<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<meta name="description" content="Sua coleção de Magic: catálogo completo, coleções temáticas, decks, chase cards e a mesa de jogo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" type="image/png">
<!-- o iPhone não lê o manifest inteiro: precisa destas três -->
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Collector">
<title>Collector — Magic: The Gathering</title>
<style>
  /* =================================================================
     Cor e forma.

     Regra que guia tudo aqui: o cromo é neutro e quase invisível; a arte
     da carta é a única cor forte da página. O dourado fica reservado a
     três papéis — botão principal, estado ativo (em tinta fraca) e
     número de valor. É assim que Scryfall, Letterboxd e a TV da Apple
     conseguem parecer calmos com centenas de imagens na tela.

     Profundidade no escuro não vem de sombra (não aparece): vem de
     camada de superfície mais clara + um fio de borda em opacidade.
     ================================================================= */
  :root{
    --bg:#0a0b0e; --surface-1:#101218; --surface-2:#171a22; --surface-3:#1e222c;
    --line:rgba(255,255,255,.065); --line-strong:rgba(255,255,255,.13);
    --text:#e8eaf0; --text-2:#a7aec0; --text-3:#8a92a6;
    --accent:#e3b25a; --accent-hover:#f0cb84; --accent-dim:#8c6e33;
    --accent-soft:rgba(227,178,90,.12); --accent-line:rgba(227,178,90,.38); --accent-ink:#14161b;
    --pos:#5bd69b; --neg:#f0705c; --info:#6fb6f0;
    --neg-soft:rgba(240,112,92,.12);
    --mythic:#e07a3a; --rare:#e3b25a; --uncommon:#a9b6c6; --common:#5a6478;
    --radius:12px; --r-sm:8px; --r-lg:16px; --r-xl:20px;
    --lift:inset 0 1px 0 rgba(255,255,255,.05);
    --shadow:0 18px 40px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
    --t-fast:120ms cubic-bezier(.2,0,.2,1);
    --t-base:180ms cubic-bezier(.2,0,.2,1);
    --t-slow:240ms cubic-bezier(.16,1,.3,1);
    /* nomes antigos, para o resto do arquivo continuar funcionando */
    --bg2:var(--surface-1); --surface:var(--surface-1); --surface2:var(--surface-2);
    --line2:var(--line-strong); --muted:var(--text-2); --faint:var(--text-3);
    --gold:var(--accent); --gold-dim:var(--accent-dim);
    --green:var(--pos); --red:var(--neg); --blue:var(--info);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",
      system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:14px; line-height:1.5; min-height:100vh;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  /* foco visível: sem isto não dá para usar o app pelo teclado */
  :where(button,a,input,select,textarea,summary,[tabindex]):focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
    .card:hover,.theme:hover,.set-cartao:hover,.atalho:hover{transform:none}
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  a{color:var(--blue);text-decoration:none}
  ::selection{background:var(--gold);color:#111}

  /* ---------- topbar ---------- */
  header.top{
    position:sticky;top:0;z-index:40;
    padding-top:env(safe-area-inset-top);
    backdrop-filter:blur(10px) saturate(140%);
    background:rgba(10,11,14,.88);
    border-bottom:1px solid var(--line);
  }
  .top-inner{max-width:1400px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{margin:0;font-size:18px;letter-spacing:.2em;font-weight:700;color:var(--text)}
  .brand h1::first-letter{color:var(--accent)}
  .brand span{font-size:11px;color:var(--faint);letter-spacing:.06em}
  /* ---- navegação em dois níveis: botão-mestre em cima, seções embaixo ---- */
  nav.masters{
    max-width:1400px;margin:0 auto;padding:2px 22px 0;display:flex;gap:6px;
    overflow-x:auto;scrollbar-width:none;
  }
  nav.masters::-webkit-scrollbar{display:none}
  .master{
    flex:0 0 auto;padding:9px 16px;min-height:38px;border-radius:10px 10px 0 0;
    font-size:13.5px;font-weight:600;letter-spacing:.01em;color:var(--text-3);
    border:1px solid transparent;border-bottom:none;background:transparent;
    transition:color var(--t-fast),background var(--t-fast);
  }
  .master:hover{color:var(--text)}
  .master.on{
    color:var(--accent);background:var(--surface-1);
    border-color:var(--line);box-shadow:var(--lift);
  }
  .master .seta{font-size:9px;opacity:.6;margin-left:5px;vertical-align:1px}
  .games{display:flex;gap:6px;margin-left:4px}
  .game-pill{
    padding:6px 12px;border-radius:999px;border:1px solid var(--line);
    font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);
    transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast);
  }
  .game-pill.active{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line);font-weight:600}
  .game-pill.soon{opacity:.45}
  .spacer{flex:1}
  .kpis{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
  .kpi{
    text-align:left;padding:5px 12px;display:flex;flex-direction:column-reverse;gap:1px;
    background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--lift);
  }
  .kpi b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .kpi small{color:var(--faint);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .icon-btn{
    padding:8px 13px;border-radius:var(--r-sm);border:1px solid var(--line);
    background:var(--surface-1);color:var(--muted);font-size:12.5px;font-weight:500;
    transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast);
  }
  .icon-btn:hover{color:var(--text);background:var(--surface-2);border-color:var(--line-strong)}
  /* quando alguém entrou, o botão de conta vira a inicial num círculo */
  .icon-btn.logado{
    min-width:36px;padding:8px 10px;border-radius:999px;font-weight:700;
    color:var(--gold);border-color:rgba(227,178,90,.35);background:rgba(227,178,90,.10);
  }

  /* abas em pílula: no celular elas rolam de lado em vez de espremer */
  nav.tabs{
    max-width:1400px;margin:0 auto;padding:8px 22px 10px;display:flex;gap:4px;
    overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;
    border-top:1px solid var(--line);
  }
  nav.tabs:empty{display:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;scroll-snap-align:start;
    padding:8px 14px;min-height:36px;font-size:13px;font-weight:500;color:var(--muted);
    border:1px solid transparent;border-radius:999px;
    transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast);
  }
  .tab:hover{color:var(--text);background:var(--surface-2)}
  .tab.active{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line);font-weight:600}

  main{max-width:1400px;margin:0 auto;
    padding:26px max(22px, env(safe-area-inset-left)) calc(80px + env(safe-area-inset-bottom))}

  /* ---------------- Home: notícias ---------------- */
  .noticias{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:4px}
  .noticia{
    display:flex;gap:12px;align-items:stretch;text-decoration:none;color:inherit;
    background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--lift);
    transition:transform var(--t-base),border-color var(--t-base),box-shadow var(--t-base);
  }
  .noticia:hover{transform:translateY(-2px);border-color:var(--accent-line);box-shadow:var(--shadow)}
  .noticia .n-foto{flex:0 0 108px;background:var(--surface-2);position:relative}
  .noticia .n-foto img{width:100%;height:100%;object-fit:cover;display:block}
  .noticia .sem-foto{
    width:100%;height:100%;display:grid;place-items:center;
    font-size:26px;font-weight:700;color:var(--text-3);background:var(--surface-3);
  }
  .noticia .n-corpo{flex:1 1 auto;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
  .noticia .n-fonte{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .noticia h3{margin:0;font-size:14px;line-height:1.35;font-weight:600;color:var(--text)}
  .noticia p{margin:0;font-size:12.5px;color:var(--text-2);line-height:1.45}
  .noticia .n-quando{margin-top:auto;font-size:11.5px;color:var(--text-3)}
  /* a primeira ocupa a linha inteira e mostra o resumo */
  .noticia.grande{grid-column:1/-1;flex-direction:row}
  .noticia.grande .n-foto{flex:0 0 42%;max-width:420px;min-height:190px;max-height:300px}
  .noticia.grande h3{font-size:19px;line-height:1.25}
  .noticia.grande .n-corpo{padding:18px 20px;gap:8px}
  @media (max-width:640px){
    .noticia.grande{flex-direction:column}
    .noticia.grande .n-foto{flex:0 0 auto;max-width:none;width:100%;height:180px}
    .noticia .n-foto{flex-basis:92px}
  }

  .atalhos-home{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:22px;
  }
  .atalho{
    text-align:left;padding:14px 16px;border-radius:var(--radius);
    background:var(--surface-1);border:1px solid var(--line);
    display:flex;flex-direction:column;gap:3px;
    transition:border-color var(--t-fast),background var(--t-fast);
  }
  .atalho:hover{border-color:var(--accent-line);background:var(--surface-2)}
  .atalho b{font-size:13.5px;color:var(--text)}
  .atalho span{font-size:12px;color:var(--text-3)}

  /* ---------------- comunidade ---------------- */
  .theme.publica{cursor:default;display:flex;flex-direction:column}
  .theme.publica .theme-body{display:flex;flex-direction:column;flex:1 1 auto}
  .theme.publica .theme-meta{margin-top:auto}

  /* ---------------- ajustes ---------------- */
  .bloco-cfg{
    background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:18px 20px;margin-bottom:14px;box-shadow:var(--lift);
  }
  .bloco-cfg h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;
    letter-spacing:.09em;color:var(--text-3);font-weight:700}
  .temas-cor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tema-opc{
    display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
    padding:12px 13px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--surface-2);transition:border-color var(--t-fast);
  }
  .tema-opc:hover{border-color:var(--line-strong)}
  .tema-opc.on{border-color:var(--accent);background:var(--accent-soft)}
  .tema-opc b{font-size:13px;color:var(--text)}
  .tema-opc>span:last-child{font-size:11.5px;color:var(--text-3)}
  .tema-bolas{display:flex;gap:4px;margin-bottom:5px}
  .tema-bolas i{width:15px;height:15px;border-radius:50%;border:1px solid var(--line-strong)}
  .chave{display:flex;gap:11px;align-items:flex-start;padding:9px 0;cursor:pointer}
  .chave+.chave{border-top:1px solid var(--line)}
  .chave input{width:17px;height:17px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
  .chave b{display:block;font-size:13.5px;font-weight:500;color:var(--text)}
  .chave small{display:block;font-size:12px;color:var(--text-3);margin-top:1px}
  .minha-copia{margin-top:16px;padding:13px 14px;border:1px solid var(--accent-line);
    border-radius:var(--radius);background:var(--accent-soft)}
  .minha-copia .flabel{display:block;font-size:11px;text-transform:uppercase;
    letter-spacing:.09em;color:var(--accent);margin-bottom:9px}
  .mc-linha{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:9px}
  .mc-linha .field span{display:block;font-size:11px;color:var(--text-3);margin-bottom:3px}
  .mc-linha select,.mc-linha input{width:100%;padding:7px 9px;font-size:12.5px}
  @media (max-width:640px){ .mc-linha{grid-template-columns:1fr 1fr} .mc-linha .field:last-child{grid-column:1/-1} }
  .sobe{color:var(--pos)} .desce{color:var(--neg)}
  .nao-achadas{display:flex;flex-direction:column;gap:3px;margin-top:9px;max-height:210px;
    overflow-y:auto;font-size:12px;color:var(--text-2)}
  .nao-achadas i{color:var(--text-3);font-style:normal}

  /* ---------------- valorização ---------------- */
  .bloco-val{margin-top:16px;padding:16px 18px;border:1px solid var(--line);
    border-radius:var(--r-lg);background:var(--surface-1);box-shadow:var(--lift)}
  .val-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .val-topo b{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3)}
  .val-corpo{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .val-numeros{flex:0 0 auto}
  .val-hoje{font-size:27px;font-weight:600;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
  .val-dif{font-size:14px;font-weight:600;margin-top:2px}
  .val-dif span{font-weight:500;opacity:.75}
  .val-desde{font-size:12px;color:var(--text-3);margin-top:3px}
  .val-grafico{flex:1 1 260px;min-width:220px}
  .val-grafico .spark{width:100%;height:74px}
  .movers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px;
    padding-top:14px;border-top:1px solid var(--line)}
  .mv-col .flabel{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--text-3);margin-bottom:7px}
  .mover{display:flex;align-items:center;gap:9px;width:100%;padding:6px 7px;border-radius:var(--r-sm);
    text-align:left;transition:background var(--t-fast)}
  .mover:hover{background:var(--surface-2)}
  .mover img,.mover .mv-sem{width:30px;height:42px;object-fit:cover;border-radius:3px;
    flex:0 0 auto;background:var(--surface-3)}
  .mv-nome{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mv-nome small{display:block;font-size:11px;color:var(--text-3)}
  .mv-dif{flex:0 0 auto;font-size:12.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .mv-dif small{display:block;font-weight:500;font-size:11px;opacity:.8}
  .lista-compras{margin-top:14px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .lc-linha{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line)}
  .lc-linha img,.lc-linha .mv-sem{width:30px;height:42px;object-fit:cover;border-radius:3px;
    flex:0 0 auto;background:var(--surface-3)}
  .lc-nome{flex:1 1 auto;min-width:0;font-size:13px;color:var(--text)}
  .lc-nome small{display:block;font-size:11px;color:var(--text-3)}
  .lc-preco{flex:0 0 auto;font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}
  .icon-btn.sino{position:relative;font-size:15px;line-height:1;padding:8px 11px}
  .cartao-previa{margin:8px 0 4px;border-radius:var(--radius);overflow:hidden;
    background:var(--surface-2);min-height:180px;display:grid;place-items:center}
  .cartao-previa img{width:100%;display:block}
  .icon-btn.sino i{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;
    border-radius:999px;background:var(--neg);color:#fff;font-size:10px;font-weight:700;
    font-style:normal;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
  .publicar-link{
    display:block;margin-top:9px;font-size:11.5px;color:var(--text-3);
    padding:5px 0 0;border-top:1px solid var(--line);
  }
  .publicar-link:hover{color:var(--accent)}

  /* ---------- generic ---------- */
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 16px;flex-wrap:wrap}
  .section-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em}
  .section-head p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.55;max-width:62ch}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:38px;padding:0 16px;border-radius:var(--r-sm);
    font-size:13px;font-weight:600;line-height:1;border:1px solid transparent;
    background:var(--accent);color:var(--accent-ink);
    transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast);
  }
  .btn:hover{background:var(--accent-hover)}
  .btn:active{background:var(--accent-dim);color:var(--text)}
  .btn.ghost{background:var(--surface-2);color:var(--text);border-color:var(--line-strong);font-weight:500}
  .btn.ghost:hover{background:var(--surface-3);border-color:var(--line-strong)}
  .btn.danger{background:transparent;border-color:var(--line-strong);color:var(--neg);font-weight:500}
  .btn.danger:hover{background:var(--neg-soft);border-color:var(--neg)}
  .btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
  @media (max-width:640px){ .btn{min-height:44px} }
  input[type=text],input[type=search],input[type=number],textarea,select{
    width:100%;padding:10px 13px;border-radius:var(--r-sm);background:var(--surface-2);
    border:1px solid var(--line);outline:none;
    transition:border-color var(--t-fast),box-shadow var(--t-fast);
  }
  input:focus,textarea:focus,select:focus{
    border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);outline:none;
  }
  label.field{display:block;margin-bottom:13px}
  label.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  label.field small{display:block;color:var(--faint);font-size:11.5px;margin-top:5px}
  .empty{padding:60px 20px;text-align:center;color:var(--faint);border:1px dashed var(--line2);border-radius:var(--radius)}

  /* ---------- theme grid ---------- */
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
  .grupo-temas{margin-bottom:30px}
  .grupo-titulo{
    display:flex;align-items:center;gap:9px;margin:0 0 12px;
    font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);
  }
  .grupo-titulo span{
    font-size:10.5px;font-weight:600;letter-spacing:0;color:var(--faint);
    background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;
  }
  .grupo-titulo::after{content:"";flex:1;height:1px;background:var(--line)}
  .theme{
    position:relative;border-radius:var(--radius);overflow:hidden;text-align:left;
    background:var(--surface);border:1px solid var(--line);transition:.18s;display:flex;flex-direction:column;
  }
  .theme:hover{transform:translateY(-3px);border-color:var(--gold-dim);box-shadow:var(--shadow)}
  .theme-cover{height:96px;position:relative;display:flex;align-items:center;justify-content:center;font-size:34px}
  /* rebaixa a capa colorida para ela não competir com a arte das cartas */
  .theme-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,14,.25),rgba(10,11,14,.6))}
  .theme-cover>*{position:relative;z-index:1}
  /* capa escolhida pelo usuário: a arte da carta ocupa a faixa inteira */
  .theme-cover.com-arte{background-size:cover;background-position:center 32%;background-color:var(--surface-2)}
  .theme-cover.com-arte::after{background:linear-gradient(180deg,transparent 45%,rgba(10,11,14,.75))}
  .ico-capa{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
  .capa-atual{
    display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:18px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  }
  .capa-atual img{width:78px;height:56px;object-fit:cover;border-radius:7px;flex:0 0 auto}
  .capa-atual div{flex:1;min-width:0}
  .capa-atual b{display:block;font-size:13px}
  .capa-atual span{font-size:11.5px;color:var(--faint)}
  .theme-body{padding:13px 15px 15px;flex:1;display:flex;flex-direction:column;gap:6px}
  .theme-body h3{margin:0;font-size:14.5px;font-weight:600}
  .theme-body p{margin:0;font-size:12.3px;color:var(--muted);flex:1}
  .theme-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--faint)}
  .chip{padding:3px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);font-size:11px;color:var(--muted)}
  .mini-bar{height:4px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:8px}
  .mini-bar i{display:block;height:100%;background:var(--accent)}

  /* ---------- collection view ---------- */
  .coll-head{
    display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;
    padding:20px;border-radius:var(--radius);background:var(--surface-1);
    border:1px solid var(--line);margin-bottom:20px;
  }
  .coll-head .ico{font-size:40px;line-height:1;flex:0 0 auto}
  .coll-head .ico:has(.ico-capa){width:104px;height:74px;border-radius:10px;overflow:hidden}
  .coll-head h2{margin:0 0 4px;font-size:20px}
  .coll-head p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
  .progress-wrap{min-width:250px;flex:1}
  .bar{height:9px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:8px 0 6px;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
  .progress-num{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .progress-num b{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .toolbar .grow{flex:1;min-width:200px}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
  .seg button{padding:8px 14px;font-size:12.5px;color:var(--muted)}
  .seg button.active{background:var(--surface2);color:var(--gold)}

  /* ---------- card grid ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(104px,13vw,166px),1fr));gap:12px}
  /* o raio em porcentagem acompanha o canto real da carta em qualquer tamanho */
  .card{
    position:relative;border-radius:4.75% / 3.4%;overflow:hidden;background:var(--surface-2);
    aspect-ratio:488/680;border:none;box-shadow:0 0 0 1px var(--line);
    transition:transform var(--t-base),box-shadow var(--t-base);
    content-visibility:auto;contain-intrinsic-size:auto 230px;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity var(--t-base)}
  /* o que você não tem vira fantasma limpo, não cinza lamacento */
  .card:not(.owned) img{filter:grayscale(1) contrast(.92);opacity:.45}
  .card.owned{box-shadow:0 0 0 1px var(--accent-line)}
  @media (hover:hover){
    .card:hover{transform:scale(1.035);z-index:2;box-shadow:0 0 0 1px var(--line-strong),0 12px 28px -10px rgba(0,0,0,.8)}
    .card.owned:hover{box-shadow:0 0 0 1.5px var(--accent),0 12px 28px -10px rgba(0,0,0,.8)}
    .card:hover img{filter:none;opacity:1}
  }
  .card .tick{
    position:absolute;left:7px;top:7px;width:23px;height:23px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    background:rgba(10,12,16,.7);border:1px solid var(--line-strong);color:var(--faint);
    backdrop-filter:blur(4px);opacity:0;transition:opacity var(--t-fast);
  }
  .card:hover .tick,.card:focus-within .tick,.card.owned .tick{opacity:1}
  .card.owned .tick{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .card .info{
    position:absolute;right:7px;top:7px;width:24px;height:24px;border-radius:50%;
    background:rgba(10,12,16,.78);border:1px solid var(--line2);color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-style:italic;font-family:Georgia,serif;
  }
  .card .info:hover{color:var(--gold);border-color:var(--gold-dim)}
  .card .quero-carta{
    position:absolute;right:7px;top:36px;z-index:3;width:23px;height:23px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
    background:rgba(10,12,16,.7);border:1px solid var(--line-strong);color:var(--faint);
    backdrop-filter:blur(4px);opacity:0;transition:opacity var(--t-fast),color var(--t-fast);
  }
  .card:hover .quero-carta,.card:focus-within .quero-carta,.card .quero-carta.na-lista{opacity:1}
  .card .quero-carta:hover{color:var(--accent);border-color:var(--accent-line)}
  .card .quero-carta.na-lista{color:var(--accent);border-color:var(--accent-line)}
  @media (hover:none){ .card .quero-carta{opacity:1} }
  .card .tirar-carta{
    position:absolute;left:7px;bottom:30px;z-index:3;width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;
    background:rgba(10,12,16,.85);border:1px solid var(--line2);color:var(--muted);
    opacity:0;transition:.14s;
  }
  .card:hover .tirar-carta,.card:focus-within .tirar-carta{opacity:1}
  .card .tirar-carta:hover{color:var(--red);border-color:var(--red)}
  @media (hover:none){ .card .tirar-carta{opacity:1} }
  .card .cap{
    position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;font-size:11px;
    background:linear-gradient(180deg,transparent,rgba(8,10,14,.94));
    display:flex;align-items:baseline;gap:6px;
  }
  .card .cap-nome{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* no celular a miniatura é estreita: nome em cima, preço embaixo,
     senão o nome vira "Cart…" e não serve para nada */
  @media (max-width:760px){
    /* a barra de cima não pode empurrar a página: marca em cima, números embaixo */
    .top-inner{gap:8px;padding:10px 14px}
    .spacer{display:none}
    .brand{flex:1 1 auto}
    .games{order:3;width:100%;margin-left:0}
    .kpis{order:4;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:2px}
    .kpis::-webkit-scrollbar{display:none}
    .kpis .kpi,.kpis .icon-btn{flex:0 0 auto}
    .game-pill{font-size:11.5px;padding:5px 10px}
    .so-largo{display:none}
    #btn-config{padding:8px 12px;font-size:15px;line-height:1}
    nav.masters{padding:2px 14px 0}
    nav.tabs{padding:6px 14px 8px}
    .master{padding:8px 12px;font-size:13px}
  }
  @media (max-width:640px){
    .card .cap{flex-direction:column;align-items:flex-start;gap:0;padding:16px 7px 5px}
    .card .cap-nome{font-size:10.5px;width:100%}
    .card .cap-preco{font-size:10px}
    .kpi{padding:4px 9px}
    .kpi b{font-size:15px}
    .kpi small{font-size:9px}
    .top-inner{gap:12px;padding:10px 16px}
    main{padding:18px 16px 70px}
    nav.tabs{padding:0 16px 10px}
  }
  .card .cap-preco{flex:0 0 auto;font-size:10.5px;color:var(--gold);font-variant-numeric:tabular-nums}
  .card:not(.owned) .cap-preco{color:var(--gold-dim)}
  .card-skel{border-radius:4.75% / 3.4%;aspect-ratio:488/680;background:linear-gradient(100deg,var(--surface-1) 30%,var(--surface-2) 50%,var(--surface-1) 70%);background-size:220% 100%;animation:sk 1.2s infinite}
  @keyframes sk{from{background-position:180% 0}to{background-position:-40% 0}}

  .loadmore{display:flex;justify-content:center;margin-top:22px}
  .status{color:var(--faint);font-size:12.5px;margin-top:12px;text-align:center}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(2px);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:22px;animation:ov 160ms ease-out;
  }
  @keyframes ov{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--surface-3);border:1px solid var(--line-strong);border-radius:var(--r-xl);
    max-width:860px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow),var(--lift);
    animation:mo 220ms cubic-bezier(.16,1,.3,1);
  }
  @keyframes mo{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .modal-pad{padding:22px}
  .modal h3{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.015em}
  .modal .close{
    position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--faint);
    background:var(--surface-2);border:1px solid var(--line);z-index:2;
  }
  .modal .close:hover{color:var(--text);background:var(--surface-3)}
  /* no celular o modal sobe de baixo, onde o polegar alcança */
  @media (max-width:640px){
    .overlay{align-items:flex-end;padding:0}
    .modal{max-height:92vh;border-radius:var(--r-xl) var(--r-xl) 0 0;border-bottom:none;
      animation:sheet 260ms cubic-bezier(.16,1,.3,1)}
    .modal-pad{padding:16px 16px 40px}
    .detail > div:first-child{width:100%;flex:1 1 auto}
  }
  @keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
  .detail{display:flex;gap:22px;flex-wrap:wrap}
  .detail img{width:260px;border-radius:12px;box-shadow:var(--shadow)}
  .detail .meta{flex:1;min-width:230px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv span{color:var(--muted)}
  .oracle{white-space:pre-wrap;font-size:13px;color:var(--muted);margin:12px 0;padding:12px;background:var(--surface);border-radius:10px;border:1px solid var(--line)}
  .rarity-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

  /* ---------- preço, gráfico e impressões no detalhe ---------- */
  .detail > div:first-child{display:flex;flex-direction:column;gap:12px;width:260px;flex:0 0 auto}
  .detail img{width:100%}
  .precao{text-align:center}
  .precao-valor{font-size:26px;font-weight:600;color:var(--gold);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .precao-fonte{font-size:11.5px;color:var(--faint);margin-top:2px;display:flex;gap:7px;justify-content:center;align-items:center}
  .estimado{
    font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--blue);
    border:1px solid var(--blue);border-radius:999px;padding:1px 7px;cursor:help;
  }
  .precao-outros{font-size:11.5px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}
  .grafico{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .grafico-topo{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--faint);margin-bottom:2px}
  .grafico-topo b{font-size:12.5px;font-variant-numeric:tabular-nums}
  .grafico-topo .sobe{color:var(--green)}
  .grafico-topo .desce{color:var(--red)}
  .spark{width:100%;height:54px;display:block}
  .carregando{font-size:11.5px;color:var(--faint);text-align:center;line-height:1.45}

  .lojas{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .lojas .flabel{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin-bottom:8px}
  .lojas-links{display:flex;flex-wrap:wrap;gap:7px}
  .lojas-links a{
    font-size:12.5px;padding:6px 12px;border-radius:8px;background:var(--surface);
    border:1px solid var(--line2);color:var(--muted);text-decoration:none;transition:.14s;
  }
  .lojas-links a:hover{color:var(--gold);border-color:var(--gold-dim)}

  .impressoes{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .impressoes .flabel{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin-bottom:10px}
  .impr-tira{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;
    max-height:460px;overflow-y:auto;padding:2px 4px 8px 0;
  }
  .impr-tira::-webkit-scrollbar{width:7px}
  .impr-tira::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  /* uma arte por bloco; dentro dele, as edições que usam essa mesma arte */
  .impr-grupo{border:1px solid var(--line);border-radius:11px;padding:8px;background:var(--surface)}
  .impr-grupo.atual{border-color:var(--gold-dim)}
  .impr-arte{width:100%;border-radius:7px;display:block;filter:grayscale(.6) brightness(.75)}
  .impr-grupo.atual .impr-arte,.impr-grupo.tenho .impr-arte,.impr-grupo:hover .impr-arte{filter:none}
  .impr-artista{display:block;font-size:10px;color:var(--faint);margin:6px 0 5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .impr-eds{display:flex;flex-wrap:wrap;gap:4px}
  .impr{
    text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:7px;
    padding:4px 6px;transition:border-color .14s,background .14s;flex:1 1 auto;min-width:56px;
  }
  .impr:hover{border-color:var(--line2)}
  .impr.atual{border-color:var(--gold-dim);background:var(--bg2)}
  .impr.owned{border-color:var(--gold)}
  .impr-set{display:flex;align-items:center;justify-content:center;height:18px}
  .impr-set .set-simbolo{width:16px;height:16px;flex:0 0 16px}
  .impr-set .set-simbolo.vazio{width:auto;flex:0 0 auto;font-size:10px;letter-spacing:.05em;color:var(--muted)}
  .impr.owned .set-simbolo,.impr.atual .set-simbolo{filter:invert(74%) sepia(38%) saturate(600%) hue-rotate(348deg)}
  .impr-ano{display:block;font-size:10px;color:var(--faint)}
  .impr-var{display:block;font-size:9.5px;line-height:1.25;color:var(--faint);
    max-width:74px;margin:1px auto 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .impr.owned .impr-var,.impr.atual .impr-var{color:var(--muted)}
  .impr-preco{display:block;font-size:10.5px;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:1px}
  .impr-dica{font-size:11.5px;color:var(--faint);margin-top:8px}


  /* ---------- decks ---------- */
  .abas-deck{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .decks-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .deck-cartao{
    text-align:left;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--lift);
    transition:transform var(--t-base),border-color var(--t-base);
  }
  .deck-cartao:hover{transform:translateY(-2px);border-color:var(--line-strong)}
  .deck-capa{
    height:104px;background-size:cover;background-position:center 22%;background-color:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;
  }
  .deck-capa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,11,14,.7))}
  .deck-corpo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .deck-corpo h3{margin:0;font-size:15px;font-weight:600}
  .deck-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint);flex-wrap:wrap}
  .deck-cmd{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .deck-tenho{font-size:11px;color:var(--faint)}
  .deck-cores{display:flex;gap:3px}
  .ponto-cor{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.4)}

  .formatos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:6px}
  .formato{
    text-align:left;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);
    border:1px solid var(--line);transition:background var(--t-fast),border-color var(--t-fast);
  }
  .formato b{display:block;font-size:13px}
  .formato small{display:block;font-size:11px;color:var(--faint);line-height:1.35;margin-top:2px}
  .formato.on{background:var(--accent-soft);border-color:var(--accent-line)}
  .formato.on b{color:var(--accent)}

  .deck-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
  @media (max-width:900px){ .deck-layout{grid-template-columns:1fr} }
  .deck-secao{margin-bottom:20px}
  .deck-linhas{display:flex;flex-direction:column;gap:4px}
  .deck-linha{
    display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:var(--r-sm);
    background:var(--surface-1);border:1px solid var(--line);
  }
  .deck-linha.tenho{border-color:var(--accent-line)}
  .dl-qtd{font-size:12px;font-weight:600;color:var(--muted);min-width:26px;text-align:right}
  .dl-img{width:34px;height:26px;object-fit:cover;object-position:center 18%;border-radius:4px;flex:0 0 34px;background:var(--surface-2)}
  .dl-nome{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dl-nome small{display:block;font-size:10.5px;color:var(--faint)}
  .dl-preco{font-size:12px;color:var(--accent);min-width:64px;text-align:right}
  .dl-tenho{width:14px;color:var(--accent);font-size:12px}
  .dl-acoes{display:flex;gap:2px;opacity:0;transition:opacity var(--t-fast)}
  .deck-linha:hover .dl-acoes,.chase-linha:hover .dl-acoes{opacity:1}
  @media (hover:none){ .dl-acoes{opacity:1} }
  .dl-acoes button{
    width:24px;height:24px;border-radius:6px;color:var(--muted);font-size:13px;
    background:var(--surface-2);border:1px solid var(--line);
  }
  .dl-acoes button:hover{color:var(--text);border-color:var(--line-strong)}
  .dl-acoes .dl-fora:hover{color:var(--neg);border-color:var(--neg)}
  .card.no-deck{outline:2px solid var(--accent);outline-offset:2px}

  .deck-lado{display:flex;flex-direction:column;gap:14px;position:sticky;top:80px}
  .dg-bloco{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--lift)}
  .dg-grande{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
  .dg-grande b{font-size:30px;font-weight:600;letter-spacing:-.02em}
  .dg-grande span{font-size:12px;color:var(--faint)}
  .dg-grande.certo b{color:var(--pos)} .dg-grande.abaixo b{color:var(--neg)} .dg-grande.acima b{color:var(--accent)}
  .dg-txt{margin:6px 0 0;font-size:11.5px;line-height:1.5;color:var(--muted)}
  .dg-linha{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .dg-linha:last-child{border-bottom:none}
  .dg-linha span:first-child{flex:1;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dg-linha b{font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
  .dg-linha small{font-size:10.5px;color:var(--faint);min-width:96px;text-align:right}
  .dg-linha.certo b{color:var(--pos)} .dg-linha.abaixo b{color:var(--neg)} .dg-linha.acima b{color:var(--accent)}
  .dg-problema{font-size:12px;padding:7px 9px;border-radius:7px;margin-bottom:6px;line-height:1.4}
  .dg-problema.erro{background:var(--neg-soft);color:var(--neg)}
  .dg-problema.aviso{background:var(--accent-soft);color:var(--accent)}
  .dg-problema.ok{background:rgba(91,214,155,.1);color:var(--pos)}
  .curva{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:6px}
  .curva-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
  .curva-col i{display:block;width:100%;background:var(--accent-dim);border-radius:3px 3px 0 0;min-height:2px}
  .curva-col span{font-size:10px;color:var(--faint)}

  .cmd-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .cmd-cartao{
    display:flex;gap:10px;padding:10px;background:var(--surface-1);border:1px solid var(--line);

    font-size:13px;color:var(--muted);line-height:1.6}

  .link-int{color:var(--accent);background:none;border:none;padding:0;font-size:inherit;
    text-decoration:underline;text-underline-offset:3px}




  .instalar-passos{display:flex;flex-direction:column;gap:14px}

    flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;

  }

  .ip-arte{display:block;width:100%;max-width:300px;margin-top:9px}
  .passos-instalar{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .passo-i{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}

  /* ---------- mesa de jogo ---------- */

  .partidas{display:flex;flex-direction:column;gap:8px}

  .pj i{font-style:normal;font-size:10px;color:var(--faint)}

  .rp-jogadores{display:flex;flex-direction:column;gap:6px}

  .ferramentas{display:flex;flex-direction:column;gap:16px}

  .vidas{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}

  .pv-nome{font-size:12.5px;font-weight:600;outline:none;margin-bottom:6px;color:var(--muted)}

    color:var(--muted);font-size:12px}

  .pv-extras{display:flex;gap:5px;justify-content:center;margin-top:8px}

    border:1px solid var(--line);color:var(--muted)}

  .pv-morto{display:block;margin-top:7px;font-size:10.5px;color:var(--neg);text-transform:uppercase;letter-spacing:.08em}
  .cronometro{font-size:44px;font-weight:600;letter-spacing:.02em;text-align:center;
    font-variant-numeric:tabular-nums;color:var(--accent);padding:6px 0}
  .ordem-sorteada{display:flex;flex-wrap:wrap;gap:7px}
  .ordem-item{display:inline-flex;align-items:baseline;gap:6px;font-size:12.5px;padding:6px 12px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--line)}
  .ordem-item.primeiro{border-color:var(--accent-line);color:var(--accent)}

  .dados{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

  .cmd-dano{display:flex;flex-direction:column;gap:6px}

    padding:7px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}

    border:1px solid var(--line);color:var(--muted)}

  /* ---------- chase cards ---------- */
  .chase-grupo{margin-bottom:26px}
  .chase-nome{outline:none;text-transform:none;font-size:13px;letter-spacing:0;color:var(--text);border-bottom:1px dashed transparent}
  .chase-nome:hover,.chase-nome:focus{border-bottom-color:var(--line-strong)}
  .chase-soma{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:0}

  .chase-apagar:hover{color:var(--neg)}
  .chase-linhas{display:flex;flex-direction:column;gap:5px}
  .chase-linha{
    display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:var(--r-sm);
    background:var(--surface-1);border:1px solid var(--line);flex-wrap:wrap;

  .chase-alvo em{font-size:10px;color:var(--pos);font-style:normal}
  .chase-mover{width:auto;min-width:130px;padding:5px 8px;font-size:11.5px}

  /* ---------- minha coleção ---------- */
  .resumo-colecao{
    display:flex;gap:26px;align-items:center;flex-wrap:wrap;
    background:var(--surface-1);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;
  }
  .rc b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .rc small{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em}

  .ano-bloco{margin-bottom:26px}

    position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;

  /* ---------- produtos lacrados, artes focadas e chips de símbolo ---------- */
  .produtos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .produto{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .produto-foto{flex:0 0 86px;height:86px;display:flex;align-items:center;justify-content:center;
    background:var(--bg2);border-radius:9px;overflow:hidden}
  .produto-foto img{width:100%;height:100%;object-fit:contain}
  .sem-foto{font-size:10.5px;color:var(--faint);text-align:center;padding:6px}
  .produto-info{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
  .produto-info b{font-size:13px;font-weight:600;line-height:1.3}
  .produto-cat{font-size:11px;color:var(--faint)}
  .produto-preco{display:flex;align-items:center;gap:8px;margin-top:4px}
  .produto-preco input{padding:6px 9px;font-size:12.5px}
  .produto-rel{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

  .produto-ev{font-size:11px;color:var(--muted)}
  .produto-link{font-size:11px;color:var(--faint);text-decoration:none}

  .arte.escondida{display:none}

  .versoes-topo .btn{padding:5px 12px;font-size:12px}
  .set-chip.so-simbolo{display:inline-flex;align-items:center;gap:6px;padding:5px 10px}
  .set-chip.so-simbolo .set-simbolo{width:16px;height:16px}
  .set-chip.so-simbolo b{font-size:10.5px}

  /* ---------- acabamento e escolha por arte ---------- */
  .acab-seletor{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

    position:absolute;right:7px;top:36px;z-index:2;font-size:9.5px;text-transform:uppercase;
    letter-spacing:.07em;background:rgba(10,12,16,.88);border:1px solid var(--blue);

    border-radius:999px;padding:2px 8px;
  }

  /* carta sem imagem: nome legível em vez de ícone quebrado */
  .sem-arte{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:10px;font-size:11.5px;line-height:1.35;color:var(--muted);background:var(--surface2);

  /* quantas cópias você tem — só na Minha coleção */

    position:absolute;left:50%;transform:translateX(-50%);bottom:6px;z-index:3;

    width:22px;height:22px;border-radius:999px;border:none;background:none;color:var(--muted);

  /* ---------- escolha de edição com símbolo ---------- */

  /* =====================================================================
     Um visual só para todos os chips do app. Antes eram sete parecidos e

<main id="app"></main>
<div id="modal-root"></div>

<script>
/* ============================================================
   Collector — protótipo v0.1
   Dados: Scryfall API (https://scryfall.com) — uso não comercial,
   sem afiliação com a Wizards of the Coast.
   ============================================================ */

const API = "https://api.scryfall.com";

/* O banco do Collector. Esta chave é publicável por natureza: quem protege os
   dados é a regra do banco, não o segredo da chave — com ela é possível ler o
   catálogo e o histórico de preço, e nada da coleção de ninguém. */
const SUPA_URL = "https://elkavicjupjcwrdgossx.supabase.co";
const SUPA_KEY = "sb_publishable_Bua_15O5bp_LzAxV4RasxQ_anZme9DF";

/* A sessão de quem entrou, quando alguém entrou. Fica em SESSAO e é lida do
   armazenamento lá embaixo, na área de conta. Enquanto for nula o app inteiro
   funciona igual — a conta é opcional por decisão de projeto. */
let SESSAO = null;

/* Toda chamada ao banco usa o token de quem está logado, se houver. Sem
   login vai a chave publishable, que só abre catálogo e preço. */
function cabecalhoAuth(){
  const token = (SESSAO && SESSAO.access_token) || SUPA_KEY;
  return { apikey:SUPA_KEY, Authorization:`Bearer ${token}` };
}

async function supa(caminho){
  const r = await fetch(`${SUPA_URL}/rest/v1/${caminho}`,
    { headers:Object.assign(cabecalhoAuth(), { Accept:"application/json" }) });
  if(!r.ok) throw new Error(`banco respondeu ${r.status}`);
  return r.json();
}

/* ---------------- região, moeda e câmbio ---------------- */
const REGIOES = {
  global: { nome:"Global",         moeda:"USD", simbolo:"US$", fonte:"TCGplayer" },
  us:     { nome:"Estados Unidos", moeda:"USD", simbolo:"US$", fonte:"TCGplayer" },
  eu:     { nome:"Europa",         moeda:"EUR", simbolo:"€",   fonte:"Cardmarket" },
  br:     { nome:"Brasil",         moeda:"BRL", simbolo:"R$",  fonte:"estimativa por câmbio" },
};
let CAMBIO = null;   // { usd:5.14, eur:5.96, em:timestamp }

async function carregarCambio(){
  if(CAMBIO && Date.now() - CAMBIO.em < 6*3600*1000) return CAMBIO;
  try{
    const guardado = JSON.parse(localStorage.getItem("collector.cambio") || "null");
    if(guardado && Date.now() - guardado.em < 6*3600*1000){ CAMBIO = guardado; return CAMBIO; }
  }catch(e){}
  try{
    const r = await fetch("https://economia.awesomeapi.com.br/last/USD-BRL,EUR-BRL");
    const j = await r.json();
    CAMBIO = { usd:Number(j.USDBRL.bid), eur:Number(j.EURBRL.bid), em:Date.now() };
    try{ localStorage.setItem("collector.cambio", JSON.stringify(CAMBIO)); }catch(e){}
  }catch(e){ CAMBIO = CAMBIO || { usd:0, eur:0, em:Date.now() }; }
  return CAMBIO;
}

function regiao(){ return REGIOES[S.config.regiao] || REGIOES.global; }

/* Preço de uma carta na moeda da região escolhida.
   Devolve null quando não há preço, e marca estimativa quando houve conversão. */
/* Duas impressões da mesma edição têm o mesmo símbolo e o mesmo ano — o que
   as separa é o tratamento. Sem isto, o Sauron da LTR aparece três vezes
   igual e parece bug, quando na verdade são a normal, a showcase e a de
   pré-lançamento. */
const VARIANTES = [
  ["serialized",   "serializada"],
  ["prerelease",   "pré-lançamento"],
  ["promopack",    "promo pack"],
  ["buyabox",      "buy-a-box"],
  ["judgegift",    "presente de juiz"],
  ["poster",       "pôster"],
  ["stepandcompleat","step-and-compleat"],
  ["halofoil",     "halo foil"],
  ["confettifoil", "confetti foil"],
  ["doublerainbow","arco-íris duplo"],
  ["galaxyfoil",   "galaxy foil"],
  ["surgefoil",    "surge foil"],
  ["silverfoil",   "silver foil"],
  ["rainbowfoil",  "rainbow foil"],
  ["textured",     "texturizada"],
  ["raisedfoil",   "relevo"],
  ["gilded",       "dourada"],
  ["oilslick",     "oil slick"],
  ["neonink",      "tinta neon"],
];
const MOLDURAS = [
  ["showcase",     "showcase"],
  ["extendedart",  "arte estendida"],
  ["inverted",     "invertida"],
  ["etched",       "gravada"],
  ["shatteredglass","vidro partido"],
  ["companion",    "companheira"],
];
function rotuloVariante(c){
  const promos = c.promos || [], molduras = c.frames || [];
  for(const [chave, nome] of VARIANTES) if(promos.includes(chave)) return nome;
  for(const [chave, nome] of MOLDURAS) if(molduras.includes(chave)) return nome;
  if(c.borda === "borderless") return "sem borda";
  if(promos.includes("boosterfun")) return "especial";
  return "";
}

function nomeAcabamento(card, acab){
  if(acab === "etched") return "foil gravado";
  if(acab === "foil") return (card.promos || []).includes("surgefoil") ? "surge foil"
                           : (card.promos || []).includes("galaxyfoil") ? "galaxy foil" : "foil";
  return "normal";
}

function precoLocal(card, acabamento){
  const r = regiao();
  // o acabamento da própria carta manda; depois o escolhido na hora; depois a preferência geral
  // o acabamento é da carta, não uma preferência global: quem tem a foil marca a foil
  const escolhido = acabamento || card.acabamentoEscolhido || "normal";
  const querFoil = escolhido === "foil" || escolhido === "etched";
  // se a versão pedida não tem preço, mostra a outra em vez de mostrar nada
  const usd = Number(querFoil ? (card.usdFoil || card.usd) : (card.usd || card.usdFoil)) || 0;
  const eur = Number(querFoil ? (card.eurFoil || card.eur) : (card.eur || card.eurFoil)) || 0;
  const emDolar = usd ? { valor:usd, simbolo:"US$", estimado:false, fonte:"TCGplayer" } : null;
  const emEuro  = eur ? { valor:eur, simbolo:"€",   estimado:false, fonte:"Cardmarket" } : null;

  if(r.moeda === "EUR") return emEuro || emDolar;

  if(r.moeda === "BRL"){
    const taxa = CAMBIO && CAMBIO.usd, taxaEur = CAMBIO && CAMBIO.eur;
    if(usd && taxa)    return { valor:usd * taxa,    simbolo:"R$", estimado:true, fonte:"convertido do dólar" };
    if(eur && taxaEur) return { valor:eur * taxaEur, simbolo:"R$", estimado:true, fonte:"convertido do euro" };
    return emDolar || emEuro;
  }
  // dólar primeiro; se o TCGplayer não lista essa impressão, mostra o euro em vez de nada
  return emDolar || emEuro;
}

function formatarPreco(p){
  if(!p) return "";
  const casas = p.valor >= 100 ? 0 : 2;
  return `${p.simbolo} ${p.valor.toLocaleString("pt-BR",{minimumFractionDigits:casas,maximumFractionDigits:casas})}`;
}

/* links de compra — sempre permitido mandar o comprador para a loja */
function linksDeCompra(card){
  const nome = encodeURIComponent(card.name);
  const compra = card.compra || {};
  // quando o Scryfall dá o link exato daquela impressão, usa ele;
  // senão cai na busca pelo nome, que sempre existe.
  const sigla = (card.set || "").toLowerCase();
  const edicao = card.setName ? ` ${card.setName}` : "";
  const lista = [
    // quando o Scryfall dá o link da impressão exata, é ele; senão, busca com a edição junto
    ["TCGplayer",  compra.tcgplayer  || `https://www.tcgplayer.com/search/magic/product?q=${encodeURIComponent(card.name + edicao)}`],
    ["Cardmarket", compra.cardmarket || `https://www.cardmarket.com/en/Magic/Products/Search?searchString=${nome}`],
    ["eBay",       `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(card.name + edicao + " mtg")}`],
    // a LigaMagic aceita a sigla da edição dentro da própria busca
    ["Ligamagic",  sigla
        ? `https://www.ligamagic.com.br/?view=cards/search&card=${encodeURIComponent(card.name + " ed=" + sigla)}`
        : `https://www.ligamagic.com.br/?view=cards/card&card=${nome}`],
  ];
  // a loja da região escolhida vem primeiro
  const primeiro = { us:"TCGplayer", global:"TCGplayer", eu:"Cardmarket", br:"Ligamagic" }[S.config.regiao];
  return lista.sort((a,b) => (b[0]===primeiro) - (a[0]===primeiro));
}

const STORE = "collector.mtg.v1";

/* ---------------- estado persistido ---------------- */
const blank = { owned:{}, custom:[], totals:{}, exclusoes:{}, inclusoes:{}, uniques:{}, selados:{}, capas:{},
                decks:[], chase:{ grupos:[{ id:"geral", nome:"Quero comprar" }], cartas:[] },
                mesa:{ eu:"", grupos:[], atual:null },
                config:{ regiao:"global", acabamento:"normal", tema:"ouro",
                         avisos:{ chase:true, noticias:false, colecao:false } } };
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return structuredClone(blank);
    const lido = Object.assign(structuredClone(blank), JSON.parse(raw));
    lido.config = Object.assign({ regiao:"global", acabamento:"normal", tema:"ouro" }, lido.config || {});
    lido.uniques = lido.uniques || {};
    return lido;
  }catch(e){ return structuredClone(blank); }
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(S)); }
  catch(e){ toast("Não consegui salvar (armazenamento cheio ou bloqueado)"); }
  // quem está logado tem a mudança levada para a conta alguns segundos depois
  if(typeof agendarSync === "function") agendarSync();
}

/* cartas que o usuário tirou de uma coleção na mão — vale para as temáticas
   prontas também, porque a curadoria de ninguém acerta o gosto de todo mundo */
function excluidasDe(id){ return (S.exclusoes && S.exclusoes[id]) || []; }
/* cartas que o usuário puxou para dentro de uma coleção que a busca não pegaria */
function incluidasDe(id){ return (S.inclusoes && S.inclusoes[id]) || []; }
function incluirNaColecao(colId, carta){
  S.inclusoes = S.inclusoes || {};
  const atual = S.inclusoes[colId] || [];
  if(atual.some(c => c.id === carta.id)) return false;
  atual.push(carta);
  S.inclusoes[colId] = atual;
  save();
  return true;
}
function removerIncluida(colId, cardId){
  if(!S.inclusoes || !S.inclusoes[colId]) return;
  S.inclusoes[colId] = S.inclusoes[colId].filter(c => c.id !== cardId);
  save();
}
function excluirDaColecao(colId, cardId){
  S.exclusoes = S.exclusoes || {};
  const atual = new Set(excluidasDe(colId));
  atual.add(cardId);
  S.exclusoes[colId] = [...atual];
  save();
}
function restaurarColecao(colId){
  if(!S.exclusoes) return;
  delete S.exclusoes[colId];
  save();
}

/* Quantas versões da mesma carta a coleção deve conter:
   uma por carta, uma por arte (repete quando a ilustração muda) ou toda impressão. */
const VERSOES = [["cards","uma linha por carta"],["art","uma por arte diferente"],["prints","todas as impressões"]];
function uniqueDaColecao(def){ return (S.uniques && S.uniques[def.id]) || def.unique || "cards"; }
function definirUnique(colId, valor){
  S.uniques = S.uniques || {};
  S.uniques[colId] = valor;
  save();
}

/* ---------------- Scryfall ---------------- */
const memCache = new Map();     // "q|unique|order|page" -> resposta
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function scryPage(q, unique="cards", order="name", page=1, dir="auto"){
  const key = `${q}|${unique}|${order}|${dir}|${page}`;
  if(memCache.has(key)) return memCache.get(key);
  const url = `${API}/cards/search?q=${encodeURIComponent(q)}&unique=${unique}&order=${order}&dir=${dir}&page=${page}`;
  const res = await fetch(url, { headers:{ "Accept":"application/json" } });
  if(res.status === 404){ const out = { data:[], total_cards:0, has_more:false }; memCache.set(key,out); return out; }
  if(!res.ok) throw new Error(`Scryfall respondeu ${res.status}`);
  const json = await res.json();
  memCache.set(key, json);
  await sleep(PAGE_DELAY);
  return json;
}

function normalize(c){
  const faces = (c.card_faces || []).filter(f => f && f.image_uris);
  const face = (c.image_uris ? c : faces[0]) || {};
  const img = face.image_uris || {};
  return {
    id:c.id, name:c.name, set:(c.set||"").toUpperCase(), setName:c.set_name,
    layout:c.layout || "normal",
    /* cartas de duas faces: guardo os dois lados para dar o botão de virar */
    faces: faces.length > 1 ? faces.map(f => ({
      nome:f.name, small:(f.image_uris||{}).small,
      normal:(f.image_uris||{}).normal || (f.image_uris||{}).large })) : null,
    num:c.collector_number, rarity:c.rarity, type:c.type_line, mana:c.mana_cost || (c.card_faces&&c.card_faces[0]&&c.card_faces[0].mana_cost) || "",
    oracle:c.oracle_text || (c.card_faces||[]).map(f=>f.oracle_text).filter(Boolean).join("\n//\n"),
    artist:c.artist, released:c.released_at,
    small:img.small, normal:img.normal || img.large,
    arteCrop:img.art_crop,
    usd:c.prices && c.prices.usd,
    usdFoil:c.prices && (c.prices.usd_foil || c.prices.usd_etched),
    eur:c.prices && c.prices.eur,
    eurFoil:c.prices && c.prices.eur_foil,
    url:c.scryfall_uri,
    compra:c.purchase_uris || null,
    impressoesUri:c.prints_search_uri || null,
    arte:c.illustration_id || (c.card_faces && c.card_faces[0] && c.card_faces[0].illustration_id) || null,
    acabamentos:c.finishes || [],
    promos:c.promo_types || [],
    frames:c.frame_effects || [],
    borda:c.border_color || "",
    /* usados pela área de decks: identidade de cor manda no Commander,
       o que a terra produz manda no diagnóstico de mana */
    ci:(c.color_identity || []).join("").toLowerCase(),
    produz:(c.produced_mana || []).join("").toLowerCase(),
    legal:c.legalities || null,
    edhrec:c.edhrec_rank || null,
    cores:(c.colors || (c.card_faces && c.card_faces[0] && c.card_faces[0].colors) || []).join("").toLowerCase(),
    mv:(c.cmc === undefined ? null : c.cmc)
  };
}

/* O que fica guardado de cada carta que você tem. É o bastante para a aba
   "Minha coleção" funcionar sozinha, sem consultar o Scryfall a cada abertura. */
function resumoCarta(c){
  return { n:c.name, s:c.set, sn:c.setName, num:c.num, r:c.rarity, t:c.type,
           c:c.cores || "", mv:(c.mv === undefined ? null : c.mv),
           img:c.small, big:c.normal, art:c.artist, url:c.url,
           usd:Number(c.usd) || 0, eur:Number(c.eur) || 0,
           usdF:Number(c.usdFoil) || 0, eurF:Number(c.eurFoil) || 0,
           fin:c.acabamentoEscolhido || "normal", promos:c.promos || [], arte:c.arte || null,
           crop:c.arteCrop || null,
           ano:(c.released || "").slice(0,4), at:Date.now() };
}
function cartaDoResumo(id, r){
  return { id, name:r.n, set:r.s, setName:r.sn, num:r.num, rarity:r.r, type:r.t,
           cores:r.c || "", mv:r.mv, small:r.img, normal:r.big || r.img,
           usd:r.usd || null, eur:r.eur || null,
           usdFoil:r.usdF || null, eurFoil:r.eurF || null, artist:r.art, url:r.url,
           acabamentoEscolhido:r.fin || "normal", promos:r.promos || [], arte:r.arte || null,
           arteCrop:r.crop || null,
           released:r.ano ? `${r.ano}-01-01` : "", mana:"", oracle:"", compra:null, impressoesUri:null };
}
function toggleOwn(card){
  if(S.owned[card.id]) delete S.owned[card.id];
  else S.owned[card.id] = resumoCarta(card);
  save(); renderKPIs();
}

/* Cartas marcadas antes desta versão só têm nome e set guardados.
   Este remendo busca o resto em lotes e some sozinho depois. */
let hidratando = false;
async function hidratarColecao(){
  if(hidratando) return false;
  /* "semImg" marca a carta que o Scryfall não conhece mais: sem isso ela
     volta na lista toda vez e a aba fica repintando para sempre. */
  const faltando = Object.keys(S.owned).filter(id => !S.owned[id].img && !S.owned[id].semImg);
  if(!faltando.length) return false;
  hidratando = true;
  let mudou = false;
  try{
    for(let i = 0; i < faltando.length; i += 75){
      const lote = faltando.slice(i, i + 75).map(id => ({ id }));
      const r = await fetch(`${API}/cards/collection`, {
        method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
        body: JSON.stringify({ identifiers: lote })
      });
      if(!r.ok) break;
      const j = await r.json();
      (j.data || []).map(normalize).forEach(c => {
        const antes = S.owned[c.id] || {};
        // o que é seu não se perde: data de entrada, acabamento e quantidade
        S.owned[c.id] = Object.assign(resumoCarta(c), {
          at: antes.at || Date.now(), fin: antes.fin || "normal", q: antes.q });
        mudou = true;
      });
      (j.not_found || []).forEach(x => {
        const id = x && x.id;
        if(id && S.owned[id]){ S.owned[id].semImg = 1; mudou = true; }
      });
      await sleep(120);
    }
    if(mudou) save();
    return mudou;
  } finally { hidratando = false; }
}
/* conta cópias, não linhas: quem tem quatro Llanowar Elves iguais tem quatro cartas */
function ownedCount(){ return Object.keys(S.owned).reduce((a,id)=>a+qtdDe(id),0); }
/* o valor já desconta a condição de cada carta — ver CONDICOES */
function ownedValue(){ return Object.keys(S.owned).reduce((a,id)=>a+valorUnitario(id)*qtdDe(id),0); }
function money(v){
  const r = regiao();
  let valor = v, simbolo = "US$";
  if(r.moeda === "BRL" && CAMBIO && CAMBIO.usd){ valor = v * CAMBIO.usd; simbolo = "R$"; }
  else if(r.moeda === "EUR" && CAMBIO && CAMBIO.eur && CAMBIO.usd){ valor = v * (CAMBIO.eur ? CAMBIO.usd/CAMBIO.eur : 1); simbolo = "€"; }
  return simbolo + " " + valor.toLocaleString("pt-BR",{maximumFractionDigits:0});
}

function renderKPIs(){
  document.getElementById("kpi-cards").textContent = ownedCount().toLocaleString("pt-BR");
  document.getElementById("kpi-value").textContent = money(ownedValue());
}

/* telas de dentro → a qual mestre pertencem */
const DONO_DA_TELA = {
  collection:"colecao", set:"buscador", secretlair:"buscador", promos:"buscador",
  deck:"game", config:null,
};

function mestreDaView(nome){
  const dono = MENU.find(m => m.secoes.some(s => s.v === nome));
  if(dono) return dono.id;
  return DONO_DA_TELA[nome] !== undefined ? DONO_DA_TELA[nome] : null;
}

let view = { name:"home", id:null };
const app = document.getElementById("app");

function pintarNav(){
  const atual = mestreDaView(view.name);
  const masters = document.getElementById("masters");
  masters.innerHTML = MENU.map(m => `
    <button class="master ${m.id===atual?"on":""}" data-master="${m.id}">${m.nome}${
      m.secoes.length > 1 ? `<span class="seta">▾</span>` : ""}</button>`).join("");
  masters.querySelectorAll("[data-master]").forEach(b => b.onclick = () => {
    const m = MENU.find(x => x.id === b.dataset.master);
    go(m.secoes[0].v);
  });

  const barra = document.getElementById("subtabs");
  const dono = MENU.find(m => m.id === atual);
  // um mestre com uma seção só não precisa repetir o próprio nome embaixo
  if(!dono || dono.secoes.length < 2){ barra.innerHTML = ""; return; }
  barra.innerHTML = dono.secoes.map(s => `
    <button class="tab ${s.v===view.name?"active":""}" data-view="${s.v}">${s.nome}</button>`).join("");
  barra.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
}

function go(name,id){ view={name,id}; render(); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  pintarNav(); renderKPIs();
  if(view.name==="home") return renderHome();
  if(view.name==="comunidade") return renderComunidade();
  if(view.name==="troca") return renderTroca();
  if(view.name==="config") return renderConfig();
  if(view.name==="themes") return renderThemes();
  if(view.name==="minha") return renderMinha();
  if(view.name==="mine") return renderMine();
  if(view.name==="decks") return renderDecks();
  if(view.name==="deck") return renderDeck(view.id);
  if(view.name==="chase") return renderChase();
  if(view.name==="mesa") return renderMesa();
  if(view.name==="catalogo") return renderCatalogo();
  if(view.name==="sets") return renderSets();
  if(view.name==="set") return renderSet(view.id);
  if(view.name==="secretlair") return renderSecretLair();
  if(view.name==="promos") return renderPromos();
  if(view.name==="collection") return renderCollection(view.id);
}

/* =====================================================================
   HOME — as notícias do dia

   O app não reproduz matéria de ninguém: mostra manchete, imagem e fonte,
   e o toque leva para o site de quem escreveu. Quem lê os feeds é o robô,
   de quatro em quatro horas, porque nenhum site de Magic libera leitura
   direta pelo navegador.

   A última leva fica guardada aqui no aparelho: no metrô, a Home abre.
   ===================================================================== */
const NEWS_KEY = "collector.noticias";
let noticias = { itens:null, em:0, erro:null, carregando:false };

function noticiasGuardadas(){
  try{
    const g = JSON.parse(localStorage.getItem(NEWS_KEY) || "null");
    return (g && Array.isArray(g.itens)) ? g : null;
  }catch(e){ return null; }
}

async function carregarNoticias(forcar){
  if(noticias.carregando) return;
  if(!forcar && noticias.itens && Date.now() - noticias.em < 15*60*1000) return;
  noticias.carregando = true;
  try{
    const linhas = await supa("news?select=id,url,source,source_name,title,summary,image,published_at"
                            + "&order=published_at.desc&limit=40");
    noticias = { itens:linhas, em:Date.now(), erro:null, carregando:false };
    try{ localStorage.setItem(NEWS_KEY, JSON.stringify({ itens:linhas, em:noticias.em })); }catch(e){}
  }catch(e){
    noticias.carregando = false;
    noticias.erro = e.message;
  }
  if(view.name === "home") renderHome();
}

const FONTE_COR = {
  wizards:"#e3b25a", goldfish:"#5bd69b", hipsters:"#f0705c",
  edhrec:"#6fb6f0", herald:"#b48ce0",
};

function quandoRelativo(iso){
  const t = new Date(iso).getTime();
  if(!t) return "";
  const min = Math.round((Date.now() - t) / 60000);
  if(min < 2) return "agora";
  if(min < 60) return `há ${min} min`;
  const h = Math.round(min/60);
  if(h < 24) return `há ${h} h`;
  const d = Math.round(h/24);
  if(d === 1) return "ontem";
  if(d < 30) return `há ${d} dias`;
  return new Date(iso).toLocaleDateString("pt-BR", { day:"2-digit", month:"short" });
}

/* O resumo do feed costuma vir com o rodapé do WordPress grudado —
   "The post X appeared first on Y", "Continue reading". Isso não é
   notícia, é encanamento: sai antes de aparecer na tela. */
function limparResumo(txt){
  return String(txt || "")
    .replace(/\s*The post\b[\s\S]*?appeared first on[\s\S]*$/i, "")
    .replace(/\s*Continue reading[\s\S]*$/i, "")
    .replace(/\s*Read (the rest|more)[\s\S]*$/i, "")
    .replace(/\s*\[[.…]+\]\s*$/, "")
    .replace(/\s*[.…]{2,}\s*$/, "…")
    .trim();
}

function noticiaHTML(n, grande){
  const cor = FONTE_COR[n.source] || "var(--accent)";
  const img = n.image
    ? `<img src="${escapeHTML(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
    : `<div class="sem-foto">${escapeHTML((n.source_name||"?")[0])}</div>`;
  return `
  <a class="noticia ${grande?"grande":""}" href="${escapeHTML(n.url)}" target="_blank" rel="noopener noreferrer">
    <div class="n-foto">${img}</div>
    <div class="n-corpo">
      <span class="n-fonte" style="color:${cor}">${escapeHTML(n.source_name)}</span>
      <h3>${escapeHTML(n.title)}</h3>
      ${grande && limparResumo(n.summary) ? `<p>${escapeHTML(limparResumo(n.summary))}</p>` : ""}
      <span class="n-quando">${quandoRelativo(n.published_at)}</span>
    </div>
  </a>`;
}

    ${itens.length ? `
      <div class="noticias">
        ${noticiaHTML(primeira, true)}

      </div>
      <p class="status">${noticias.em ? "última atualização " + quandoRelativo(new Date(noticias.em).toISOString()) : ""}</p>
    ` : noticias.erro ? `
      <div class="empty">Não consegui buscar as notícias agora.<br>

    ` : `<div class="empty">Buscando as notícias…</div>`}

    <div class="atalhos-home">
      <button class="atalho" data-ir="minha"><b>Sua coleção</b><span>${ownedCount().toLocaleString("pt-BR")} cartas · ${money(ownedValue())}</span></button>
      <button class="atalho" data-ir="chase"><b>Chase cards</b><span>${((S.chase||{}).cartas||[]).length} sendo vigiadas</span></button>
      <button class="atalho" data-ir="decks"><b>Seus decks</b><span>${(S.decks||[]).length} montados</span></button>
      <button class="atalho" data-ir="comunidade"><b>Comunidade</b><span>coleções que outros publicaram</span></button>
    </div>`;

  const rec = document.getElementById("news-recarregar");

/* =====================================================================
   COLEÇÕES DA COMUNIDADE

   Publicar manda a DEFINIÇÃO da coleção (nome, busca ou lista de cartas).
   O que você tem não sai daqui — quem segue conta o próprio progresso com
   os próprios dados.

   Seguir copia a definição para "Minhas coleções", marcada com quem fez.
   Assim tudo o que já existe — progresso, capa, faltantes, chase — passa a
   valer para ela sem uma linha nova de código.
   ===================================================================== */
let comunidade = { lista:null, sigo:[], erro:null, carregando:false };

async function carregarComunidade(){
  if(comunidade.carregando) return;
  comunidade.carregando = true;
  try{
    comunidade.lista = await supa("public_collections?select=id,local_id,owner,name,descricao,icon,autor,"
      + "cartas,seguidores,payload,updated_at&order=seguidores.desc,updated_at.desc&limit=60");
    comunidade.erro = null;
    if(logado()){
      try{ comunidade.sigo = await rpc("my_follows", {}) || []; }catch(e){ comunidade.sigo = []; }
    }
  }catch(e){
    comunidade.erro = e.message;

}

function publicaCardHTML(p){

  return `

      </div>

async function seguirPublica(p, botao){
  if(!p) return;
  const local = localDaPublica(p);
  if(local) return go("collection", local.id);

  if(!logado()){
    toast("Entre na sua conta para seguir uma coleção");
    return abrirConta();
  }
  botao.disabled = true; botao.textContent = "seguindo…";
  try{
    await rpc("follow_collection", { p_id:p.id, p_seguir:true });
  }catch(e){
    botao.disabled = false; botao.textContent = "Seguir";
    return toast("Não consegui seguir: " + e.message);
  }
  // a definição vira uma coleção aqui dentro, com a marca de quem fez
  const d = p.payload || {};
  const nova = {
    id:"s" + Date.now().toString(36), type:d.type || "query", name:p.name,
    desc:p.descricao || d.desc || "", icon:p.icon || d.icon || "⭐",
    q:d.q || null, order:"name", cards:d.cards || [], createdAt:Date.now(),
    unique:d.unique || "cards",
    origem:{ id:p.id, autor:p.autor || "", em:Date.now() },
  };
  S.custom.push(nova); save();
  comunidade.sigo.push(p.id);
  toast(`"${p.name}" entrou nas suas coleções`);
  go("collection", nova.id);
}

/* publicar / despublicar uma coleção sua */
async function publicarColecao(col){
  if(!logado()){ toast("Entre na sua conta para publicar"); return abrirConta(); }
  const total = col.type === "manual" ? (col.cards||[]).length : (S.totals[col.id] || 0);
  const payload = { app:"collector", v:1, type:col.type || "query", q:col.q || null,
                    cards:col.cards || [], unique:col.unique || "cards",
                    icon:col.icon || "⭐", desc:col.desc || "" };
  try{
    await rpc("publish_collection", {
      p_local_id: col.id, p_name: col.name, p_desc: col.desc || null,
      p_icon: col.icon || "⭐", p_autor: (S.mesa && S.mesa.eu) || "",
      p_payload: payload, p_cartas: total });
    col.publicada = true; save();
    toast("Publicada — já aparece para a comunidade");
  }catch(e){ toast("Não consegui publicar: " + e.message); }
  if(view.name === "comunidade"){ comunidade.lista = null; carregarComunidade(); }
  render();
}

async function despublicarColecao(col){
  try{
    await rpc("unpublish_collection", { p_local_id: col.id });
    col.publicada = false; save();
    toast("Saiu da comunidade — continua aqui com você");
  }catch(e){ toast("Não consegui tirar: " + e.message); }
  if(view.name === "comunidade"){ comunidade.lista = null; carregarComunidade(); }
  render();
}

/* ---------------- capa da coleção ----------------

   mesmo sem internet e sem depender da carta estar em alguma lista. */
function capaDe(id){ return (S.capas || {})[id] || null; }
function definirCapa(id, carta){
  S.capas = S.capas || {};
  if(!carta) delete S.capas[id];
  else S.capas[id] = { img: carta.arteCrop || carta.normal || carta.small, nome: carta.name, cid: carta.id };
  save();
}
function capaHTML(id, fundo, emoji){
  const capa = capaDe(id);

            title="capa: ${escapeHTML(capa.nome || "")}"></div>`

/* Regra única de interação com uma miniatura, para não haver surpresa:
   clique marca a carta que você não tem; carta que você já tem só sai pelo ×. */
function naChase(id){ return !!(S.chase && (S.chase.cartas||[]).some(x => x.id === id)); }

/* o botão de "quero esta" existe em toda miniatura do app: catálogo, edições,
   coleções, Secret Lair. Ele manda a carta para os chase cards sem sair da tela. */
function ligarQuero(el, c, aoMudar){
  const b = el.querySelector(".quero-carta");
  if(!b) return;
  b.onclick = e => {
    e.stopPropagation();
    if(naChase(c.id)){
      S.chase.cartas = S.chase.cartas.filter(x => x.id !== c.id); save();
      toast(`${c.name} saiu dos chase cards`);
    } else {
      porNoChase(c);
      toast(`${c.name} entrou nos chase cards`);
    }
    if(aoMudar) aoMudar(c, el);
    else { b.classList.toggle("na-lista", naChase(c.id)); b.textContent = naChase(c.id) ? "★" : "☆"; }
  };
}

function ligarCartas(grid, achar, aoMudar){
  if(!grid) return;
  grid.querySelectorAll(".card").forEach(el => {
    const c = achar(el.dataset.id);
    if(!c) return;
    ligarQuero(el, c, aoMudar);
    const info = el.querySelector(".info");
    if(info) info.onclick = e => { e.stopPropagation(); openCard(c); };
    const tirar = el.querySelector(".tirar-carta");
    if(tirar) tirar.onclick = e => {
      e.stopPropagation();
      registrarDesfazer(`tirar ${c.name} da sua coleção`, { owned:{ ...S.owned } });
      toggleOwn(c);
      if(aoMudar) aoMudar(c, el);
    };
    el.onclick = () => {
      if(isOwned(c.id)) return openCard(c);   // já é sua: clicar abre os detalhes
      toggleOwn(c);
      if(aoMudar) aoMudar(c, el);
    };
  });
}
