}

/* =====================================================================
   CONDIÇÃO, IDIOMA E PREÇO PAGO

   Até aqui o valor estimado supunha que toda carta é NM em inglês. Isso é
   uma ficção educada: uma carta jogada vale bem menos, e carta em
   português é outro mercado.

   Duas honestidades importantes nesta parte:

   - Os multiplicadores de condição são REGRA DE BOLSO do mercado, não
     preço de fonte nenhuma. Por isso ficam à vista na tela e a conta diz
     que é estimativa. O Scryfall publica preço de carta NM; o desconto
     por desgaste é convenção de loja.
   - Idioma NÃO mexe no preço. Carta em português às vezes vale mais e às
     vezes vale menos, e eu não tenho fonte para isso — então fica só
     registrado, e a tela avisa que o preço é o da impressão em inglês.

   Carta marcada antes desta versão continua valendo como NM em inglês,
   que é o que ela já era na conta. Ninguém precisa arrumar nada.
   ===================================================================== */
const CONDICOES = [
  ["NM",  "Perfeita",     "Near Mint — como saiu do pacote",            1.00],
  ["SP",  "Quase perfeita","Slightly Played — desgaste de manuseio",     0.90],
  ["MP",  "Jogada",       "Moderately Played — marcas visíveis",         0.75],
  ["HP",  "Muito jogada", "Heavily Played — desgaste forte",             0.55],
  ["DMG", "Danificada",   "Damaged — dobra, rasgo ou dano de água",      0.35],
];
const IDIOMAS = [
  ["en", "Inglês"], ["pt", "Português"], ["es", "Espanhol"], ["ja", "Japonês"],
  ["de", "Alemão"], ["fr", "Francês"], ["it", "Italiano"], ["ru", "Russo"],
  ["ko", "Coreano"], ["zhs", "Chinês"],
];

const condDe  = r => (r && r.cond) || "NM";
const langDe  = r => (r && r.lang) || "en";
const fatorCondicao = cond => (CONDICOES.find(c => c[0] === cond) || CONDICOES[0])[3];
const nomeCondicao  = cond => (CONDICOES.find(c => c[0] === cond) || CONDICOES[0])[1];
const nomeIdioma    = lang => (IDIOMAS.find(i => i[0] === lang) || IDIOMAS[0])[1];

function normalizarCondicao(t){
  const s = String(t || "").trim().toLowerCase();
  if(!s) return "";
  if(/^(nm|m|mint|near ?mint|nova|perfeita)$/.test(s)) return "NM";
  if(/^(sp|lp|light(ly)? ?played|slight(ly)? ?played|excellent|good)$/.test(s)) return "SP";
  if(/^(mp|moderate(ly)? ?played|played)$/.test(s)) return "MP";
  if(/^(hp|heav(il)?y ?played|poor)$/.test(s)) return "HP";
  if(/^(dmg|damaged|danificada)$/.test(s)) return "DMG";
  return "";
}
function normalizarIdioma(t){
  const s = String(t || "").trim().toLowerCase();
  if(!s) return "";
  const mapa = { en:"en", english:"en", ingles:"en", "inglês":"en",
                 pt:"pt", "pt-br":"pt", portuguese:"pt", "português":"pt", portugues:"pt",
                 es:"es", spanish:"es", "espanhol":"es",
                 ja:"ja", jp:"ja", japanese:"ja", "japonês":"ja",
                 de:"de", german:"de", fr:"fr", french:"fr",
                 it:"it", italian:"it", ru:"ru", russian:"ru",
                 ko:"ko", korean:"ko", zhs:"zhs", chinese:"zhs" };
  return mapa[s] || "";
}

/* preço unitário de uma carta que você tem, já com o desconto da condição */
function valorUnitario(id){
  const r = S.owned[id];
  if(!r) return 0;
  const base = (r.fin === "foil" && r.usdF) ? r.usdF : (r.usd || 0);
  return base * fatorCondicao(condDe(r));
}
/* quanto você pagou, em dólar, somando todas as cópias */
function pagoTotal(){
  return Object.entries(S.owned).reduce((a, [id, r]) => a + (Number(r.pg) || 0) * qtdDe(id), 0);
}
function temPrecoPago(){ return Object.values(S.owned).some(r => Number(r.pg) > 0); }

/* =====================================================================
   REFERÊNCIA DE PREÇO — para anunciar e para ler um anúncio

   O app sugere um valor, mas é preciso dizer de onde ele vem, porque
   quem lê vai negociar com esse número na mão. São duas referências,
   e nenhuma delas é "o preço da carta":

   1. SCRYFALL — preço de carta solta no mercado americano (TCGplayer),
      ajustado pela condição da sua cópia e convertido pelo câmbio do
      dia. Não é o preço brasileiro: frete, imposto e o que está
      disponível por aqui mudam isso, e o app não tem essa fonte.
   2. A PRÓPRIA COMUNIDADE — o que as pessoas estão pedindo pela mesma
      carta aqui dentro, agora. Com poucos anúncios isso diz pouco, e a
      tela mostra quantos são para você julgar.

   O que o app NÃO faz: inventar um multiplicador de "mercado
   brasileiro", cobrar por idioma, ou estimar preço de carta graduada.
   Onde não há fonte, a tela diz que não há.
   ===================================================================== */

const cifraDe = m => m === "BRL" ? "R$" : m === "EUR" ? "€" : "US$";
function dinheiro(v, moeda){
  return cifraDe(moeda) + " " + Number(v).toLocaleString("pt-BR",
    { minimumFractionDigits:2, maximumFractionDigits:2 });
}
/* dólar -> moeda pedida (null quando o câmbio ainda não chegou) */
function deUsd(usd, moeda){
  if(usd == null) return null;
  if(moeda === "USD") return usd;
  if(moeda === "BRL") return (CAMBIO && CAMBIO.usd) ? usd * CAMBIO.usd : null;
  if(moeda === "EUR") return (CAMBIO && CAMBIO.usd && CAMBIO.eur) ? usd * CAMBIO.usd / CAMBIO.eur : null;
  return null;
}
/* moeda qualquer -> dólar */
function paraUsd(v, moeda){
  const n = Number(v);
  if(!(n > 0)) return null;
  if(moeda === "USD") return n;
  if(moeda === "BRL") return (CAMBIO && CAMBIO.usd) ? n / CAMBIO.usd : null;
  if(moeda === "EUR") return (CAMBIO && CAMBIO.usd && CAMBIO.eur) ? n * CAMBIO.eur / CAMBIO.usd : null;
  return null;
}

/* preço de carta solta do Scryfall já com o desconto da condição.
   Devolve null quando a fonte não tem preço para essa impressão. */
function refScryfall({ usd, usdF, fin, cond }){
  const foil = fin === "foil" || fin === "etched";
  const base = Number(foil ? (usdF || usd) : usd) || 0;
  if(!base) return null;
  const fator = fatorCondicao(cond || "NM");
  return { base, foil, fator, cond: cond || "NM", usd: base * fator };
}

/* o que a comunidade está pedindo pela mesma carta, hoje.
   Prefere anúncios da MESMA impressão; só cai para o nome quando não
   existe nenhum, e diz qual dos dois está mostrando. */
function refDaComunidade(cardId, nome, ignorarId){
  const ativos = (mercado.lista || []).filter(a =>
    a.status === "ativo" && a.preco != null && a.tipo !== "troca" && a.id !== ignorarId);
  const mesmaImpressao = cardId ? ativos.filter(a => a.card_id === cardId) : [];
  const mesmoNome = ativos.filter(a => semAcento(a.card_name || "") === semAcento(nome || ""));
  const lista = mesmaImpressao.length ? mesmaImpressao : mesmoNome;
  const valores = lista.map(a => paraUsd(a.preco, a.moeda)).filter(v => v > 0).sort((x, y) => x - y);
  if(!valores.length) return null;
  const meio = Math.floor(valores.length / 2);
  const mediana = valores.length % 2 ? valores[meio] : (valores[meio - 1] + valores[meio]) / 2;
  return { n:valores.length, mediana, min:valores[0], max:valores[valores.length - 1],
           impressao: mesmaImpressao.length > 0 };
}

/* preço das cartas que aparecem nos anúncios — o Scryfall em lote, só
   dos anúncios que estão na tela. Fica em memória enquanto a aba viver. */
let refMercado = {};
async function carregarRefDoMercado(){
  const ids = [...new Set((mercado.lista || [])
    .map(a => a.card_id).filter(id => id && !(id in refMercado)))];
  if(!ids.length) return;
  for(let i = 0; i < ids.length; i += 75){
    const lote = ids.slice(i, i + 75).map(id => ({ id }));
    try{
      const r = await fetch(`${API}/cards/collection`, {
        method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
        body: JSON.stringify({ identifiers: lote })
      });
      if(!r.ok) break;
      const j = await r.json();
      (j.data || []).forEach(c => {
        refMercado[c.id] = { usd:Number((c.prices||{}).usd) || 0,
                             usdF:Number((c.prices||{}).usd_foil) || 0 };
      });
      (j.not_found || []).forEach(x => { if(x && x.id) refMercado[x.id] = { usd:0, usdF:0 }; });
    }catch(e){ break; }
    await sleep(120);
  }
  if(view.name === "mercado") renderMercado();
}

/* o quadro de sugestão que aparece dentro do formulário do anúncio */
function blocoSugestao(alvo, moeda, ignorarId, tipo){
  const titulo = tipo === "troca"
    ? "Quanto vale o que você está oferecendo"
    : "Sugestão para este anúncio";

  if(alvo.slab && alvo.slab.grad){
    const g = (GRADUADORAS.find(x => x[0] === alvo.slab.grad) || ["", "graduadora"])[1];
    return `<span class="sug-rot">${titulo}</span>
      <p class="sug-aviso" style="margin-top:0">
        <b>Carta graduada não tem sugestão aqui.</b> Um slab ${escapeHTML(g)} ${escapeHTML(alvo.slab.nota || "")}
        vale por leilão e por população, não pelo preço da carta solta. Procure vendas recentes da mesma
        nota antes de pôr um número — o app não inventa esse valor.</p>`;
  }

  const ref = refScryfall(alvo);
  const com = refDaComunidade(alvo.id, alvo.nome, ignorarId);

  if(!ref && !com){
    return `<span class="sug-rot">${titulo}</span>
      <p class="sug-aviso" style="margin-top:0">
        O Scryfall não publica preço para essa impressão e ninguém anunciou essa carta aqui ainda.
        Sem fonte, o app não chuta um número.</p>`;
  }

  /* o número grande é o Scryfall quando existe; senão, a mediana da comunidade */
  const usdSugerido = ref ? ref.usd : com.mediana;
  const convertido  = deUsd(usdSugerido, moeda);
  const moedaFinal  = convertido == null ? "USD" : moeda;
  const valorFinal  = convertido == null ? usdSugerido : convertido;
  const arredondado = valorFinal >= 20 ? Math.round(valorFinal) : Math.round(valorFinal * 100) / 100;

  const linhas = [];
  if(ref){
    linhas.push([`Scryfall — carta solta, mercado americano${ref.foil ? " (foil)" : ""}`,
                 dinheiro(ref.base, "USD")]);
    if(ref.fator !== 1)
      linhas.push([`Condição ${ref.cond} — ${nomeCondicao(ref.cond).toLowerCase()}`,
                   "×" + ref.fator.toLocaleString("pt-BR", { minimumFractionDigits:2 })]);
  }
  if(moedaFinal !== "USD" && CAMBIO && CAMBIO.usd)
    linhas.push([moedaFinal === "BRL" ? "Câmbio de hoje" : "Câmbio de hoje (US$ → €)",
                 moedaFinal === "BRL" ? `R$ ${CAMBIO.usd.toFixed(2)}`
                                      : (CAMBIO.usd / CAMBIO.eur).toFixed(2)]);
  if(com){
    const faixa = com.min === com.max ? "" :
      ` (${dinheiro(deUsd(com.min, moedaFinal) ?? com.min, moedaFinal)} a ${dinheiro(deUsd(com.max, moedaFinal) ?? com.max, moedaFinal)})`;
    linhas.push([`Pedido aqui na comunidade — ${com.n} anúncio${com.n > 1 ? "s" : ""} ${
                   com.impressao ? "da mesma impressão" : "com esse nome"}`,
                 `mediana ${dinheiro(deUsd(com.mediana, moedaFinal) ?? com.mediana, moedaFinal)}${faixa}`]);
  }

  return `
    <div class="sug-topo">
      <div>
        <span class="sug-rot">${titulo}</span>
        <span class="sug-valor">${dinheiro(arredondado, moedaFinal)}</span>
      </div>
      ${tipo === "troca" ? "" :
        `<button type="button" class="btn ghost sug-usar" id="an-usar" data-valor="${arredondado}">usar esse valor</button>`}
    </div>
    <ul class="sug-conta">
      ${linhas.map(([a, b]) => `<li><span>${escapeHTML(a)}</span><b>${escapeHTML(b)}</b></li>`).join("")}
    </ul>
    <p class="sug-aviso">
      <b>É ponto de partida, não tabela.</b> A referência do Scryfall é o mercado americano; no Brasil
      frete, imposto e o que está disponível por aqui mudam o valor, e o app não tem essa fonte.
      Idioma e assinatura também mexem no preço e o Scryfall não separa por isso.
      ${com && com.n < 3 ? "E aqui dentro ainda são poucos anúncios para tirar média." : ""}</p>`;
}

/* quanto o anúncio está acima ou abaixo da referência do Scryfall.
   Some quando não há fonte — e some sempre em carta graduada, que tem
   régua própria (ver a área de graduadas). */
function distanciaDaReferencia(a){
  if(a.tipo === "troca" || a.preco == null) return "";
  if(a.slab && a.slab.grad) return "";
  const ref = refScryfall(Object.assign({}, refMercado[a.card_id] || {},
    { fin:a.finish, cond:a.cond }));
  if(!ref) return "";
  const pedido = paraUsd(a.preco, a.moeda);
  if(!pedido) return "";
  const d = (pedido - ref.usd) / ref.usd;
  const pct = Math.round(Math.abs(d) * 100);
  const txt = pct <= 8 ? "na referência"
            : `${pct}% ${d > 0 ? "acima" : "abaixo"} da referência`;
  return `<small>${txt}</small>`;
}

/* =====================================================================
   MERCADO INTERNO

   Um quadro de anúncios, e só. O app aproxima quem tem de quem quer, e
   NÃO toca no dinheiro — o combinado é entre as duas pessoas, como já
   acontece nos grupos de troca. Isso é decisão de projeto: intermediar
   pagamento é outra atividade inteira, com empresa, gateway, estorno e
   disputa para mediar.

   Duas coisas que a tela precisa deixar claras, e deixa:
   - o contato só aparece para quem entrou na conta (senão robô coleta);
   - não existe nota de reputação. O que existe é quantos anúncios a
     própria pessoa marcou como fechados, com essas palavras.
   ===================================================================== */
let mercado = { lista:null, carregando:false, erro:null, f:{ texto:"", tipo:"", so:"ativo" } };

async function carregarMercado(){
  if(mercado.carregando) return;
  mercado.carregando = true;
  try{
    mercado.lista = await supa("market_listings?select=id,seller,card_id,card_name,set_code,set_name,"
      + "img,cond,lang,finish,slab,tipo,preco,moeda,quer,obs,cidade,status,created_at"
      + "&order=created_at.desc&limit=200");
    mercado.erro = null;
  }catch(e){ mercado.erro = e.message; }
  mercado.carregando = false;
  if(view.name === "mercado") renderMercado();
  carregarCambio().then(() => { if(view.name === "mercado") renderMercado(); });
  carregarRefDoMercado();
}

const precoDoAnuncio = a => {
  if(a.preco == null) return "";
  const n = Number(a.preco);
  return (a.moeda === "BRL" ? "R$ " : a.moeda === "EUR" ? "€ " : "US$ ")
       + n.toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
};

    if(f.tipo && a.tipo !== f.tipo && a.tipo !== "ambos") return false;
    if(f.texto){
      const t = semAcento(f.texto);

    }
    return true;
  });

  app.innerHTML = `
    <div class="section-head">
      <div>
        <h2>Mercado</h2>
        <p>Anúncios de colecionador para colecionador. O app <b>não intermedia pagamento</b>:

      </div>

    </div>

    <div class="filtros" style="margin-bottom:16px">
      <div class="fgrupo">
        <label class="field"><span>Buscar por carta ou cidade</span>
          <input type="search" id="mk-texto" value="${escapeHTML(f.texto)}" placeholder="ex.: Sol Ring, Curitiba"></label>
      </div>
      <div class="fgrupo">
        <span class="flabel">Tipo</span>
        <div class="toggles" id="mk-tipo">
          ${[["","tudo"],["venda","à venda"],["troca","para troca"]].map(([v,t]) =>
            `<button class="tog ${f.tipo===v?"on":""}" data-tipo="${v}">${t}</button>`).join("")}
        </div>
      </div>
      <div class="fgrupo">
        <span class="flabel">Situação</span>
        <div class="toggles" id="mk-so">
          ${[["ativo","só os ativos"],["","todos"]].map(([v,t]) =>
            `<button class="tog ${f.so===v?"on":""}" data-so="${v}">${t}</button>`).join("")}
        </div>
      </div>
    </div>

    ${meus.length ? `<section class="grupo-temas">
      <h3 class="grupo-titulo">Seus anúncios<span>${meus.length}</span></h3>
      <div class="lista-compras" style="max-height:none">${meus.map(a => linhaDoAnuncio(a, true)).join("")}</div>
    </section>` : ""}

    ${mercado.erro ? `<div class="empty">Não consegui buscar agora.<br>
        <span style="color:var(--faint);font-size:12.5px">${escapeHTML(mercado.erro)}</span></div>`
    : mercado.carregando && !todos.length ? `<div class="empty">Buscando…</div>`

    : `<section class="grupo-temas">
        <h3 class="grupo-titulo">Anúncios<span>${filtrados.length}</span></h3>
        <div class="lista-compras" style="max-height:none">${filtrados.map(a => linhaDoAnuncio(a, false)).join("")}</div>
      </section>`}

    <p class="dg-txt" style="margin-top:18px">
      <b>O que é "a referência".</b> É o preço de carta solta do Scryfall — mercado americano —
      ajustado pela condição declarada no anúncio e convertido pelo câmbio de hoje${
        CAMBIO && CAMBIO.usd ? ` (US$ 1 = R$ ${CAMBIO.usd.toFixed(2)})` : ""}.
      <b>Não é o preço brasileiro:</b> frete, imposto e o que está disponível por aqui mudam esse número,
      e o app não tem essa fonte. Serve para comparar anúncios entre si, não para dizer quem está certo.
      Em carta graduada não aparece, porque slab tem régua própria.</p>

    <p class="dg-txt" style="margin-top:12px">
      <b>Combinem com cuidado.</b> O Collector não participa do negócio, não guarda dinheiro e não tem

  const texto = document.getElementById("mk-texto");

    try{
      await rpc("market_delete", { p_id:b.dataset.mkApagar });
      mercado.lista = null; carregarMercado(); renderMercado();
      toast("anúncio apagado");
    }catch(e){ toast("não consegui: " + e.message); }
  });
}

function linhaDoAnuncio(a, meu){
  const slab = a.slab && a.slab.grad
    ? ` · ${(GRADUADORAS.find(g=>g[0]===a.slab.grad)||["","?"])[1]} ${escapeHTML(a.slab.nota||"")}` : "";
  return `
  <div class="lc-linha ${a.status !== "ativo" ? "fechado" : ""}">
    ${a.img ? `<img src="${escapeHTML(a.img)}" alt="" loading="lazy">` : `<span class="mv-sem"></span>`}
    <span class="lc-nome">${escapeHTML(a.card_name)}
      <small>${escapeHTML(a.set_name || a.set_code || "")}${a.cond ? " · " + escapeHTML(a.cond) : ""}${
        a.finish === "foil" ? " · foil" : ""}${slab}${a.cidade ? " · " + escapeHTML(a.cidade) : ""}
        ${a.status !== "ativo" ? ` · <b>${a.status}</b>` : ""}
        ${a.quer ? `<br>aceita em troca: ${escapeHTML(a.quer)}` : ""}
        ${a.obs ? `<br>${escapeHTML(a.obs)}` : ""}</small></span>
    <span class="lc-preco">${a.tipo === "troca" ? "troca" : precoDoAnuncio(a)}${
      a.tipo === "troca" ? "" : distanciaDaReferencia(a)}</span>
    ${meu ? `
      <button class="icon-btn" data-mk-editar="${a.id}">editar</button>
      ${a.status === "ativo"
        ? `<button class="icon-btn" data-mk-status="${a.id}" data-valor="fechado">marcar fechado</button>`
        : `<button class="icon-btn" data-mk-status="${a.id}" data-valor="ativo">reabrir</button>`}
      <button class="icon-btn" data-mk-apagar="${a.id}">apagar</button>`
    : `<button class="icon-btn" data-contato="${a.id}">falar com o dono</button>`}
  </div>`;
}

async function verContato(id){
  if(!logado()){
    toast("Entre na sua conta para ver o contato");
    return abrirConta();
  }
  let dados = null;
  try{ dados = await rpc("market_contact", { p_id:id }); }
  catch(e){ return toast("não consegui: " + e.message); }

  const desde = dados.anuncia_desde
    ? new Date(dados.anuncia_desde).toLocaleDateString("pt-BR", { month:"long", year:"numeric" }) : null;

  modal(`<div class="modal-pad">
    <h3>Falar com quem anunciou</h3>
    <div class="kv"><span>Contato</span><b>${escapeHTML(dados.contato || "não informou")}</b></div>
    <div class="kv"><span>Anúncios que essa pessoa marcou como fechados</span><b>${dados.fechados_declarados}</b></div>

      <b>Esse número não é uma avaliação.</b> É só quantas vezes a própria pessoa marcou um anúncio dela

      desfazer nada se der errado.

function escolherCartaParaAnunciar(){
  if(!logado()){ toast("Entre na sua conta para anunciar"); return abrirConta(); }
  const minhas = cartasQueTenho().sort((a,b) => (b.unit||0) - (a.unit||0));
  if(!minhas.length) return toast("marque alguma carta na sua coleção primeiro");

  const repetidasPrimeiro = minhas.slice().sort((a,b) => (b.qtd - 1) - (a.qtd - 1));
  modal(`<div class="modal-pad">
    <h3>Qual carta você quer anunciar?</h3>
    <p style="color:var(--muted);font-size:13px;margin:6px 0 12px">
      As suas repetidas aparecem primeiro — são as que sobram de verdade.</p>
    <input type="search" id="mk-busca" placeholder="filtrar pelo nome…">
    <div class="lista-compras" id="mk-escolha" style="max-height:340px;margin-top:10px"></div>
  </div>`);

  const pintar = () => {
    const t = semAcento(document.getElementById("mk-busca").value || "");
    const lista = repetidasPrimeiro.filter(c => !t || semAcento(c.name).includes(t)).slice(0, 60);
    document.getElementById("mk-escolha").innerHTML = lista.map(c => `
      <button class="lc-linha" data-escolher="${c.id}" style="width:100%;text-align:left">
        ${c.small ? `<img src="${escapeHTML(c.small)}" alt="" loading="lazy">` : `<span class="mv-sem"></span>`}
        <span class="lc-nome">${escapeHTML(c.name)}
          <small>${escapeHTML(c.setName || c.set || "")} · ${c.cond}${c.qtd > 1 ? ` · você tem ${c.qtd}` : ""}</small></span>
        <span class="lc-preco">${money(c.unit || 0)}</span>
      </button>`).join("") || `<div class="empty">nada com esse nome</div>`;
    document.querySelectorAll("[data-escolher]").forEach(b => b.onclick = () => {
      const c = minhas.find(x => x.id === b.dataset.escolher);
      if(c) formDeAnuncio(null, c);
    });
  };
  document.getElementById("mk-busca").oninput = pintar;
  pintar();
}

    st.textContent = "publicando…";
    try{
      await rpc("market_publish", {
        p_id: anuncio ? a.id : null,
        p_carta: anuncio ? { card_name: a.card_name } : {
          card_id: carta.id, card_name: carta.name, set_code: carta.set, set_name: carta.setName,
          img: carta.small, cond: r.cond || "NM", lang: r.lang || "en", finish: r.fin || "normal",
          slab: r.slab || null,

        p_moeda: document.getElementById("an-moeda").value,

        p_obs: document.getElementById("an-obs").value,
        p_cidade: document.getElementById("an-cidade").value,
        p_contato: document.getElementById("an-contato").value,
      });
      closeModal();
      mercado.lista = null; carregarMercado();
      go("mercado");
      toast(anuncio ? "anúncio atualizado" : "anúncio publicado");
    }catch(e){ st.textContent = "não consegui: " + e.message; }
  };

/* =====================================================================
   CARTAS GRADUADAS E ASSINADAS

   Uma carta dentro de um slab não é a mesma carta solta: ela vale por
   outra régua, e o que dá credibilidade a ela é o número do certificado,
   que qualquer um confere no site da graduadora.

   Por isso o app guarda graduadora, nota e certificado — e monta o link
   de verificação sozinho. O que ele NÃO faz é estimar preço de carta
   graduada: isso depende de leilão e de população, não do preço de carta
   solta do Scryfall. A tela diz isso em vez de inventar um número.

   A foto fica no seu aparelho, em base64, e é reduzida antes de guardar:
   uma foto de celular inteira estouraria o espaço do navegador sozinha.
   ===================================================================== */
const GRADUADORAS = [
  ["psa",  "PSA",  n => `https://www.psacard.com/cert/${n}`],
  ["bgs",  "BGS",  n => `https://www.beckett.com/grading/card-lookup?certNumber=${n}`],
  ["cgc",  "CGC",  n => `https://www.cgccards.com/certlookup/${n}/`],
  ["sgc",  "SGC",  n => `https://gosgc.com/pop/certcheck/?cert=${n}`],
  ["tag",  "TAG",  n => `https://my.taggrading.com/card/${n}`],
  ["outra","Outra", () => ""],
];
const NOTAS = ["10","9.5","9","8.5","8","7","6","5","4","3","2","1"];

const ehGraduada = r => !!(r && r.slab && r.slab.grad);
const ehAssinada = r => !!(r && r.assinada && r.assinada.por);

function linkDoCertificado(slab){
  const g = GRADUADORAS.find(x => x[0] === (slab || {}).grad);
  const n = String((slab || {}).cert || "").replace(/\D/g, "");
  return (g && n) ? g[2](n) : "";
}

/* uma foto de celular tem uns 4 MB; aqui ela vira ~60 KB antes de entrar
   no armazenamento, que é pequeno e é compartilhado com a coleção inteira */
function encolherFoto(arquivo, ladoMax = 640){
  return new Promise(res => {
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const e = Math.min(1, ladoMax / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * e); cv.height = Math.round(img.height * e);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = () => res(null);
      img.src = leitor.result;
    };
    leitor.onerror = () => res(null);
    leitor.readAsDataURL(arquivo);
  });
}

/* =====================================================================
   IMPORTAR DE OUTRO APLICATIVO

   Quem já tem coleção no Moxfield, no Deckbox, no Archidekt, no TCGplayer
   ou no MTGGoldfish não vai remarcar três mil cartas na mão. Todos eles
   exportam CSV, e todos põem as mesmas coisas em colunas de nome
   diferente — então a gente lê pelo NOME DA COLUNA, não pela posição, e
   aceita os apelidos de cada um.

   Depois de ler, cada linha precisa virar uma carta de verdade. A ordem
   de tentativa vai do mais exato para o mais frouxo:

     1. id do Scryfall, quando o arquivo traz (Archidekt e Moxfield trazem)
     2. edição + número de coleção — identifica a impressão exata
     3. nome + edição
     4. só o nome — aí o Scryfall escolhe uma impressão qualquer

   E nada é gravado antes de você ver o que casou e o que não casou. Uma
   importação que apaga a coleção da pessoa é pior do que importação
   nenhuma.
   ===================================================================== */

/* apelidos de coluna → o que a gente precisa */
const COLUNAS = {
  qtd:    ["count", "quantity", "qty", "quantidade", "amount"],
  nome:   ["name", "card", "card name", "simple name", "nome"],
  set:    ["edition", "set", "set name", "edition name", "set code", "edition code", "set id"],
  setCode:["set code", "edition code", "set id"],
  numero: ["collector number", "card number", "number", "collector_number"],
  id:     ["scryfall id", "scryfall_id", "scryfallid"],
  foil:   ["foil", "finish", "printing", "premium"],
  cond:   ["condition", "condicao", "condição"],
  lang:   ["language", "lang", "idioma"],
  pago:   ["purchase price", "my price", "price", "preco pago", "preço pago", "purchase_price"],
  local:  ["location", "storage", "binder", "local", "onde", "localizacao", "localização"],
};

/* Um CSV de verdade tem vírgula dentro de aspas ("Ach! Hans, Run!") e aspas
   dobradas. Fazer isso na mão é chato mas é curto, e evita uma biblioteca. */
function lerCSV(texto){
  texto = String(texto || "").replace(/^﻿/, "");           // BOM do Excel
  const primeira = (texto.split(/\r?\n/)[0] || "");
  // alguns exports em português usam ponto e vírgula
  const sep = (primeira.match(/;/g) || []).length > (primeira.match(/,/g) || []).length ? ";" : ",";

  const linhas = [];
  let campo = "", linha = [], dentro = false;
  for(let i = 0; i < texto.length; i++){
    const ch = texto[i];
    if(dentro){
      if(ch === '"'){
        if(texto[i+1] === '"'){ campo += '"'; i++; }
        else dentro = false;
      } else campo += ch;
    } else if(ch === '"'){ dentro = true; }
    else if(ch === sep){ linha.push(campo); campo = ""; }
    else if(ch === "\n"){ linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else if(ch !== "\r"){ campo += ch; }
  }
  if(campo || linha.length){ linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(c => String(c).trim() !== ""));
}

function mapearColunas(cabecalho){
  const limpo = cabecalho.map(c => String(c).trim().toLowerCase());
  const achar = apelidos => {
    for(const a of apelidos){ const i = limpo.indexOf(a); if(i >= 0) return i; }
    return -1;
  };
  const mapa = {};
  Object.entries(COLUNAS).forEach(([k, apelidos]) => { mapa[k] = achar(apelidos); });
  return mapa;
}

const FOIL_SIM = /^(foil|yes|true|1|sim|etched|foil etched)$/i;

function linhasDoArquivo(texto){
  const linhas = lerCSV(texto);
  if(linhas.length < 2) return { erro:"esse arquivo não parece um CSV com cabeçalho" };
  const mapa = mapearColunas(linhas[0]);
  if(mapa.nome < 0 && mapa.id < 0)
    return { erro:"não achei uma coluna de nome de carta (nem de id do Scryfall) no cabeçalho" };

  const pega = (l, i) => (i >= 0 && l[i] !== undefined) ? String(l[i]).trim() : "";
  const fora = [];
  for(let i = 1; i < linhas.length; i++){
    const l = linhas[i];
    const nome = pega(l, mapa.nome);
    const id = pega(l, mapa.id);
    if(!nome && !id) continue;
    const q = parseInt(pega(l, mapa.qtd), 10);
    const foilCru = pega(l, mapa.foil);
    fora.push({
      nome, id,
      set: (pega(l, mapa.setCode) || pega(l, mapa.set)).trim(),
      numero: pega(l, mapa.numero).replace(/^0+(?=\d)/, ""),
      qtd: Number.isFinite(q) && q > 0 ? q : 1,
      foil: FOIL_SIM.test(foilCru),
      cond: normalizarCondicao(pega(l, mapa.cond)),
      lang: normalizarIdioma(pega(l, mapa.lang)),
      pago: precoDoTexto(pega(l, mapa.pago)),
      local: pega(l, mapa.local).trim().slice(0, 80),
      linha: i + 1,
    });
  }
  return { itens:fora, colunas:mapa };
}

function precoDoTexto(t){
  if(!t) return 0;
  const n = parseFloat(String(t).replace(/[^\d.,-]/g, "").replace(/\.(?=\d{3}\b)/g, "").replace(",", "."));
  return Number.isFinite(n) && n > 0 ? n : 0;
}

/* Identificadores no formato que o /cards/collection do Scryfall entende.
   Um pedido leva 75 por vez. */
function identificadorDe(it){
  if(it.id && /^[0-9a-f-]{30,}$/i.test(it.id)) return { id: it.id };
  const set = (it.set || "").toLowerCase();
  // sigla de edição tem 3 a 5 letras/números; "Bloomburrow" por extenso não serve aqui
  const sigla = /^[a-z0-9]{3,5}$/.test(set) ? set : "";
  if(sigla && it.numero) return { set: sigla, collector_number: it.numero };
  if(sigla && it.nome)   return { name: it.nome, set: sigla };
  return { name: it.nome };
}

async function casarComOScryfall(itens, aoAndar){
  const achadas = new Map();     // índice do item → carta normalizada
  const naoAchadas = [];
  for(let i = 0; i < itens.length; i += 75){
    const lote = itens.slice(i, i + 75);
    let j = null;
    try{
      const r = await fetch(`${API}/cards/collection`, {
        method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
        body: JSON.stringify({ identifiers: lote.map(identificadorDe) })
      });
      if(r.ok) j = await r.json();
    }catch(e){}
    if(!j){ lote.forEach(it => naoAchadas.push(it)); }
    else {
      const porNome = new Map();
      (j.data || []).map(normalize).forEach(c => {
        achadas.set(c.id, c);
        const chave = c.name.toLowerCase();
        if(!porNome.has(chave)) porNome.set(chave, []);
        porNome.get(chave).push(c);
      });
      // o Scryfall devolve as cartas fora de ordem: cada item procura a sua
      lote.forEach(it => {
        const ident = identificadorDe(it);
        let c = null;
        if(ident.id) c = achadas.get(ident.id) || null;
        if(!c){
          const cands = porNome.get((it.nome || "").toLowerCase()) || [];
          c = cands.find(x => ident.set && x.set.toLowerCase() === ident.set
                              && (!ident.collector_number || String(x.num) === ident.collector_number))
              || cands.find(x => ident.set && x.set.toLowerCase() === ident.set)
              || cands[0] || null;
        }
        if(c) it.carta = c; else naoAchadas.push(it);
      });
    }
    if(aoAndar) aoAndar(Math.min(i + 75, itens.length), itens.length);
    await sleep(PAGE_DELAY);
  }
  return { casadas: itens.filter(it => it.carta), naoAchadas };
}

  modal(`<div class="modal-pad">

      <b>Moxfield</b>, <b>Deckbox</b>, <b>Archidekt</b>, <b>TCGplayer</b> e <b>MTGGoldfish</b> —

    <p style="color:var(--faint);font-size:12.5px;margin:0 0 16px">

      <input type="file" id="imp-arquivo" accept=".csv,text/csv,text/plain" hidden></label>

  document.getElementById("imp-arquivo").onchange = async e => {

    if(!arq) return;
    const st = document.getElementById("imp-status");
    st.textContent = "lendo o arquivo…";
    const texto = await arq.text();
    const lido = linhasDoArquivo(texto);
    if(lido.erro){ st.textContent = lido.erro; return; }
    if(!lido.itens.length){ st.textContent = "o arquivo não tem nenhuma linha de carta"; return; }

    st.textContent = `${lido.itens.length} linhas — procurando as cartas no Scryfall…`;
    const { casadas, naoAchadas } = await casarComOScryfall(lido.itens, (feito, total) => {
      st.textContent = `procurando as cartas no Scryfall… ${feito} de ${total}`;
    });
    st.textContent = "";
    mostrarPrevia(arq.name, casadas, naoAchadas, lido.colunas);
  };
}

function mostrarPrevia(nomeArquivo, casadas, naoAchadas, colunas){
  const copias = casadas.reduce((a, it) => a + it.qtd, 0);
  const novas  = casadas.filter(it => !isOwned(it.carta.id)).length;
  const jaTinha = casadas.length - novas;
  const valor = casadas.reduce((a, it) => a + (Number(it.carta.usd) || 0) * it.qtd, 0);
  const temCond = colunas.cond >= 0, temPago = colunas.pago >= 0;

  document.getElementById("imp-resultado").innerHTML = `
    <div class="kv"><span>Arquivo</span><b>${escapeHTML(nomeArquivo)}</b></div>
    <div class="kv"><span>Cartas encontradas</span><b>${casadas.length} linhas · ${copias} cópias</b></div>
    <div class="kv"><span>Novas para você</span><b>${novas}</b></div>
    <div class="kv"><span>Você já tinha</span><b>${jaTinha}</b></div>
    <div class="kv"><span>Valor estimado do que entra</span><b>${money(valor)}</b></div>
    ${temCond ? `<div class="kv"><span>Condição</span><b>vem no arquivo</b></div>` : ""}
    ${temPago ? `<div class="kv"><span>Preço pago</span><b>vem no arquivo</b></div>` : ""}

    ${naoAchadas.length ? `
      <details class="avancado" open>
        <summary>${naoAchadas.length} linha${naoAchadas.length>1?"s":""} que eu não consegui identificar</summary>
        <div class="nao-achadas">
          ${naoAchadas.slice(0,60).map(it => `<span>linha ${it.linha}: ${escapeHTML(it.nome || it.id || "?")}${
            it.set ? ` <i>(${escapeHTML(it.set)})</i>` : ""}</span>`).join("")}
          ${naoAchadas.length > 60 ? `<span>…e mais ${naoAchadas.length - 60}</span>` : ""}
        </div>
        <p class="dg-txt">Costuma ser carta de outro jogo, token, ou nome escrito de um jeito que o
        Scryfall não reconhece. Essas linhas simplesmente não entram — nada do que você já tem é mexido.</p>
      </details>` : ""}

    ${jaTinha ? `
      <div class="fgrupo" style="margin-top:14px">
        <span class="flabel">Para as cartas que você já tem</span>
        <div class="toggles">
          <button class="tog on" data-modo="arquivo">usar a quantidade do arquivo</button>
          <button class="tog" data-modo="somar">somar às minhas</button>
          <button class="tog" data-modo="pular">não mexer</button>
        </div>
      </div>` : ""}

    <div class="pergunta-acoes" style="margin-top:16px">
      <button class="btn" id="imp-confirmar">Trazer ${casadas.length} carta${casadas.length>1?"s":""}</button>
      <button class="btn ghost" id="imp-cancelar">Cancelar</button>
    </div>`;

  let modo = "arquivo";
  document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => {
    modo = b.dataset.modo;
    document.querySelectorAll("[data-modo]").forEach(x => x.classList.toggle("on", x === b));
  });
  document.getElementById("imp-cancelar").onclick = closeModal;
  document.getElementById("imp-confirmar").onclick = () => {
    const n = aplicarImportacao(casadas, modo);
    closeModal(); render();
    toast(`${n} carta${n>1?"s":""} entraram na sua coleção`);
  };
}

function aplicarImportacao(casadas, modo){
  let mexidas = 0;
  casadas.forEach(it => {
    const c = it.carta;
    const jaTinha = isOwned(c.id);
    if(jaTinha && modo === "pular") return;

    const antes = S.owned[c.id] || {};
    const registro = Object.assign(resumoCarta(c), {
      at: antes.at || Date.now(),
      fin: it.foil ? "foil" : (antes.fin || "normal"),
    });
    const qAntes = jaTinha ? qtdDe(c.id) : 0;
    registro.q = modo === "somar" ? qAntes + it.qtd : it.qtd;
    if(it.cond) registro.cond = it.cond;
    else if(antes.cond) registro.cond = antes.cond;
    if(it.lang) registro.lang = it.lang;
    else if(antes.lang) registro.lang = antes.lang;
    if(it.pago) { registro.pg = it.pago; registro.pgM = "USD"; }
    else if(antes.pg){ registro.pg = antes.pg; registro.pgM = antes.pgM; }
    if(it.local) registro.loc = it.local;
    else if(antes.loc) registro.loc = antes.loc;

    S.owned[c.id] = registro;
    mexidas++;
  });
  save(); renderKPIs();
  return mexidas;
}

/* =====================================================================
   CONTA E SINCRONIZAÇÃO

   Três decisões que explicam todo o resto deste bloco:

   1. Entrar é OPCIONAL. Sem conta o app é o que sempre foi: tudo no
      aparelho, nada sai daqui. A conta só acrescenta — nunca é exigida
      para abrir uma tela.

   2. A porta é um CÓDIGO DE SEIS DÍGITOS por e-mail, não um link. Link
      mágico é mais bonito, mas no iPhone ele abre no Safari — e quem
      instalou o Collector na tela de início ficaria logado no navegador
      e deslogado no aplicativo, que é exatamente o problema que a conta
      veio resolver. Código a pessoa digita onde ela está. Sem senha:
      senha é mais uma coisa para vazar, esquecer e recuperar.

   3. O que sobe é o PACOTE DO BACKUP inteiro, o mesmo de sempre. E a
      fusão é sempre aditiva, dos dois lados: entrar numa conta nunca
      apaga o que já estava no aparelho, e subir nunca apaga o que já
      estava na nuvem. Na dúvida entre perder e duplicar, duplica.
   ===================================================================== */

const SESSAO_KEY = "collector.sessao";
const SYNC_KEY   = "collector.sync";

let SYNC = { rev:0, dono:null, em:0, sujo:false, estado:"parado", timer:null, indo:null };

function lerSessao(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSAO_KEY) || "null");
    return (s && s.refresh_token) ? s : null;
  }catch(e){ return null; }
}
function guardarSessao(s){
  SESSAO = s;
  try{
    if(s) localStorage.setItem(SESSAO_KEY, JSON.stringify(s));
    else localStorage.removeItem(SESSAO_KEY);
  }catch(e){}
  pintarBotaoConta();
}
function lerSync(){
  try{ return Object.assign(SYNC, JSON.parse(localStorage.getItem(SYNC_KEY) || "{}"), { timer:null, indo:null }); }
  catch(e){ return SYNC; }
}
function guardarSync(){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify({ rev:SYNC.rev, dono:SYNC.dono, em:SYNC.em, sujo:SYNC.sujo })); }
  catch(e){}
}

const logado = () => !!(SESSAO && SESSAO.refresh_token);

/* ---------------- as três chamadas de autenticação ---------------- */
async function auth(caminho, corpo){
  const r = await fetch(`${SUPA_URL}/auth/v1/${caminho}`, {
    method:"POST",
    headers:{ apikey:SUPA_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(corpo || {})
  });
  const txt = await r.text();
  let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    const m = (j && (j.msg || j.error_description || j.message || j.error)) || `erro ${r.status}`;
    throw new Error(traduzErroAuth(m, r.status));
  }
  return j;
}

function traduzErroAuth(m, status){
  const t = String(m).toLowerCase();
  if(/invalid|expired|token has expired|otp/.test(t) && status === 403) return "código errado ou vencido — peça outro";
  if(/rate|too many|seconds/.test(t))    return "muitas tentativas seguidas — espere um minuto";
  if(/invalid.*email|email.*invalid/.test(t)) return "esse e-mail não parece válido";
  if(/signups not allowed|disabled/.test(t))  return "cadastro fechado no momento";
  return m;
}

function daSessao(j){
  if(!j || !j.access_token) throw new Error("resposta do login veio incompleta");
  return {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expira_em: Date.now() + (Number(j.expires_in || 3600) * 1000),
    email: (j.user && j.user.email) || "",
    user_id: (j.user && j.user.id) || ""
  };
}

/* Para onde o link do e-mail volta. Precisa estar na lista de Redirect URLs
   do Supabase (Authentication → URL Configuration). */
function voltarPara(){
  return location.origin + location.pathname;
}

async function pedirCodigo(email){
  await auth("otp?redirect_to=" + encodeURIComponent(voltarPara()), { email, create_user:true });
}

/* O e-mail pode chegar de duas formas, e as duas funcionam:

   - CÓDIGO de seis dígitos, que é o caminho bom: a pessoa digita onde
     estiver, inclusive dentro do app instalado na tela de início.
   - LINK, que é o que o Supabase manda enquanto o projeto usa o servidor
     de e-mail dele (no plano gratuito o texto do e-mail é fixo e só traz
     o link). Clicar no link traz os tokens no fim do endereço; esta
     função os recolhe e limpa a barra de endereço.

   Assim o login funciona hoje, e passa a funcionar também pelo código no
   dia em que o projeto tiver SMTP próprio — sem mexer no app. */
function pegarSessaoDoLink(){
  const bruto = (location.hash || "").replace(/^#/, "");
  if(!bruto) return false;
  const p = new URLSearchParams(bruto);
  // tira os tokens da barra de endereço para não ficarem no histórico
  const limpar = () => {
    try{ history.replaceState(null, "", location.pathname + location.search); }
    catch(e){ location.hash = ""; }
  };

  if(p.get("error_description") || p.get("error")){
    const m = decodeURIComponent(p.get("error_description") || p.get("error")).replace(/\+/g," ");
    limpar();
    setTimeout(() => toast("O link do e-mail não valeu: " + m), 300);
    return false;
  }
  if(!p.get("access_token") || !p.get("refresh_token")) return false;

  guardarSessao({
    access_token: p.get("access_token"),
    refresh_token: p.get("refresh_token"),
    expira_em: Date.now() + (Number(p.get("expires_in") || 3600) * 1000),
    email: "", user_id: ""
  });
  limpar();
  // o token traz o e-mail e o id dentro dele; ler é só decodificar o meio
  try{
    const meio = JSON.parse(decodeURIComponent(escape(atob(
      SESSAO.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))));
    SESSAO.email = meio.email || ""; SESSAO.user_id = meio.sub || "";
    guardarSessao(SESSAO);
  }catch(e){}
  return true;
}
async function entrarComCodigo(email, codigo){
  const j = await auth("verify", { type:"email", email, token:String(codigo).replace(/\D/g,"") });
  guardarSessao(daSessao(j));
}
async function renovarSessao(){
  if(!logado()) return false;
  try{
    const j = await auth("token?grant_type=refresh_token", { refresh_token: SESSAO.refresh_token });
    guardarSessao(daSessao(j));
    return true;
  }catch(e){
    // refresh vencido de vez: a sessão acabou, mas os dados daqui continuam intactos
    guardarSessao(null);
    return false;
  }
}
async function garantirSessao(){
  if(!logado()) return false;
  if(SESSAO.access_token && SESSAO.expira_em - Date.now() > 60000) return true;
  return renovarSessao();
}
async function sair(){
  try{
    await fetch(`${SUPA_URL}/auth/v1/logout`, { method:"POST",
      headers:Object.assign(cabecalhoAuth(), { "Content-Type":"application/json" }) });
  }catch(e){}
  guardarSessao(null);
  SYNC.rev = 0; SYNC.dono = null; SYNC.em = 0; SYNC.sujo = false; SYNC.estado = "parado";
  guardarSync();
}

/* ---------------- subir e descer ---------------- */
function nomeDoAparelho(){
  const ua = navigator.userAgent;
  const qual = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad"
             : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac"
             : /Windows/.test(ua) ? "Windows" : "navegador";
  return qual + (ehAppInstalado() ? " (app)" : "");
}

function pintarEstadoSync(){
  // o estado aparece em dois lugares: na janela da conta e na tela de Ajustes
  document.querySelectorAll("#sync-estado, #sync-estado-tela").forEach(el => el.innerHTML = textoDoSync());
  pintarBotaoConta();
}
function textoDoSync(){
  if(!logado()) return "";
  if(SYNC.estado === "indo")  return "sincronizando…";
  if(SYNC.estado === "erro")  return `<span style="color:var(--neg)">não consegui sincronizar — tentarei de novo</span>`;
  if(!SYNC.em)                return "ainda não sincronizado";
  const min = Math.round((Date.now() - SYNC.em)/60000);
  return SYNC.sujo ? "alterações esperando para subir"
       : min < 1 ? "tudo salvo na conta, agora mesmo"
       : `tudo salvo na conta · há ${min} min`;
}

/* O coração: junta o que está na nuvem com o que está aqui e sobe o
   resultado. Roda inteiro em qualquer um dos casos — primeiro login,
   aparelho novo, conflito — porque a fusão aditiva é idempotente. */
async function sincronizar(motivo){
  if(!logado()) return;
  if(SYNC.indo) return SYNC.indo;

  SYNC.indo = (async () => {
    SYNC.estado = "indo"; pintarEstadoSync();
    try{
      if(!await garantirSessao()) throw new Error("sessão vencida");

      // conta diferente da última que sincronizou neste aparelho: começa do zero
      if(SYNC.dono && SESSAO.user_id && SYNC.dono !== SESSAO.user_id){ SYNC.rev = 0; }
      SYNC.dono = SESSAO.user_id || SYNC.dono;

      const nuvem = await rpc("sync_pull", {});
      let precisaSubir = SYNC.sujo || !nuvem || motivo === "entrou";

      if(nuvem && nuvem.payload && nuvem.rev !== SYNC.rev){
        // o que está lá é novidade para este aparelho: funde e sobe o resultado
        restaurarBackup(nuvem.payload);
        precisaSubir = true;
      }

      if(precisaSubir){
        let r = await rpc("sync_push", { p_payload: pacoteDeBackup(), p_device: nomeDoAparelho(),
                                         p_rev: nuvem ? nuvem.rev : null });
        if(r && r.conflito){                       // alguém subiu no meio do caminho
          restaurarBackup(r.payload);
          r = await rpc("sync_push", { p_payload: pacoteDeBackup(), p_device: nomeDoAparelho(), p_rev: null });
        }
        SYNC.rev = (r && r.rev) || SYNC.rev;
      } else if(nuvem){
        SYNC.rev = nuvem.rev;
      }

      SYNC.sujo = false; SYNC.em = Date.now(); SYNC.estado = "ok";
      guardarSync();
      aplicarTema();
      if(motivo === "entrou" || motivo === "manual") render();
    }catch(e){
      SYNC.estado = "erro";
      if(motivo === "manual") toast("Não consegui sincronizar: " + e.message);
    }finally{
      SYNC.indo = null;
      pintarEstadoSync();
    }
  })();
  return SYNC.indo;
}

/* save() chama isto a cada mudança; sobe uma vez só depois que a pessoa para de mexer */
function agendarSync(){
  if(!logado()) return;
  // se já tem uma subida em andamento, ela leva o que acabou de mudar
  if(SYNC.indo) return;
  SYNC.sujo = true; guardarSync(); pintarEstadoSync();
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => sincronizar("mudou"), 4000);
}

/* ---------------- a tela ---------------- */
function pintarBotaoConta(){
  const b = document.getElementById("btn-conta");
  if(!b) return;
  if(!logado()){ b.textContent = "Entrar"; b.classList.remove("logado"); return; }
  b.classList.add("logado");
  const inicial = (SESSAO.email || "?").trim()[0].toUpperCase();
  const pino = SYNC.estado === "indo" ? "…" : SYNC.estado === "erro" ? "!" : SYNC.sujo ? "•" : "";
  b.textContent = inicial + (pino ? " " + pino : "");
  b.title = SESSAO.email + " — " + textoDoSync().replace(/<[^>]+>/g,"");
}

function abrirConta(){
  if(logado()) return telaDaConta();
  telaDeEntrada();
}

/* =====================================================================
   LEVAR OS DADOS EMBORA

   Quem trouxe a coleção de outro app tem que poder levá-la para o
   próximo. O formato é o do Moxfield, que é o que a maioria lê — e é o
   mesmo que a importação daqui entende, então dá para ir e voltar.
   ===================================================================== */
function csvDaColecao(){
  const escapar = v => {
    const t = String(v == null ? "" : v);
    return /[",\n;]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
  };
  const cab = ["Count","Name","Edition","Collector Number","Condition","Language",
               "Foil","Purchase Price","Scryfall ID","Location"];
  const linhas = Object.entries(S.owned).map(([id, r]) => [
    qtdDe(id), r.n || "", (r.s || "").toLowerCase(), r.num || "",
    condDe(r), langDe(r), r.fin === "foil" ? "foil" : "",
    r.pg ? Number(r.pg).toFixed(2) : "", id, r.loc || "",
  ].map(escapar).join(","));
  return [cab.join(","), ...linhas].join("\n");
}

function exportarColecao(){
  const csv = csvDaColecao();
  const linhas = Object.keys(S.owned).length;
  const blob = new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `collector-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`${linhas} linha${linhas>1?"s":""} exportadas`);
}

function abrirBackup(){

           a que não depende de nada nem de ninguém.`
        : `<b>Hoje a sua coleção só existe neste aparelho.</b> Se o navegador limpar os dados do site
           — você limpando, o telefone sem espaço, o app apagado sem querer — não há de onde
           recuperar. <b>Entrar numa conta</b> resolve isso sozinho, sem senha; baixar o arquivo
           resolve enquanto você lembrar de baixar.`}
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 12px">
      <button class="btn" id="bk-arquivo">Baixar arquivo</button>
      <label class="btn ghost" style="cursor:pointer">Restaurar de arquivo
        <input type="file" id="bk-ler" accept="application/json,.json" hidden></label>
    </div>

    <details class="avancado" ${codigo ? "" : "hidden"}>
      <summary>Passar por código (para outro aparelho)</summary>
      <p style="color:var(--faint);font-size:11.5px;margin:8px 0">
        Copie daqui e cole no outro aparelho, em Backup → Restaurar de código.</p>
      <textarea id="bk-codigo" rows="4" readonly
        style="font-family:ui-monospace,monospace;font-size:11px">${escapeHTML(codigo)}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn ghost" id="bk-copiar">Copiar código</button>
        <button class="btn ghost" id="bk-colar">Restaurar de código</button>
      </div>
    </details>
    <div class="status" id="bk-status"></div>
  </div>`);

  const st = document.getElementById("bk-status");

  document.getElementById("bk-arquivo").onclick = () => {
    const blob = new Blob([JSON.stringify(p, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `collector-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    marcarBackupFeito();
    toast("Backup baixado");
  };

  document.getElementById("bk-ler").onchange = e => {
    const arq = e.target.files && e.target.files[0];
    if(!arq) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      let obj = null;
      try{ obj = JSON.parse(leitor.result); }catch(err){ st.textContent = "esse arquivo não é um backup"; return; }
      const erro = restaurarBackup(obj);
      if(erro){ st.textContent = erro; return; }
      closeModal(); render(); toast("Backup restaurado — nada do que já estava aqui foi apagado");
    };
    leitor.readAsText(arq);
  };

  const copiar = document.getElementById("bk-copiar");
  if(copiar) copiar.onclick = () => {
    const el = document.getElementById("bk-codigo");
    el.removeAttribute("readonly"); el.select(); el.setSelectionRange(0, 999999);

    if(!texto) return;
    let obj = null;
    try{ obj = JSON.parse(texto); }
    catch(e){ try{ obj = JSON.parse(decodeURIComponent(escape(atob(texto.trim())))); }catch(e2){} }
    const erro = obj ? restaurarBackup(obj) : "não consegui ler esse código";
    if(erro){ st.textContent = erro; return; }
    closeModal(); render(); toast("Dados restaurados");
  };
}

/* "/" abre a busca de qualquer tela — menos quando você já está digitando
   em algum campo, senão a barra some do texto */
addEventListener("keydown", e => {
  if(e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
  const alvo = e.target;
  const digitando = alvo && (alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA" ||
                             alvo.tagName === "SELECT" || alvo.isContentEditable);
  if(digitando) return;
  e.preventDefault();
  abrirBuscaTudo();
});

/* =====================================================================
   Instalação na tela de início

   O service worker faz o app abrir sem internet e guardar a arte das
   cartas já vistas. Em file:// o navegador não deixa registrar — e tudo
   bem, ali é só para testar.

/* ---------------- utils ---------------- */
function escapeHTML(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
let toastT;
function toast(msg){
  clearTimeout(toastT);
  let el = document.querySelector(".toast");
  if(!el){ el = document.createElement("div"); el.className="toast"; document.body.appendChild(el); }
  el.textContent = msg;
  toastT = setTimeout(()=>el.remove(), 2600);
}
