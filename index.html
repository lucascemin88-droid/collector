  </div>`);
  document.getElementById("env-cancel").onclick = closeModal;
  document.getElementById("env-ok").onclick = () => {
    const col = customById(document.getElementById("env-col").value);
    if(!col) return;
    registrarDesfazer(`enviar cartas para ${col.name}`, { custom: JSON.parse(JSON.stringify(S.custom)) });
    let novas = 0;
    lista.forEach(c => { if(!col.cards.some(x => x.id === c.id)){ col.cards.push(c); novas++; } });
    save(); closeModal();
    toast(novas ? `${novas} carta${novas>1?"s":""} em ${col.name}` : "todas já estavam lá");
  };
}

/* =====================================================================
   CONFERÊNCIA EM MASSA

   Cadastrar 500 cartas clicando uma a uma é o motivo pelo qual a coleção
   de muita gente nunca sai do papel. Aqui a mão não sai do teclado:
   digita o nome, Enter, próxima. Quem está com o fichário aberto na
   frente da TV consegue passar o fichário inteiro.

   Quatro decisões que fazem a diferença nesse ritmo:

   - "3 sol ring" entra como três cópias. O número na frente é o jeito
     natural de falar e evita apertar + três vezes.
   - Dá para TRAVAR UMA EDIÇÃO. Conferindo um fichário de Bloomburrow,
     toda carta digitada vira a impressão daquela edição, sem escolher
     edição 300 vezes.
   - A carta entra na hora, com a linha aparecendo no topo — e cada linha
     tem desfazer. Confirmar antes de cada uma mataria o ritmo; não poder
     voltar atrás seria pior.
   - Quando o nome é ambíguo, as opções aparecem para clicar e o campo
     continua focado. Nada de modal no meio da digitação.
   ===================================================================== */
let conferencia = { linhas:[], set:"", buscando:false, opcoes:[], termo:"" };

function renderConferencia(){
  const c = conferencia;
  const total = c.linhas.reduce((a, l) => a + l.qtd, 0);

  app.innerHTML = `
    <div class="section-head">
      <div>
        <h2>Conferir a coleção</h2>
        <p>Digite o nome e aperte Enter. A carta entra na hora e a próxima já pode ser digitada —
        é para passar o fichário inteiro sem tirar a mão do teclado.</p>
      </div>
      <button class="btn ghost" id="cf-sair">Voltar para a coleção</button>
    </div>

    <div class="conf-caixa">
      <label class="field"><span>Nome da carta</span>
        <input type="text" id="cf-nome" autocomplete="off" autocapitalize="none" spellcheck="false"
               placeholder="ex.: sol ring — ou &quot;3 sol ring&quot; para três cópias"></label>
      <label class="field"><span>Travar a edição (opcional)</span>
        <input type="text" id="cf-set" maxlength="6" autocomplete="off" autocapitalize="characters"
               value="${escapeHTML(c.set)}" placeholder="ex.: BLB"></label>
    </div>
    <div class="status" id="cf-status">${c.set
      ? `tudo o que você digitar entra como carta de <b>${escapeHTML(c.set.toUpperCase())}</b>`
      : "a edição fica em branco: entra a impressão mais recente que o Scryfall achar"}</div>

    <div id="cf-opcoes" class="conf-opcoes"></div>

    <div class="toolbar" style="margin-top:16px">
      <span class="status" style="margin:0">${total
        ? `${total} carta${total > 1 ? "s" : ""} nesta sessão · ${c.linhas.length} linha${c.linhas.length > 1 ? "s" : ""}`
        : "nada ainda"}</span>
      <div class="grow"></div>
      ${c.linhas.length ? `<button class="icon-btn" id="cf-limpar">limpar a lista da tela</button>` : ""}
    </div>

    <div class="lista-compras" style="max-height:none" id="cf-lista">
      ${c.linhas.length ? c.linhas.map((l, i) => `
        <div class="lc-linha">
          ${l.img ? `<img src="${escapeHTML(l.img)}" alt="" loading="lazy">` : `<span class="mv-sem"></span>`}
          <span class="lc-nome">${escapeHTML(l.nome)}
            <small>${escapeHTML(l.setName || l.set || "")}${l.qtd > 1 ? ` · ${l.qtd} cópias` : ""}${
              l.jaTinha ? ` · você já tinha ${l.jaTinha}` : ""}</small></span>
          <span class="lc-preco">${l.usd ? money(Number(l.usd)) : "—"}</span>
          <button class="icon-btn" data-desfazer="${i}">desfazer</button>
        </div>`).join("")
      : `<div class="empty">O que você for marcando aparece aqui, com desfazer em cada linha.</div>`}
    </div>`;

  const campo = document.getElementById("cf-nome");
  const setCampo = document.getElementById("cf-set");
  document.getElementById("cf-sair").onclick = () => go("minha");
  const limpar = document.getElementById("cf-limpar");
  if(limpar) limpar.onclick = () => { conferencia.linhas = []; renderConferencia(); };

  setCampo.onchange = () => {
    conferencia.set = setCampo.value.trim().toLowerCase();
    renderConferencia();
  };
  campo.onkeydown = e => {
    if(e.key !== "Enter") return;
    e.preventDefault();
    const texto = campo.value.trim();
    if(!texto) return;
    campo.value = "";
    conferir(texto);
  };
  campo.focus();

  app.querySelectorAll("[data-desfazer]").forEach(b => b.onclick = () => {
    desfazerConferencia(Number(b.dataset.desfazer));
  });
  const ops = document.getElementById("cf-opcoes");
  if(ops) ops.onclick = e => {
    const b = e.target.closest("[data-op]");
    if(!b) return;
    const carta = conferencia.opcoes[Number(b.dataset.op)];
    if(carta) marcarNaConferencia(carta, conferencia.qtdPendente || 1);
    conferencia.opcoes = []; conferencia.qtdPendente = 0;
    renderConferencia();
  };
}

/* "3 sol ring" -> { qtd:3, nome:"sol ring" } */
function lerLinhaDeConferencia(texto){
  const m = /^(\d{1,3})\s*[xX]?\s+(.+)$/.exec(texto);
  return m ? { qtd:Math.min(99, Number(m[1])), nome:m[2].trim() } : { qtd:1, nome:texto };
}

async function conferir(texto){
  const { qtd, nome } = lerLinhaDeConferencia(texto);
  const st = document.getElementById("cf-status");
  const ops = document.getElementById("cf-opcoes");
  if(st) st.textContent = `procurando ${nome}…`;
  if(ops) ops.innerHTML = "";

  const partes = [`name:"${nome}"`];
  if(conferencia.set) partes.push(`set:${conferencia.set}`);
  try{
    const json = await scryPage(partes.join(" "), "cards", "released", 1, "desc");
    const achadas = (json.data || []).map(normalize);
    if(!achadas.length){
      if(st) st.innerHTML = `<span style="color:var(--neg)">não achei "${escapeHTML(nome)}"${
        conferencia.set ? ` em ${escapeHTML(conferencia.set.toUpperCase())}` : ""}</span>`;
      return;
    }
    /* nome exato ganha de nome parecido: quem digita "counterspell" quer
       Counterspell, não Counterspell Bug */
    const exatas = achadas.filter(c => semAcento(c.name) === semAcento(nome));
    const lista = exatas.length ? exatas : achadas;
    if(lista.length === 1 || exatas.length === 1){
      marcarNaConferencia(lista[0], qtd);
      renderConferencia();
      return;
    }
    conferencia.opcoes = lista.slice(0, 8);
    conferencia.qtdPendente = qtd;
    if(st) st.textContent = `${lista.length} cartas com esse nome — escolha qual`;
    if(ops) ops.innerHTML = conferencia.opcoes.map((c, i) => `
      <button class="conf-op" data-op="${i}">
        ${c.small ? `<img src="${escapeHTML(c.small)}" alt="" loading="lazy">` : ""}
        <span>${escapeHTML(c.name)}<small>${escapeHTML(c.setName || c.set || "")}</small></span>
      </button>`).join("");
  }catch(e){
    if(st) st.innerHTML = `<span style="color:var(--neg)">não consegui buscar agora</span>`;
  }
}

function marcarNaConferencia(carta, qtd){
  const jaTinha = qtdDe(carta.id);
  if(!S.owned[carta.id]) S.owned[carta.id] = resumoCarta(carta);
  definirQtd(carta.id, jaTinha + qtd);
  conferencia.linhas.unshift({ id:carta.id, nome:carta.name, set:carta.set,
    setName:carta.setName, img:carta.small, usd:carta.usd, qtd, jaTinha });
  conferencia.linhas = conferencia.linhas.slice(0, 200);
  save();
}

function desfazerConferencia(i){
  const l = conferencia.linhas[i];
  if(!l) return;
  definirQtd(l.id, Math.max(0, qtdDe(l.id) - l.qtd));
  conferencia.linhas.splice(i, 1);
  save();
  renderConferencia();
  toast(`${l.nome} desfeita`);
}

/* =====================================================================
   BUSCA ÚNICA

   O app cresceu para sete lugares onde se procura: catálogo, coleção,
   decks, edições, chase, mercado e trocas. Quem sabe o que quer não devia
   ter que lembrar em qual deles isso mora.

   Este campo procura em tudo o que já está no aparelho — carta da sua
   coleção, deck, coleção temática ou própria, edição, chase card — e
   responde na hora, sem rede. A busca no catálogo inteiro do Scryfall
   continua sendo a do Buscador, e aparece aqui como último item: "buscar
   <termo> no catálogo", que é o que fazer quando a carta ainda não é sua.

   Atalho: `/` de qualquer tela (menos dentro de um campo de texto).
   ===================================================================== */
function resultadosDaBusca(termo){
  const t = semAcento(termo).trim();
  if(t.length < 2) return [];
  const achados = [];
  const cabe = (texto) => semAcento(texto || "").includes(t);

  (S.decks || []).forEach(d => {
    if(cabe(d.nome)) achados.push({ tipo:"Deck", nome:d.nome,
      detalhe:`${formatoDe(d.formato).nome} · ${totalDoDeck(d)} cartas`,
      ir:() => go("deck", d.id) });
  });

  (S.custom || []).forEach(c => {
    if(cabe(c.name)) achados.push({ tipo:"Sua coleção", nome:c.name,
      detalhe:c.desc || "", ir:() => go("collection", c.id) });
  });

  THEMES.forEach(c => {
    if(cabe(c.name)) achados.push({ tipo:"Coleção temática", nome:c.name,
      detalhe:c.grupo || "", ir:() => go("collection", c.id) });
  });

  ((S.chase || {}).cartas || []).forEach(x => {
    if(cabe(x.n)) achados.push({ tipo:"Chase card", nome:x.n, img:x.img,
      detalhe:"na sua lista de caça", ir:() => go("chase") });
  });

  /* as cartas que você tem vêm por último entre os "seus", mas são o que
     a pessoa procura na maioria das vezes — então entram no topo */
  const minhas = [];
  Object.entries(S.owned).forEach(([id, r]) => {
    if(minhas.length >= 8) return;
    if(!cabe(r.n)) return;
    minhas.push({ tipo:"Na sua coleção", nome:r.n, img:r.img,
      detalhe:`${r.sn || r.s || ""}${qtdDe(id) > 1 ? ` · ${qtdDe(id)} cópias` : ""}${
        r.loc ? ` · ${r.loc}` : ""}`,
      ir:() => openCard(cartaDoResumo(id, r)) });
  });

  (listaDeSets() || []).forEach(x => {
    if(achados.length > 40) return;
    if(cabe(x.name) || semAcento(x.code) === t) achados.push({ tipo:"Edição", nome:x.name,
      detalhe:(x.code || "").toUpperCase(), ir:() => go("set", x.code) });
  });

  return [...minhas, ...achados].slice(0, 24);
}

/* as edições já carregadas, quando houver — a busca não vai à rede */
function listaDeSets(){
  try{ return (typeof SETS !== "undefined" && SETS && SETS.length) ? SETS : []; }
  catch(e){ return []; }
}

/* =====================================================================
   RETRATO DA COLEÇÃO

   Todo o dado já está no aparelho — cor, raridade, edição, ano, custo de
   mana. Falta só olhar para ele junto.

   Três cuidados para não virar gráfico bonito e mentiroso:

   - CONTA CÓPIA, não linha. Quem tem seis Sol Ring tem seis cartas, e é
     assim que as barras somam.
   - CARTA MULTICOLOR entra em cada cor que ela tem, e a tela diz isso —
     senão a soma das cores não bate com o total e ninguém entende por quê.
   - O ANO é o da IMPRESSÃO que você tem, não o da estreia da carta. Uma
     reimpressão de 2024 de uma carta de 1994 conta em 2024, e a tela
     avisa, porque as duas leituras são legítimas e só uma está aqui.
   ===================================================================== */
const NOMES_DE_COR = { w:"Branco", u:"Azul", b:"Preto", r:"Vermelho", g:"Verde" };

function retratoDaColecao(){
  const cartas = cartasQueTenho();
  const total = somaQtd(cartas);
  if(!total) return null;

  const cores = { w:0, u:0, b:0, r:0, g:0 }, multi = { n:0 }, incolor = { n:0 };
  const raridade = {}, porSet = {}, porDecada = {}, curva = {};
  let maisAntiga = null, maisCara = null;

  cartas.forEach(c => {
    const q = c.qtd || 1;
    const cor = (c.cores || "").replace(/[^wubrg]/g, "");
    if(!cor) incolor.n += q;
    else {
      cor.split("").forEach(x => { if(cores[x] !== undefined) cores[x] += q; });
      if(cor.length > 1) multi.n += q;
    }
    raridade[c.rarity] = (raridade[c.rarity] || 0) + q;
    if(c.set) porSet[c.set] = { nome:c.setName || c.set.toUpperCase(),
                                n:((porSet[c.set] || {}).n || 0) + q };
    const ano = Number((c.released || "").slice(0, 4));
    if(ano){
      const dec = Math.floor(ano / 10) * 10;
      porDecada[dec] = (porDecada[dec] || 0) + q;
      if(!maisAntiga || ano < Number((maisAntiga.released || "").slice(0, 4))) maisAntiga = c;
    }
    /* terreno não tem custo e entupiria a coluna do zero */
    if(c.mv != null && !/land/i.test(c.type || "")){
      const chave = Math.min(8, Math.round(c.mv));
      curva[chave] = (curva[chave] || 0) + q;
    }
    if(!maisCara || (c.unit || 0) > (maisCara.unit || 0)) maisCara = c;
  });

  const emOrdem = obj => Object.entries(obj).sort((a, b) => b[1] - a[1]);
  return {
    total, diferentes:cartas.length,
    cores, multi:multi.n, incolor:incolor.n,
    raridade, curva,
    sets: Object.entries(porSet).map(([code, x]) => ({ code, ...x })).sort((a, b) => b.n - a.n),
    decadas: Object.entries(porDecada).sort((a, b) => Number(a[0]) - Number(b[0])),
    maisAntiga, maisCara,
    emOrdem,
  };
}

function barra(valor, teto, cor){
  const pct = teto ? Math.max(2, Math.round(100 * valor / teto)) : 0;
  return `<i style="width:${pct}%${cor ? `;background:${cor}` : ""}"></i>`;
}

function blocoRetrato(){
  const r = retratoDaColecao();
  if(!r) return "";
  const corHex = { w:"var(--m-w, #EFE5C8)", u:"var(--m-u, #4E8FD1)", b:"var(--m-b, #7A6E8C)",
                   r:"var(--m-r, #D4544A)", g:"var(--m-g, #4E9E68)" };
  const tetoCor = Math.max(...Object.values(r.cores), r.incolor, 1);
  const tetoCurva = Math.max(...Object.values(r.curva), 1);
  const tetoDec = Math.max(...r.decadas.map(d => d[1]), 1);
  const rarNome = { mythic:"Mítica", rare:"Rara", uncommon:"Incomum", common:"Comum" };

  return `
  <section class="retrato" id="retrato">
    <h3 class="grupo-titulo">Retrato da coleção<span>${r.total.toLocaleString("pt-BR")}</span></h3>

    <div class="ret-grade">
      <div class="ret-bloco">
        <span class="flabel">Por cor</span>
        ${Object.entries(NOMES_DE_COR).map(([k, nome]) => `
          <div class="ret-linha"><span>${nome}</span>
            <div class="ret-barra">${barra(r.cores[k], tetoCor, corHex[k])}</div>
            <b>${r.cores[k].toLocaleString("pt-BR")}</b></div>`).join("")}
        <div class="ret-linha"><span>Incolor</span>
          <div class="ret-barra">${barra(r.incolor, tetoCor, "var(--m-c, #8E8A99)")}</div>
          <b>${r.incolor.toLocaleString("pt-BR")}</b></div>
        <p class="ret-obs">Carta de duas cores entra nas duas — por isso a soma passa do total.
          ${r.multi ? `<b>${r.multi.toLocaleString("pt-BR")}</b> são multicoloridas.` : ""}</p>
      </div>

      <div class="ret-bloco">
        <span class="flabel">Por raridade</span>
        ${["mythic","rare","uncommon","common"].filter(k => r.raridade[k]).map(k => `
          <div class="ret-linha"><span><i class="rar-${k}"></i>${rarNome[k]}</span>
            <div class="ret-barra">${barra(r.raridade[k], Math.max(...Object.values(r.raridade)))}</div>
            <b>${r.raridade[k].toLocaleString("pt-BR")}</b></div>`).join("")}
        <p class="ret-obs">${(() => {
          const raras = (r.raridade.mythic || 0) + (r.raridade.rare || 0);
          return `${Math.round(100 * raras / r.total)}% da sua coleção é rara ou mítica.`;
        })()}</p>
      </div>

      <div class="ret-bloco">
        <span class="flabel">Custo de mana</span>
        <div class="ret-curva">
          ${Array.from({ length:9 }, (_, i) => `
            <div class="cv-col" title="${r.curva[i] || 0} cartas de custo ${i}${i === 8 ? " ou mais" : ""}">
              <div class="cv-barra"><i style="height:${Math.round(100 * (r.curva[i] || 0) / tetoCurva)}%"></i></div>
              <span>${i === 8 ? "8+" : i}</span>
            </div>`).join("")}
        </div>
        <p class="ret-obs">Só as cartas que não são terreno — terreno não tem custo e ocuparia
          a coluna do zero sozinho.</p>
      </div>

      <div class="ret-bloco">
        <span class="flabel">Por década de impressão</span>
        ${r.decadas.map(([dec, n]) => `
          <div class="ret-linha"><span>${dec}s</span>
            <div class="ret-barra">${barra(n, tetoDec)}</div>
            <b>${n.toLocaleString("pt-BR")}</b></div>`).join("") ||
          `<p class="ret-obs">Sem data de impressão nas suas cartas.</p>`}
        <p class="ret-obs">É o ano da <b>impressão que você tem</b>, não o da estreia da carta: uma
          reimpressão nova de uma carta velha conta no ano da reimpressão.</p>
      </div>

      <div class="ret-bloco">
        <span class="flabel">Edições que mais aparecem</span>
        ${r.sets.slice(0, 6).map(x => `
          <div class="ret-linha"><span>${escapeHTML(x.nome)}</span>
            <div class="ret-barra">${barra(x.n, r.sets[0].n)}</div>
            <b>${x.n.toLocaleString("pt-BR")}</b></div>`).join("")}
        <p class="ret-obs">${r.sets.length} edições diferentes no total.</p>
      </div>

      <div class="ret-bloco">
        <span class="flabel">Destaques</span>
        ${r.maisCara ? `<div class="ret-kv"><span>A mais valiosa</span>
          <b>${escapeHTML(r.maisCara.name)}</b>
          <small>${escapeHTML(r.maisCara.setName || "")} · ${money(r.maisCara.unit || 0)}</small></div>` : ""}
        ${r.maisAntiga ? `<div class="ret-kv"><span>A impressão mais antiga</span>
          <b>${escapeHTML(r.maisAntiga.name)}</b>
          <small>${escapeHTML(r.maisAntiga.setName || "")} · ${escapeHTML((r.maisAntiga.released || "").slice(0,4))}</small></div>` : ""}
        <div class="ret-kv"><span>Cartas diferentes</span>
          <b>${r.diferentes.toLocaleString("pt-BR")}</b>
          <small>de ${r.total.toLocaleString("pt-BR")} cópias no total</small></div>
      </div>
    </div>
  </section>`;
}

function abrirAdicionarCarta(){
  modal(`<div class="modal-pad">
    <h3>Adicionar carta</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 14px">
      Busque pelo nome. As versões com a <b>mesma ilustração</b> vêm agrupadas — clique numa arte
      para escolher a edição e o acabamento exatos.</p>
    <label class="field"><span>Nome da carta</span>
      <input type="text" id="ad-nome" placeholder="ex.: Sol Ring" autocomplete="off">
    </label>
    <div id="ad-artes" class="artes"></div>
    <div id="ad-versoes"></div>
    <div class="status" id="ad-status">digite pelo menos três letras</div>
  </div>`);
  const campo = document.getElementById("ad-nome");
  let timer, achadas = [], busca = 0;
  campo.oninput = () => { clearTimeout(timer); timer = setTimeout(buscar, 400); };
  campo.focus();
  carregarSets().catch(()=>{});   // para o símbolo da edição aparecer na lista

  async function buscar(){
    const termo = campo.value.trim();
    const st = document.getElementById("ad-status"),
          artes = document.getElementById("ad-artes"),
          versoes = document.getElementById("ad-versoes");
    versoes.innerHTML = "";
    if(termo.length < 3){ st.textContent = "digite pelo menos três letras"; artes.innerHTML = ""; return; }
    st.textContent = "buscando…"; artes.innerHTML = skeletons(6);
    const meu = ++busca;   // duas buscas no ar: vale a última que o usuário pediu
    try{
      const json = await scryPage(`name:"${termo}"`, "prints", "released", 1, "asc");
      if(meu !== busca || !artes.isConnected) return;
      achadas = (json.data || []).map(normalize);
      if(!achadas.length){ st.textContent = "nada encontrado"; artes.innerHTML = ""; return; }
      pintarArtes();
    }catch(e){
      if(meu === busca && artes.isConnected){ st.textContent = "erro na busca"; artes.innerHTML = ""; }
    }
  }

  function grupos(){
    const mapa = new Map();
    achadas.forEach(c => {
      const chave = c.arte || (c.name + "|" + c.artist);
      if(!mapa.has(chave)) mapa.set(chave, []);
      mapa.get(chave).push(c);
    });
    return [...mapa.values()];
  }

  function pintarArtes(){
    const artes = document.getElementById("ad-artes"), st = document.getElementById("ad-status");
    const gs = grupos();
    st.textContent = `${gs.length} ilustraç${gs.length>1?"ões":"ão"} diferentes · ${achadas.length} impressões no total`;
    artes.innerHTML = gs.map((g,i) => {
      // a capa é a versão que você já tem; senão, a primeira
      const c = g.find(x => isOwned(x.id)) || g[0];
      const tenho = g.filter(x => isOwned(x.id)).length;
      return `
      <button class="arte ${tenho?"tenho":""}" data-g="${i}">
        <img loading="lazy" src="${c.small||""}" alt="${escapeHTML(c.name)}">
        <span class="arte-meta">
          <b>${g.length} ${g.length>1?"versões":"versão"}</b>
          <small>${escapeHTML(c.artist || "")}</small>
          ${tenho?`<em>você tem ${tenho}</em>`:""}
        </span>
      </button>`;
    }).join("");
    artes.onclick = e => {
      const b = e.target.closest(".arte"); if(!b) return;
      // some com as outras artes: sobra só a escolhida e a lista de edições dela
      artes.querySelectorAll(".arte").forEach(x => x.classList.toggle("escondida", x !== b));
      artes.querySelectorAll(".arte").forEach(x => x.classList.toggle("aberta", x === b));
      artes.classList.add("focada");
      pintarVersoes(gs[Number(b.dataset.g)], () => {
        artes.classList.remove("focada");
        artes.querySelectorAll(".arte").forEach(x => x.classList.remove("escondida","aberta"));
        document.getElementById("ad-versoes").innerHTML = "";
      });
    };
  }

  function pintarVersoes(grupo, voltar){
    const alvo = document.getElementById("ad-versoes");
    // normalize() guarda o código em maiúsculo; o Scryfall entrega minúsculo
    const simbolo = code => {
      const st = (SETS||[]).find(x => x.code === String(code||"").toLowerCase());
      return st && st.icone ? `<img class="set-simbolo" src="${st.icone}" alt="">` : `<span class="set-simbolo vazio">◆</span>`;
    };
    alvo.innerHTML = `
      <div class="versoes-topo">
        <span class="flabel">Qual é a sua? — ${grupo.length} ediç${grupo.length>1?"ões":"ão"} com esta arte</span>
        ${voltar ? `<button class="btn ghost" id="ad-voltar">← todas as artes</button>` : ""}
      </div>
      <div class="versoes">
        ${grupo.map(c => {
          const acabs = (c.acabamentos||[]).filter(a => ["nonfoil","foil","etched"].includes(a));
          return `
          <div class="versao" data-id="${c.id}">
            ${c.small ? `<img class="versao-mini" loading="lazy" src="${c.small}" alt="">` : ""}
            ${simbolo(c.set)}
            <span class="versao-nome">${escapeHTML(c.setName || c.set.toUpperCase())}
              <small>#${c.num} · ${(c.released||"").slice(0,4)}${
                rotuloVariante(c) ? " · " + escapeHTML(rotuloVariante(c)) : ""}</small></span>
            <span class="versao-acabs">
              ${(acabs.length ? acabs : ["nonfoil"]).map(a => {
                const chave = a === "nonfoil" ? "normal" : a;
                const preco = precoLocal(c, chave);
                const marcado = isOwned(c.id) && (S.owned[c.id].fin || "normal") === chave;
                return `<button class="vacab ${marcado?"on":""}" data-id="${c.id}" data-acab="${chave}">
                  ${nomeAcabamento(c, chave)}${preco?` · ${formatarPreco(preco)}`:""}</button>`;
              }).join("")}
            </span>
          </div>`;
        }).join("")}
      </div>`;

    const btnVoltar = document.getElementById("ad-voltar");
    if(btnVoltar && voltar) btnVoltar.onclick = voltar;

    alvo.onclick = e => {
      const b = e.target.closest(".vacab"); if(!b) return;
      const c = grupo.find(x => x.id === b.dataset.id);
      const acab = b.dataset.acab;
      const jaEra = isOwned(c.id) && (S.owned[c.id].fin || "normal") === acab;
      if(jaEra){ toggleOwn(c); toast(`${c.name} removida`); }
      else {
        c.acabamentoEscolhido = acab;
        if(!isOwned(c.id)) toggleOwn(c);
        S.owned[c.id].fin = acab; save(); renderKPIs();
        toast(`${c.name} (${(c.set||"").toUpperCase()}, ${nomeAcabamento(c, acab)}) adicionada`);
      }
      pintarVersoes(grupo, voltar);
      if(view.name === "minha") renderMinha();
    };
  }
}

/* Escolher a carta que vira capa da coleção. As que você já tem vêm
   primeiro — em geral é uma delas que você quer mostrar. */
function escolherCapa(def){
  const daColecao = (cur && cur.def && cur.def.id === def.id ? cur.cards : []).slice();
  const lista = daColecao.sort((a,b) => (isOwned(b.id)?1:0) - (isOwned(a.id)?1:0));
  const capa = capaDe(def.id);

  modal(`<div class="modal-pad">
    <h3>Capa de ${escapeHTML(def.name)}</h3>

      Escolha a carta que representa esta coleção. Ela aparece na lista de coleções no lugar do ícone.</p>
    ${capa ? `<div class="capa-atual">
        <img src="${escapeHTML(capa.img)}" alt="">
        <div><b>${escapeHTML(capa.nome || "capa atual")}</b>
          <span>é a capa de agora</span></div>
        <button class="btn ghost" id="capa-tirar">Voltar ao ícone</button>
      </div>` : ""}
    ${lista.length
      ? `<span class="flabel">Cartas desta coleção${lista.some(c=>isOwned(c.id)) ? " — as suas primeiro" : ""}</span>
         <div class="cards" id="capa-grid">${lista.slice(0,60).map(c => cardHTML(c)).join("")}</div>`
      : `<div class="empty">As cartas ainda estão carregando. Feche, espere a grade aparecer e tente de novo.</div>`}
  </div>`);

  const tirar = document.getElementById("capa-tirar");
  if(tirar) tirar.onclick = () => { definirCapa(def.id, null); closeModal(); go("collection", def.id); };

  const grade = document.getElementById("capa-grid");
  if(grade) grade.querySelectorAll(".card").forEach(el => {
    const c = lista.find(x => x.id === el.dataset.id);
    if(!c) return;
    el.onclick = e => {
      e.stopPropagation();
      definirCapa(def.id, c);
      closeModal();
      toast(`${c.name} virou a capa`);
      go("collection", def.id);
    };
    const info = el.querySelector(".info"); if(info) info.remove();
    const tirarCarta = el.querySelector(".tirar-carta"); if(tirarCarta) tirarCarta.remove();
  });
}

let pilhaDesfazer = [];
function registrarDesfazer(descricao, instantaneo){
  pilhaDesfazer.push({ descricao, instantaneo });
  if(pilhaDesfazer.length > 20) pilhaDesfazer.shift();
  mostrarDesfazer(descricao);
}
function desfazer(){
  const ultimo = pilhaDesfazer.pop();
  if(!ultimo) return toast("nada para desfazer");
  Object.assign(S, ultimo.instantaneo);
  save(); render();
  toast(`desfeito: ${ultimo.descricao}`);
}
let toastDesfazerTimer;
function mostrarDesfazer(descricao){
  clearTimeout(toastDesfazerTimer);
  let el = document.querySelector(".toast-desfazer");
  if(!el){
    el = document.createElement("div");
    el.className = "toast toast-desfazer";
    document.body.appendChild(el);
  }
  el.innerHTML = `<span>${escapeHTML(descricao)}</span><button class="btn ghost" id="btn-desfazer">Desfazer</button>`;
  document.getElementById("btn-desfazer").onclick = () => { el.remove(); desfazer(); };
  toastDesfazerTimer = setTimeout(() => el.remove(), 7000);
}

let vistaSets = { busca:"", tipo:"principais" };
const TIPOS_DE_SET = {

function pintarSets(){
  const alvo = document.getElementById("s-lista");
  if(!alvo || !SETS) return;
  const termo = semAcento(vistaSets.busca).trim();
  const meus = {};
  // o resumo guarda o código em maiúsculo e o Scryfall usa minúsculo:
  // sem normalizar, o "você tem N" da edição ficava sempre zerado
  Object.entries(S.owned).forEach(([id, r]) => {
    if(!r.s) return;
    const k = String(r.s).toLowerCase();
    meus[k] = (meus[k] || 0) + qtdDe(id);
  });

  let lista = SETS.filter(st => {
    const grupo = TIPOS_DE_SET[vistaSets.tipo];
    if(grupo && !grupo.includes(st.tipo)) return false;
    if(!termo) return true;
    return semAcento(st.name).includes(termo) || st.code.includes(termo);
  });

  if(!lista.length){ alvo.innerHTML = `<div class="empty">Nenhuma edição com esse nome.</div>`; return; }

  const porAno = {};
  lista.forEach(st => { (porAno[st.ano] = porAno[st.ano] || []).push(st); });
  const anos = Object.keys(porAno).sort((a,b) => b.localeCompare(a));

  alvo.innerHTML = `<div class="status" style="text-align:left;margin:0 0 14px">${lista.length} edições</div>` +
    anos.map(ano => `
      <section class="ano-bloco">
        <h3 class="ano-titulo">${ano}<span>${porAno[ano].length} edições</span></h3>
        <div class="sets-grade">
          ${porAno[ano].sort((a,b) => b.n - a.n).map(st => {
            const tenho = meus[st.code] || 0;
            const pct = st.n ? Math.round(100 * tenho / st.n) : 0;
            return `
            <button class="set-cartao" data-code="${st.code}">
              <div class="set-icone">${st.icone ? `<img src="${st.icone}" alt="" loading="lazy">` : "◆"}</div>
              <div class="set-info">
                <b>${escapeHTML(st.name)}</b>
                <span>${st.code.toUpperCase()} · ${st.n} cartas</span>
                ${tenho ? `<span class="set-tenho">você tem ${tenho} (${pct}%)</span>` : ""}
              </div>
              ${tenho ? `<div class="set-barra"><i style="width:${Math.min(100,pct)}%"></i></div>` : ""}
            </button>`;
          }).join("")}
        </div>
      </section>`).join("");

  alvo.querySelectorAll(".set-cartao").forEach(el => {
    el.onclick = () => go("set", el.dataset.code);
  });
}

/* Modelos de booster. As estruturas mudaram bastante: o Play Booster (2024
   em diante) trocou o Draft Booster e trouxe curinga e foil garantido. */
const MODELOS_BOOSTER = {
  play:         { rotulo:"Play Booster (2024+)",     comuns:6,  incomuns:3, raros:1, curinga:1, foils:1,  porBox:30 },
  draft:        { rotulo:"Draft Booster (até 2023)", comuns:10, incomuns:3, raros:1, curinga:0, foils:1,  porBox:36 },
  colecionador: { rotulo:"Collector Booster",        comuns:0,  incomuns:4, raros:5, curinga:1, foils:15, porBox:12 },
};
const BOOSTER_PADRAO = { modelo:"play", chanceMitico:1/7.4 };

async function renderSet(code){
  await carregarSets();
  const st = (SETS || []).find(x => x.code === code);
  if(!st){ go("sets"); return; }
  const cfg = Object.assign({}, BOOSTER_PADRAO,
    { modelo: Number(st.ano) >= 2024 ? "play" : "draft" },
    (S.selados && S.selados[code]) || {});

  app.innerHTML = `
    <button class="icon-btn" id="voltar-sets" style="margin-bottom:16px">← todas as edições</button>
    <div class="coll-head">
      <div class="ico">${st.icone ? `<img class="set-simbolo grande" src="${st.icone}" alt="">` : "◆"}</div>
      <div style="flex:1;min-width:220px">
        <h2>${escapeHTML(st.name)}</h2>
        <p>${st.code.toUpperCase()} · ${st.ano} · ${st.n} cartas</p>
      </div>
      <button class="btn ghost" id="ver-cartas">Ver as cartas</button>
    </div>
    <div id="set-analise"><div class="status">calculando o valor das cartas desta edição…</div></div>`;

  document.getElementById("voltar-sets").onclick = ()=> go("sets");
  document.getElementById("ver-cartas").onclick = ()=>{
    cat.f = FILTROS_VAZIOS(); cat.f.set = code; cat.f.unico = "prints";
    view = { name:"catalogo", id:null };
    renderCatalogo().then(buscarCatalogo);
    window.scrollTo({ top:0, behavior:"smooth" });
  };

  // cartas que realmente saem em booster — é o que interessa para o cálculo
  let cartas = [], usouTodas = false;
  const buscar = async (consulta) => {
    const achadas = [];
    for(let pagina = 1; pagina <= 8; pagina++){
      const json = await scryPage(consulta, "cards", "usd", pagina, "desc");
      achadas.push(...(json.data || []).map(normalize));
      if(!json.has_more) break;
    }
    return achadas;
  };
  try{ cartas = await buscar(`e:${code} is:booster`); }catch(e){ cartas = []; }
  if(!cartas.length){
    // sets recentes ainda não têm a marcação de booster no Scryfall — usa todas
    try{ cartas = await buscar(`e:${code}`); usouTodas = true; }catch(e){ cartas = []; }
  }

  pintarAnaliseSet(st, cartas, cfg, usouTodas);
  carregarProdutosDoSet(st, cartas, cfg);
}

function estatisticas(lista, acabamento){
  const vals = lista.map(c => { const p = precoLocal(c, acabamento); return p ? p.valor : 0; }).filter(v => v > 0).sort((a,b) => a-b);
  if(!vals.length) return { n:lista.length, media:0, mediana:0, max:0 };
  const meio = Math.floor(vals.length/2);
  return {
    n: lista.length,
    media: vals.reduce((a,b)=>a+b,0) / vals.length,
    mediana: vals.length % 2 ? vals[meio] : (vals[meio-1] + vals[meio]) / 2,
    max: vals[vals.length-1],
  };
}

/* As estatísticas por raridade custam caro e não mudam enquanto a lista de
   cartas for a mesma — ficam guardadas na própria lista. */
const cacheEst = new WeakMap();
function estatisticasDoSet(cartas){
  if(cacheEst.has(cartas)) return cacheEst.get(cartas);
  const porRar = r => cartas.filter(c => c.rarity === r);
  const est = { mythic:estatisticas(porRar("mythic")), rare:estatisticas(porRar("rare")),
                uncommon:estatisticas(porRar("uncommon")), common:estatisticas(porRar("common")),
                geral:estatisticas(cartas), foil:estatisticas(cartas, "foil") };
  cacheEst.set(cartas, est);
  return est;
}

/* Valor esperado de UM booster do modelo pedido. Cada produto tem o seu:
   Collector Booster não pode ser contado com a receita do Play Booster. */
function evComModelo(est, cfg, nomeModelo, usar){
  const mod = MODELOS_BOOSTER[nomeModelo] || MODELOS_BOOSTER.play;
  const m = est.mythic[usar] || 0, r = est.rare[usar] || 0;
  const raroSlot = est.mythic.n ? cfg.chanceMitico * m + (1 - cfg.chanceMitico) * r : r;
  return mod.raros * raroSlot
       + mod.incomuns * (est.uncommon[usar] || 0)
       + mod.comuns  * (est.common[usar]   || 0)
       + mod.curinga * (est.geral[usar]    || 0)
       + mod.foils   * (est.foil[usar]     || 0);
}

async function carregarDrops(){
  const alvo = document.getElementById("sl-lista");
  if(!alvo) return;
  sl.cartas = [];
  try{
    for(let pagina = 1; pagina <= 6; pagina++){

      sl.cartas.push(...(json.data || []).map(normalize));

    return;

    try{ dropsSLD = await carregarDropsSecretLair(); }

function pintarDrops(){
  const alvo = document.getElementById("sl-lista");
  if(!alvo) return;
  if(!sl.cartas.length){ alvo.innerHTML = `<div class="empty">Nenhum drop em ${sl.ano}.</div>`; return; }

  /* Agrupa pelo nome do drop. O que não tem nome fica junto pela data,
     dizendo o que é: bônus sorteado, token, ou drop daquele dia. */
  const grupos = {};
  sl.cartas.forEach(c => {
    const d = dropDaCarta(c);
    const data = d.data || (c.released || "").slice(0,10);
    const chave = d.nome ? "n:" + d.nome : `${d.tipo || "resto"}:${data}`;
    (grupos[chave] = grupos[chave] || []).push(c);
  });
  const chaves = Object.keys(grupos).sort((a,b) => {
    const dataDe = k => (grupos[k][0].released || "");
    return dataDe(b).localeCompare(dataDe(a)) || a.localeCompare(b);
  });

  alvo.innerHTML = `<div class="status" style="text-align:left;margin:0 0 16px">
      ${chaves.length} drops · ${sl.cartas.length} cartas em ${sl.ano}</div>` +
    chaves.map(chave => {
      const cartas = grupos[chave].sort((a,b) => (Number(a.num) || 0) - (Number(b.num) || 0));
      const tipo = chave.slice(0, chave.indexOf(":"));
      const d = (tipo === "n" ? (cartas[0].released || "") : chave.slice(tipo.length+1) || cartas[0].released || "").slice(0,10);
      const porExtenso = dt => dt ? new Date(dt + "T12:00:00").toLocaleDateString("pt-BR", { day:"2-digit", month:"long", year:"numeric" }) : "";
      const curta = dt => dt ? new Date(dt + "T12:00:00").toLocaleDateString("pt-BR", { day:"2-digit", month:"short", year:"numeric" }) : "";
      const titulo = tipo === "n" ? chave.slice(2)
        : tipo === "bonus" ? `Bônus sorteados nos drops de ${porExtenso(d)}`
        : tipo === "token" ? `Tokens dos drops de ${porExtenso(d)}`
        : null;
      const tenho = cartas.filter(c => isOwned(c.id)).length;
      const valor = cartas.reduce((a,c) => { const p = precoLocal(c); return a + (p ? p.valor : 0); }, 0);
      return `
      <section class="drop">
        <h3 class="drop-titulo">
          ${titulo ? escapeHTML(titulo) : porExtenso(d)}
          <span>${chave.startsWith("n:") ? curta(d) + " · " : ""}${cartas.length} cartas · ${formatarPreco({valor, simbolo:regiao().simbolo})}${tenho?` · você tem ${tenho}`:""}</span>
        </h3>
        <div class="cards">${cartas.map(c => cardHTML(c)).join("")}</div>
      </section>`;
    }).join("");

  ligarCartas(alvo, id => sl.cartas.find(x => x.id === id), () => pintarDrops());
}

/* =====================================================================
   MTGJSON — produtos selados e nomes dos drops de Secret Lair.
   O Scryfall só conhece cartas; produto lacrado e nome de drop vêm daqui.
   As imagens das caixas são as do TCGplayer, pelo id que o MTGJSON entrega.
   ===================================================================== */

const MTGJSON = "https://mtgjson.com/api/v5";
const cacheSelados = {};

function imagemProduto(tcg){
  return tcg ? `https://product-images.tcgplayer.com/fit-in/437x437/${tcg}.jpg` : null;
}

function guardarLocal(chave, valor){
  try{ localStorage.setItem(chave, JSON.stringify({ em:Date.now(), valor })); }catch(e){}
}
function lerLocal(chave, validadeDias){
  try{
    const g = JSON.parse(localStorage.getItem(chave) || "null");
    if(g && Date.now() - g.em < validadeDias*24*3600*1000) return g.valor;
  }catch(e){}
  return null;
}

/* Deixa dois nomes comparáveis sem apagar palavra nenhuma: "Play" e
   "Collector", "Japanese" e número de série continuam distinguindo. */
const chaveDeNome = s => String(s || "").toLowerCase().normalize("NFKD")
  .replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

async function carregarSelados(code){
  const c = code.toUpperCase();
  if(cacheSelados[c]) return cacheSelados[c];
  const guardado = lerLocal("collector.selados.v2." + c, 30);
  if(guardado){ cacheSelados[c] = guardado; return guardado; }
  try{
    const r = await fetch(`${MTGJSON}/${c}.json`);
    if(!r.ok) throw new Error("mtgjson " + r.status);
    const j = await r.json();
    const brutos = ((j.data && j.data.sealedProduct) || []).map(p => ({
      uuid: p.uuid, nome: p.name, cat: p.category, sub: p.subtype,
      tam: Number(p.productSize) || 0,
      tcg: (p.identifiers && p.identifiers.tcgplayerProductId) || null,
    }));

    /* O MTGJSON às vezes lista o mesmo produto físico duas vezes — uma por
       canal de venda. Mesmo id do TCGplayer é o mesmo produto, sempre;
       sem id, só junta se nome, categoria e subtipo forem iguais. */
    const juntos = new Map();
    brutos.forEach(p => {
      const chave = p.tcg ? "tcg:" + p.tcg : `n:${chaveDeNome(p.nome)}|${p.cat||""}|${p.sub||""}`;
      const antes = juntos.get(chave);
      if(!antes){ juntos.set(chave, Object.assign({}, p, { uuids:[p.uuid] })); return; }
      antes.uuids.push(p.uuid);
      if(!antes.tcg && p.tcg) antes.tcg = p.tcg;       // fica com quem tem foto e link
      if(!antes.tam && p.tam) antes.tam = p.tam;
    });

    const lista = [...juntos.values()];
    cacheSelados[c] = lista;
    guardarLocal("collector.selados.v2." + c, lista);
    return lista;
  }catch(e){ cacheSelados[c] = []; return []; }
}

/* =====================================================================
   De que drop é cada carta do Secret Lair.

   O Scryfall não guarda o nome do drop; o MTGJSON guarda, mas espalhado:
   uma parte das cartas aparece em contents.card, a maioria vem dentro de
   um "deck" com o mesmo nome do drop, e as versões sorteadas aparecem em
   contents.variable. Ler só o contents.card nomeava 160 de 2.686 cartas —
   por isso tanto drop sem nome e tanto drop de uma carta só.

   Lendo as três fontes mais os tokens, 2.339 das 2.754 cartas ficam com
   o nome certo. Das que sobram, quase todas são bônus sorteados dentro
   dos drops (o Scryfall marca como "sldbonus") e tokens. Quando só um
   drop saiu naquela data, a carta entra nele — é o mesmo drop, com
   certeza. Quando foi um superdrop com vários no mesmo dia, elas ficam
   juntas e a tela diz o que são, porque chutar um nome errado é pior do
   que não dar nome: testei o chute pela faixa de número de coleção e ele
   acerta metade das vezes.
   ===================================================================== */
async function carregarDropsSecretLair(){
  const guardado = lerLocal("collector.drops.sld3", 30);
  if(guardado) return guardado;
  const r = await fetch(`${MTGJSON}/SLD.json`);
  if(!r.ok) throw new Error("mtgjson " + r.status);
  const j = await r.json();
  const dados = j.data || {};
  const produtos = dados.sealedProduct || [];

  const numeroPorUuid = {}, dataPorNumero = {};
  [...(dados.cards || []), ...(dados.tokens || [])].forEach(c => {
    numeroPorUuid[c.uuid] = c.number;
    if(c.number) dataPorNumero[c.number] = c.originalReleaseDate || "";
  });
  const deckPorNome = {};
  (dados.decks || []).forEach(d => { deckPorNome[d.name] = d; });

  const numerosDoDeck = d => {
    const fora = [];
    ["commander","displayCommander","mainBoard","sideBoard"].forEach(k =>
      (d[k] || []).forEach(e => { const n = numeroPorUuid[e.uuid]; if(n) fora.push(n); }));
    return fora;
  };
  const daqui = x => String(x.set || "").toLowerCase() === "sld" && x.number;
  const numerosDoProduto = p => {
    const c = p.contents || {}, fora = [];
    (c.card || []).forEach(x => { if(daqui(x)) fora.push(x.number); });
    (c.deck || []).forEach(x => { const d = deckPorNome[x.name]; if(d) fora.push(...numerosDoDeck(d)); });
    (c.other || []).forEach(x => { const n = numeroPorUuid[x.uuid]; if(n) fora.push(n); });
    (c.variable || []).forEach(v => (v.configs || []).forEach(cf => {
      (cf.card || []).forEach(x => { if(daqui(x)) fora.push(x.number); });
      (cf.deck || []).forEach(x => { const d = deckPorNome[x.name]; if(d) fora.push(...numerosDoDeck(d)); });
    }));
    return fora;
  };

  // bundles (que só embrulham outros drops) não dão nome a carta nenhuma;
  // e entre os demais o produto menor ganha, porque é o drop mais específico
  const lista = produtos
    .filter(p => !(p.contents && p.contents.sealed))
    .map(p => ({ nome: nomeDoDrop(p.name), nums: [...new Set(numerosDoProduto(p))] }))
    .filter(x => x.nums.length && x.nome)
    .sort((a,b) => b.nums.length - a.nums.length);

  const nomes = {};
  lista.forEach(x => x.nums.forEach(n => { nomes[n] = x.nome; }));

  // data de cada drop: a mais repetida entre as cartas que já têm nome
  const contagem = {};
  Object.keys(nomes).forEach(n => {
    const d = dataPorNumero[n]; if(!d) return;
    const m = contagem[nomes[n]] = contagem[nomes[n]] || {};
    m[d] = (m[d] || 0) + 1;
  });
  const dropsDaData = {};
  Object.keys(contagem).forEach(nome => {
    const d = Object.entries(contagem[nome]).sort((a,b) => b[1] - a[1])[0][0];
    (dropsDaData[d] = dropsDaData[d] || []).push(nome);
  });

  // as sorteadas: entram no drop da data quando aquela data teve um drop só
  const datas = {};
  Object.keys(dataPorNumero).forEach(n => {
    if(nomes[n]) return;
    const d = dataPorNumero[n];
    const candidatos = (d && dropsDaData[d]) || [];
    if(candidatos.length === 1) nomes[n] = candidatos[0];
    else datas[n] = d || "";
  });

  const mapa = { nomes, datas, dropsDaData };
  guardarLocal("collector.drops.sld3", mapa);
  return mapa;
}

/* A carta não tem nome de drop pelo MTGJSON: se na data dela saiu um drop
   só, é dele; senão, dá para dizer o que ela é sem inventar nome. */
function dropDaCarta(c){
  if(!dropsSLD) return { nome:null, tipo:null };
  const num = c.num;
  const direto = dropsSLD.nomes && dropsSLD.nomes[num];
  if(direto) return { nome:direto, tipo:"drop" };
  const data = (dropsSLD.datas && dropsSLD.datas[num]) || (c.released || "").slice(0,10);
  const porData = dropsSLD.dropsDaData || {};
  const candidatos = porData[data] || porData[(c.released || "").slice(0,10)] || [];
  if(candidatos.length === 1) return { nome:candidatos[0], tipo:"drop" };
  const tipo = (c.promos || []).includes("sldbonus") ? "bonus"
             : c.layout === "token" ? "token" : "resto";
  return { nome:null, tipo, data };
}

/* os nomes vêm longos: "Secret Lair Bundle X Superdrop Y Foil and Non Foil" */
function nomeDoDrop(bruto){
  return String(bruto)
    .replace(/^Secret Lair\s*(Drop Series|Commander Deck|Bundle|Drop)?\s*[:\-–]?\s*/i, "")
    .replace(/\s*(Foil and Non ?-?Foil|Non ?-?Foil|Foil Edition|Traditional Foil|Rainbow Foil|Galaxy Foil|Textured Foil|Foil)$/i, "")
    .replace(/\s{2,}/g, " ")
    .trim() || bruto;
}


/* =====================================================================
   DECKS

   Um deck aqui é uma lista de cartas com quantidade, um formato e (no
   Commander) um comandante. As cartas são guardadas em forma compacta,
   como na Minha coleção, para o deck abrir sem depender do Scryfall.

   O que o app faz de útil e ninguém faz por você:
   - conta quantos terrenos o deck pede, pela fórmula do Frank Karsten
   - conta rampa, compra, remoção e varrida lendo o texto das cartas
   - compara as fontes de cor com os símbolos de mana que o deck exige
   - diz o que é ilegal no formato antes de você levar o deck para a mesa
   - mostra quanto do deck você já tem e quanto custa o que falta
   ===================================================================== */

const FORMATOS = [
  { id:"commander", nome:"Commander",  cartas:100, singleton:true,  comandante:true,
    desc:"100 cartas, uma de cada, tudo dentro da identidade de cor do comandante." },
  { id:"brawl",     nome:"Brawl",      cartas:100, singleton:true,  comandante:true,
    desc:"Commander com cartas do Standard." },
  { id:"standard",  nome:"Standard",   cartas:60,  singleton:false, comandante:false,
    desc:"Só as edições mais recentes. Máximo de 4 cópias." },
  { id:"pioneer",   nome:"Pioneer",    cartas:60,  singleton:false, comandante:false,
    desc:"De Return to Ravnica para cá." },
  { id:"modern",    nome:"Modern",     cartas:60,  singleton:false, comandante:false,
    desc:"De Eighth Edition (2003) para cá." },
  { id:"legacy",    nome:"Legacy",     cartas:60,  singleton:false, comandante:false,
    desc:"Quase tudo que já foi impresso." },
  { id:"vintage",   nome:"Vintage",    cartas:60,  singleton:false, comandante:false,
    desc:"Tudo, com uma lista de cartas restritas a uma cópia." },
  { id:"pauper",    nome:"Pauper",     cartas:60,  singleton:false, comandante:false,
    desc:"Só cartas que já saíram como comuns." },
];
const formatoDe = id => FORMATOS.find(f => f.id === id) || FORMATOS[0];

/* carta dentro de um deck: o suficiente para contar mana, cor e regra sem rede */
function cartaDeDeck(c, qtd){
  return {
    id:c.id, n:c.name, s:c.set, sn:c.setName, num:c.num, r:c.rarity, t:c.type,
    mv:(c.mv === undefined || c.mv === null) ? 0 : c.mv,
    cores:c.cores || "", ci:c.ci || c.cores || "", produz:c.produz || "",
    mana:c.mana || "", oracle:c.oracle || "",
    img:c.small, big:c.normal, usd:Number(c.usd) || 0, eur:Number(c.eur) || 0,
    legal:c.legal || null, gc:!!c.gc, qtd:qtd || 1,
  };
}
/* volta ao formato que o resto do app entende (openCard, preço, links) */
function deckParaCarta(d){
  return { id:d.id, name:d.n, set:d.s, setName:d.sn, num:d.num, rarity:d.r, type:d.t,
           mv:d.mv, cores:d.cores, ci:d.ci, produz:d.produz, mana:d.mana, oracle:d.oracle,
           small:d.img, normal:d.big || d.img, usd:d.usd || null, eur:d.eur || null,
           acabamentos:[], promos:[], frames:[], legal:d.legal, released:"", compra:null };
}

function decks(){ return S.decks || (S.decks = []); }
function deckPorId(id){ return decks().find(d => d.id === id); }
function totalDoDeck(d){
  return (d.cartas || []).reduce((a,c) => a + (c.qtd || 1), 0) + (d.comandante ? 1 : 0);
}
function cartasDoDeck(d){
  return (d.comandante ? [Object.assign({}, d.comandante, { qtd:1, ehComandante:true })] : [])
    .concat(d.cartas || []);
}

/* ---------------- reservas ----------------
   As cartas que você considera para o deck mas que não estão nele hoje:
   a troca que faz quando o meta muda, a peça que ainda vai comprar, a
   versão alternativa de um pacote. Em Commander não existe sideboard de
   torneio, então isto NÃO conta para as 100 cartas, não entra no
   diagnóstico e não pesa no bracket — e a tela diz isso. O que ela faz
   é deixar a carta a um clique de entrar. */
function reservasDo(d){ return d.reservas || (d.reservas = []); }
function totalDasReservas(d){ return reservasDo(d).reduce((a,c) => a + (c.qtd || 1), 0); }

function porNasReservas(d, carta){
  const lista = reservasDo(d);
  const ja = lista.find(x => x.id === carta.id);
  if(ja) ja.qtd = (ja.qtd || 1) + 1;
  else lista.push(cartaDeDeck(carta, 1));
  save();
  if(view.name === "deck") pintarReservas(d);
}

/* move entre o deck e as reservas, uma cópia por vez, respeitando o
   limite do formato — quem tenta pôr a segunda cópia num singleton
   recebe o mesmo aviso de sempre */
function moverParaReservas(d, id){
  const i = (d.cartas || []).findIndex(x => x.id === id);
  if(i < 0) return;
  const c = d.cartas[i];
  const uma = Object.assign({}, c, { qtd:1 });
  if((c.qtd || 1) <= 1) d.cartas.splice(i, 1); else c.qtd--;
  const lista = reservasDo(d);
  const ja = lista.find(x => x.id === id);
  if(ja) ja.qtd = (ja.qtd || 1) + 1; else lista.push(uma);
  save();
}
function moverParaODeck(d, id){
  const c = reservasDo(d).find(x => x.id === id);
  if(!c) return false;
  const fmt = formatoDe(d.formato);
  const basico = /basic/i.test(c.t || "");
  const noDeck = (d.cartas || []).find(x => x.id === id);
  if(noDeck && !basico){
    if(fmt.singleton){ toast(`${c.n} já está no deck (${fmt.nome} é singleton)`); return false; }
    if((noDeck.qtd || 1) >= 4){ toast("máximo de 4 cópias"); return false; }
  }
  if(noDeck) noDeck.qtd = (noDeck.qtd || 1) + 1;
  else (d.cartas = d.cartas || []).push(Object.assign({}, c, { qtd:1 }));
  const i = d.reservas.indexOf(c);
  if((c.qtd || 1) <= 1) d.reservas.splice(i, 1); else c.qtd--;
  save();
  return true;
}

/* ---------------- diagnóstico ---------------- */

const EH_TERRENO = c => /land/i.test(c.t || "");
/* Regras de bolso para ler o que uma carta faz. Não é perfeito — nenhum
   robô lê Magic direito — mas erra para o lado seguro e é conferível. */
const EH_RAMPA = c => !EH_TERRENO(c) && (c.mv || 0) <= 4 &&
  /add \{|search your library for (a|up to \w+) (basic )?(land|plains|island|swamp|mountain|forest)|lands? onto the battlefield/i.test(c.oracle || "");
const EH_COMPRA = c => /draw (a|one|two|three|four|five|\w+) cards?|draws? cards? equal/i.test(c.oracle || "")
  && !/opponent draws/i.test(c.oracle || "");
const EH_REMOCAO = c => /(destroy|exile) target|counter target (spell|creature)|deals? \d+ damage to (target|any target)|target creature gets -|fight target/i.test(c.oracle || "");
const EH_VARRIDA = c => /(destroy|exile) all|each (creature|player sacrifices)|all creatures get -/i.test(c.oracle || "");

function simbolosDeMana(texto){
  const conta = { w:0, u:0, b:0, r:0, g:0 };
  (String(texto || "").match(/\{[^}]+\}/g) || []).forEach(s => {
    const dentro = s.slice(1,-1).toLowerCase();
    ["w","u","b","r","g"].forEach(cor => { if(dentro.includes(cor)) conta[cor]++; });
  });
  return conta;
}

/* Quantos terrenos o deck pede.
   Fórmula do Frank Karsten (artigo "How Many Lands Do You Need?"), que é o
   trabalho mais citado sobre isso: para 100 cartas, 31,42 + 3,13 × custo
   médio − 0,28 × (rampa e compra baratas); para 60, 16,79 + 1,83 × custo
   médio − 0,28 × (rampa e compra baratas). */
function terrenosSugeridos(cartas, tamanho){
  const naoTerreno = cartas.filter(c => !EH_TERRENO(c));
  const copias = naoTerreno.reduce((a,c) => a + (c.qtd || 1), 0) || 1;
  const somaMv = naoTerreno.reduce((a,c) => a + (c.mv || 0) * (c.qtd || 1), 0);
  const mvMedio = somaMv / copias;
  const baratas = naoTerreno.filter(c => (c.mv || 0) <= 3 && (EH_RAMPA(c) || EH_COMPRA(c)))
                            .reduce((a,c) => a + (c.qtd || 1), 0);
  const bruto = tamanho >= 100
    ? 31.42 + 3.13 * mvMedio - 0.28 * baratas
    : 16.79 + 1.83 * mvMedio - 0.28 * baratas;
  return { alvo: Math.max(tamanho >= 100 ? 30 : 17, Math.round(bruto)), mvMedio };
}

function diagnosticoDoDeck(d){
  const fmt = formatoDe(d.formato);
  const todas = cartasDoDeck(d);
  const expandidas = [];
  todas.forEach(c => { for(let i = 0; i < (c.qtd || 1); i++) expandidas.push(c); });

  const terrenos = expandidas.filter(EH_TERRENO).length;
  const { alvo, mvMedio } = terrenosSugeridos(todas.filter(c => !c.ehComandante), fmt.cartas);
  const conta = f => todas.filter(c => !EH_TERRENO(c) && f(c)).reduce((a,c) => a + (c.qtd || 1), 0);

  // curva: quantas cartas em cada custo (terreno fora)
  const curva = {};
  expandidas.filter(c => !EH_TERRENO(c)).forEach(c => {
    const k = Math.min(7, Math.round(c.mv || 0));
    curva[k] = (curva[k] || 0) + 1;
  });

  // cor: símbolos exigidos × fontes que produzem aquela cor
  const pips = { w:0, u:0, b:0, r:0, g:0 };
  expandidas.filter(c => !EH_TERRENO(c)).forEach(c => {
    const s = simbolosDeMana(c.mana);
    ["w","u","b","r","g"].forEach(x => pips[x] += s[x]);
  });
  const fontes = { w:0, u:0, b:0, r:0, g:0 };
  expandidas.forEach(c => {
    const p = c.produz || (EH_TERRENO(c) ? "" : "");
    ["w","u","b","r","g"].forEach(x => { if(p.includes(x)) fontes[x]++; });
  });

  // legalidade
  const problemas = [];
  const total = totalDoDeck(d);
  if(total !== fmt.cartas)
    problemas.push({ tipo: total < fmt.cartas ? "aviso" : "erro",
      txt:`${total} de ${fmt.cartas} cartas${total < fmt.cartas ? ` — faltam ${fmt.cartas - total}` : ` — ${total - fmt.cartas} a mais`}` });

  const fora = todas.filter(c => c.legal && c.legal[d.formato] && c.legal[d.formato] !== "legal" && c.legal[d.formato] !== "restricted");
  if(fora.length) problemas.push({ tipo:"erro", txt:`${fora.length} carta${fora.length>1?"s":""} não permitida${fora.length>1?"s":""} em ${fmt.nome}: ${fora.slice(0,4).map(c=>c.n).join(", ")}${fora.length>4?"…":""}` });

  if(fmt.singleton){
    const basicos = c => /basic/i.test(c.t || "");
    const repetidas = todas.filter(c => (c.qtd || 1) > 1 && !basicos(c));
    if(repetidas.length) problemas.push({ tipo:"erro", txt:`${fmt.nome} é singleton: ${repetidas.map(c=>c.n).join(", ")} aparece${repetidas.length>1?"m":""} mais de uma vez` });
  } else {
    const demais = todas.filter(c => (c.qtd || 1) > 4 && !/basic/i.test(c.t || ""));
    if(demais.length) problemas.push({ tipo:"erro", txt:`máximo de 4 cópias: ${demais.map(c=>c.n).join(", ")}` });
  }

  if(fmt.comandante && d.comandante){
    const ci = (d.comandante.ci || "").split("");
    const foraDaCor = (d.cartas || []).filter(c =>
      (c.ci || "").split("").some(x => x && !ci.includes(x)));
    if(foraDaCor.length) problemas.push({ tipo:"erro",
      txt:`${foraDaCor.length} carta${foraDaCor.length>1?"s":""} fora da identidade de cor do comandante: ${foraDaCor.slice(0,4).map(c=>c.n).join(", ")}${foraDaCor.length>4?"…":""}` });
  }
  if(fmt.comandante && !d.comandante)
    problemas.push({ tipo:"aviso", txt:"o deck ainda não tem comandante" });

  const tenho = todas.filter(c => isOwned(c.id)).reduce((a,c) => a + (c.qtd || 1), 0);
  const valor = todas.reduce((a,c) => { const p = precoLocal(deckParaCarta(c)); return a + (p ? p.valor * (c.qtd||1) : 0); }, 0);
  const falta = todas.filter(c => !isOwned(c.id))
    .reduce((a,c) => { const p = precoLocal(deckParaCarta(c)); return a + (p ? p.valor * (c.qtd||1) : 0); }, 0);

  return { fmt, total, terrenos, alvoTerrenos:alvo, mvMedio, curva, pips, fontes, problemas,
           rampa:conta(EH_RAMPA), compra:conta(EH_COMPRA), remocao:conta(EH_REMOCAO), varrida:conta(EH_VARRIDA),
           tenho, valor, falta };
}

/* metas de referência do Commander, que é onde a maioria começa perdida */
const METAS_EDH = { rampa:[8,12], compra:[8,12], remocao:[6,10], varrida:[2,4] };

/* ---------------- view: lista de decks ---------------- */
let deckView = { busca:"", formato:"", aba:"meus" };

function renderDecks(){
  const lista = decks().filter(d =>
    (!deckView.formato || d.formato === deckView.formato) &&
    (!deckView.busca || semAcento(d.nome).includes(semAcento(deckView.busca))));

  app.innerHTML = `
    <div class="section-head">
      <div>
        <h2>Decks</h2>
        <p>Monte seu deck puxando cartas da sua coleção ou do catálogo inteiro. O app conta os terrenos,
        olha a curva, confere a legalidade e diz o que falta comprar.</p>
      </div>
      <button class="btn" id="novo-deck">+ Novo deck</button>
    </div>

    <div class="abas-deck">
      <button class="tog ${deckView.aba==="meus"?"on":""}" data-aba="meus">Meus decks</button>
      <button class="tog ${deckView.aba==="top"?"on":""}" data-aba="top">Decks mais jogados</button>
      <button class="tog ${deckView.aba==="ajuda"?"on":""}" data-aba="ajuda">Como montar um deck</button>
    </div>

    <div id="deck-conteudo"></div>`;

  document.getElementById("novo-deck").onclick = () => novoDeck();
  document.querySelector(".abas-deck").onclick = e => {
    const b = e.target.closest("[data-aba]"); if(!b) return;
    deckView.aba = b.dataset.aba; renderDecks();
  };

  if(deckView.aba === "top") return pintarTopDecks();
  if(deckView.aba === "ajuda") return pintarAjuda();

  const alvo = document.getElementById("deck-conteudo");
  alvo.innerHTML = decks().length === 0
    ? `<div class="empty">Você ainda não tem deck nenhum.<br>
         Comece pelo <b>+ Novo deck</b>, ou vá em <b>Comandantes mais jogados</b> e crie um deck já com o comandante.</div>`
    : `<div class="toolbar" style="margin-bottom:14px">
         <div class="grow"><input type="search" id="busca-deck" placeholder="filtrar por nome…" value="${escapeHTML(deckView.busca)}"></div>
         <select id="filtro-formato" style="width:auto">
           <option value="">todos os formatos</option>
           ${FORMATOS.map(f => `<option value="${f.id}"${deckView.formato===f.id?" selected":""}>${f.nome}</option>`).join("")}
         </select>
       </div>
       <div class="decks-grade">${lista.map(cartaoDeDeck).join("")}</div>
       ${lista.length ? "" : `<div class="empty">Nenhum deck com esse filtro.</div>`}`;

  const b = document.getElementById("busca-deck");
  if(b) b.oninput = () => { deckView.busca = b.value; const f = document.activeElement === b;
    renderDecks(); if(f){ const n = document.getElementById("busca-deck"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } } };
  const ff = document.getElementById("filtro-formato");
  if(ff) ff.onchange = () => { deckView.formato = ff.value; renderDecks(); };
  alvo.querySelectorAll("[data-deck]").forEach(el => el.onclick = () => go("deck", el.dataset.deck));
}

function cartaoDeDeck(d){
  const fmt = formatoDe(d.formato);
  const total = totalDoDeck(d);
  const capa = (d.comandante && (d.comandante.big || d.comandante.img))
            || ((d.cartas || []).find(c => c.img) || {}).img;
  const tenho = cartasDoDeck(d).filter(c => isOwned(c.id)).reduce((a,c)=>a+(c.qtd||1),0);
  const pct = total ? Math.round(100 * tenho / total) : 0;
  const cores = coresDoDeck(d);
  return `
  <button class="deck-cartao" data-deck="${d.id}">
    <div class="deck-capa" ${capa ? `style="background-image:url('${escapeHTML(capa)}')"` : ""}>
      ${capa ? "" : `<span>🂠</span>`}
    </div>
    <div class="deck-corpo">
      <h3>${escapeHTML(d.nome)}</h3>
      <div class="deck-meta">
        <span class="chip">${fmt.nome}</span>
        ${cores ? `<span class="deck-cores">${cores}</span>` : ""}
        <span>${total}/${fmt.cartas}</span>
      </div>
      ${d.comandante ? `<p class="deck-cmd">${escapeHTML(d.comandante.n)}</p>` : ""}
      <div class="mini-bar" title="${pct}% das cartas você já tem"><i style="width:${pct}%"></i></div>
      <span class="deck-tenho">${pct}% na sua coleção</span>
    </div>
  </button>`;
}

/* =====================================================================
   O DECK VIRA LISTA DE COMPRAS

   Decks e chase cards já existiam e não se falavam. Aqui a conta é
   simples e a comparação é POR NOME: quem tem o Sol Ring de qualquer
   edição tem o Sol Ring do deck. Comparar por impressão exata só geraria
   uma lista de compras cheia de carta que a pessoa já tem na mão.
   ===================================================================== */
function copiasQueTenho(nome){
  const alvo = String(nome || "").toLowerCase();
  return Object.entries(S.owned).reduce((a, [id, r]) =>
    a + (String(r.n || "").toLowerCase() === alvo ? qtdDe(id) : 0), 0);
}

function faltamDoDeck(d){
  const cartas = (d.cartas || []).concat(d.comandante ? [Object.assign({}, d.comandante, { qtd:1 })] : []);
  const juntas = new Map();
  cartas.forEach(c => {
    const chave = String(c.n || "").toLowerCase();
    const atual = juntas.get(chave);
    if(atual) atual.precisa += (c.qtd || 1);
    else juntas.set(chave, { carta:c, precisa:(c.qtd || 1) });
  });

  const fora = [];
  juntas.forEach(({ carta, precisa }) => {
    const tenho = copiasQueTenho(carta.n);
    const falta = precisa - tenho;
    if(falta > 0){
      const p = precoLocal(deckParaCarta(carta));
      fora.push({ carta, precisa, tenho, falta, unidade: p ? p.valor : 0 });
    }
  });
  return fora.sort((a, b) => (b.unidade * b.falta) - (a.unidade * a.falta));
}

function abrirComprasDoDeck(d){
  const faltam = faltamDoDeck(d);
  const total = faltam.reduce((a, f) => a + f.unidade * f.falta, 0);
  const copias = faltam.reduce((a, f) => a + f.falta, 0);
  const noDeck = (d.cartas || []).reduce((a, c) => a + (c.qtd || 1), 0) + (d.comandante ? 1 : 0);

  modal(`<div class="modal-pad">
    <h3>O que falta para montar "${escapeHTML(d.nome)}"</h3>
    ${!faltam.length ? `
      <p style="color:var(--muted);font-size:13px;margin:8px 0 0">
        Você já tem todas as ${noDeck} cartas deste deck. Pode montar hoje.</p>
      <div class="pergunta-acoes"><button class="btn" id="cp-fechar">Fechar</button></div>
    ` : `
      <p style="color:var(--muted);font-size:13px;margin:6px 0 14px">
        Comparo por nome, não por impressão: se você tem o Sol Ring de qualquer edição,
        ele não aparece aqui.</p>

      <div class="kv"><span>Cartas do deck</span><b>${noDeck}</b></div>
      <div class="kv"><span>Faltam</span><b>${copias} cópia${copias>1?"s":""} · ${faltam.length} carta${faltam.length>1?"s":""} diferente${faltam.length>1?"s":""}</b></div>
      <div class="kv"><span>Custo estimado</span><b>${money(total)}</b></div>

      <div class="lista-compras">
        ${faltam.map(f => `
          <div class="lc-linha">
            ${f.carta.img ? `<img src="${escapeHTML(f.carta.img)}" alt="" loading="lazy">` : `<span class="mv-sem"></span>`}
            <span class="lc-nome">${escapeHTML(f.carta.n)}
              <small>${f.tenho ? `você tem ${f.tenho} de ${f.precisa}` : `precisa de ${f.precisa}`}</small></span>
            <span class="lc-preco">${f.falta > 1 ? `${f.falta} × ` : ""}${f.unidade ? money(f.unidade) : "sem preço"}</span>
          </div>`).join("")}
      </div>

      <div class="pergunta-acoes" style="margin-top:16px">
        <button class="btn" id="cp-chase">Mandar as ${faltam.length} para os chase cards</button>
        <button class="btn ghost" id="cp-fechar">Fechar</button>
      </div>
    `}
  </div>`);

  document.getElementById("cp-fechar").onclick = closeModal;
  const bc = document.getElementById("cp-chase");
  if(bc) bc.onclick = () => {
    const c = chase();
    // um grupo por deck: a lista de compras não se mistura com o resto
    let grupo = c.grupos.find(g => g.deck === d.id);
    if(!grupo){
      grupo = { id:"g" + Date.now().toString(36), nome:`Faltam no ${d.nome}`, deck:d.id };
      c.grupos.push(grupo);
    }
    let n = 0;
    faltam.forEach(f => { if(porNoChase(deckParaCarta(f.carta), grupo.id)) n++; });
    save(); closeModal();
    toast(n ? `${n} carta${n>1?"s":""} em "${grupo.nome}"` : "essas cartas já estavam nos chase cards");
    go("chase");
  };
}

function pintarDeck(d){
  const alvo = document.getElementById("deck-cartas");
  if(!alvo) return;
  const todas = cartasDoDeck(d);

  const usadas = new Set();
  const secoes = GRUPOS_DECK.map(([chave, titulo, casa]) => {
    const itens = todas.filter(c => !usadas.has(c) && casa(c));
    itens.forEach(c => usadas.add(c));
    return { chave, titulo, itens:itens.sort((a,b) => (a.mv||0)-(b.mv||0) || a.n.localeCompare(b.n)) };
  }).filter(s => s.itens.length);
  const sobrou = todas.filter(c => !usadas.has(c));
  if(sobrou.length) secoes.push({ chave:"outros", titulo:"Outras", itens:sobrou });

  alvo.innerHTML = todas.length === 0
    ? `<div class="empty">Deck vazio. Clique em <b>+ Adicionar cartas</b> — dá para buscar em tudo
        que existe ou só no que você já tem.</div>`
    : secoes.map(s => `
      <section class="deck-secao">
        <h3 class="grupo-titulo">${s.titulo}<span>${s.itens.reduce((a,c)=>a+(c.qtd||1),0)}</span></h3>
        <div class="deck-linhas">
          ${s.itens.map(c => linhaDeCarta(c, d)).join("")}
        </div>
      </section>`).join("");

  ligarLinhasDoDeck(d);
  pintarDiagnostico(d);
  pintarResumoDoDeck(d);
}

function ligarLinhasDoDeck(d, naReserva){
  const alvo = document.getElementById(naReserva ? "reservas-lista" : "deck-cartas");
  if(!alvo) return;
  const repintar = () => { pintarDeck(d); pintarReservas(d); atualizarNumeroDasReservas(d); };
  alvo.querySelectorAll(".deck-linha").forEach(el => {
    const id = el.dataset.id;
    const lista = () => naReserva ? reservasDo(d) : (d.cartas || []);
    const achar = () => lista().find(x => x.id === id);
    const ehCmd = !naReserva && d.comandante && d.comandante.id === id;
    const mexer = f => { f(); save(); repintar(); };
    const bt = (sel, fn) => { const b = el.querySelector(sel); if(b) b.onclick = e => { e.stopPropagation(); fn(); }; };
    bt(".dl-mais", () => mexer(() => { const c = achar(); if(c) c.qtd = (c.qtd || 1) + 1; }));
    bt(".dl-menos", () => mexer(() => {
      const c = achar(); if(!c) return;
      if((c.qtd || 1) <= 1){
        if(naReserva) d.reservas = d.reservas.filter(x => x.id !== id);
        else d.cartas = d.cartas.filter(x => x.id !== id);
      } else c.qtd--;
    }));
    bt(".dl-fora", () => mexer(() => {
      if(ehCmd) d.comandante = null;
      else if(naReserva) d.reservas = d.reservas.filter(x => x.id !== id);
      else d.cartas = d.cartas.filter(x => x.id !== id);
    }));
    bt(".dl-mover", () => {
      if(naReserva){ if(moverParaODeck(d, id)) repintar(); }
      else { moverParaReservas(d, id); repintar(); }
    });
    bt(".dl-info", () => {
      const c = ehCmd ? d.comandante : achar();
      if(c) openCard(deckParaCarta(c));
    });
    bt(".dl-versao", () => {
      const c = ehCmd ? d.comandante : achar();
      if(c) escolherVersaoNoDeck(d, c, ehCmd);
    });
  });
}

/* =====================================================================
   BRACKET DO COMMANDER

   Os brackets são o sistema oficial da Wizards para dizer o quanto um
   deck de Commander é forte, de 1 (Exhibition) a 5 (cEDH). Os critérios
   são poucos e claros: quantas Game Changers, se tem negação de terreno
   em massa, turnos extras, tutores e combo de duas cartas.

   A parte que costuma envelhecer — QUAIS cartas são Game Changers — a
   gente não guarda: o Scryfall marca cada carta com `game_changer`, e é
   dali que vem a conta. Quando a Wizards mexer na lista, o app acompanha
   sozinho, sem eu tocar em nada. (Eram 53 cartas quando isto foi escrito.)

   O que o app NÃO faz é adivinhar combo de duas cartas: isso depende de
   ler interação entre cartas, e chutar aqui daria bracket errado. Então
   essas três perguntas quem responde é você, e a resposta fica guardada
   no deck.
   ===================================================================== */
const BRACKETS = [
  [1, "Exhibition", "Ultracasual. Tema acima de ganhar."],
  [2, "Core",       "O nível de um precon de fábrica."],
  [3, "Upgraded",   "Precon turbinado, com cartas escolhidas a dedo."],
  [4, "Optimized",  "Seus decks mais fortes, sem foco em metagame."],
  [5, "cEDH",       "Competitivo de verdade, jogando o metagame."],
];

/* padrões de texto que a própria carta declara — estes dá para ver sem chutar */
const TURNO_EXTRA = /take an extra turn|takes an extra turn/i;
const TERRA_EM_MASSA = /destroy all lands|each player sacrifices? (a|all) lands?|destroy target land.*(each|all)/i;
const TUTOR = /search your library for (a|an|up to|two|three)/i;

function brackDoDeck(d){
  const todas = cartasDoDeck(d);
  const gc = todas.filter(c => c.gc);
  const turnos = todas.filter(c => TURNO_EXTRA.test(c.oracle || ""));
  const terras = todas.filter(c => TERRA_EM_MASSA.test(c.oracle || ""));
  const tutores = todas.filter(c => TUTOR.test(c.oracle || ""));
  const resp = (d.bracketResp || {});          // o que o dono respondeu

  let nivel, porque;
  if(resp.combo === "cedh"){ nivel = 5; porque = "você marcou o deck como competitivo de metagame"; }
  else if(gc.length > 3 || terras.length || resp.combo === "cedo" || (resp.turnos === "encadeia")){
    nivel = 4;
    porque = gc.length > 3 ? `${gc.length} Game Changers (acima de 3)`
           : terras.length ? "tem negação de terreno em massa"
           : resp.combo === "cedo" ? "você marcou que tem combo de duas cartas cedo"
           : "você marcou que encadeia turnos extras";
  }
  else if(gc.length > 0 || resp.combo === "tarde" || tutores.length > 3){
    nivel = 3;
    porque = gc.length ? `${gc.length} Game Changer${gc.length>1?"s":""} (até 3 cabe no 3)`
           : resp.combo === "tarde" ? "combo de duas cartas só no fim de jogo"
           : `${tutores.length} tutores`;
  }
  else if(turnos.length || tutores.length){ nivel = 2; porque = "sem Game Changers, com peças fortes soltas"; }
  else { nivel = 1; porque = "sem Game Changers, sem tutor, sem turno extra"; }

  return { nivel, porque, gc, turnos, terras, tutores, respondeu: !!d.bracketResp };
}

function blocoBracket(d){
  if(!formatoDe(d.formato).comandante) return "";
  const b = brackDoDeck(d);
  const [n, nome, desc] = BRACKETS[b.nivel - 1];
  const resp = d.bracketResp || {};

  return `
  <section class="ficha-bloco">
    <div class="bracket-topo">
      <div class="bracket-num">${n}</div>
      <div>
        <b>${nome}</b>
        <span>${desc}</span>
      </div>
    </div>

/* =====================================================================
   A FICHA DO DECK

   O que não cabe na lista de cartas: por que o deck existe, quais são os
   combos, em que bracket ele está e como ele vem se saindo.

   O histórico vem de dois lugares e diz de qual: a partida registrada na
   Mesa entra sozinha (quando o deck usado bate com um deck seu), e quem
   jogou sem a Mesa anota na mão. Nada é inventado — cada linha mostra de
   onde veio.
   ===================================================================== */
function anotarPartida(d, p){
  d.partidas = d.partidas || [];
  d.partidas.unshift(Object.assign({ id:"p"+Date.now().toString(36), em:Date.now() }, p));
  d.partidas = d.partidas.slice(0, 300);
  save();
}

function placarDoDeck(d){
  const ps = d.partidas || [];
  const v = ps.filter(p => p.venceu).length;
  return { jogos:ps.length, vitorias:v, pct: ps.length ? Math.round(100*v/ps.length) : null };
}

  const pl = placarDoDeck(d);
  const combos = d.combos || [];

  alvo.innerHTML = `
    <section class="ficha-bloco">
      <span class="flabel">Sobre este deck</span>
      <textarea id="fd-desc" rows="3" placeholder="o que ele quer fazer, como ele ganha, o que odeia enfrentar">${escapeHTML(d.descricao || "")}</textarea>
    </section>

    <section class="ficha-bloco">
      <div class="ficha-topo">
        <span class="flabel">Combos</span>
        <button class="icon-btn" id="fd-combo-novo">+ combo</button>
      </div>
      ${combos.length ? `<div class="combos">${combos.map((c,i) => `
        <div class="combo" data-i="${i}">
          <div class="combo-cartas">${(c.cartas||[]).map(n => `<span class="chip">${escapeHTML(n)}</span>`).join(" + ")}</div>

        </div>`).join("")}</div>`
      : `<p class="dg-txt">Nenhum combo anotado. Serve para lembrar você — e para responder a pergunta do bracket com honestidade.</p>`}
    </section>

    ${blocoBracket(d)}

    <section class="ficha-bloco">

      ${pl.jogos ? `

            </div>`).join("")}
        </div>`
      : `<p class="dg-txt">Sem partidas ainda. Quando você registrar uma partida na <b>Mesa</b> usando este deck,

  const desc = document.getElementById("fd-desc");
  desc.onblur = () => { d.descricao = desc.value.trim(); save(); };

  document.getElementById("fd-combo-novo").onclick = () => novoCombo(d);
