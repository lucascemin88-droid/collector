/* ---------------- buscar cartas para o deck ---------------- */
function buscarParaDeck(d, opcoes = {}){
  const fmt = formatoDe(d.formato);
  const soComandante = !!opcoes.comandante;
  const paraReserva = !!opcoes.reservas;
  let busca = 0, achadas = [], soMinhas = false;

  modal(`<div class="modal-pad">
    <h3>${soComandante ? "Escolher comandante" : paraReserva ? "Adicionar às reservas" : "Adicionar cartas"}</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 14px">
      ${soComandante
        ? "Só aparecem cartas que podem ser comandante."
        : paraReserva
        ? `A carta vai para as reservas, não para o deck — ela não conta nas ${fmt.cartas} do deck.`
        : `Busca em tudo que é legal em ${fmt.nome}${d.comandante ? `, dentro da identidade de cor de ${escapeHTML(d.comandante.n)}` : ""}.`}</p>
    <label class="field"><span>Nome, tipo ou o que a carta faz</span>
      <input type="text" id="bd-termo" placeholder="ex.: Sol Ring, dragão, destroy target creature" autocomplete="off">
    </label>
    <label class="check" style="margin-bottom:12px"><input type="checkbox" id="bd-minhas">
      <span>só cartas que eu já tenho</span></label>
    <div class="status" id="bd-status">digite pelo menos três letras</div>
    <div class="cards" id="bd-grade"></div>
  </div>`);

  const campo = document.getElementById("bd-termo");
  const status = document.getElementById("bd-status");
  const grade = document.getElementById("bd-grade");
  campo.focus();
  let timer;
  campo.oninput = () => { clearTimeout(timer); timer = setTimeout(rodar, 380); };
  document.getElementById("bd-minhas").onchange = e => { soMinhas = e.target.checked; rodar(); };

  function query(termo){
    const partes = [];
    if(soComandante) partes.push("is:commander");
    partes.push(`f:${d.formato}`);
    if(!soComandante && d.comandante && fmt.comandante) partes.push(`ci<=${d.comandante.ci || "c"}`);
    if(soComandante && false) partes.push("");
    partes.push(`(name:"${termo}" or type:"${termo}" or oracle:"${termo}")`);
    return partes.join(" ");
  }

  async function rodar(){
    const termo = campo.value.trim();
    if(termo.length < 3){ status.textContent = "digite pelo menos três letras"; grade.innerHTML = ""; return; }
    status.textContent = "buscando…"; grade.innerHTML = skeletons(8);
    const meu = ++busca;
    try{
      if(soMinhas){
        const t = semAcento(termo);
        achadas = cartasQueTenho().filter(c => semAcento(c.name).includes(t) || semAcento(c.type||"").includes(t));
        if(meu !== busca || !grade.isConnected) return;
        status.textContent = `${achadas.length} na sua coleção`;
      } else {
        const json = await scryPage(query(termo), "cards", "edhrec", 1, "auto");
        if(meu !== busca || !grade.isConnected) return;
        achadas = (json.data || []).map(normalize);
        status.textContent = `${json.total_cards || achadas.length} carta${(json.total_cards||0)===1?"":"s"} — mostrando ${achadas.length}`;
      }
      if(!achadas.length){ grade.innerHTML = ""; status.textContent = "nada encontrado"; return; }
      grade.innerHTML = achadas.map(c => cardHTML(c)).join("");
      grade.querySelectorAll(".card").forEach(el => {
        const c = achadas.find(x => x.id === el.dataset.id);
        if(!c) return;
        const info = el.querySelector(".info");
        if(info) info.onclick = ev => { ev.stopPropagation(); openCard(c); };
        el.onclick = () => {
          if(soComandante){
            d.comandante = cartaDeDeck(c, 1); save(); closeModal(); renderDeck(d.id);
            toast(`${c.name} virou o comandante`);
            return;
          }
          if(paraReserva){
            porNasReservas(d, c);
            el.classList.add("no-deck");
            toast(`${c.name} foi para as reservas`);
            return;
          }
          porNoDeck(d, c);
          el.classList.add("no-deck");
          toast(`${c.name} entrou no deck`);
        };
        /* põe a carta e já abre as impressões: quem liga para a arte
           escolhe na hora, quem não liga só clica na carta e segue */
        const bv = document.createElement("button");
        bv.className = "escolher-versao";
        bv.title = "pôr no deck escolhendo a versão";
        bv.textContent = "⇄";
        bv.onclick = ev => {
          ev.stopPropagation();
          if(soComandante){ d.comandante = cartaDeDeck(c, 1); save(); }
          else if(paraReserva) porNasReservas(d, c);
          else porNoDeck(d, c);
          const posta = soComandante ? d.comandante
            : paraReserva ? reservasDo(d).find(x => x.id === c.id)
            : (d.cartas || []).find(x => x.id === c.id);
          if(posta) escolherVersaoNoDeck(d, posta, soComandante);
        };
        el.appendChild(bv);
      });
    }catch(e){
      if(meu === busca && grade.isConnected){ status.textContent = "erro na busca"; grade.innerHTML = ""; }
    }
  }
}

/* =====================================================================
   QUAL IMPRESSÃO VAI NO DECK

   Duas cartas com o mesmo nome não são a mesma coisa para quem monta
   deck: muda a arte, muda a moldura e muda muito o preço. Aqui a pessoa
   escolhe qual versão vai — na hora de pôr, ou depois, pelo ⇄ da linha.

   O que troca é só a impressão: quantidade, comandante e posição no deck
   ficam como estavam.
   ===================================================================== */
async function escolherVersaoNoDeck(d, carta, ehComandante){
  modal(`<div class="modal-pad">
    <h3>Versão de ${escapeHTML(carta.n)}</h3>
    <p style="color:var(--muted);font-size:13px;margin:6px 0 14px">
      Todas as impressões desta carta. A escolhida é a que aparece no deck e a que conta no preço.</p>
    <div class="cards" id="vd-grade">${skeletons(8)}</div>
  </div>`);

  let versoes = [];
  try{
    const json = await scryPage(`!"${carta.n.replace(/"/g, "")}"`, "prints", "released", 1, "auto");
    versoes = (json.data || []).map(normalize);
  }catch(e){}
  const grade = document.getElementById("vd-grade");
  if(!grade || !grade.isConnected) return;
  if(!versoes.length){ grade.innerHTML = `<div class="empty">Não consegui buscar as impressões agora.</div>`; return; }

  grade.innerHTML = versoes.map(v => `
    <div class="card ${v.id === carta.id ? "escolhida" : ""}" data-id="${v.id}">
      ${v.small ? `<img loading="lazy" src="${escapeHTML(v.small)}" alt="${escapeHTML(v.name)}">`
                : `<div class="sem-arte">${escapeHTML(v.name)}</div>`}
      <div class="cap">
        <span class="cap-nome">${simboloDoSet(v.set, v.setName)} ${escapeHTML(v.setName || v.set)}</span>
        <span class="cap-preco">${v.usd ? money(Number(v.usd)) : "—"}</span>
      </div>
      ${isOwned(v.id) ? `<span class="tag-tenho">você tem</span>` : ""}
    </div>`).join("");

  grade.querySelectorAll(".card").forEach(el => el.onclick = () => {
    const nova = versoes.find(x => x.id === el.dataset.id);
    if(!nova) return;
    const antes = ehComandante ? d.comandante : (d.cartas || []).find(x => x.id === carta.id);
    if(!antes) return;
    const trocada = cartaDeDeck(nova, antes.qtd || 1);
    if(ehComandante) d.comandante = trocada;
    else {
      /* trocar para uma impressão que já está no deck junta as cópias.
         Sem isso o deck ficava com duas linhas da mesma carta — e num
         formato singleton isso é uma lista ilegal que ninguém vê. */
      const i = d.cartas.indexOf(antes);
      if(i < 0) return;
      const ja = d.cartas.findIndex((x, k) => k !== i && x.id === trocada.id);
      if(ja >= 0){
        d.cartas[ja].qtd = (d.cartas[ja].qtd || 1) + (trocada.qtd || 1);
        d.cartas.splice(i, 1);
      } else d.cartas[i] = trocada;
    }
    save(); closeModal(); renderDeck(d.id);
    toast(`Agora é a versão de ${nova.setName || nova.set}`);
  });
}

/* =====================================================================
   SUGESTÕES POR OBJETIVO

   Duas fontes se encontram aqui. O QUE sugerir vem do EDHREC, pelo robô:
   as cartas que as pessoas de fato jogam com aquele comandante. Em que
   GAVETA cada uma cai — ramp, compra, remoção — sai do texto de regra da
   própria carta, lido do Scryfall.

   Isso evita os dois erros comuns: sugerir carta boa que ninguém joga com
   aquele comandante, e jogar uma lista solta de cem nomes sem dizer para
   que serve cada um.

   O que a tela não esconde: comandante que ninguém usou ainda não tem
   lista, e ela chega na próxima passagem do robô.
   ===================================================================== */
const OBJETIVOS = [
  ["ramp", "Rampa de mana", c => /\badd \{|search your library for (a|up to \w+) .{0,20}land/i.test(c.oracle || "")
                                  && !/^land/i.test(c.type || "")],
  ["compra", "Compra de cartas", c => /draw (a|one|two|three|four|X|that many) card/i.test(c.oracle || "")],
  ["remocao", "Remoção pontual", c => /(destroy|exile) target/i.test(c.oracle || "")],
  ["varredura", "Varredura", c => /(destroy|exile) all|each (creature|player sacrifices)/i.test(c.oracle || "")],
  ["protecao", "Proteção e resposta", c => /counter target|hexproof|indestructible|protection from/i.test(c.oracle || "")],
  ["terreno", "Terrenos", c => /^land|\bland\b/i.test((c.type || "").split("—")[0] || "")],
];

function slugComandante(nome){
  return String(nome || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/['']/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")
    .split("--")[0];
}

async function abrirSugestoes(d){
  const fmt = formatoDe(d.formato);
  if(!fmt.comandante || !d.comandante)
    return toast("as sugestões saem do comandante — escolha um primeiro");

  modal(`<div class="modal-pad">
    <h3>O que costuma entrar com ${escapeHTML(d.comandante.n)}</h3>
    <p style="color:var(--muted);font-size:13px;margin:6px 0 14px">
      As cartas que outras pessoas jogam com este comandante, separadas pelo que elas fazem.
      O que já está no deck fica de fora.</p>
    <div class="status" id="sg-status">buscando…</div>
    <div id="sg-corpo"></div>
  </div>`);

  const status = document.getElementById("sg-status");
  const slug = slugComandante(d.comandante.n);
  let linhas = [];
  try{
    linhas = await supa(`commander_cards?commander=eq.${encodeURIComponent(slug)}`
                      + `&select=card_name,decks,potencial,sinergia&order=decks.desc&limit=160`);
  }catch(e){
    status.textContent = "não consegui buscar agora — " + e.message;
    return;
  }
  if(!status.isConnected) return;
  if(!linhas.length){
    status.innerHTML = `Ainda não tenho a lista deste comandante. O robô busca as listas dos comandantes
      que aparecem nos decks guardados — <b>este entra na próxima passagem</b>, e amanhã a sugestão está aqui.`;
    return;
  }

  // tira o que já está no deck antes de gastar chamada no Scryfall
  const noDeck = new Set(cartasDoDeck(d).map(c => String(c.n).toLowerCase()));
  const faltando = linhas.filter(l => !noDeck.has(String(l.card_name).toLowerCase()));
  status.textContent = `lendo ${faltando.length} cartas…`;

  const porNome = new Map(faltando.map(l => [l.card_name.toLowerCase(), l]));
  const cartas = [];
  for(let i = 0; i < faltando.length; i += 75){
    const lote = faltando.slice(i, i + 75).map(l => ({ name: l.card_name }));
    try{
      const r = await fetch(`${API}/cards/collection`, {
        method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
        body: JSON.stringify({ identifiers: lote })
      });
      if(r.ok){ const j = await r.json(); (j.data || []).map(normalize).forEach(c => cartas.push(c)); }
    }catch(e){}
    await sleep(PAGE_DELAY);
  }
  if(!status.isConnected) return;

  // dentro da identidade de cor do comandante, e nada que eu já tenha no deck
  const ci = (d.comandante.ci || "").split("");
  const validas = cartas.filter(c => !(c.ci || "").split("").some(x => x && !ci.includes(x)));

  const usadas = new Set();
  const grupos = OBJETIVOS.map(([chave, titulo, casa]) => {
    const itens = validas.filter(c => !usadas.has(c.id) && casa(c));
    itens.forEach(c => usadas.add(c.id));
    itens.sort((a, b) => (porNome.get(b.name.toLowerCase())?.decks || 0)
                       - (porNome.get(a.name.toLowerCase())?.decks || 0));
    return { chave, titulo, itens: itens.slice(0, 8) };
  }).filter(g => g.itens.length);

  status.textContent = "";
  document.getElementById("sg-corpo").innerHTML = grupos.map(g => `
    <section class="sg-grupo">
      <h4 class="grupo-titulo">${g.titulo}<span>${g.itens.length}</span></h4>
      <div class="sg-linhas">
        ${g.itens.map(c => {
          const l = porNome.get(c.name.toLowerCase()) || {};
          const pct = l.potencial ? Math.round(100 * (l.decks || 0) / l.potencial) : null;
          return `<button class="sg-linha" data-id="${c.id}">
            ${c.small ? `<img src="${escapeHTML(c.small)}" alt="" loading="lazy">` : `<span class="mv-sem"></span>`}
            <span class="lc-nome">${escapeHTML(c.name)}
              <small>${pct !== null ? `${pct}% dos decks` : `${l.decks || 0} decks`}${
                isOwned(c.id) ? " · você tem" : ""}</small></span>
            <span class="lc-preco">${c.usd ? money(Number(c.usd)) : "—"}</span>
            <span class="sg-mais">+</span>
          </button>`;
        }).join("")}
      </div>
    </section>`).join("") || `<div class="empty">Nada de novo — você já tem no deck o que costuma entrar.</div>`;

  document.querySelectorAll(".sg-linha").forEach(el => el.onclick = () => {
    const c = validas.find(x => x.id === el.dataset.id);
    if(!c) return;
    porNoDeck(d, c);
    el.classList.add("posta");
    el.querySelector(".sg-mais").textContent = "✓";
    toast(`${c.name} entrou no deck`);
  });
}

function porNoDeck(d, carta){
  const fmt = formatoDe(d.formato);
  d.cartas = d.cartas || [];
  const ja = d.cartas.find(x => x.id === carta.id);
  const basico = /basic/i.test(carta.type || "");
  if(ja){
    if(fmt.singleton && !basico) return toast(`${carta.name} já está no deck (${fmt.nome} é singleton)`);
    if(!fmt.singleton && !basico && (ja.qtd || 1) >= 4) return toast("máximo de 4 cópias");
    ja.qtd = (ja.qtd || 1) + 1;
  } else {
    d.cartas.push(cartaDeDeck(carta, 1));
  }
  save();
  if(view.name === "deck") pintarDeck(d);
}

/* =====================================================================
   DECKLIST DE TORNEIO

   A lista de texto do Moxfield serve para importar em outro site; não
   serve para entregar na mesa do juiz. A folha oficial pede outra coisa:
   nome do jogador, formato, evento, data, e as cartas agrupadas por tipo
   com o total conferido em cima.

   Como o app é um arquivo só e roda offline, quem gera o PDF é o próprio
   navegador: a folha é montada em HTML com estilo de impressão e o botão
   chama a impressão do sistema. No iPhone é Compartilhar → Imprimir →
   pinçar para "Salvar em PDF". Sem biblioteca, sem servidor, e sai igual
   no computador e no telefone.

   O total é CONFERIDO na folha, não escondido: se o deck tiver 98 cartas
   a folha diz 98 e avisa em vermelho que o formato pede 100. Chegar na
   mesa com lista errada é game loss, e o app tem como avisar antes.
   ===================================================================== */
function folhaDeTorneio(d){
  const fmt = formatoDe(d.formato);
  const todas = cartasDoDeck(d);
  const usadas = new Set();
  const secoes = GRUPOS_DECK.map(([chave, titulo, casa]) => {
    const itens = todas.filter(c => !usadas.has(c) && casa(c));
    itens.forEach(c => usadas.add(c));
    return { titulo, itens:itens.sort((a, b) => a.n.localeCompare(b.n)) };
  }).filter(x => x.itens.length);
  const sobrou = todas.filter(c => !usadas.has(c));
  if(sobrou.length) secoes.push({ titulo:"Outras", itens:sobrou });

  const total = totalDoDeck(d);
  const reservas = reservasDo(d);
  const soma = lista => lista.reduce((a, c) => a + (c.qtd || 1), 0);
  const dia = new Date().toLocaleDateString("pt-BR");

  return `
  <div class="folha" id="folha-torneio">
    <div class="folha-cab">
      <div>
        <h1>${escapeHTML(d.nome)}</h1>
        <p>${escapeHTML(fmt.nome)}${d.comandante ? ` · comandante: ${escapeHTML(d.comandante.n)}` : ""}</p>
      </div>
      <div class="folha-total ${total === fmt.cartas ? "" : "errado"}">
        <b>${total}</b><span>de ${fmt.cartas}</span>
      </div>
    </div>

    <div class="folha-campos">
      <label class="field"><span>Seu nome</span>
        <input type="text" id="ft-nome" value="${escapeHTML(mesa().eu || "")}" placeholder="nome completo"></label>
      <label class="field"><span>Evento</span>
        <input type="text" id="ft-evento" placeholder="ex.: Liga de sexta — loja X"></label>
      <label class="field"><span>Data</span>
        <input type="text" id="ft-data" value="${dia}"></label>
    </div>

    ${total !== fmt.cartas ? `<p class="folha-alerta">
      Este deck tem <b>${total}</b> cartas e ${escapeHTML(fmt.nome)} pede <b>${fmt.cartas}</b>.
      Lista com número errado é game loss na maioria dos eventos — confira antes de entregar.</p>` : ""}
    ${fmt.singleton && (() => {
      const repetidas = (d.cartas || []).filter(c => (c.qtd || 1) > 1 && !/basic/i.test(c.t || ""));
      return repetidas.length ? `<p class="folha-alerta">
        ${escapeHTML(fmt.nome)} é singleton e este deck tem cópia repetida de
        <b>${repetidas.map(c => escapeHTML(c.n)).join(", ")}</b>.</p>` : "";
    })()}

    <div class="folha-colunas">
      ${secoes.map(sec => `
        <section>
          <h2>${escapeHTML(sec.titulo)} <span>${soma(sec.itens)}</span></h2>
          ${sec.itens.map(c => `<div class="folha-linha">
            <span class="fl-q">${c.qtd || 1}</span>
            <span class="fl-n">${escapeHTML(c.n)}${c.ehComandante ? " <i>(comandante)</i>" : ""}</span>
            <span class="fl-s">${escapeHTML((c.s || "").toUpperCase())}</span>
          </div>`).join("")}
        </section>`).join("")}
    </div>

    ${reservas.length ? `
      <div class="folha-reservas">
        <h2>Reservas <span>${soma(reservas)}</span></h2>
        ${reservas.map(c => `<div class="folha-linha">
          <span class="fl-q">${c.qtd || 1}</span>
          <span class="fl-n">${escapeHTML(c.n)}</span>
          <span class="fl-s">${escapeHTML((c.s || "").toUpperCase())}</span>
        </div>`).join("")}
        <p class="folha-obs">Commander não tem sideboard de torneio: esta lista é o seu banco de
        trocas. Só entregue esta parte se o evento pedir.</p>
      </div>` : ""}

    <p class="folha-rodape">Assinatura: ______________________________
      &nbsp;&nbsp; Mesa: ______ &nbsp;&nbsp; Gerado no Velvo em ${dia}</p>
  </div>`;
}

function abrirFolhaDeTorneio(d){
  modal(`<div class="modal-pad modal-folha">
    <h3>Decklist para entregar</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 14px">
      Preencha o nome e o evento e mande imprimir. No iPhone: <b>Compartilhar → Imprimir</b> e,
      na tela da impressão, pinçar a miniatura para abrir e <b>Salvar em PDF</b>.</p>
    ${folhaDeTorneio(d)}
    <div class="pergunta-acoes nao-imprimir">
      <button class="btn" id="ft-imprimir">Imprimir / salvar em PDF</button>
      <button class="btn ghost" id="ft-fechar">Fechar</button>
    </div>
  </div>`);
  document.getElementById("ft-fechar").onclick = closeModal;
  document.getElementById("ft-imprimir").onclick = () => {
    /* o campo digitado não vira atributo sozinho, e sem isso a impressão
       sai com o campo vazio */
    ["ft-nome", "ft-evento", "ft-data"].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.setAttribute("value", el.value);
    });
    document.body.classList.add("imprimindo");
    window.print();
    setTimeout(() => document.body.classList.remove("imprimindo"), 800);
  };
}

function exportarDeck(d){
  const linhas = [];
  if(d.comandante) linhas.push(`1 ${d.comandante.n}`, "");
  (d.cartas || []).forEach(c => linhas.push(`${c.qtd || 1} ${c.n}`));
  /* a lista de reservas sai separada por uma linha em branco e o
     cabeçalho que Moxfield e Archidekt entendem como sideboard */
  if(totalDasReservas(d)){
    linhas.push("", "Sideboard");
    reservasDo(d).forEach(c => linhas.push(`${c.qtd || 1} ${c.n}`));
  }
  const txt = linhas.join("\n");
  modal(`<div class="modal-pad">
    <h3>Lista do deck</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 12px">
      Formato de texto que Moxfield, Archidekt e a maioria dos sites entende.</p>
    <textarea id="deck-txt" rows="14" style="font-family:ui-monospace,monospace;font-size:12.5px">${escapeHTML(txt)}</textarea>
    <div class="pergunta-acoes"><button class="btn" id="copiar-deck">Copiar</button></div>
  </div>`);
  document.getElementById("copiar-deck").onclick = () => {
    const el = document.getElementById("deck-txt");
    el.select(); document.execCommand("copy");
    toast("lista copiada");
  };
}

/* ---------------- decks mais jogados ----------------
   Em Commander o deck é o comandante, e o EDHREC publica esse ranking por
   período. O navegador não lê o EDHREC direto (o site não libera CORS), então
   quem lê é o job diário: a tela aqui consulta a nossa tabela top_decks.
   "Desde sempre" não precisa de tabela: o próprio Scryfall carrega o ranking
   histórico do EDHREC dentro de cada carta (edhrec_rank), e ordenar por ele
   dá a lista de todos os tempos ao vivo. */

const PERIODOS_TOP = [
  ["semana",  "Última semana"],
  ["mes",     "Último mês"],
  ["anos2",   "Últimos 2 anos"],
  ["sempre",  "Desde sempre"],
];
/* Commander tem as quatro janelas (o EDHREC publica as três primeiras e o
   Scryfall carrega o ranking histórico). Os formatos de torneio vêm das
   listas de torneio dos últimos 7 e 30 dias — não existe "desde sempre"
   honesto ali, porque o metagame de dois anos atrás não é o de hoje. */
const PERIODOS_POR_FORMATO = {
  commander: ["semana","mes","anos2","sempre"],
  brawl:     [],
  standard:  ["semana","mes"], pioneer:["semana","mes"], modern:["semana","mes"],
  legacy:    ["semana","mes"], vintage:["semana","mes"], pauper:["semana","mes"],
};
const periodosDe = f => PERIODOS_POR_FORMATO[f] || [];
let topView = { formato:"commander", periodo:"semana", linhas:[], cartas:{}, busca:"", pagina:1, temMais:false, total:0 };

async function pintarTopDecks(){
  const alvo = document.getElementById("deck-conteudo");
  if(!alvo) return;
  const janelas = periodosDe(topView.formato);
  const temFonte = janelas.length > 0;
  if(temFonte && !janelas.includes(topView.periodo)) topView.periodo = janelas[0];

  alvo.innerHTML = `
    <div class="toggles" style="margin-bottom:10px" id="top-formatos">
      ${FORMATOS.map(f => `<button class="tog ${topView.formato===f.id?"on":""}" data-f="${f.id}">${f.nome}</button>`).join("")}
    </div>
    ${temFonte ? `
      <div class="toggles" style="margin-bottom:16px" id="top-periodos">
        ${PERIODOS_TOP.filter(([id]) => janelas.includes(id))
            .map(([id,nome]) => `<button class="tog ${topView.periodo===id?"on":""}" data-p="${id}">${nome}</button>`).join("")}
      </div>` : ""}
    <div id="top-lista"></div>`;

  document.getElementById("top-formatos").onclick = e => {
    const b = e.target.closest("[data-f]"); if(!b) return;
    topView.formato = b.dataset.f; topView.linhas = []; pintarTopDecks();
  };
  const per = document.getElementById("top-periodos");
  if(per) per.onclick = e => {
    const b = e.target.closest("[data-p]"); if(!b) return;
    topView.periodo = b.dataset.p; topView.linhas = []; topView.pagina = 1; pintarTopDecks();
  };

  const lista = document.getElementById("top-lista");
  if(!temFonte){
    const fmt = formatoDe(topView.formato);
    const link = LINKS_META[topView.formato] || LINKS_META.commander;
    lista.innerHTML = `
      <div class="nota-regiao">
        <b>Ainda não tenho ranking de ${fmt.nome}.</b><br>
        Os formatos de torneio saem das listas publicadas de MTGO, Melee e Topdeck, e o Brawl quase não
        aparece nelas. Se você quiser acompanhar, o lugar hoje é
        <a href="${link[1]}" target="_blank" rel="noopener">${escapeHTML(link[0])} ↗</a>.
      </div>`;
    return;
  }

  if(topView.formato === "commander" && topView.periodo === "sempre") return listaDeSempre();
  return listaDoPeriodo();
}

/* Vem da nossa tabela, alimentada pelo job diário. Em Commander cada linha é
   um comandante; nos formatos de torneio é um arquétipo, com a fatia que ele
   ocupou nas listas de torneio da janela. */
async function listaDoPeriodo(){
  const alvo = document.getElementById("top-lista");
  if(!alvo) return;
  const ehEdh = topView.formato === "commander";
  alvo.innerHTML = `<div class="status">carregando o ranking…</div>`;
  let linhas = [];
  try{
    linhas = await supa(`top_decks?formato=eq.${encodeURIComponent(topView.formato)}`
      + `&periodo=eq.${encodeURIComponent(topView.periodo)}`
      + `&select=posicao,nome,decks,url,dia&order=posicao.asc&limit=100`);
  }catch(e){ linhas = []; }
  if(!alvo.isConnected) return;

  if(!linhas.length){
    alvo.innerHTML = `<div class="nota-regiao">
      O ranking desta janela ainda não foi baixado. Ele vem do job diário, que roda às 6h10.
      ${ehEdh ? "Enquanto isso, o <b>Desde sempre</b> funciona sozinho, direto do Scryfall." : ""}</div>`;
    return;
  }

  const dia = linhas[0].dia;
  const totalDecks = linhas.reduce((a,l) => a + (l.decks||0), 0) || 1;
  const janela = (PERIODOS_TOP.find(p => p[0] === topView.periodo) || ["","essa janela"])[1].toLowerCase();

  alvo.innerHTML = `
    <p class="status" style="text-align:left;margin:0 0 12px">
      ${linhas.length} ${ehEdh ? "decks mais jogados de Commander" : "arquétipos de " + formatoDe(topView.formato).nome}
      ${janela} · ${ehEdh
        ? "número de decks publicados no EDHREC"
        : `${totalDecks.toLocaleString("pt-BR")} decks de torneio classificados`}${
        dia ? ` · atualizado em ${new Date(dia+"T12:00:00").toLocaleDateString("pt-BR")}` : ""}</p>
    <div class="${ehEdh ? "cmd-grade" : "meta-lista"}" id="top-grade">
      ${linhas.map(l => ehEdh ? `
        <div class="cmd-cartao" data-nome="${escapeHTML(l.nome)}">
          <div class="cmd-pos">${l.posicao}</div>
          <div class="cmd-mini" id="mini-${l.posicao}"></div>
          <div class="cmd-info">
            <b>${escapeHTML(l.nome)}</b>
            <small>${(l.decks||0).toLocaleString("pt-BR")} decks publicados</small>
            <div class="cmd-acoes">
              <button class="btn ghost cmd-usar">Criar deck</button>
              ${l.url ? `<a class="btn ghost" href="${escapeHTML(l.url)}" target="_blank" rel="noopener">Ver no EDHREC ↗</a>` : ""}
            </div>
          </div>
        </div>` : `
        <div class="meta-linha">
          <span class="meta-pos">${l.posicao}</span>
          <span class="meta-nome">${escapeHTML(l.nome)}</span>
          <span class="meta-barra"><i style="width:${Math.round(100*(l.decks||0)/totalDecks)}%"></i></span>
          <span class="meta-share">${(100*(l.decks||0)/totalDecks).toFixed(1)}%</span>
          <span class="meta-decks">${(l.decks||0)} deck${(l.decks||0)===1?"":"s"}</span>
        </div>`).join("")}
    </div>
    ${ehEdh ? "" : `<p class="impr-dica">Arquétipo classificado pelas regras abertas do MTGOFormatData,
      sobre as listas de torneio de MTGO, Melee, Topdeck e Manatraders. A fatia é sobre os decks
      classificados nesta janela, não sobre o mundo inteiro.</p>`}`;

  if(!ehEdh) return;

  // as imagens vêm do Scryfall em lote, pelo nome
  const cartas = await cartasPorNome(linhas.map(l => l.nome));
  if(!alvo.isConnected) return;
  linhas.forEach(l => {
    const c = cartas[chaveDeNome(l.nome)];
    const caixa = document.getElementById("mini-" + l.posicao);
    if(caixa && c) caixa.innerHTML = `<img loading="lazy" src="${escapeHTML(c.small||"")}" alt="${escapeHTML(c.name)}">`;
  });
  alvo.querySelectorAll(".cmd-cartao").forEach(el => {
    const c = cartas[chaveDeNome(el.dataset.nome)];
    const usar = el.querySelector(".cmd-usar");
    if(usar) usar.onclick = () => c
      ? novoDeck({ formato:"commander", nome:c.name, comandante:cartaDeDeck(c,1) })
      : novoDeck({ formato:"commander", nome:el.dataset.nome });
    const mini = el.querySelector(".cmd-mini");
    if(mini && c) mini.onclick = () => openCard(c);
  });
}

/* busca em lote pelo nome exato — /cards/collection aceita 75 por vez */
async function cartasPorNome(nomes){
  const fora = {};
  const unicos = [...new Set(nomes)];
  for(let i = 0; i < unicos.length; i += 75){
    const lote = unicos.slice(i, i+75).map(n => ({ name: n.split(" // ")[0] }));
    try{
      const r = await fetch(`${API}/cards/collection`, {
        method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
        body: JSON.stringify({ identifiers: lote })
      });
      if(!r.ok) break;
      const j = await r.json();
      (j.data || []).map(normalize).forEach(c => {
        fora[chaveDeNome(c.name)] = c;
        fora[chaveDeNome(c.name.split(" // ")[0])] = c;
      });
    }catch(e){ break; }
    await sleep(120);
  }
  return fora;
}

async function carregarSempre(zerar){
  const grade = document.getElementById("top-grade"), status = document.getElementById("top-status");
  if(!grade) return;
  if(zerar){ topView.linhas = []; topView.pagina = 1; grade.innerHTML = skeletons(8); }
  const partes = ["is:commander game:paper"];
  if((topView.busca||"").trim()) partes.push(`name:"${topView.busca.trim()}"`);
  if(topView.cor) partes.push(topView.cor === "c" ? "ci:c" : `ci:${topView.cor}`);
  try{
    const json = await scryPage(partes.join(" "), "cards", "edhrec", topView.pagina, "auto");
    if(!grade.isConnected) return;
    topView.linhas.push(...(json.data || []).map(normalize));
    topView.total = json.total_cards || topView.linhas.length;
    topView.temMais = !!json.has_more;
    topView.pagina++;
  }catch(e){
    if(grade.isConnected){ grade.innerHTML = ""; status.textContent = "não consegui buscar agora."; }
    return;
  }
  if(!grade.isConnected) return;

  status.innerHTML = `${topView.total.toLocaleString("pt-BR")} comandantes${topView.busca||topView.cor?" nesse filtro":""} ·
    ordenados pelo ranking histórico de uso do EDHREC, que o Scryfall publica em cada carta`;
  grade.innerHTML = topView.linhas.map((c,i) => `
    <div class="cmd-cartao" data-id="${c.id}">
      <div class="cmd-pos">${i+1}</div>
      <div class="cmd-mini"><img loading="lazy" src="${escapeHTML(c.small||"")}" alt="${escapeHTML(c.name)}"></div>
      <div class="cmd-info">
        <b>${escapeHTML(c.name)}</b>
        <small>${escapeHTML((c.type||"").split("—")[0].trim())}${c.edhrec ? ` · #${c.edhrec} entre todas as cartas` : ""}</small>
        <div class="cmd-acoes">
          <button class="btn ghost cmd-usar">Criar deck</button>
          <button class="btn ghost cmd-ver">Ver carta</button>
        </div>
      </div>
    </div>`).join("");

  grade.querySelectorAll(".cmd-cartao").forEach(el => {
    const c = topView.linhas.find(x => x.id === el.dataset.id);
    if(!c) return;
    el.querySelector(".cmd-usar").onclick = () => novoDeck({ formato:"commander", nome:c.name, comandante:cartaDeDeck(c,1) });
    el.querySelector(".cmd-ver").onclick = () => openCard(c);
  });

  const mais = document.getElementById("top-mais");
  if(mais) mais.innerHTML = topView.temMais ? `<button class="btn ghost" id="top-mais-btn">Carregar mais</button>` : "";
  const btn = document.getElementById("top-mais-btn");
  if(btn) btn.onclick = () => { btn.disabled = true; carregarSempre(false); };
}

/* =====================================================================
   CHASE CARDS — a lista de desejo com preço de olho

   O usuário cria os grupos com o nome que quiser ("comprar em outubro",
   "reserva do Modern") e joga carta dentro. Para cada carta o app guarda o
   preço do dia em que ela entrou e compara com o de agora, usando o mesmo
   histórico diário que alimenta o gráfico da carta.
   ===================================================================== */

function chase(){
  if(!S.chase) S.chase = { grupos:[{ id:"geral", nome:"Quero comprar" }], cartas:[] };
  if(!S.chase.grupos.length) S.chase.grupos = [{ id:"geral", nome:"Quero comprar" }];
  return S.chase;
}
function porNoChase(carta, grupoId){
  const c = chase();
  if(c.cartas.some(x => x.id === carta.id)) return false;
  const p = precoLocal(carta);
  c.cartas.push(Object.assign(cartaDeDeck(carta, 1), {
    grupo: grupoId || c.grupos[0].id,
    entrada: p ? p.valor : 0,
    entradaEm: Date.now(),
    alvo: 0,
  }));
  save();
  return true;
}

let chaseView = { carregouHistorico:false };

function renderChase(){
  const c = chase();
  const total = c.cartas.reduce((a,x) => { const p = precoLocal(deckParaCarta(x)); return a + (p?p.valor:0); }, 0);

  app.innerHTML = `
    <div class="section-head">
      <div>
        <h2>Chase cards</h2>
        <p>As cartas que você quer comprar, em grupos com o nome que você quiser. O app guarda o preço
        do dia em que cada uma entrou e mostra o que subiu e o que caiu desde então.</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="chase-add">+ Adicionar carta</button>
        <button class="btn ghost" id="chase-grupo">+ Grupo</button>
      </div>
    </div>

    ${c.cartas.length === 0
      ? `<div class="empty">Nenhuma carta na lista ainda.<br>
          Use o <b>+ Adicionar carta</b>, ou abra qualquer carta no catálogo e clique em
          <b>“quero esta”</b>.</div>`
      : `<div class="resumo-colecao" style="margin-bottom:18px">
          <div class="rc"><b>${c.cartas.length}</b><small>cartas na mira</small></div>
          <div class="rc"><b>${formatarPreco({valor:total, simbolo:regiao().simbolo})}</b><small>custo de comprar tudo</small></div>
          <div class="rc"><b>${c.grupos.length}</b><small>grupos</small></div>
        </div>` }

    <div id="chase-lista"></div>`;

  document.getElementById("chase-add").onclick = () => buscarParaChase();
  document.getElementById("chase-grupo").onclick = () => criarGrupoChase();
  pintarChase();
  carregarPrecosDoChase();
}

function pintarChase(){
  const alvo = document.getElementById("chase-lista");
  if(!alvo) return;
  const c = chase();
  if(!c.cartas.length){ alvo.innerHTML = ""; return; }

  alvo.innerHTML = c.grupos.map(g => {
    const itens = c.cartas.filter(x => x.grupo === g.id);
    const soma = itens.reduce((a,x) => { const p = precoLocal(deckParaCarta(x)); return a + (p?p.valor:0); }, 0);
    return `
    <section class="chase-grupo" data-grupo="${g.id}">
      <h3 class="grupo-titulo">
        <span class="chase-nome" contenteditable="true" spellcheck="false" data-g="${g.id}">${escapeHTML(g.nome)}</span>
        <span>${itens.length}</span>
        <b class="chase-soma">${formatarPreco({valor:soma, simbolo:regiao().simbolo})}</b>
        ${c.grupos.length > 1 ? `<button class="chase-apagar" data-g="${g.id}" title="apagar grupo">×</button>` : ""}
      </h3>
      ${itens.length
        ? `<div class="chase-linhas">${itens.map(linhaChase).join("")}</div>`
        : `<div class="empty" style="padding:22px">Grupo vazio — mande cartas para cá pelo seletor de cada carta.</div>`}
    </section>`;
  }).join("");

  ligarChase();
}

function linhaChase(x){
  const carta = deckParaCarta(x);
  const p = precoLocal(carta);
  const agora = p ? p.valor : 0;
  const entrada = Number(x.entrada) || 0;
  const dif = entrada && agora ? (agora - entrada) / entrada : 0;
  const seta = dif > 0.02 ? "subiu" : dif < -0.02 ? "caiu" : "parado";
  const alvo = Number(x.alvo) || 0;
  const bateu = alvo && agora && agora <= alvo;
  const grupos = chase().grupos;
  return `
  <div class="chase-linha ${bateu?"na-mira":""}" data-id="${x.id}">
    <img class="dl-img" loading="lazy" src="${escapeHTML(x.img||"")}" alt="">
    <span class="dl-nome">${escapeHTML(x.n)}
      <small>${escapeHTML(x.sn || x.s || "")}</small></span>
    <span class="chase-graf" id="chase-graf-${escapeHTML(x.id)}"></span>
    <span class="chase-preco">
      <b>${p ? formatarPreco(p) : "—"}</b>
      ${entrada ? `<small class="var-${seta}">${dif>0?"+":""}${(dif*100).toFixed(0)}% desde que entrou</small>` : ""}
    </span>
    <span class="chase-alvo">
      <input type="number" step="0.01" min="0" placeholder="preço alvo" value="${alvo||""}" data-alvo="${escapeHTML(x.id)}">
      ${bateu ? `<em>chegou no alvo</em>` : ""}
    </span>
    <select class="chase-mover" data-mover="${escapeHTML(x.id)}">
      ${grupos.map(g => `<option value="${g.id}"${g.id===x.grupo?" selected":""}>${escapeHTML(g.nome)}</option>`).join("")}
    </select>
    <span class="dl-acoes">
      <button class="dl-info" title="detalhes">i</button>
      <button class="dl-fora" title="tirar da lista">×</button>
    </span>
  </div>`;
}

function ligarChase(){
  const alvo = document.getElementById("chase-lista");
  if(!alvo) return;
  const c = chase();

  alvo.querySelectorAll(".chase-nome").forEach(el => {
    el.onblur = () => {
      const g = c.grupos.find(x => x.id === el.dataset.g);
      const t = el.textContent.trim();
      if(g && t){ g.nome = t; save(); pintarChase(); } else el.textContent = g ? g.nome : "";
    };
    el.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); el.blur(); } };
  });

  alvo.querySelectorAll(".chase-apagar").forEach(b => b.onclick = () => {
    const g = c.grupos.find(x => x.id === b.dataset.g);
    if(!g) return;
    const quantas = c.cartas.filter(x => x.grupo === g.id).length;
    if(quantas && !confirm(`Apagar "${g.nome}"? As ${quantas} cartas vão para o primeiro grupo.`)) return;
    c.grupos = c.grupos.filter(x => x.id !== g.id);
    c.cartas.forEach(x => { if(x.grupo === g.id) x.grupo = c.grupos[0].id; });
    save(); renderChase();
  });

  alvo.querySelectorAll(".chase-linha").forEach(el => {
    const x = c.cartas.find(y => y.id === el.dataset.id);
    if(!x) return;
    el.querySelector(".dl-info").onclick = () => openCard(deckParaCarta(x));
    el.querySelector(".dl-fora").onclick = () => {
      registrarDesfazer(`tirar ${x.n} da lista de desejo`, { chase: JSON.parse(JSON.stringify(c)) });
      S.chase.cartas = c.cartas.filter(y => y.id !== x.id); save(); renderChase();
    };
    const alvoInput = el.querySelector("[data-alvo]");
    if(alvoInput) alvoInput.onchange = () => { x.alvo = Number(alvoInput.value) || 0; save(); pintarChase(); };
    const mover = el.querySelector("[data-mover]");
    if(mover) mover.onchange = () => { x.grupo = mover.value; save(); pintarChase(); };
  });
}

function criarGrupoChase(){
  const nome = prompt("Nome do grupo (ex.: comprar em outubro, reserva do Modern):");
  if(!nome || !nome.trim()) return;
  chase().grupos.push({ id:"g" + Date.now().toString(36), nome:nome.trim() });
  save(); renderChase();
}

function buscarParaChase(){
  let busca = 0, achadas = [];
  const grupos = chase().grupos;
  modal(`<div class="modal-pad">
    <h3>Adicionar à lista de desejo</h3>
    <label class="field"><span>Nome da carta</span>
      <input type="text" id="ch-termo" placeholder="ex.: Mana Crypt" autocomplete="off"></label>
    <label class="field"><span>Em qual grupo</span>
      <select id="ch-grupo">${grupos.map(g => `<option value="${g.id}">${escapeHTML(g.nome)}</option>`).join("")}</select>
    </label>
    <div class="status" id="ch-status">digite pelo menos três letras</div>
    <div class="cards" id="ch-grade"></div>
  </div>`);
  const campo = document.getElementById("ch-termo");
  const status = document.getElementById("ch-status"), grade = document.getElementById("ch-grade");
  campo.focus();
  let t;
  campo.oninput = () => { clearTimeout(t); t = setTimeout(rodar, 380); };

  async function rodar(){
    const termo = campo.value.trim();
    if(termo.length < 3){ status.textContent = "digite pelo menos três letras"; grade.innerHTML = ""; return; }
    status.textContent = "buscando…"; grade.innerHTML = skeletons(6);
    const meu = ++busca;
    try{
      const json = await scryPage(`name:"${termo}"`, "prints", "usd", 1, "desc");
      if(meu !== busca || !grade.isConnected) return;
      achadas = (json.data || []).map(normalize);
      status.textContent = `${achadas.length} impressões — escolha a que você quer comprar`;
      grade.innerHTML = achadas.map(c => cardHTML(c)).join("");
      grade.querySelectorAll(".card").forEach(el => {
        const c = achadas.find(x => x.id === el.dataset.id);
        if(!c) return;
        const info = el.querySelector(".info");
        if(info) info.onclick = ev => { ev.stopPropagation(); openCard(c); };
        el.onclick = () => {
          const g = document.getElementById("ch-grupo").value;
          if(porNoChase(c, g)) toast(`${c.name} entrou na lista`);
          else toast(`${c.name} já estava na lista`);
          closeModal(); renderChase();
        };
      });
    }catch(e){
      if(meu === busca && grade.isConnected){ status.textContent = "erro na busca"; grade.innerHTML = ""; }
    }
  }
}

/* o gráfico de cada carta da lista vem do mesmo histórico diário do banco */
async function carregarPrecosDoChase(){
  const c = chase();
  for(const x of c.cartas.slice(0, 40)){
    const caixa = document.getElementById("chase-graf-" + x.id);
    if(!caixa || !caixa.isConnected) continue;
    try{
      const linhas = await supa(`price_history?card_id=eq.${encodeURIComponent(x.id)}&select=day,usd,usd_foil&order=day.asc&limit=120`);
      if(!caixa.isConnected) continue;
      const pontos = (linhas || []).map(l => ({ dia:l.day, v:Number(l.usd || l.usd_foil) })).filter(p => p.v > 0);
      if(pontos.length >= 2) caixa.innerHTML = sparkline(pontos);
      else caixa.innerHTML = `<small class="sem-hist">sem histórico ainda</small>`;
    }catch(e){ break; }
  }
}



/* =====================================================================
   MESA — o grupo de jogo

   Primeira parte do app em que gente diferente escreve no mesmo lugar.
   Sem cadastro: quem cria o grupo recebe um código de 8 letras e passa
   para a mesa; quem tem o código entra. As tabelas ficam fechadas no
   banco e tudo passa por funções que exigem esse código, então a chave
   pública que vive dentro do app não abre grupo de ninguém.

   O que fica guardado aqui no aparelho é só quais grupos são seus e com
   que nome você entrou.
   ===================================================================== */

function mesa(){
  if(!S.mesa) S.mesa = { eu:"", grupos:[], atual:null };
  return S.mesa;
}
const grupoAtual = () => mesa().grupos.find(g => g.code === mesa().atual) || null;

async function rpc(funcao, args){
  const r = await fetch(`${SUPA_URL}/rest/v1/rpc/${funcao}`, {
    method:"POST",
    headers:Object.assign(cabecalhoAuth(),
            { "Content-Type":"application/json", Accept:"application/json" }),
    body: JSON.stringify(args || {})
  });
  const txt = await r.text();
  let corpo = null;
  try{ corpo = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    const msg = (corpo && (corpo.message || corpo.hint)) || `erro ${r.status}`;
    throw new Error(msg.replace(/^.*?:\s*/, ""));
  }
  return corpo;
}

/* =====================================================================
   PONTUAÇÃO DO GRUPO

   Uma mesa de Magic quase nunca tem sempre o mesmo tamanho: hoje jogam
   quatro, quinta que vem jogam dois. Contar "1 ponto por vitória" nesse
   cenário premia quem joga em mesa pequena, porque vencer um duelo é
   bem mais provável do que vencer um pod de quatro.

   Por isso a regra tem DOIS eixos, e os dois ficam à vista na tela:

   - O QUE CONTA: só o primeiro lugar, ou a colocação inteira (1º, 2º,
     3º, 4º). Colocação exige que alguém anote a ordem em que a mesa
     morreu; quem não anota continua marcando só o vencedor, e o app
     usa "só o primeiro" naquela partida sozinho.
   - AJUSTE PELO TAMANHO DA MESA: ligado, o ponto é quantos jogadores
     ficaram atrás de você — vencer entre quatro vale 3, vencer um duelo
     vale 1. Desligado, a colocação vale sempre o mesmo (3/2/1/0),
     independentemente de quantos jogaram.

   E uma temporada opcional de N partidas: quando a última é registrada,
   quem estiver na frente é o campeão. O ranking continua completo o
   tempo todo — campeão é um rótulo em cima da tabela, não um filtro.

   Regra vive no GRUPO, não no aparelho: se cada telefone tivesse a sua,
   duas pessoas da mesma mesa veriam campeões diferentes.
   ===================================================================== */

const PONTUACAO_PADRAO = { modo:"colocacao", ajuste:true, temporada:null };

function regrasDoGrupo(dados){
  return Object.assign({}, PONTUACAO_PADRAO, (dados && dados.scoring) || {});
}

/* o que vale cada jogador numa partida, pelas regras do grupo */
function pontosDaPartida(p, regras){
  const js = p.players || [];
  const n = js.length;
  /* sem ninguém com colocação anotada, esta partida vira "só o primeiro"
     por conta própria — é melhor do que zerar todo mundo */
  const temLugar = js.some(j => Number(j.place) > 0);
  const pontos = {};
  js.forEach(j => {
    const lugar = Number(j.place) > 0 ? Number(j.place) : (j.won ? 1 : null);
    let v = 0;
    if(regras.modo === "primeiro" || !temLugar){
      v = lugar === 1 ? (regras.ajuste ? Math.max(1, n - 1) : 1) : 0;
    } else if(lugar == null){
      v = 0;                                   // esse jogador não foi anotado
    } else if(regras.ajuste){
      v = Math.max(0, n - lugar);              // quantos ficaram atrás de você
    } else {
      v = Math.max(0, 4 - lugar);              // 1º=3 · 2º=2 · 3º=1 · daí em diante 0
    }
    pontos[j.member_id] = v;
  });
  return pontos;
}

/* a temporada, quando existe: quais partidas contam e quantas faltam */
function temporadaDoGrupo(dados, regras){
  const t = regras.temporada;
  if(!t || !(Number(t.jogos) > 0)) return null;
  const desde = t.desde ? Date.parse(t.desde) : 0;
  const emOrdem = (dados.matches || [])
    .filter(p => !desde || Date.parse(p.played_at) >= desde)
    .slice().sort((a, b) => Date.parse(a.played_at) - Date.parse(b.played_at));
  const contam = emOrdem.slice(0, Number(t.jogos));
  return { alvo:Number(t.jogos), jogadas:contam.length,
           completa:contam.length >= Number(t.jogos), partidas:contam, desde };
}

/* ---------------- ranking ---------------- */
function rankingDoGrupo(dados){
  const regras = regrasDoGrupo(dados);
  const temporada = temporadaDoGrupo(dados, regras);
  const partidas = temporada ? temporada.partidas : (dados.matches || []);

  const linhas = (dados.members || []).map(m => ({
    id:m.id, nome:m.name, jogos:0, vitorias:0, pontos:0, tempo:0, decks:{}, ultimas:[]
  }));
  const porId = {};
  linhas.forEach(l => porId[l.id] = l);

  partidas.slice().sort((a, b) => Date.parse(a.played_at) - Date.parse(b.played_at)).forEach(p => {
    const pts = pontosDaPartida(p, regras);
    (p.players || []).forEach(j => {
      const l = porId[j.member_id];
      if(!l) return;
      const lugar = Number(j.place) > 0 ? Number(j.place) : (j.won ? 1 : null);
      l.jogos++;
      if(j.won) l.vitorias++;
      l.pontos += pts[j.member_id] || 0;
      l.tempo += Number(p.seconds) || 0;
      if(j.deck_name){
        const dk = l.decks[j.deck_name] = l.decks[j.deck_name] ||
          { nome:j.deck_name, jogos:0, vitorias:0, pontos:0, ultima:null, lugares:[] };
        dk.jogos++;
        if(j.won) dk.vitorias++;
        dk.pontos += pts[j.member_id] || 0;
        dk.ultima = p.played_at;
        if(lugar) dk.lugares.push(lugar);
      }
      l.ultimas.push(!!j.won);
    });
  });

  linhas.forEach(l => {
    l.taxa = l.jogos ? l.vitorias / l.jogos : 0;
    l.media = l.jogos ? l.pontos / l.jogos : 0;
    l.ultimas = l.ultimas.slice(-8);
    // sequência de vitórias atual, contando de trás para frente
    let seq = 0;
    for(let i = l.ultimas.length - 1; i >= 0 && l.ultimas[i]; i--) seq++;
    l.sequencia = seq;
    l.listaDecks = Object.values(l.decks).sort((a, b) => b.jogos - a.jogos || b.vitorias - a.vitorias);
    const favorito = l.listaDecks[0];
    l.deckFavorito = favorito ? `${favorito.nome} (${favorito.jogos})` : "";
  });

  const ordenado = linhas.sort((a, b) =>
    b.pontos - a.pontos || b.vitorias - a.vitorias || b.taxa - a.taxa || a.nome.localeCompare(b.nome));
  ordenado.regras = regras;
  ordenado.temporada = temporada;
  return ordenado;
}

/* uma frase que descreve a regra em vigor, para a tela nunca ter um
   número de ponto sem explicação do lado */
function explicarPontuacao(regras){
  if(regras.modo === "primeiro"){
    return regras.ajuste
      ? "Só o 1º lugar pontua, e vale quantos adversários ele venceu: 3 numa mesa de quatro, 1 num duelo."
      : "Só o 1º lugar pontua, e vale 1 ponto, não importa quantos jogaram.";
  }
  return regras.ajuste
    ? "A colocação inteira pontua: você marca quantos jogadores ficaram atrás de você (mesa de quatro: 3 · 2 · 1 · 0; duelo: 1 · 0)."
    : "A colocação inteira pontua com valor fixo: 1º = 3 · 2º = 2 · 3º = 1 · do 4º em diante, 0.";
}

const tempoCurto = seg => {
  seg = Math.max(0, Math.round(Number(seg) || 0));
  const h = Math.floor(seg/3600), m = Math.floor((seg%3600)/60), s = seg%60;
  return h ? `${h}h${String(m).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
};

  const t = rank.temporada;
  const campeao = t && t.completa && rank[0] && rank[0].pontos ? rank[0] : null;
  const jogou = rank.some(l => l.jogos);

  const cabecalho = `
    <div class="rank-topo">
      <div>
        <span class="flabel" style="margin:0 0 4px">Como este grupo pontua</span>
        <p class="rank-regra">${escapeHTML(explicarPontuacao(regras))}</p>
      </div>
      <button class="btn ghost" id="rank-regras">Mudar as regras</button>
    </div>
    ${t ? `
      <div class="temporada ${t.completa ? "fim" : ""}">
        ${campeao
          ? `<b>Campeão da temporada: ${escapeHTML(campeao.nome)}</b>
             <span>${t.alvo} partidas · ${campeao.pontos} pontos. O ranking abaixo é o fechamento —
             comece outra temporada nas regras quando a mesa quiser recomeçar do zero.</span>`
          : `<b>Temporada: partida ${t.jogadas} de ${t.alvo}</b>
             <span>Faltam ${t.alvo - t.jogadas} para fechar. Quem estiver na frente na última é o campeão.</span>`}
        <div class="temporada-barra"><i style="width:${Math.min(100, Math.round(100*t.jogadas/t.alvo))}%"></i></div>
      </div>` : ""}`;

  if(!jogou) return cabecalho + `<div class="empty">Ninguém jogou ainda. Clique em
    <b>+ Registrar partida</b> quando a primeira terminar — ou use as <b>ferramentas da mesa</b>
    para sortear a ordem, cronometrar e marcar o tempo de cada jogador.</div>`;

  return cabecalho + `
    <div class="rank-tabela pontuada">
      <div class="rank-cab">
        <span>#</span><span>jogador</span><span>pts</span><span>V</span><span>J</span><span>%</span>
        <span>últimas</span><span>deck mais usado</span>
      </div>
      ${rank.map((l,i) => `
        <div class="rank-linha ${i===0 && l.pontos ? "lider" : ""}" data-jog="${l.id}" title="ver o histórico de decks">
          <span class="rank-pos">${i+1}</span>
          <span class="rank-nome">${escapeHTML(l.nome)}${l.sequencia >= 2 ? ` <em title="sequência de vitórias">🔥${l.sequencia}</em>` : ""}</span>
          <span class="rank-num destaque">${l.pontos}</span>
          <span class="rank-num">${l.vitorias}</span>
          <span class="rank-num">${l.jogos}</span>
          <span class="rank-num">${l.jogos ? Math.round(100*l.taxa) : 0}%</span>
          <span class="rank-ultimas">${l.ultimas.map(v => `<i class="${v?"v":"d"}" title="${v?"vitória":"derrota"}"></i>`).join("")}</span>
          <span class="rank-deck">${escapeHTML(l.deckFavorito)}</span>
        </div>`).join("")}
    </div>
    <p class="dg-txt" style="margin-top:12px">Toque em um jogador para ver o histórico de decks dele:
    quantas vezes usou cada um, quanto ganhou e quantos pontos tirou com cada deck.</p>`;
}

/* =====================================================================
   CONFRONTOS — quem ganha de quem

   Numa mesa de quatro não existe "A venceu B": existe um vencedor e três
   que não venceram. Então a conta aqui é honesta sobre o que mede:
   **em quantas partidas os dois estiveram juntos, e quantas cada um
   venceu**. Não é um placar de duelo, e a tela diz isso — chamar de
   "vitórias contra fulano" numa mesa de quatro seria inventar um duelo
   que não aconteceu.

   Partida em que nenhum dos dois venceu conta como jogada junto e não
   soma para ninguém: alguém de fora ganhou, e essa informação existe.
   ===================================================================== */
function confrontosDoGrupo(dados){
  const nomes = {};
  (dados.members || []).forEach(m => nomes[m.id] = m.name);
  const par = {};   // "a|b" -> { juntos, venceuA, venceuB, outro }
  const chave = (a, b) => a < b ? a + "|" + b : b + "|" + a;

  (dados.matches || []).forEach(p => {
    const js = (p.players || []).filter(j => nomes[j.member_id]);
    for(let i = 0; i < js.length; i++){
      for(let k = i + 1; k < js.length; k++){
        const a = js[i], b = js[k];
        const c = chave(a.member_id, b.member_id);
        const e = par[c] = par[c] || { juntos:0, vit:{}, outro:0 };
        e.juntos++;
        if(a.won) e.vit[a.member_id] = (e.vit[a.member_id] || 0) + 1;
        else if(b.won) e.vit[b.member_id] = (e.vit[b.member_id] || 0) + 1;
        else e.outro++;
      }
    }
  });
  return { nomes, par, chave };
}

function blocoConfrontos(dados){
  const membros = (dados.members || []).slice();
  const { par, chave } = confrontosDoGrupo(dados);
  if(membros.length < 2) return `<div class="empty">Confronto precisa de pelo menos dois jogadores no grupo.</div>`;
  if(!Object.keys(par).length) return `<div class="empty">Nenhuma partida registrada ainda —
    é dela que sai quem já jogou com quem.</div>`;

  const celula = (a, b) => {
    if(a.id === b.id) return `<span class="cf-cel vazia">—</span>`;
    const e = par[chave(a.id, b.id)];
    if(!e) return `<span class="cf-cel vazia" title="nunca jogaram na mesma mesa">·</span>`;
    const meu = e.vit[a.id] || 0, dele = e.vit[b.id] || 0;
    const forte = meu > dele ? "bom" : dele > meu ? "ruim" : "";
    return `<span class="cf-cel ${forte}" title="${escapeHTML(a.name)} ${meu} × ${dele} ${escapeHTML(b.name)} em ${e.juntos} partida${e.juntos>1?"s":""} juntos${
      e.outro ? ` — ${e.outro} venceu outra pessoa` : ""}">
      <b>${meu}</b><i>×</i><b>${dele}</b><small>${e.juntos}j</small></span>`;
  };

  return `
    <p class="dg-txt" style="margin-bottom:14px">
      <b>Isto não é placar de duelo.</b> Numa mesa de quatro não existe "A venceu B": existe um vencedor
      e três que não venceram. Cada quadrinho mostra <b>quantas partidas os dois jogaram juntos</b> e
      quantas cada um venceu — quando quem ganhou foi um terceiro, a partida conta como jogada junto e
      não soma para nenhum dos dois. Leia a linha: <b>o número da esquerda é de quem está na linha</b>.</p>

    <div class="cf-rolagem">
      <table class="cf-tabela">
        <thead><tr><th></th>${membros.map(m =>
          `<th><span>${escapeHTML(m.name)}</span></th>`).join("")}</tr></thead>
        <tbody>
          ${membros.map(a => `<tr>
            <th>${escapeHTML(a.name)}</th>
            ${membros.map(b => `<td>${celula(a, b)}</td>`).join("")}
          </tr>`).join("")}
        </tbody>
      </table>
    </div>

    ${blocoConfrontoDeDecks(dados)}`;
}

/* o mesmo cruzamento, mas por deck: é o que a mesa comenta de verdade
   ("contra o Krenko dele eu não ganho") */
function blocoConfrontoDeDecks(dados){
  const nomes = {};
  (dados.members || []).forEach(m => nomes[m.id] = m.name);
  const linhas = {};
  (dados.matches || []).forEach(p => {
    const js = (p.players || []).filter(j => j.deck_name && nomes[j.member_id]);
    js.forEach(j => {
      const k = j.member_id + "|" + j.deck_name;
      const l = linhas[k] = linhas[k] || { dono:nomes[j.member_id], deck:j.deck_name,
                                           jogos:0, vitorias:0, contra:{} };
      l.jogos++;
      if(j.won) l.vitorias++;
      const vencedor = js.find(x => x.won && x.member_id !== j.member_id);
      if(vencedor){
        const c = `${vencedor.deck_name} (${nomes[vencedor.member_id]})`;
        l.contra[c] = (l.contra[c] || 0) + 1;
      }
    });
  });
  const lista = Object.values(linhas).filter(l => l.jogos >= 2)
    .sort((a, b) => b.jogos - a.jogos || b.vitorias - a.vitorias);
  if(!lista.length) return "";

  return `
    <h3 class="grupo-titulo" style="margin-top:24px">Por deck<span>${lista.length}</span></h3>
    <div class="rank-tabela decks-jog">
      <div class="rank-cab"><span>deck</span><span>J</span><span>V</span><span>%</span><span></span><span>quem mais te ganhou</span></div>
      ${lista.map(l => {
        const pior = Object.entries(l.contra).sort((a, b) => b[1] - a[1])[0];
        return `<div class="rank-linha">
          <span class="rank-nome">${escapeHTML(l.deck)}<em style="color:var(--text-3)"> · ${escapeHTML(l.dono)}</em></span>
          <span class="rank-num">${l.jogos}</span>
          <span class="rank-num">${l.vitorias}</span>
          <span class="rank-num destaque">${Math.round(100*l.vitorias/l.jogos)}%</span>
          <span class="rank-num"></span>
          <span class="rank-deck">${pior ? escapeHTML(pior[0]) + " (" + pior[1] + ")" : "—"}</span>
        </div>`;
      }).join("")}
    </div>
    <p class="dg-txt" style="margin-top:10px">Só aparecem decks com duas partidas ou mais — com uma só,
    a porcentagem seria 0% ou 100% e não diria nada.</p>`;
}

/* ---------------- histórico de decks de um jogador ---------------- */
function abrirJogador(rank, dados, id){
  const l = rank.find(x => x.id === id);
  if(!l) return;
  const partidas = (dados.matches || []).filter(p => (p.players||[]).some(j => j.member_id === id));
  modal(`<div class="modal-pad">
    <h3>${escapeHTML(l.nome)}</h3>
    <div class="resumo-colecao" style="margin:10px 0 16px">
      <div class="rc"><b>${l.pontos}</b><small>pontos</small></div>
      <div class="rc"><b>${l.vitorias}</b><small>vitórias</small></div>
      <div class="rc"><b>${l.jogos}</b><small>partidas</small></div>
      <div class="rc"><b>${l.jogos ? l.media.toFixed(1).replace(".", ",") : "—"}</b><small>pontos por partida</small></div>
    </div>

    <span class="flabel">Decks que ele usou</span>
    ${l.listaDecks.length ? `<div class="rank-tabela decks-jog">
      <div class="rank-cab"><span>deck</span><span>J</span><span>V</span><span>%</span><span>pts</span><span>lugar médio</span></div>
      ${l.listaDecks.map(dk => {
        const lugarMedio = dk.lugares.length
          ? (dk.lugares.reduce((a,b)=>a+b,0)/dk.lugares.length).toFixed(1).replace(".", ",") + "º" : "—";
        return `<div class="rank-linha">
          <span class="rank-nome">${escapeHTML(dk.nome)}</span>
          <span class="rank-num">${dk.jogos}</span>
          <span class="rank-num">${dk.vitorias}</span>
          <span class="rank-num">${Math.round(100*dk.vitorias/dk.jogos)}%</span>
          <span class="rank-num destaque">${dk.pontos}</span>
          <span class="rank-num">${lugarMedio}</span>
        </div>`;
      }).join("")}
    </div>` : `<div class="empty">Nenhum deck anotado nas partidas dele.<br>
      <span style="color:var(--faint);font-size:12.5px">O campo do deck é opcional ao registrar a
      partida — quando alguém preenche, ele vira este histórico.</span></div>`}

    <span class="flabel" style="margin-top:16px">Últimas partidas</span>
    <div class="partidas">${partidas.slice(0, 12).map(p => {
      const eu = (p.players||[]).find(j => j.member_id === id) || {};
      const lugar = Number(eu.place) > 0 ? `${eu.place}º` : (eu.won ? "1º" : "—");
      return `<div class="partida ${eu.won ? "ganhou" : ""}">
        <div class="partida-topo">
          <b>${lugar} de ${(p.players||[]).length}${eu.deck_name ? " · " + escapeHTML(eu.deck_name) : ""}</b>
          <span>${new Date(p.played_at).toLocaleDateString("pt-BR", { day:"2-digit", month:"short" })}${
            p.seconds ? ` · ${tempoCurto(p.seconds)}` : ""}</span>
        </div>
      </div>`;
    }).join("") || `<div class="empty">Sem partidas.</div>`}</div>

    <div class="pergunta-acoes"><button class="btn" id="jog-fechar">Fechar</button></div>
  </div>`);
  document.getElementById("jog-fechar").onclick = closeModal;
}

function blocoHistorico(dados){
  const partidas = dados.matches || [];
  if(!partidas.length) return `<div class="empty">Nenhuma partida registrada ainda.</div>`;
  const nome = id => ((dados.members||[]).find(m => m.id === id) || {}).name || "?";
  return `<div class="partidas">${partidas.map(p => {
    const venceu = (p.players||[]).filter(j => j.won).map(j => nome(j.member_id));
    return `
    <div class="partida" data-p="${p.id}">
      <div class="partida-topo">
        <b>${venceu.length ? escapeHTML(venceu.join(", ")) + " venceu" : "sem vencedor anotado"}</b>
        <span>${new Date(p.played_at).toLocaleString("pt-BR", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" })}
          ${p.seconds ? ` · ${tempoCurto(p.seconds)}` : ""}${p.format ? ` · ${escapeHTML(p.format)}` : ""}</span>
        <button class="partida-x" title="apagar esta partida">×</button>
      </div>
      <div class="partida-jogadores">
        ${(p.players||[]).map(j => `
          <span class="pj ${j.won?"ganhou":""}">
            ${j.seat ? `<i>${j.seat}º</i>` : ""}${escapeHTML(nome(j.member_id))}
            ${j.deck_name ? `<small>${escapeHTML(j.deck_name)}</small>` : ""}
          </span>`).join("")}
      </div>
      ${p.notes ? `<p class="partida-nota">${escapeHTML(p.notes)}</p>` : ""}
    </div>`;
  }).join("")}</div>`;
}

/* ---------------- regras de pontuação ---------------- */
function abrirRegrasDePontuacao(dados){
  const r = regrasDoGrupo(dados);
  const t = r.temporada || {};
  modal(`<div class="modal-pad">
    <h3>Regras de pontuação</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 16px">

    <div class="fgrupo">
      <span class="flabel">O que conta</span>
      <div class="toggles" id="pt-modo">
        <button class="tog ${r.modo==="primeiro"?"on":""}" data-modo="primeiro">só o 1º lugar</button>
        <button class="tog ${r.modo==="colocacao"?"on":""}" data-modo="colocacao">colocação inteira (1º, 2º, 3º, 4º)</button>

    </div>

    <div class="fgrupo">
      <span class="flabel">Ajustar pelo tamanho da mesa</span>
      <div class="toggles" id="pt-ajuste">

      </div>
    </div>

    <p class="sug-aviso" id="pt-explica" style="margin:4px 0 16px">${escapeHTML(explicarPontuacao(r))}</p>

    <div class="fgrupo">
      <span class="flabel">Temporada</span>
      <div class="dupla">
        <label class="field"><span>Partidas até o campeão</span>
          <input type="number" id="pt-jogos" min="0" max="200" step="1" value="${Number(t.jogos) || 0}"
                 placeholder="0 = ranking corrido, sem campeão"></label>
        <label class="field"><span>Contar a partir de</span>
          <select id="pt-desde">
            <option value="mantem"${t.desde ? " selected" : ""}>${t.desde

              : "todas as partidas do grupo"}</option>
            <option value="agora">recomeçar agora — zera a contagem</option>

          </select></label>
      </div>
      <p class="sug-aviso" style="margin-top:6px">
        Com um número aqui, o app mostra "partida 7 de 12" e crava o campeão quando a última entrar.
        <b>O ranking continua completo o tempo todo</b> — campeão é um rótulo, não um filtro.

    <div class="pergunta-acoes">
      <button class="btn" id="pt-ok">Salvar para o grupo</button>
      <button class="btn ghost" id="pt-cancelar">Cancelar</button>
    </div>
    <div class="status" id="pt-status"></div>

  let modo = r.modo, ajuste = !!r.ajuste;
