}

/* ---------------- registrar partida ---------------- */
function registrarPartida(dados, daMesa){
  const membros = dados.members || [];
  /* casa os jogadores do contador de vida com os membros do grupo pelo
     nome — é o que a pessoa digitou nos dois lugares */
  const lugarPorMembro = {};
  (daMesa || []).forEach(x => {
    const m = membros.find(y => semAcento(y.name) === semAcento(x.nome));
    if(m) lugarPorMembro[m.id] = x.lugar;
  });
  if(!membros.length) return toast("o grupo ainda não tem jogadores");
  const meusDecks = decks().map(d => d.nome);

  modal(`<div class="modal-pad">
    <h3>Registrar partida</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 14px">
      Marque quem jogou, com que deck, e quem venceu. A ordem de jogo e o tempo são opcionais —
      se você usou o cronômetro ou o relógio da mesa, o tempo já vem preenchido.</p>
    ${Object.keys(lugarPorMembro).length ? `<div class="nota-regiao" style="margin-bottom:14px">
      <b>A colocação veio do contador de vida</b>, pela ordem em que a mesa foi caindo. Confira antes
      de salvar — quem não bateu de nome com o grupo ficou em branco.</div>` : ""}
    ${regrasDoGrupo(dados).modo === "colocacao" ? `
      <div class="nota-regiao" style="margin-bottom:14px">
        <b>Este grupo pontua a colocação inteira.</b> Preencha o campo <b>lugar</b> de cada um —
        1 para quem venceu, 2 para o penúltimo a morrer, e assim por diante. Se você só marcar o
        vencedor, esta partida sozinha conta como "só o 1º lugar", e o app avisa isso no ranking.
      </div>` : ""}

    <div class="dupla">
      <label class="field"><span>Formato</span>
        <select id="rp-formato">
          ${FORMATOS.map(f => `<option value="${f.id}"${f.id==="commander"?" selected":""}>${f.nome}</option>`).join("")}
        </select></label>
      <label class="field"><span>Duração (minutos)</span>
        <input type="number" id="rp-minutos" min="0" step="1"
               value="${(() => {
                 if(cron.acumulado) return Math.round(cron.acumulado/60);
                 const doRelogio = Object.values(relogio.gasto || {}).reduce((a,b) => a + b, 0);
                 return doRelogio ? Math.round(doRelogio/60) : "";
               })()}" placeholder="ex.: 52"></label>
    </div>

    <span class="flabel">Quem jogou</span>
    <div class="rp-jogadores">
      ${membros.map(m => `
        <div class="rp-jogador" data-m="${m.id}">
          <label class="check"><input type="checkbox" class="rp-tem" checked><span>${escapeHTML(m.name)}</span></label>
          <input type="text" class="rp-deck" list="rp-decks" placeholder="deck usado (opcional)">
          <input type="number" class="rp-seat" min="1" max="12" placeholder="ordem" title="ordem de jogo sorteada">
          <input type="number" class="rp-lugar" min="1" max="16" placeholder="lugar" title="colocação: 1 é quem venceu"
                 value="${lugarPorMembro[m.id] || ""}">
          <label class="check rp-venceu-lbl"><input type="radio" name="rp-venceu" class="rp-venceu" value="${m.id}"
                 ${lugarPorMembro[m.id] === 1 ? "checked" : ""}>
            <span>venceu</span></label>
        </div>`).join("")}
    </div>
    <datalist id="rp-decks">${meusDecks.map(n => `<option value="${escapeHTML(n)}"></option>`).join("")}</datalist>

    <label class="field" style="margin-top:14px"><span>Anotação (opcional)</span>
      <input type="text" id="rp-nota" placeholder="ex.: virada no último turno"></label>

    <div class="pergunta-acoes">
      <button class="btn" id="rp-ok">Salvar partida</button>
      <button class="btn ghost" id="rp-sortear">Sortear a ordem</button>
      <button class="btn ghost" id="rp-cancelar">Cancelar</button>
    </div>
    <div class="status" id="rp-status"></div>
  </div>`);

  document.getElementById("rp-cancelar").onclick = closeModal;
  document.querySelectorAll(".rp-jogador").forEach(l => {
    const lugar = l.querySelector(".rp-lugar");
    lugar.oninput = () => {
      if(Number(lugar.value) === 1) l.querySelector(".rp-venceu").checked = true;
      else if(l.querySelector(".rp-venceu").checked && Number(lugar.value) > 1)
        l.querySelector(".rp-venceu").checked = false;
    };
    l.querySelector(".rp-venceu").onchange = () => {
      document.querySelectorAll(".rp-jogador").forEach(o => {
        const c = o.querySelector(".rp-lugar");
        if(o === l) c.value = 1;
        else if(Number(c.value) === 1) c.value = "";
      });
    };
  });
  document.getElementById("rp-sortear").onclick = () => {
    const linhas = [...document.querySelectorAll(".rp-jogador")]
      .filter(l => l.querySelector(".rp-tem").checked);
    const ordem = linhas.map((_,i) => i+1);
    for(let i = ordem.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [ordem[i], ordem[j]] = [ordem[j], ordem[i]];
    }
    linhas.forEach((l,i) => l.querySelector(".rp-seat").value = ordem[i]);
    toast("ordem sorteada");
  };

  document.getElementById("rp-ok").onclick = async () => {
    const st = document.getElementById("rp-status");
    const jogadores = [...document.querySelectorAll(".rp-jogador")]
      .filter(l => l.querySelector(".rp-tem").checked)
      .map(l => {
        const lugar = Number(l.querySelector(".rp-lugar").value) || null;
        return {
          member_id: l.dataset.m,
          deck_name: l.querySelector(".rp-deck").value.trim() || null,
          seat: Number(l.querySelector(".rp-seat").value) || null,
          place: lugar,
          // quem foi marcado em 1º venceu, mesmo sem tocar no botão
          won: l.querySelector(".rp-venceu").checked || lugar === 1,
        };
      });
    if(!jogadores.length){ st.textContent = "marque quem jogou"; return; }
    st.textContent = "salvando…";
    try{
      await rpc("play_match_add", {
        p_code: grupoAtual().code,
        p_format: document.getElementById("rp-formato").value,
        p_seconds: Math.round((Number(document.getElementById("rp-minutos").value) || 0) * 60),
        p_notes: document.getElementById("rp-nota").value.trim() || null,
        p_players: jogadores,
      });
      /* a mesma partida também vira histórico do SEU deck, aqui no
         aparelho: a mesa guarda no servidor, mas o deck precisa disso
         offline e sem depender de abrir o grupo de novo */
      const eu = (mesa().grupos.find(g => g.code === mesa().atual) || {}).membroId;
      const minha = jogadores.find(j => j.member_id === eu);
      if(minha && minha.deck_name){
        const meu = decks().find(x => x.nome.toLowerCase() === minha.deck_name.toLowerCase());
        if(meu) anotarPartida(meu, {
          venceu: minha.won,
          lugar: minha.place || null,
          formato: document.getElementById("rp-formato").value,
          minutos: Number(document.getElementById("rp-minutos").value) || null,
          jogadores: jogadores.length,
          nota: document.getElementById("rp-nota").value.trim() || "",
          origem: "mesa",
        });
      }
      cron.acumulado = 0; cron.rodando = false;
      relZerar();
      closeModal(); mesaView.dados = null; renderMesa();
      toast("partida registrada");
    }catch(e){ st.textContent = "não consegui salvar: " + e.message; }
  };
}

/* =====================================================================
   FERRAMENTAS DA MESA

   O que se usa com a carta na mão: contador de vida com dano de
   comandante e veneno, sorteio de quem começa, cronômetro da partida,
   dado e cara ou coroa. Tudo funciona sem grupo e sem internet — é a
   parte do app que roda com o celular no meio da mesa.
   ===================================================================== */

/* `mortos` é a ORDEM em que a mesa foi caindo: o primeiro a morrer é o
   último colocado. É daqui que sai a colocação da partida sem ninguém
   ter que anotar nada no meio do jogo. */
let vida = { jogadores:[], formato:"commander", mortos:[] };
let cron = { rodando:false, inicio:0, acumulado:0, timer:null };

/* =====================================================================
   RELÓGIO DOS JOGADORES

   Dois jeitos de marcar, e a mesa escolhe:

   - PARA CIMA: só conta quanto cada um usou. Não pressiona ninguém e
     serve para descobrir onde a partida demora — é o que a maioria das
     mesas de Commander quer.
   - PARA BAIXO (xadrez): cada um começa com um tempo e ele desce só na
     vez dele. Com incremento opcional, no estilo Fischer: ao passar a
     vez você recebe alguns segundos de volta, para o fim de partida não
     virar corrida.

   O relógio NÃO elimina ninguém quando o tempo acaba. Magic não tem essa
   regra e o app não vai inventar: ele marca "tempo esgotado", passa a vez
   e deixa a mesa decidir o que fazer com isso.
   ===================================================================== */
let relogio = {
  modo:"cima", inicialMin:25, incremento:0,
  atual:null, desde:0, gasto:{}, credito:{}, estourou:{}, parado:{}, timer:null,
};

const relInicial = () => Math.max(0, Math.round(relogio.inicialMin * 60));
/* segundos que este jogador já usou, contando o que corre agora */
function relGasto(id){
  const base = relogio.gasto[id] || 0;
  return base + (relogio.atual === id ? (Date.now() - relogio.desde) / 1000 : 0);
}
/* o que o painel mostra: usado, no modo para cima; o que sobra, para baixo */
function relMostrar(id){
  return relogio.modo === "baixo"
    ? relInicial() + (relogio.credito[id] || 0) - relGasto(id)
    : relGasto(id);
}
const relSinal = seg => (seg < 0 ? "-" : "") + tempoLongo(Math.abs(seg));

/* fecha a vez de quem estava jogando: guarda o tempo e paga o incremento */
function relFechar(){
  const id = relogio.atual;
  if(id == null) return;
  relogio.gasto[id] = relGasto(id);
  if(relogio.modo === "baixo" && relogio.incremento > 0)
    relogio.credito[id] = (relogio.credito[id] || 0) + relogio.incremento;
  relogio.atual = null;
}
function relDarAVez(id){
  const quem = vida.jogadores.find(j => j.id === id);
  if(quem && estaMorto(quem)){ toast(`${quem.nome} já saiu da partida`); return; }
  if(relogio.atual === id){ relFechar(); relPintar(); return; }
  relFechar();
  relogio.atual = id;
  relogio.desde = Date.now();
  relTicar();
  relPintar();
}
function relProximo(){
  /* quem já saiu da partida não recebe a vez de novo */
  const vivos = vida.jogadores.filter(j => !estaMorto(j)).map(j => j.id);
  const ordem = vivos.length ? vivos : vida.jogadores.map(j => j.id);
  if(!ordem.length) return;
  const i = ordem.indexOf(relogio.atual);
  relDarAVez(ordem[(i + 1) % ordem.length]);
}
function relZerar(){
  relFechar();
  relogio.gasto = {}; relogio.credito = {}; relogio.estourou = {}; relogio.parado = {};
  relogio.atual = null;
  relPintar();
}
function relTicar(){
  clearInterval(relogio.timer);
  relogio.timer = setInterval(() => {
    const grade = document.getElementById("relogio-grade");
    if(!grade || !grade.isConnected){ clearInterval(relogio.timer); relogio.timer = null; return; }
    const id = relogio.atual;
    if(id == null){ clearInterval(relogio.timer); relogio.timer = null; return; }
    const el = grade.querySelector(`[data-rel="${id}"] .rel-tempo`);
    if(el) el.textContent = relSinal(relMostrar(id));
    /* estourou o tempo: marca uma vez, avisa e passa a vez */
    if(relogio.modo === "baixo" && relMostrar(id) <= 0 && !relogio.estourou[id]){
      relogio.estourou[id] = true;
      const j = vida.jogadores.find(x => x.id === id);
      toast(`${j ? j.nome : "Jogador"} estourou o tempo — a mesa decide o que fazer`);
      relProximo();
    }
  }, 250);
}
/* Repinta SEM refazer o HTML quando a mesa é a mesma: o telefone fica no
   meio da mesa e um relógio que pisca a cada ajuste é insuportável — e um
   botão que se troca embaixo do dedo perde o toque de quem ia usá-lo. */
function relPintar(){
  const grade = document.getElementById("relogio-grade");
  if(!grade) return;
  const ids = vida.jogadores.map(j => j.id).join(",");
  if(grade.dataset.ids !== ids){
    grade.dataset.ids = ids;
    grade.innerHTML = vida.jogadores.map(j => `
      <button class="rel-jog" data-rel="${escapeHTML(j.id)}">
        <span class="rel-nome"></span><span class="rel-tempo"></span><span class="rel-rot"></span>
      </button>`).join("") || `<span class="status">ponha jogadores no contador de vida primeiro</span>`;
  }
  vida.jogadores.forEach(j => {
    const el = grade.querySelector(`[data-rel="${j.id}"]`);
    if(!el) return;
    const fora = estaMorto(j);
    el.classList.toggle("na-vez", relogio.atual === j.id);
    el.classList.toggle("estourou", !!relogio.estourou[j.id]);
    el.classList.toggle("fora", fora);
    el.querySelector(".rel-nome").textContent = j.nome;
    el.querySelector(".rel-tempo").textContent = relSinal(relMostrar(j.id));
    el.querySelector(".rel-rot").textContent =
      fora ? "fora da partida" :
      relogio.atual === j.id ? "na vez" :
      relogio.estourou[j.id] ? "tempo esgotado" :
      relogio.modo === "baixo" ? "restam" : "usou";
  });
  const b = document.getElementById("rel-pausar");
  if(b) b.textContent = relogio.atual == null ? "Pausado" : "Pausar";
}

function vidaInicial(){ return vida.formato === "commander" ? 40 : 20; }

function novoJogadorDeVida(nome){
  return { id:"j"+Math.random().toString(36).slice(2,7), nome, vida:vidaInicial(), veneno:0, cmd:{} };
}
/* as três formas de sair da partida, no mesmo lugar */
const estaMorto = j => j.vida <= 0 || j.veneno >= 10 ||
  Object.values(j.cmd || {}).some(v => v >= 21);

/* =====================================================================
   MORREU: O RELÓGIO PARA E A COLOCAÇÃO SE ESCREVE SOZINHA

   Enquanto o contador de vida e o relógio eram duas coisas separadas, o
   relógio de quem já tinha morrido continuava correndo — e ninguém anota
   colocação no meio de uma partida de Commander.

   Agora o contador avisa: quem zera a vida (ou toma 10 de veneno, ou 21
   de um comandante) sai da mesa. Se era a vez dele, o relógio passa
   sozinho para o próximo; e a ordem das mortes vira a colocação, de trás
   para frente. Quem sobra vivo é o vencedor.

   A colocação é sugestão, não sentença: a tela deixa mudar antes de
   registrar, porque partida acaba por concessão, por acordo e por
   engano de contagem.
   ===================================================================== */
function conferirMortes(){
  vida.mortos = vida.mortos || [];
  let mudou = false;
  vida.jogadores.forEach(j => {
    const morto = estaMorto(j);
    const jaAnotado = vida.mortos.includes(j.id);
    if(morto && !jaAnotado){
      vida.mortos.push(j.id);
      mudou = true;
      /* o relógio dele para na hora; se era a vez dele, passa adiante */
      if(relogio.atual === j.id){
        const vivos = vida.jogadores.filter(x => !estaMorto(x));
        relFechar();
        if(vivos.length) relDarAVez(vivos[0].id);
      }
      relogio.parado = relogio.parado || {};
      relogio.parado[j.id] = true;
      toast(`${j.nome} saiu da partida`);
    }
    /* voltou a ter vida (erro de contagem acontece): volta para a mesa */
    if(!morto && jaAnotado){
      vida.mortos = vida.mortos.filter(x => x !== j.id);
      if(relogio.parado) delete relogio.parado[j.id];
      mudou = true;
    }
  });
  if(mudou) relPintar();
  return mudou;
}

/* colocação sugerida: quem sobrou vivo em 1º, e os mortos na ordem
   inversa da morte. Devolve [{ id, nome, lugar }] */
function colocacaoDaMesa(){
  const vivos = vida.jogadores.filter(j => !estaMorto(j));
  const mortos = (vida.mortos || [])
    .map(id => vida.jogadores.find(j => j.id === id))
    .filter(Boolean)
    .reverse();                       // o último a morrer fica na frente
  return [...vivos, ...mortos].map((j, i) => ({ id:j.id, nome:j.nome, lugar:i + 1 }));
}
function garantirJogadores(){
  if(!vida.jogadores.length){
    const g = grupoAtual();
    const nomes = (mesaView.dados && mesaView.dados.members || []).map(m => m.name);
    const base = nomes.length ? nomes.slice(0,6) : ["Você", "Oponente"];
    vida.jogadores = base.map(novoJogadorDeVida);
  }
}

function painelDeVida(j){
  const perigo = j.vida <= 5 || j.veneno >= 10 || Object.values(j.cmd).some(v => v >= 21);
  const morto = estaMorto(j);
  return `
  <div class="painel-vida ${morto?"morto":perigo?"perigo":""}" data-j="${j.id}">
    <div class="pv-nome" contenteditable="true" spellcheck="false">${escapeHTML(j.nome)}</div>
    <div class="pv-linha">
      <button class="pv-menos" data-d="-5">−5</button>
      <button class="pv-menos" data-d="-1">−1</button>
      <b class="pv-num">${j.vida}</b>
      <button class="pv-mais" data-d="1">+1</button>
      <button class="pv-mais" data-d="5">+5</button>
    </div>
    <div class="pv-extras">
      <button class="pv-chip pv-veneno" title="veneno">☠ ${j.veneno}</button>
      <button class="pv-chip pv-cmd" title="dano de comandante recebido">⚔ ${Object.values(j.cmd).reduce((a,b)=>a+b,0)}</button>
      <button class="pv-chip pv-fora" title="tirar da mesa">×</button>
    </div>
    ${morto ? `<span class="pv-morto">fora da partida</span>` : ""}
  </div>`;
}

function tempoDoCron(){
  return cron.acumulado + (cron.rodando ? (Date.now() - cron.inicio)/1000 : 0);
}
const tempoLongo = seg => {
  seg = Math.max(0, Math.floor(seg));
  const h = Math.floor(seg/3600), m = Math.floor((seg%3600)/60), s = seg%60;
  return `${h ? h+":" : ""}${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
};

function ligarFerramentas(){
  const grade = document.getElementById("vidas");
  if(grade){
    grade.querySelectorAll(".painel-vida").forEach(el => {
      const j = vida.jogadores.find(x => x.id === el.dataset.j);
      if(!j) return;
      el.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
        j.vida += Number(b.dataset.d);
        repintarVidas();
      });
      const nome = el.querySelector(".pv-nome");
      nome.onblur = () => { const t = nome.textContent.trim(); if(t) j.nome = t; else nome.textContent = j.nome; };
      nome.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); nome.blur(); } };
      el.querySelector(".pv-veneno").onclick = () => { j.veneno = (j.veneno + 1) % 11; repintarVidas(); };
      el.querySelector(".pv-fora").onclick = () => {
        vida.jogadores = vida.jogadores.filter(x => x.id !== j.id); repintarVidas();
      };
      el.querySelector(".pv-cmd").onclick = () => abrirDanoDeComandante(j);
    });
  }

  const fmt = document.getElementById("vida-formato");
  if(fmt) fmt.onchange = () => {
    vida.formato = fmt.value;
    vida.jogadores.forEach(j => { j.vida = vidaInicial(); j.veneno = 0; j.cmd = {}; });
    repintarVidas();
  };
  const add = document.getElementById("vida-add");
  if(add) add.onclick = () => {
    vida.jogadores.push(novoJogadorDeVida("Jogador " + (vida.jogadores.length + 1)));
    repintarVidas();
  };
  const zerar = document.getElementById("vida-zerar");
  if(zerar) zerar.onclick = () => {
    vida.jogadores.forEach(j => { j.vida = vidaInicial(); j.veneno = 0; j.cmd = {}; });
    repintarVidas();
  };

  const bt = document.getElementById("cron-toggle");
  if(bt) bt.onclick = () => {
    if(cron.rodando){
      cron.acumulado = tempoDoCron(); cron.rodando = false;
      clearInterval(cron.timer); cron.timer = null;
    } else {
      cron.inicio = Date.now(); cron.rodando = true;
      clearInterval(cron.timer);
      cron.timer = setInterval(() => {
        const el = document.getElementById("cronometro");
        if(!el || !el.isConnected){ clearInterval(cron.timer); cron.timer = null; return; }
        el.textContent = tempoLongo(tempoDoCron());
      }, 500);
    }
    bt.textContent = cron.rodando ? "Pausar" : "Continuar";
  };
  const cz = document.getElementById("cron-zerar");
  if(cz) cz.onclick = () => {
    cron.rodando = false; cron.acumulado = 0;
    clearInterval(cron.timer); cron.timer = null;
    const el = document.getElementById("cronometro");
    if(el) el.textContent = tempoLongo(0);
    const b = document.getElementById("cron-toggle");
    if(b) b.textContent = "Começar";
  };

  pintarResultado();
  const breg = document.getElementById("res-registrar");
  if(breg) breg.onclick = () => {
    const dados = mesaView.dados;
    if(!dados || !(dados.members || []).length)
      return toast("entre num grupo para registrar a partida no ranking");
    registrarPartida(dados, colocacaoDaMesa());
  };
  const grade2 = document.getElementById("resultado-mesa");
  if(grade2) grade2.onclick = e => {
    const b = e.target.closest("[data-venceu]");
    if(!b) return;
    /* marcar o vencedor na mão: os outros passam a ser "fora" na ordem
       em que já estavam, e quem estava vivo e não venceu vai para o fim */
    const id = b.dataset.venceu;
    const outros = vida.jogadores.filter(j => j.id !== id).map(j => j.id);
    const jaMortos = (vida.mortos || []).filter(x => outros.includes(x));
    const vivosPerdedores = outros.filter(x => !jaMortos.includes(x));
    vida.mortos = [...jaMortos, ...vivosPerdedores.reverse()];
    pintarResultado();
  };

  /* relógio dos jogadores */
  const modo = document.getElementById("rel-modo");
  if(modo) modo.onclick = e => {
    const b = e.target.closest("[data-modo]"); if(!b) return;
    relFechar();
    relogio.modo = b.dataset.modo;
    modo.querySelectorAll("[data-modo]").forEach(x => x.classList.toggle("on", x === b));
    const cfg = document.getElementById("rel-config");
    if(cfg) cfg.hidden = relogio.modo !== "baixo";
    relogio.estourou = {};
    relPintar();
  };
  const relMin = document.getElementById("rel-min");
  if(relMin) relMin.onchange = () => {
    relogio.inicialMin = Math.max(1, Number(relMin.value) || 25);
    relogio.estourou = {}; relPintar();
  };
  const relInc = document.getElementById("rel-inc");
  if(relInc) relInc.onchange = () => {
    relogio.incremento = Math.max(0, Number(relInc.value) || 0);
  };
  const relProx = document.getElementById("rel-proximo");
  if(relProx) relProx.onclick = relProximo;
  const relPausa = document.getElementById("rel-pausar");
  if(relPausa) relPausa.onclick = () => { relFechar(); relPintar(); };
  const relZero = document.getElementById("rel-zerar");
  if(relZero) relZero.onclick = relZerar;
  const relGrade = document.getElementById("relogio-grade");
  if(relGrade){
    relPintar();
    relGrade.onclick = e => {
      const b = e.target.closest("[data-rel]"); if(!b) return;
      relDarAVez(b.dataset.rel);
    };
  }

  const sortear = document.getElementById("sortear-ordem");
  if(sortear) sortear.onclick = () => {
    const nomes = vida.jogadores.map(j => j.nome);
    for(let i = nomes.length - 1; i > 0; i--){
      const k = Math.floor(Math.random() * (i+1));
      [nomes[i], nomes[k]] = [nomes[k], nomes[i]];
    }
    const alvo = document.getElementById("ordem-sorteada");
    if(alvo) alvo.innerHTML = nomes.length
      ? nomes.map((n,i) => `<span class="ordem-item ${i===0?"primeiro":""}"><b>${i+1}º</b>${escapeHTML(n)}</span>`).join("")
      : `<span class="status">ponha jogadores no contador de vida primeiro</span>`;
  };

  const dados = document.querySelector(".dados");
  if(dados) dados.onclick = e => {
    const b = e.target.closest("[data-dado],[data-moeda]"); if(!b) return;
    const alvo = document.getElementById("resultado-dado");
    if(b.dataset.moeda) alvo.textContent = Math.random() < 0.5 ? "cara" : "coroa";
    else {
      const n = Number(b.dataset.dado);
      alvo.textContent = `d${n}: ${1 + Math.floor(Math.random()*n)}`;
    }
  };
}

/* o quadro do resultado: colocação sugerida e o vencedor à mão */

  const alvo = document.getElementById("resultado-mesa");
  if(!alvo) return;
  const ordem = colocacaoDaMesa();
  const vivos = vida.jogadores.filter(j => !estaMorto(j)).length;
  if(!vida.jogadores.length){
    alvo.innerHTML = `<p class="dg-txt" style="margin:0">Ponha os jogadores no contador de vida —
      a colocação sai da ordem em que a mesa for caindo.</p>`;

  const acabou = vivos <= 1 && vida.jogadores.length > 1;
  alvo.innerHTML = `
    <div class="res-lista">
      ${ordem.map(x => {
        const j = vida.jogadores.find(y => y.id === x.id) || {};
        const fora = estaMorto(j);
        return `<div class="res-linha ${x.lugar === 1 ? "campeao" : ""} ${fora ? "fora" : ""}">
          <span class="res-lugar">${x.lugar}º</span>
          <span class="res-nome">${escapeHTML(x.nome)}</span>
          <span class="res-estado">${fora ? "fora da partida" : "ainda na mesa"}</span>
          ${x.lugar === 1 ? `<span class="res-selo">vencedor</span>`

        </div>`;
      }).join("")}
    </div>
    <p class="dg-txt">
      ${acabou
        ? `<b>Sobrou um: a partida acabou.</b> A colocação abaixo é a ordem inversa das mortes.`
        : `A colocação vai se escrevendo sozinha conforme a mesa cai: <b>o primeiro a morrer é o
           último colocado</b>. Se a partida acabar por concessão ou acordo, marque o vencedor na
           mão — o resto se ajeita.`}
      Registrar leva isto para o ranking do grupo, junto com o tempo e os decks.</p>`;

      j.cmd[de] = Math.max(0, (j.cmd[de] || 0) + n);
      if(n > 0) j.vida -= n; else j.vida -= n;   // dano de comandante também tira vida
      el.querySelector("b").textContent = j.cmd[de];

  });
}

function contaDaCopia(base, fator, cond, pago, vale){
  const partes = [];
  if(base){
    partes.push(fator === 1
      ? `Vale ${money(base)} — o preço de carta ${cond} do Scryfall.`
      : `Carta ${cond} vale por volta de <b>${Math.round(fator*100)}%</b> de uma perfeita: ${money(base)} → <b>${money(vale)}</b>.
         O desconto por desgaste é regra de bolso do mercado, não preço de fonte.`);
  }
  if(pago){
    const dif = vale - pago;
    partes.push(`Você pagou ${money(pago)} — ${dif >= 0
      ? `<b class="sobe">${money(dif)} acima</b>` : `<b class="desce">${money(-dif)} abaixo</b>`} do preço de hoje.`);
  }
  partes.push(`O preço é o da impressão em inglês; idioma fica registrado, mas não mexe na conta.`);
  return partes.join(" ");
}

function ligarMinhaCopia(c){
  const cond = document.getElementById("mc-cond");
  if(!cond) return;

  const caixa = document.querySelector(".minha-copia");
  const num = document.getElementById("mc-num");
  const mexer = n => {
    const nova = qtdDe(c.id) + n;
    if(nova <= 0){                    // zerar é o mesmo que não ter mais a carta
      definirQtd(c.id, 0); closeModal();
      if(view.name === "minha") renderMinha(); else render();
      return toast(`${c.name} saiu da sua coleção`);
    }
    definirQtd(c.id, nova);
    num.textContent = nova;
    caixa.querySelector(".flabel").textContent = nova > 1 ? "As suas cópias" : "A sua cópia";
  };
  caixa.querySelector(".mc-menos").onclick = () => mexer(-1);
  caixa.querySelector(".mc-mais").onclick  = () => mexer(1);
  const bs = document.getElementById("mc-slab");
  if(bs) bs.onclick = () => abrirSlab(c);
  const lang = document.getElementById("mc-lang");
  const pago = document.getElementById("mc-pago");
  const onde = document.getElementById("mc-onde");
  const conta = document.getElementById("mc-conta");

  const guardar = () => {
    const r = S.owned[c.id];
    if(!r) return;
    r.cond = cond.value;
    r.lang = lang.value;
    const p = parseFloat(pago.value);
    if(Number.isFinite(p) && p > 0){ r.pg = p; r.pgM = "USD"; }
    else { delete r.pg; delete r.pgM; }
    const l = (onde.value || "").trim().slice(0, 80);
    if(l) r.loc = l; else delete r.loc;
    save(); renderKPIs();
    const base = (r.fin === "foil" && r.usdF) ? r.usdF : (r.usd || 0);
    conta.innerHTML = contaDaCopia(base, fatorCondicao(r.cond), r.cond, Number(r.pg)||0, valorUnitario(c.id));
  };
  cond.onchange = guardar;
  lang.onchange = guardar;
  pago.onchange = guardar;
  pago.onblur = guardar;
  onde.onchange = guardar;
  onde.onblur = guardar;
}

  };

  carregarHistorico(c);
  carregarImpressoes(c);
}


/* ---------- produtos selados da edição, com a foto real da caixa ---------- */
let evUnitarioAtual = 0;
async function carregarProdutosDoSet(st, cartas, cfg){
  // se já existe uma lista na tela (troca rápida de edição), ela sai antes:
  // era isso que fazia a mesma caixa aparecer duas vezes
  document.querySelectorAll("#set-produtos").forEach(el => el.remove());

  const alvo = document.createElement("div");
  alvo.id = "set-produtos";
  alvo.innerHTML = `<div class="status">procurando os produtos lacrados desta edição…</div>`;
  const painel = document.getElementById("set-analise");
  if(painel && painel.parentNode) painel.parentNode.appendChild(alvo);

  const produtos = await carregarSelados(st.code);
  if(!alvo.isConnected) return;              // o usuário já foi para outra edição
  if(!produtos.length){
    alvo.innerHTML = `<div class="empty" style="margin-top:22px">
      Não achei produtos lacrados catalogados para esta edição.</div>`;
    return;
  }
  pintarProdutos(st, produtos, cartas, cfg);
  const ids = produtos.map(p => p.tcg).filter(Boolean);
  if(ids.length){
    const precos = await precosDeSelados(ids);
    if(alvo.isConnected && Object.keys(precos).length) pintarProdutos(st, produtos, cartas, cfg);
  }
}

/* ---------- preço de mercado dos lacrados ----------
   O Scryfall não tem preço de produto lacrado e o MTGJSON também não.
   O preço vem do nosso banco, alimentado uma vez por dia pelo job com os
   dados públicos do TCGplayer. Enquanto não houver dado, vale o preço que
   você digitar — que continua tendo precedência sobre o automático. */
const cachePrecoSelado = {};
async function precosDeSelados(tcgIds){
  const faltam = tcgIds.filter(id => cachePrecoSelado[id] === undefined);
  if(faltam.length){
    faltam.forEach(id => { cachePrecoSelado[id] = null; });   // não pergunta duas vezes
    try{
      const lista = await supa(
        `sealed_prices?tcg_id=in.(${faltam.join(",")})&select=tcg_id,market,day&order=day.desc`);
      (lista || []).forEach(l => {
        if(cachePrecoSelado[l.tcg_id] == null) cachePrecoSelado[l.tcg_id] = { valor:Number(l.market)||0, dia:l.day };
      });
    }catch(e){}
  }
  const fora = {};
  tcgIds.forEach(id => { if(cachePrecoSelado[id]) fora[id] = cachePrecoSelado[id]; });
  return fora;
}

/* Cada caixa tem o seu próprio tipo de booster: contar uma Collector Box
   com o EV do Play Booster dá número errado, que era o que acontecia. */
function modeloDoProduto(pr, cfg){
  const sub = String(pr.sub || "").toLowerCase();
  if(sub === "collector") return "colecionador";
  if(sub === "play") return "play";
  if(sub === "draft" || sub === "set") return "draft";
  return cfg.modelo;
}
function boostersDoProduto(pr){
  if(pr.tam > 0) return pr.tam;                       // o MTGJSON diz quantos vêm
  if(pr.cat === "booster_pack") return 1;
  if(pr.cat === "booster_box") return BOOSTERS_POR_CAIXA[pr.sub] || BOOSTERS_POR_CAIXA.default;
  return 0;
}

function pintarProdutos(st, produtos, cartas, cfg){
  const alvo = document.getElementById("set-produtos");
  if(!alvo) return;
  const precos = ((S.selados && S.selados[st.code]) || {}).produtos || {};
  const est = cartas.length ? estatisticasDoSet(cartas) : null;
  const r = regiao();

  alvo.dataset.pronto = "1";
  try{ alvo.dataset.lista = JSON.stringify(produtos); }catch(e){}

  /* o preço automático vem em dólar; a tela mostra na moeda da região */
  const emMoeda = usd => {
    if(r.moeda === "BRL" && CAMBIO && CAMBIO.usd) return usd * CAMBIO.usd;
    if(r.moeda === "EUR" && CAMBIO && CAMBIO.usd && CAMBIO.eur) return usd * (CAMBIO.usd / CAMBIO.eur);
    return usd;
  };
  /* lê sempre do estado, não de uma cópia: senão o preço recém-digitado
     não aparece na conta até repintar a página inteira */
  const precoManual = pr => {
    const atuais = ((S.selados && S.selados[st.code]) || {}).produtos || precos;
    for(const u of (pr.uuids || [pr.uuid])){ const v = Number(atuais[u]); if(v) return v; }
    return 0;
  };

  const ordem = { booster_box:0, booster_pack:1, bundle:2,
                  box_set:3, commander_deck:4, deck:5, prerelease_kit:6,
                  booster_case:15, bundle_case:16, case:17 };
  /* "Case" é a caixa de atacado que vem com seis displays dentro — quem
     coleciona não compra isso, e elas só enchiam a lista. Ficam escondidas,
     com um link para quem quiser ver. */
  const ehCase = pr => /_case$/.test(pr.cat || "") || pr.cat === "case" || /\bcases?\b/i.test(pr.nome || "");
  const cases = produtos.filter(ehCase);
  const mostrarCases = !!(S.config && S.config.mostrarCases);
  const lista = (mostrarCases ? produtos.slice() : produtos.filter(pr => !ehCase(pr)))
    .sort((a,b) => (ordem[a.cat] ?? 10) - (ordem[b.cat] ?? 10) || String(a.nome).localeCompare(String(b.nome)));

  const linhaProduto = pr => {
    const img = imagemProduto(pr.tcg);
    const auto = pr.tcg && cachePrecoSelado[pr.tcg] ? emMoeda(cachePrecoSelado[pr.tcg].valor) : 0;
    const manual = precoManual(pr);
    const preco = manual || auto;
    const boosters = boostersDoProduto(pr);
    const modelo = modeloDoProduto(pr, cfg);
    const ev = boosters && est ? evComModelo(est, cfg, modelo, "mediana") * boosters : 0;
    const rel = ev && preco ? ev / preco : null;
    const cor = rel === null ? "" : rel >= 1 ? "acima" : rel >= 0.75 ? "perto" : "abaixo";
    const rotuloModelo = boosters > 1 && MODELOS_BOOSTER[modelo] ? MODELOS_BOOSTER[modelo].rotulo : "";
    return `
    <div class="produto" data-uuid="${escapeHTML(pr.uuid)}">
      <div class="produto-foto">
        ${img ? `<img src="${escapeHTML(img)}" alt="${escapeHTML(pr.nome)}" loading="lazy"
                   onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sem-foto',textContent:'sem foto'}))">`
              : `<span class="sem-foto">sem foto</span>`}
      </div>
      <div class="produto-info">
        <b>${escapeHTML(pr.nome)}</b>

                  : "Ainda não tenho preço de mercado destes produtos — ponha o que você vê na loja."}
        O que você digitar vale mais que o automático, e a % compara o preço com o valor das cartas de dentro.

      </div>

  const btnCases = document.getElementById("ver-cases");
  if(btnCases) btnCases.onclick = () => {
    S.config.mostrarCases = !mostrarCases; save();
    pintarProdutos(st, produtos, cartas, cfg);
  };

  /* Repintar a lista inteira a cada tecla tirava o foco do campo no meio do
     número. Agora só a linha mexida é refeita. */
  const guardar = el => {
    const uuid = el.dataset.preco;
    S.selados = S.selados || {};
    S.selados[st.code] = S.selados[st.code] || {};
    S.selados[st.code].produtos = S.selados[st.code].produtos || {};
    S.selados[st.code].produtos[uuid] = Number(el.value) || 0;
    save();
    const pr = lista.find(p => p.uuid === uuid);
    const linha = el.closest(".produto");
    if(!pr || !linha) return;
    const novo = document.createElement("div");
    novo.innerHTML = linhaProduto(pr);
    const rel = novo.querySelector(".produto-rel"), evTxt = novo.querySelector(".produto-ev");
    const relAtual = linha.querySelector(".produto-rel"), evAtual = linha.querySelector(".produto-ev");
    if(rel && relAtual){ relAtual.className = rel.className; relAtual.textContent = rel.textContent; }
    if(evTxt && evAtual) evAtual.textContent = evTxt.textContent;
  };
  const temporizadores = new WeakMap();
  alvo.querySelectorAll("[data-preco]").forEach(el => {
    el.oninput = () => {
      clearTimeout(temporizadores.get(el));
      temporizadores.set(el, setTimeout(() => guardar(el), 500));
    };
    el.onchange = () => { clearTimeout(temporizadores.get(el)); guardar(el); };
  });
}

/* ---------- histórico de preço: vem do banco, arquivado todo dia ---------- */
async function carregarHistorico(c){
  const alvo = document.getElementById("grafico");
  if(!alvo) return;
  try{
    const linhas = await supa(`price_history?card_id=eq.${encodeURIComponent(c.id)}&select=day,usd,usd_foil&order=day.asc&limit=400`);
    if(!alvo.isConnected) return;
    const pontos = linhas.map(l => ({ dia:l.day, v:Number(l.usd || l.usd_foil) })).filter(x => x.v > 0);

    if(pontos.length === 0){
      alvo.innerHTML = `<span class="carregando">esta carta ainda não entrou no arquivo diário</span>`;
      return;
    }
    if(pontos.length === 1){
      alvo.innerHTML = `<span class="carregando">arquivando desde ${pontos[0].dia} — o gráfico ganha forma nos próximos dias</span>`;
      return;
    }
    const primeiro = pontos[0].v, ultimo = pontos[pontos.length-1].v;
    const varia = ((ultimo/primeiro) - 1) * 100;
    alvo.innerHTML = `
      <div class="grafico-topo">
        <span>${pontos.length} dias</span>
        <b class="${varia >= 0 ? "sobe" : "desce"}">${varia >= 0 ? "▲" : "▼"} ${Math.abs(varia).toFixed(1)}%</b>
      </div>
      ${sparkline(pontos)}`;
  }catch(e){
    if(alvo.isConnected) alvo.innerHTML = `<span class="carregando">histórico indisponível agora</span>`;
  }
}

function sparkline(pontos){
  const L = 260, A = 54, pad = 3;
  const vs = pontos.map(p => p.v);
  const min = Math.min(...vs), max = Math.max(...vs), amp = (max - min) || 1;
  const x = i => pad + (i / (pontos.length - 1)) * (L - pad*2);
  const y = v => A - pad - ((v - min) / amp) * (A - pad*2);
  const linha = pontos.map((p,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area = `${linha} L${x(pontos.length-1).toFixed(1)},${A} L${x(0).toFixed(1)},${A} Z`;
  const fim = pontos[pontos.length-1];
  return `<svg viewBox="0 0 ${L} ${A}" class="spark" role="img"
      aria-label="variação de preço de ${pontos[0].dia} a ${fim.dia}">
    <path d="${area}" fill="var(--gold-dim)" opacity=".18"></path>
    <path d="${linha}" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linejoin="round"></path>
    <circle cx="${x(pontos.length-1).toFixed(1)}" cy="${y(fim.v).toFixed(1)}" r="2.6" fill="var(--gold)"></circle>
  </svg>`;
}

/* ---------- todas as impressões da mesma carta ---------- */
/* Símbolo oficial da edição a partir do código. O normalize() guarda o
   código em maiúsculo e o Scryfall entrega minúsculo — daí o toLowerCase. */
function simboloDoSet(code, alt){
  const st = (SETS || []).find(x => x.code === String(code || "").toLowerCase());
  return st && st.icone
    ? `<img class="set-simbolo" src="${st.icone}" alt="${escapeHTML(alt || code || "")}" loading="lazy">`
    : `<span class="set-simbolo vazio">${escapeHTML(String(code || "").toUpperCase())}</span>`;
}

async function carregarImpressoes(c){
  const alvo = document.getElementById("impressoes");
  if(!alvo) return;
  carregarSets().then(() => {          // sem os sets não há símbolo para desenhar
    if(alvo.isConnected && alvo.dataset.semSimbolo) carregarImpressoes(c);
  }).catch(()=>{});
  try{
    const url = c.impressoesUri
      || `${API}/cards/search?q=${encodeURIComponent(`!"${c.name}"`)}&unique=prints&order=released&dir=asc`;
    const r = await fetch(url, { headers:{Accept:"application/json"} });
    if(!r.ok) throw new Error("busca falhou");
    const j = await r.json();
    if(!alvo.isConnected) return;
    const versoes = (j.data||[]).map(normalize);
    if(versoes.length <= 1){
      alvo.innerHTML = `<span class="flabel">Todas as impressões</span>
        <div class="carregando">esta carta só foi impressa uma vez</div>`;
      return;
    }
    const tenho = versoes.filter(v => isOwned(v.id)).length;

    /* Impressões que repetem a mesma ilustração ficam num bloco só: a arte
       aparece uma vez e as edições que a usam ficam listadas embaixo. */
    const mapa = new Map();
    versoes.forEach(v => {
      const chave = v.arte || (v.name + "|" + v.artist);
      if(!mapa.has(chave)) mapa.set(chave, []);
      mapa.get(chave).push(v);
    });
    const artes = [...mapa.values()];

    alvo.innerHTML = `
      <span class="flabel">Todas as impressões — ${versoes.length} em ${artes.length} ${artes.length>1?"artes":"arte"}${tenho?` · você tem ${tenho}`:""}</span>
      <div class="impr-tira">
        ${artes.map(g => {
          const capa = g.find(v => v.id === c.id) || g.find(v => isOwned(v.id)) || g[0];
          const aqui = g.some(v => v.id === c.id), meu = g.some(v => isOwned(v.id));
          return `
          <div class="impr-grupo ${aqui?"atual":""} ${meu?"tenho":""}">
            ${capa.small ? `<img class="impr-arte" loading="lazy" src="${capa.small}" alt="${escapeHTML(capa.name)}">`
                         : `<div class="impr-arte sem-arte">${escapeHTML(capa.name)}</div>`}
            <span class="impr-artista">${escapeHTML(capa.artist || "")}${g.length>1?` · ${g.length} edições`:""}</span>
            <div class="impr-eds">
              ${g.map(v => `
                <button class="impr ${isOwned(v.id)?"owned":""} ${v.id===c.id?"atual":""}" data-id="${v.id}"
                        title="${escapeHTML(v.setName||"")} (${escapeHTML((v.set||"").toUpperCase())}) · #${escapeHTML(v.num||"")}${
                          rotuloVariante(v) ? " · " + escapeHTML(rotuloVariante(v)) : ""} · ${v.released||""}">
                  <span class="impr-set">${simboloDoSet(v.set, v.setName)}</span>
                  <span class="impr-ano">${(v.released||"").slice(0,4)}</span>
                  ${rotuloVariante(v) ? `<span class="impr-var">${escapeHTML(rotuloVariante(v))}</span>` : ""}
                  ${precoLocal(v)?`<span class="impr-preco">${formatarPreco(precoLocal(v))}</span>`:""}
                </button>`).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
      <p class="impr-dica">Cada bloco é uma ilustração. Clique numa edição para ver os detalhes dela — preço e raridade mudam de uma para outra.</p>`;
    // se os símbolos ainda não tinham chegado, repinta quando chegarem
    if(alvo.querySelector(".set-simbolo.vazio")) alvo.dataset.semSimbolo = "1";
    else delete alvo.dataset.semSimbolo;
    alvo.querySelectorAll(".impr").forEach(el => {
      el.onclick = () => {
        const v = versoes.find(x => x.id === el.dataset.id);
        if(v) openCard(v);
      };
    });
  }catch(e){
    if(alvo.isConnected) alvo.innerHTML = `<span class="flabel">Todas as impressões</span>
      <div class="carregando">não consegui buscar agora</div>`;
  }
}

function tituloDaFrase(f){
  const t = f.trim().replace(/\s+/g, " ");
  if(!t) return "";
  return t.charAt(0).toUpperCase() + t.slice(1, 60);
}

function lerFrase(){
  const { partes, duvidas } = interpretar(criar.frase);
  // aplica as respostas que o usuário já deu
  const pendentes = [];
  duvidas.forEach(d => {
    const escolhidas = criar.respostas[d.id];
    if(escolhidas === undefined){ pendentes.push(d); return; }
    (escolhidas || []).forEach(parte => partes.push(parte));
  });
  criar.partes = partes.filter(p => !criar.removidas.includes(p.id));
  criar.duvidas = pendentes;

  /* O que fica de fora usa o mesmo interpretador. A diferença é que aqui
     não vale a pena perguntar: se eu não entendi um pedaço da exclusão, é
     mais honesto dizer "não entendi isto" do que abrir outra rodada de
     perguntas no meio da tela. */
  const leituraFora = interpretar(criar.fraseFora || "");
  criar.partesFora = leituraFora.partes;
  criar.naoEntendiFora = leituraFora.duvidas.map(d => d.pergunta);

  criar.q = queryComExclusoes(criar.partes, criar.partesFora);
  const campo = document.getElementById("c-q");
  if(campo) campo.value = criar.q;
  pintarLeitura();
  if(partes.length && !pendentes.length) contarPreview(criar.q);
}

function pintarLeitura(){
  const alvo = document.getElementById("c-leitura");
  if(!alvo) return;
  if(!criar.frase.trim()){ alvo.innerHTML = ""; return; }

  const chips = criar.partes.length
    ? `<div class="entendi">
         <span class="flabel">Entendi — clique no × para tirar</span>
         <div class="chips-lidos">${criar.partes.map(p => `
           <span class="lido">${escapeHTML(p.rotulo)}
             <button class="tirar-lido" data-tirar="${escapeHTML(p.id)}" title="tirar da coleção">×</button>
           </span>`).join("")}
           ${criar.removidas.length ? `<button class="restaurar" id="restaurar-partes">restaurar ${criar.removidas.length}</button>` : ""}
         </div>
       </div>`
    : (criar.duvidas.length ? ""
        : `<div class="entendi"><span class="carregando">ainda não reconheci nada — tente citar cor, tipo, ano, edição ou raridade</span></div>`);

  const forasHTML = (criar.partesFora.length || criar.naoEntendiFora.length)
    ? `<div class="entendi fora">
         <span class="flabel">Fica de fora</span>
         <div class="chips-lidos">
           ${criar.partesFora.map(p => `<span class="lido fora">− ${escapeHTML(p.rotulo)}</span>`).join("")}
           ${criar.naoEntendiFora.length
             ? `<span class="lido nao-entendi" title="reescreva citando cor, tipo, ano, edição ou raridade">não entendi um pedaço</span>` : ""}
         </div>
       </div>` : "";

  const perguntas = criar.duvidas.map(d => {
    const marcadas = criar.rascunho && criar.rascunho[d.id] ? criar.rascunho[d.id] : [];
    return `
    <div class="pergunta" data-id="${escapeHTML(d.id)}">
      <p>${escapeHTML(d.pergunta)}</p>
      <span class="pergunta-dica">dá para marcar mais de uma</span>
      <div class="opcoes">
        ${d.opcoes.map((o,i) => `<button class="op ${marcadas.includes(i)?"on":""}" data-op="${i}">${escapeHTML(o.rotulo)}</button>`).join("")}
      </div>
      <div class="pergunta-acoes">
        <button class="btn" data-confirmar="1"${marcadas.length?"":" disabled"}>
          ${marcadas.length > 1 ? `Usar as ${marcadas.length}` : "Confirmar"}</button>
        <button class="btn ghost" data-ignorar="1">Ignorar isso</button>
      </div>
    </div>`;
  }).join("");

  alvo.innerHTML = chips + forasHTML + perguntas + `<div class="preview-contagem" id="c-contagem"></div>`;

  alvo.querySelectorAll(".pergunta").forEach(el => {
    el.onclick = e => {
      const d = criar.duvidas.find(x => x.id === el.dataset.id);
      if(!d) return;
      criar.rascunho = criar.rascunho || {};

      const op = e.target.closest("[data-op]");
      if(op){
        const i = Number(op.dataset.op);
        const atual = criar.rascunho[d.id] || [];
        criar.rascunho[d.id] = atual.includes(i) ? atual.filter(x => x !== i) : atual.concat(i);
        pintarLeitura();
        return;
      }
      if(e.target.closest("[data-confirmar]")){
        const marcadas = criar.rascunho[d.id] || [];
        if(!marcadas.length) return;
        const partes = marcadas.map(i => d.opcoes[i].parte).filter(Boolean);
        criar.respostas[d.id] = partes.length > 1 ? [combinarPartes(partes)] : partes;
        delete criar.rascunho[d.id];
        lerFrase();
        return;
      }
      if(e.target.closest("[data-ignorar]")){
        criar.respostas[d.id] = [];
        delete criar.rascunho[d.id];
        lerFrase();
      }
    };
  });

  alvo.querySelectorAll("[data-tirar]").forEach(el => {
    el.onclick = () => {
      const alvoId = el.dataset.tirar;
      // se veio de uma pergunta respondida, a pergunta volta a ser feita
      const daPergunta = Object.keys(criar.respostas).find(k =>
        (criar.respostas[k] || []).some(p => p.id === alvoId));
      if(daPergunta) delete criar.respostas[daPergunta];
      else criar.removidas.push(alvoId);
      lerFrase();
    };
  });
  const restaurar = document.getElementById("restaurar-partes");
  if(restaurar) restaurar.onclick = () => { criar.removidas = []; lerFrase(); };
}

async function contarPreview(q){
  const alvo = document.getElementById("c-contagem");
  if(!alvo) return;
  alvo.textContent = "contando…";
  try{
    const json = await scryPage(q, "cards", "name", 1);
    if(!alvo.isConnected) return;

  if(tipo === "query" && criar.duvidas.length) return toast("Responda a pergunta acima primeiro");

  const icone = document.getElementById("c-icon").value.trim() || "⭐";
  const desc = document.getElementById("c-desc").value.trim();

  if(criar.editando){
    const col = customById(criar.editando.id);
    if(!col) return toast("coleção não encontrada");
    registrarDesfazer(`editar ${col.name}`, { custom: JSON.parse(JSON.stringify(S.custom)) });
    Object.assign(col, { name:nome, icon:icone, desc:desc || criar.frase.trim(),
                         frase:criar.frase.trim(), fraseFora:criar.fraseFora.trim(),

                         unique: document.getElementById("c-unique").value });

/* =====================================================================
   Backup

   Tudo mora no navegador, e navegador esquece: o Safari apaga dados de
   site que passa semanas sem uso, e o app instalado na tela de início
   guarda em outro lugar que o Safari. Por isso o backup leva TUDO — não
   só as cartas — e existe em duas formas: arquivo, para guardar, e
   código, para colar de um aparelho no outro.
   ===================================================================== */

/* as chaves que compõem o seu estado; qualquer coisa nova entra aqui */
const CHAVES_BACKUP = ["owned","custom","totals","exclusoes","inclusoes","uniques",
                       "selados","capas","decks","chase","mesa","config"];

function pacoteDeBackup(){
  const fora = { app:"collector-backup", versao:2, em:new Date().toISOString() };
  CHAVES_BACKUP.forEach(k => { if(S[k] !== undefined) fora[k] = S[k]; });
  return fora;
}

function tamanhoDoBackup(){
  try{ return (JSON.stringify(pacoteDeBackup()).length / 1024).toFixed(0) + " KB"; }
  catch(e){ return "?"; }
}

/* Junta o que veio com o que já existe, sem apagar nada seu. Em caso de
   conflito na mesma carta, fica a que já estava aqui. */
function restaurarBackup(obj){
  if(!obj || typeof obj !== "object") return "Formato não reconhecido";

  // código de uma coleção só (o "compartilhar" antigo) continua funcionando
  if(obj.app === "collector" && obj.cards){
    obj.id = "c" + Date.now().toString(36); obj.createdAt = Date.now();
    S.custom.push(obj); save();
    return null;
  }
  if(!obj.owned && !obj.decks && !obj.custom) return "Formato não reconhecido";

  S.owned   = Object.assign({}, obj.owned || {}, S.owned || {});
  S.totals  = Object.assign({}, obj.totals || {}, S.totals || {});
  S.uniques = Object.assign({}, obj.uniques || {}, S.uniques || {});
  S.capas   = Object.assign({}, obj.capas || {}, S.capas || {});
  S.selados = Object.assign({}, obj.selados || {}, S.selados || {});
  S.config  = Object.assign({}, obj.config || {}, S.config || {});

  ["exclusoes","inclusoes"].forEach(k => {
    S[k] = S[k] || {};
    Object.entries(obj[k] || {}).forEach(([col, lista]) => {
      const atual = S[k][col] || [];
      const idsAtuais = new Set(atual.map(x => (x && x.id) || x));
      S[k][col] = atual.concat((lista || []).filter(x => !idsAtuais.has((x && x.id) || x)));
    });
  });

  // listas: entra o que ainda não existe, comparando por id
  const juntarPorId = (minha, deles) => {
    const ids = new Set((minha || []).map(x => x.id));
    return (minha || []).concat((deles || []).filter(x => x && !ids.has(x.id)));
  };
  S.custom = juntarPorId(S.custom, obj.custom);
  S.decks  = juntarPorId(S.decks,  obj.decks);

  if(obj.chase){
    S.chase = S.chase || { grupos:[], cartas:[] };
    S.chase.grupos = juntarPorId(S.chase.grupos, obj.chase.grupos);
    S.chase.cartas = juntarPorId(S.chase.cartas, obj.chase.cartas);
  }
  if(obj.mesa){
    S.mesa = S.mesa || { eu:"", grupos:[], atual:null };
    S.mesa.eu = S.mesa.eu || obj.mesa.eu || "";
    const codigos = new Set((S.mesa.grupos || []).map(g => g.code));
    S.mesa.grupos = (S.mesa.grupos || []).concat((obj.mesa.grupos || []).filter(g => !codigos.has(g.code)));
    S.mesa.atual = S.mesa.atual || obj.mesa.atual;
  }
  save();
  return null;
}

/* =====================================================================
   REPETIDAS E TROCA

   A quantidade já estava implementada, e ela responde sozinha quem é
   candidata a troca: tudo com mais de uma cópia. A primeira fica com
   você; da segunda em diante é sobra.

   Quem não quer trocar uma repetida marca e ela sai da lista — porque
   ter quatro Llanowar Elves de propósito num deck não é ter três sobrando.
   ===================================================================== */
function repetidas(){
  return Object.entries(S.owned)
    .map(([id, r]) => ({ id, r, qtd: qtdDe(id), sobra: qtdDe(id) - 1 }))
    .filter(x => x.sobra > 0 && !x.r.naoTroco)
    .map(x => Object.assign(x, { unidade: valorUnitario(x.id) }))
    .sort((a, b) => (b.unidade * b.sobra) - (a.unidade * a.sobra));
}
const guardadasSemTroca = () =>
  Object.entries(S.owned).filter(([id, r]) => r.naoTroco && qtdDe(id) > 1).length;

/* =====================================================================
   CRUZAMENTO DE TROCAS

   O mercado (anúncios) já dizia quem TEM. Faltava quem QUER — e sem os
   dois lados, achar uma troca dependia de duas pessoas abrirem a lista
   uma da outra no mesmo dia.

   Cada pessoa publica UM cartão com as duas listas: as repetidas (o que
   sobra) e os chase cards (o que procura). O cruzamento é feito aqui, no
   aparelho, comparando por NOME — troca de Magic é "você tem essa
   carta?", não "você tem essa impressão?"; recusar por edição diferente
   esconderia a troca que interessa. A edição de cada carta aparece na
   lista para você julgar antes de combinar.

   O que a tela mostra são as DUAS direções separadas, sem inventar um
   "casamento perfeito": quantas cartas suas ele procura, e quantas dele
   você procura. Quem decide se a troca é justa são as duas pessoas.
   ===================================================================== */
let trocas = { lista:null, carregando:false, erro:"", meu:null };

async function carregarTrocas(){
  if(trocas.carregando) return;
  trocas.carregando = true;
  try{
    trocas.lista = await supa("trade_posts?select=owner,apelido,cidade,obs,tenho,quero,"
      + "n_tenho,n_quero,updated_at&order=updated_at.desc&limit=200");
    trocas.meu = logado() ? (trocas.lista || []).find(x => x.owner === SESSAO.user_id) || null : null;
    trocas.erro = "";
  }catch(e){ trocas.erro = e.message; }
  trocas.carregando = false;
  if(view.name === "trocas") renderTrocas();
}

/* o que eu levaria para uma troca, e o que eu procuro — do jeito que vai
   para o servidor: nome, edição e imagem, nada de quantidade paga nem de
   onde a carta está guardada */
function minhasParaTroca(){
  return repetidas().slice(0, 400).map(x => ({
    id:x.id, n:x.r.n || "", s:x.r.s || "", sn:x.r.sn || "", img:x.r.img || "",
    q:x.sobra, cond:condDe(x.r),
  }));
}
function meusProcurados(){
  return ((chase() || {}).cartas || []).slice(0, 400).map(x => ({
    id:x.id, n:x.n || "", img:x.img || "",
  }));
}

/* cruza a minha lista com a de cada pessoa. A comparação é por nome, sem
   acento e sem caixa — o mesmo critério dos dois lados. */
function cruzarTrocas(){
  const eu = logado() ? SESSAO.user_id : null;
  const tenho = new Map(minhasParaTroca().map(c => [semAcento(c.n), c]));
  const quero = new Map(meusProcurados().map(c => [semAcento(c.n), c]));

  return (trocas.lista || [])
    .filter(p => p.owner !== eu)
    .map(p => {
      const dele = (p.tenho || []), procura = (p.quero || []);
      const euTenhoQueEleQuer = procura
        .map(c => tenho.get(semAcento(c.n || "")))
        .filter(Boolean);
      const eleTemQueEuQuero = dele
        .filter(c => quero.has(semAcento(c.n || "")));
      return { pessoa:p, dou:euTenhoQueEleQuer, recebo:eleTemQueEuQuero,
               casadas: Math.min(euTenhoQueEleQuer.length, eleTemQueEuQuero.length),
               total: euTenhoQueEleQuer.length + eleTemQueEuQuero.length };
    })
    .sort((a, b) => b.casadas - a.casadas || b.total - a.total);
}

        <span style="color:var(--faint);font-size:12.5px">Pode ser o primeiro.</span></div>`

/* =====================================================================
   CARTÃO PARA POSTAR

   Uma imagem quadrada com o melhor da coleção, feita aqui mesmo no

   ===================================================================== */
async function abrirCartaoDaColecao(){

function carregarImagem(src){
  return new Promise(res => {
    if(!src) return res(null);
    const img = new Image();
    img.crossOrigin = "anonymous";      // sem isto o canvas fica sujo e não dá para salvar
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
}

/* desenha uma imagem preenchendo o retângulo, cortando o excesso */
function cobrir(g, img, x, y, l, a){
  const e = Math.max(l / img.width, a / img.height);
  g.drawImage(img, x + (l - img.width*e)/2, y + (a - img.height*e)/2, img.width*e, img.height*e);
}
function caixaRedonda(g, x, y, l, a, r){
  if(g.roundRect){ g.beginPath(); g.roundRect(x, y, l, a, r); return; }
  g.beginPath(); g.rect(x, y, l, a);
}

async function desenharCartao(melhores, todas, formato){
  const L = 1080, A = formato === "story" ? 1920 : 1080;
  const cv = document.createElement("canvas");
  cv.width = L; cv.height = A;
  const g = cv.getContext("2d");

  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const fundo = css("--bg") || "#0C0A11";
  const ouro  = css("--accent") || "#D9A441";
  const texto = css("--text") || "#e8eaf0";
  const fraco = css("--text-3") || "#8a92a6";
  const claro = /^#(f|e|d)/i.test(fundo);            // tema claro? o véu muda de cor
  const veu = claro ? "255,255,255" : "12,10,17";

  const fonte = (t, peso, cor) => {
    g.font = `${peso} ${t}px -apple-system, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif`;
    g.fillStyle = cor;
  };

  g.fillStyle = fundo; g.fillRect(0, 0, L, A);

  const artes = await Promise.all(melhores.map(c => carregarImagem(c.arteCrop || c.small)));
  const comArte = artes.filter(Boolean);

  /* fundo: a arte da carta mais cara, ampliada e apagada atrás de tudo.
     Sem blur nativo em navegador antigo, o véu escuro sozinho já resolve. */
  if(comArte[0]){
    g.save();
    try{ g.filter = "blur(26px)"; }catch(e){}
    cobrir(g, comArte[0], -40, -40, L + 80, A + 80);
    g.restore();
    const grad = g.createLinearGradient(0, 0, 0, A);
    grad.addColorStop(0,   `rgba(${veu},.82)`);
    grad.addColorStop(.45, `rgba(${veu},.93)`);
    grad.addColorStop(1,   `rgba(${veu},.99)`);
    g.fillStyle = grad; g.fillRect(0, 0, L, A);
  }

  /* A conta de espaço é de baixo para cima: primeiro reservo rodapé, linha
     da carta mais cara e números; o que sobra é a altura da grade. Assim
     nada nunca escreve por cima de nada, em qualquer um dos dois formatos. */
  const margem = 64;
  const rodapeY = A - margem - 20;
  const maisValiosaY = rodapeY - 46;
  const numerosY = maisValiosaY - (formato === "story" ? 88 : 78);
  /* ------------------------------------------------ cabeçalho */
  /* a gema, desenhada na malha de 48 e escalada para a caixa pedida */
  const gema = (gx, gy, s, cor) => {
    const u = k => k * s / 48;
    g.save(); g.translate(gx, gy);
    g.beginPath();
    g.moveTo(u(13), u(11)); g.lineTo(u(35), u(11)); g.lineTo(u(44), u(21));
    g.lineTo(u(24), u(44)); g.lineTo(u(4), u(21)); g.closePath();
    g.fillStyle = cor; g.fill();
    g.strokeStyle = fundo; g.lineWidth = u(2); g.lineJoin = "round"; g.lineCap = "round";
    g.beginPath();
    g.moveTo(u(4), u(21));  g.lineTo(u(44), u(21));
    g.moveTo(u(13), u(11)); g.lineTo(u(13), u(21));
    g.moveTo(u(35), u(11)); g.lineTo(u(35), u(21));
    g.moveTo(u(13), u(21)); g.lineTo(u(24), u(44));
    g.moveTo(u(35), u(21)); g.lineTo(u(24), u(44));
    g.stroke();
    g.restore();
  };
  gema(margem, margem - 5, 45, ouro);
  const marcaX = margem + 60;
  fonte(26, 800, texto);
  g.textAlign = "left";
  g.letterSpacing = "6px";
  g.fillText("VELVO", marcaX, margem + 30);
  g.letterSpacing = "0px";
  fonte(19, 500, fraco);
  g.fillText("Coleção e Deck MTG", marcaX, margem + 62);

  /* ------------------------------------------------ grade de artes */
  const cols = 3, gap = 14;
  const lado = (L - margem*2 - gap*(cols-1)) / cols;
  const linhas = Math.min(3, Math.ceil(artes.length / cols)) || 1;
  const topoDaGrade = margem + (formato === "story" ? 180 : 132);
  const baseDaGrade = numerosY - 76;                           // 76 = respiro acima dos números
  const espacoDaGrade = baseDaGrade - topoDaGrade;
  const alt = Math.max(60, Math.min(lado * 0.74, (espacoDaGrade - gap*(linhas-1)) / linhas));
  const alturaDaGrade = linhas * alt + gap * (linhas - 1);
  // no story sobra muito espaço: a grade fica centrada em vez de encostada no topo
  const gradeY = topoDaGrade + Math.max(0, (espacoDaGrade - alturaDaGrade) / 2);

  artes.forEach((img, i) => {
    if(i >= cols*linhas) return;
    const x = margem + (i % cols) * (lado + gap);
    const y = gradeY + Math.floor(i / cols) * (alt + gap);
    g.save();
    caixaRedonda(g, x, y, lado, alt, 12);
    g.clip();
    if(img) cobrir(g, img, x, y, lado, alt);
    else { g.fillStyle = claro ? "#EDE9F4" : "#201B2C"; g.fillRect(x, y, lado, alt); }
    g.restore();
    g.strokeStyle = `rgba(${claro ? "0,0,0" : "255,255,255"},.10)`;
    g.lineWidth = 1.5;
    caixaRedonda(g, x + .75, y + .75, lado - 1.5, alt - 1.5, 12);
    g.stroke();
  });



  /* ------------------------------------------------ números */
  const edicoes = new Set(todas.map(c => c.set).filter(Boolean)).size;
  const blocos = [
    [ownedCount().toLocaleString("pt-BR"), "cartas", texto],
    [money(ownedValue()),                  "valor estimado", ouro],
    [String(edicoes),                      edicoes === 1 ? "edição" : "edições", texto],
  ];
  const baseY = numerosY;

  g.textAlign = "center";
  const larguraBloco = (L - margem*2) / blocos.length;
  blocos.forEach(([valor, rotulo, cor], i) => {
    const cx = margem + larguraBloco * (i + .5);
    fonte(formato === "story" ? 62 : 52, 700, cor);
    g.fillText(valor, cx, baseY);
    fonte(18, 500, fraco);
    g.letterSpacing = "1.5px";
    g.fillText(rotulo.toUpperCase(), cx, baseY + 32);
    g.letterSpacing = "0px";
    if(i < blocos.length - 1){
      g.strokeStyle = `rgba(${claro ? "0,0,0" : "255,255,255"},.10)`;
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(margem + larguraBloco*(i+1), baseY - 44);
      g.lineTo(margem + larguraBloco*(i+1), baseY + 28);
      g.stroke();
    }
  });

  /* ------------------------------------------------ a mais cara, com nome */
  if(melhores[0]){
    fonte(19, 500, fraco);
    g.textAlign = "center";
    const linha = `a mais valiosa: ${melhores[0].name} · ${money(melhores[0].unit || 0)}`;
    g.fillText(linha.length > 58 ? linha.slice(0, 57) + "…" : linha, L/2, maisValiosaY);
  }

  /* ------------------------------------------------ rodapé */
  fonte(16, 500, fraco);
  g.textAlign = "center";
  g.fillText(new Date().toLocaleDateString("pt-BR", { day:"2-digit", month:"long", year:"numeric" }),
             L/2, rodapeY);

  /* aviso da Fan Content Policy: esta peca publica arte da Wizards fora do app */
  g.font = '14px "IBM Plex Mono", ui-monospace, Menlo, monospace';
  g.fillStyle = fraco;
  g.textAlign = "center";
  g.fillText("Velvo is unofficial Fan Content permitted under the Fan Content Policy. Not approved/endorsed by Wizards.",
             L/2, rodapeY + 26);
  g.fillText("Portions of the materials used are property of Wizards of the Coast. ©Wizards of the Coast LLC.",
             L/2, rodapeY + 43);

  /* moldura fina */
  g.strokeStyle = ouro; g.globalAlpha = .28; g.lineWidth = 2;
  caixaRedonda(g, 26, 26, L - 52, A - 52, 18); g.stroke();
  g.globalAlpha = 1;

  return cv.toDataURL("image/png");
}

/* =====================================================================
   O QUE MUDOU DESDE A ÚLTIMA VEZ

   Um sino que não inventa: ele compara o que existe agora com a hora em
   que você fechou o app da última vez. Enquanto não houver servidor de
   envio, é isto que dá para prometer — e é honesto, porque só fala de
   coisa que já aconteceu.
   ===================================================================== */
let avisos_ = { movers:null, carregando:false };

function vistoEm(){ return Number((S.config || {}).visto) || 0; }

/* "já vi" zera de verdade: a hora avança, as variações de preço que eu
   acabei de mostrar saem da conta, e os chase cards que chegaram no alvo
   ficam marcados como avisados — senão o sino ficaria aceso para sempre
   por causa de uma carta que continua no preço. */
function marcarVisto(){
  S.config.visto = Date.now();
  S.config.avisosVistos = chaseNoAlvo().map(x => x.id);
  avisos_.movers = [];
  save();
}

async function carregarAvisos(){
  if(avisos_.carregando || avisos_.movers) return;
  const itens = itensDaColecao();
  if(!itens.length) return;
  avisos_.carregando = true;
  try{
    const dias = Math.max(1, Math.min(30, Math.ceil((Date.now() - (vistoEm() || Date.now())) / 86400000)));
    avisos_.movers = await rpc("collection_movers", { p_itens: itens, p_dias: dias, p_limite: 4 }) || [];
  }catch(e){ avisos_.movers = []; }
  avisos_.carregando = false;
  if(view.name === "home") pintarSino();
}

/* chase card que chegou no preço que você queria */
function chaseNoAlvo(){
  const jaAvisados = (S.config || {}).avisosVistos || [];
  return ((S.chase || {}).cartas || []).filter(x => {
    const alvo = Number(x.alvo) || 0;
    if(!alvo || jaAvisados.includes(x.id)) return false;
    const p = precoLocal(deckParaCarta(x));
    return p && p.valor > 0 && p.valor <= alvo;
  });
}

/* =====================================================================
   REIMPRESSÃO DE CARTA SUA

   É o único aviso do app que chega ANTES do preço se mexer: reimpressão
   anunciada hoje derruba a cópia antiga nas semanas seguintes. Todo o
   resto que o app avisa — movers, alvo de preço — só existe depois que o
   mercado já se mexeu.

   O robô acha as reimpressões no bulk do Scryfall e grava em `reprints`.
   Aqui o cruzamento é POR NOME: em Magic o nome identifica a carta, e o
   que interessa é "reimprimiram uma carta que eu tenho", não "essa
   impressão específica". A tela mostra qual das suas cópias é a antiga.

   O que o app NÃO diz é quanto vai cair. Isso depende de tiragem, demanda
   e de a edição ser de varejo ou de colecionador, e não existe fonte para
   isso aqui. Diz "tende a cair", que é o que se sabe.
   ===================================================================== */
let reimpressoes = { linhas:null, carregando:false };

async function carregarReimpressoes(){
  if(reimpressoes.carregando || reimpressoes.linhas) return;
  reimpressoes.carregando = true;
  try{
    reimpressoes.linhas = await supa("reprints?select=oracle_id,card_name,new_set,new_set_name,"
      + "new_card_id,img,released_at,printings_before,first_printed"
      + "&order=released_at.desc&limit=300");
  }catch(e){ reimpressoes.linhas = []; }
  reimpressoes.carregando = false;
  pintarSino();
}

/* as reimpressões que tocam a sua coleção ou o seu chase */
function reimpressoesMinhas(){
  const linhas = reimpressoes.linhas || [];
  if(!linhas.length) return [];
  const meus = new Map();      // nome -> { copias, maisAntiga }
  Object.entries(S.owned).forEach(([id, r]) => {
    const nome = semAcento(r.n || "");
    if(!nome) return;
    const e = meus.get(nome) || { nome:r.n, copias:0, edicoes:new Set(), chase:false };
    e.copias += qtdDe(id);
    if(r.sn || r.s) e.edicoes.add(r.sn || String(r.s).toUpperCase());
    meus.set(nome, e);
  });
  ((chase() || {}).cartas || []).forEach(x => {
    const nome = semAcento(x.n || "");
    if(!nome) return;
    const e = meus.get(nome) || { nome:x.n, copias:0, edicoes:new Set(), chase:false };
    e.chase = true;
    meus.set(nome, e);
  });

  return linhas
    .map(l => ({ linha:l, meu:meus.get(semAcento(l.card_name || "")) }))
    .filter(x => x.meu)
    .slice(0, 12);
}

/* =====================================================================
   CARTA DO SEU CHASE À VENDA NO MERCADO

   O mercado já sabia quem TEM; o chase já sabia o que você QUER. Faltava
   ligar os dois: sem isso, achar a carta que você caça dependia de você
   abrir o mercado e lembrar de procurar.

   O casamento é pelo id da impressão quando existe, e pelo nome quando
   não — chase card muitas vezes é "quero essa carta", não "quero essa
   impressão", e recusar por edição diferente esconderia a oferta que
   interessa. A tela mostra a edição do anúncio para você julgar.
   ===================================================================== */
function chaseNoMercado(){
  const c = chase();
  const meus = (c.cartas || []);
  if(!meus.length || !(mercado.lista || []).length) return [];
  const porId = new Map(meus.map(x => [x.id, x]));
  const porNome = new Map(meus.map(x => [semAcento(x.n || ""), x]));
  const achados = [];
  (mercado.lista || []).forEach(a => {
    if(a.status !== "ativo") return;
    if(logado() && a.seller === SESSAO.user_id) return;      // o seu próprio anúncio não é notícia
    const meu = porId.get(a.card_id) || porNome.get(semAcento(a.card_name || ""));
    if(!meu) return;
    achados.push({ anuncio:a, chase:meu, mesmaImpressao: meu.id === a.card_id });
  });
  return achados;
}

function contarAvisos(){
  const desde = vistoEm();
  const noticiasNovas = desde
    ? (noticias.itens || []).filter(n => new Date(n.published_at).getTime() > desde).length : 0;
  const mexeram = (avisos_.movers || []).length;
  const naMira = chaseNoAlvo().length;
  const aVenda = chaseNoMercado().length;
  const reimpressas = reimpressoesMinhas().length;
  const semCopia = estadoDaProtecao().cobrar ? 1 : 0;
  return { noticiasNovas, mexeram, naMira, aVenda, reimpressas, semCopia,
           total: noticiasNovas + mexeram + naMira + aVenda + reimpressas + semCopia };
}

function pintarSino(){
  const el = document.getElementById("sino");
  if(!el) return;
  const c = contarAvisos();
  el.innerHTML = `🔔${c.total ? `<i>${c.total > 9 ? "9+" : c.total}</i>` : ""}`;
  el.title = c.total ? "o que mudou desde a última vez" : "nada novo desde a última vez";
}

function abrirAvisos(){
  const c = contarAvisos();
  const desde = vistoEm();
  const novas = desde
    ? (noticias.itens || []).filter(n => new Date(n.published_at).getTime() > desde) : [];
  const mira = chaseNoAlvo();
  const aVenda = chaseNoMercado();
  const reimpressas = reimpressoesMinhas();
  const prot = estadoDaProtecao();

/* =====================================================================
   VALORIZAÇÃO DA COLEÇÃO

   O robô arquiva o preço de todo dia desde 01/09/2026. Aqui a gente
   pergunta ao banco quanto a SUA coleção valia em cada um desses dias.

   A lista de cartas vai no corpo do pedido, não no banco: dá para ver a
   própria valorização sem ter conta. Em compensação o banco não sabe a
   condição das suas cartas, então o gráfico usa o preço de carta
   perfeita — e a tela diz isso.

   Duas honestidades que a tela precisa carregar:
   - só entra no gráfico a carta que o robô acompanha; a tela mostra
     quantas das suas estão cobertas;
   - o arquivo é novo, então a linha começa curta. Melhor uma linha curta
     e verdadeira do que uma longa e inventada.
   ===================================================================== */
let valorizacao = { serie:null, movers:null, cobertura:null, dias:30, carregando:false, erro:null };

const itensDaColecao = () => Object.keys(S.owned).map(id => ({ id, q: qtdDe(id) }));

async function carregarValorizacao(){
  const itens = itensDaColecao();
  if(!itens.length || valorizacao.carregando) return;
  valorizacao.carregando = true; valorizacao.erro = null;
  try{
    const [serie, movers, cobertura] = await Promise.all([
      rpc("collection_series",   { p_itens: itens, p_dias: valorizacao.dias }),
      rpc("collection_movers",   { p_itens: itens, p_dias: valorizacao.dias, p_limite: 5 }),
      rpc("collection_coverage", { p_itens: itens }),
    ]);
    valorizacao.serie = serie || [];
    valorizacao.movers = movers || [];
    valorizacao.cobertura = cobertura || null;
  }catch(e){
    valorizacao.erro = e.message;
  }
  valorizacao.carregando = false;
  if(view.name === "minha") renderMinha();
}

function blocoValorizacao(){
  const v = valorizacao;
  if(!Object.keys(S.owned).length) return "";

  const periodos = [[7,"7 dias"],[30,"30 dias"],[90,"3 meses"],[365,"tudo"]];
  const barra = `<div class="toggles" id="val-periodo">
      ${periodos.map(([d,n]) => `<button class="tog ${d===v.dias?"on":""}" data-dias="${d}">${n}</button>`).join("")}
    </div>`;

  if(v.erro) return `<section class="bloco-val"><div class="val-topo"><b>Valorização</b>${barra}</div>
    <p class="dg-txt">Não consegui buscar o histórico agora — ${escapeHTML(v.erro)}</p></section>`;

  if(!v.serie) return `<section class="bloco-val"><div class="val-topo"><b>Valorização</b>${barra}</div>
    <p class="dg-txt">Buscando o histórico…</p></section>`;

  const pontos = v.serie.map(l => ({ dia:l.dia, v:Number(l.usd) })).filter(p => p.v > 0);
  const cob = v.cobertura || {};
  const nota = cob.pedidas ? `${cob.com_historico} das suas ${cob.pedidas} cartas têm histórico arquivado` : "";

  if(pontos.length < 2){
    return `<section class="bloco-val">
      <div class="val-topo"><b>Valorização</b>${barra}</div>
      <p class="dg-txt">${pontos.length === 1
        ? `O arquivo começou em ${cob.primeiro_dia || "01/09/2026"} e ainda tem um dia só das suas cartas.
           A linha ganha forma sozinha nos próximos dias — cada dia que passa é um ponto a mais.`
        : `Nenhuma das suas cartas entrou no arquivo diário ainda. Elas entram na próxima passagem do robô,
           e a partir daí o gráfico começa.`}
        ${nota ? `<br>${nota}.` : ""}</p>
    </section>`;
  }

  const primeiro = pontos[0].v, ultimo = pontos[pontos.length-1].v;
  const dif = ultimo - primeiro;
  const pct = primeiro ? (dif / primeiro) * 100 : 0;

  return `
  <section class="bloco-val">
    <div class="val-topo"><b>Valorização</b>${barra}</div>
    <div class="val-corpo">
      <div class="val-numeros">
        <div class="val-hoje">${money(ultimo)}</div>
        <div class="val-dif ${dif>=0?"sobe":"desce"}">
          ${dif>=0?"▲":"▼"} ${money(Math.abs(dif))} <span>(${Math.abs(pct).toFixed(1)}%)</span>
        </div>
        <div class="val-desde">de ${money(primeiro)} em ${dataCurta(pontos[0].dia)}</div>
      </div>
      <div class="val-grafico">${sparkline(pontos)}</div>
    </div>
    <p class="dg-txt">
      ${nota ? nota + ". " : ""}O gráfico usa o preço de carta perfeita, que é o que o arquivo guarda;
      o valor total lá em cima já desconta a condição de cada uma das suas.
    </p>
    ${blocoMovers()}
    ${blocoDiario()}
  </section>`;
}

/* O que entrou em cada mês, a partir da data em que a carta foi marcada.
   Não é estimativa: é o carimbo que o app já guardava em cada carta. */
function diarioDaColecao(){
  const meses = new Map();
  Object.entries(S.owned).forEach(([id, r]) => {
    if(!r.at) return;
    const d = new Date(r.at);
    const chave = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const m = meses.get(chave) || { chave, cartas:0, copias:0, valor:0, pago:0 };
    m.cartas++; m.copias += qtdDe(id);
    m.valor += valorUnitario(id) * qtdDe(id);
    m.pago  += (Number(r.pg) || 0) * qtdDe(id);
    meses.set(chave, m);
  });
  return [...meses.values()].sort((a,b) => b.chave.localeCompare(a.chave)).slice(0, 18);
}

function blocoDiario(){
  const meses = diarioDaColecao();
  if(meses.length < 2) return "";
  const maior = Math.max(...meses.map(m => m.copias)) || 1;
  const mes = c => {
    const [a, m] = c.split("-");
    return new Date(Number(a), Number(m)-1, 1).toLocaleDateString("pt-BR", { month:"short", year:"2-digit" });
  };
  return `
  <details class="avancado diario">
    <summary>Diário da coleção — o que entrou mês a mês</summary>
    <div class="diario-linhas">
      ${meses.map(m => `
        <div class="diario-linha">
          <span class="dr-mes">${mes(m.chave)}</span>
          <span class="dr-barra"><i style="width:${Math.round(100*m.copias/maior)}%"></i></span>
          <span class="dr-num">${m.copias} carta${m.copias>1?"s":""}
            <small>${money(m.valor)}${m.pago ? ` · pagou ${money(m.pago)}` : ""}</small></span>
        </div>`).join("")}
    </div>
    <p class="dg-txt">Conta pela data em que você marcou a carta aqui — não pela data em que ela foi comprada.
    Quem importou a coleção de outro app vê tudo caindo no mês da importação, e isso é o certo:
    o app não inventa uma data que não tem.</p>
  </details>`;
}

function dataCurta(iso){
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("pt-BR", { day:"2-digit", month:"short" });
}

function blocoMovers(){
  const lista = valorizacao.movers || [];
  if(!lista.length) return "";
  const subiram = lista.filter(m => Number(m.dif) > 0);
  const cairam  = lista.filter(m => Number(m.dif) < 0).reverse();
  if(!subiram.length && !cairam.length) return "";

  const linha = m => {
    const r = S.owned[m.card_id];
    if(!r) return "";
    const dif = Number(m.dif), pct = Number(m.pct);
    return `<button class="mover" data-carta="${m.card_id}">
      ${r.img ? `<img src="${r.img}" alt="" loading="lazy">` : `<span class="mv-sem"></span>`}
      <span class="mv-nome">${escapeHTML(r.n || "?")}<small>${escapeHTML(r.sn || r.s || "")}</small></span>
      <span class="mv-dif ${dif>=0?"sobe":"desce"}">${dif>=0?"+":"−"}${money(Math.abs(dif))}
        <small>${pct!=null?`${dif>=0?"+":"−"}${Math.abs(pct).toFixed(1)}%`:""}</small></span>
    </button>`;
  };

  return `
  <div class="movers">
    ${subiram.length ? `<div class="mv-col"><span class="flabel">Subiram</span>${subiram.map(linha).join("")}</div>` : ""}
    ${cairam.length  ? `<div class="mv-col"><span class="flabel">Caíram</span>${cairam.map(linha).join("")}</div>` : ""}
  </div>`;
}

function ligarValorizacao(){
  const barra = document.getElementById("val-periodo");
  if(barra) barra.querySelectorAll("[data-dias]").forEach(b => b.onclick = () => {
    valorizacao.dias = Number(b.dataset.dias);
    valorizacao.serie = null; valorizacao.movers = null;
    renderMinha();
    carregarValorizacao();
  });
  app.querySelectorAll("[data-carta]").forEach(b => b.onclick = () => {
    const r = S.owned[b.dataset.carta];
