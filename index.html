function cartaoDeDeck(d){
  const fmt = formatoDe(d.formato);
  const total = totalDoDeck(d);
  const capa = (d.comandante && (d.comandante.big || d.comandante.img))
            || ((d.cartas || []).find(c => c.img) || {}).img;
  const tenho = cartasDoDeck(d).filter(c => isOwned(c.id)).reduce((a,c)=>a+(c.qtd||1),0);
  const pct = total ? Math.round(100 * tenho / total) : 0;
  const cores = coresDoDeck(d);
  return `
  <button class="deck-cartao" data-deck="${d.id}">
    <div class="deck-capa" ${capa ? `style="background-image:url('${escapeHTML(capa)}')"` : ""}>
      ${capa ? "" : `<span>🂠</span>`}
    </div>
    <div class="deck-corpo">
      <h3>${escapeHTML(d.nome)}</h3>
      <div class="deck-meta">
        <span class="chip">${fmt.nome}</span>
        ${cores ? `<span class="deck-cores">${cores}</span>` : ""}
        <span>${total}/${fmt.cartas}</span>
      </div>
      ${d.comandante ? `<p class="deck-cmd">${escapeHTML(d.comandante.n)}</p>` : ""}
      <div class="mini-bar" title="${pct}% das cartas você já tem"><i style="width:${pct}%"></i></div>
      <span class="deck-tenho">${pct}% na sua coleção</span>
    </div>
  </button>`;
}

const PONTOS_COR = { w:"#f8f3d8", u:"#9fd3f0", b:"#9a8fa3", r:"#f0a08c", g:"#9fd3a8" };
function coresDoDeck(d){
  const cores = new Set();
  cartasDoDeck(d).forEach(c => (c.ci || c.cores || "").split("").forEach(x => { if(PONTOS_COR[x]) cores.add(x); }));
  return [...cores].map(c => `<i class="ponto-cor" style="background:${PONTOS_COR[c]}"></i>`).join("");
}

/* ---------------- criar deck ---------------- */
function novoDeck(preset = {}){
  modal(`<div class="modal-pad">
    <h3>Novo deck</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 16px">
      O formato muda as regras que o app confere. Dá para trocar depois.</p>
    <label class="field"><span>Nome do deck</span>
      <input type="text" id="nd-nome" placeholder="ex.: Atraxa infinito" value="${escapeHTML(preset.nome || "")}">
    </label>
    <span class="flabel">Formato</span>
    <div class="formatos">
      ${FORMATOS.map(f => `
        <button class="formato ${(preset.formato || "commander")===f.id?"on":""}" data-fmt="${f.id}">
          <b>${f.nome}</b><small>${f.desc}</small>
        </button>`).join("")}
    </div>
    ${preset.comandante ? `<div class="nota-regiao" style="margin-top:14px">
      Comandante: <b>${escapeHTML(preset.comandante.n)}</b></div>` : ""}
    <div class="pergunta-acoes" style="margin-top:18px">
      <button class="btn" id="nd-criar">Criar deck</button>
      <button class="btn ghost" id="nd-cancelar">Cancelar</button>
    </div>
  </div>`);

  let formato = preset.formato || "commander";
  const grade = document.querySelector(".formatos");
  grade.onclick = e => {
    const b = e.target.closest(".formato"); if(!b) return;
    formato = b.dataset.fmt;
    grade.querySelectorAll(".formato").forEach(x => x.classList.toggle("on", x === b));
  };
  document.getElementById("nd-cancelar").onclick = closeModal;
  document.getElementById("nd-criar").onclick = () => {
    const nome = (document.getElementById("nd-nome").value || "").trim()
      || (preset.comandante ? preset.comandante.n : "Deck sem nome");
    const d = { id:"deck-" + Date.now().toString(36), nome, formato,
                comandante: preset.comandante || null, cartas:[], criado:Date.now() };
    decks().push(d); save(); closeModal(); go("deck", d.id);
  };
  const campo = document.getElementById("nd-nome");
  if(campo) campo.focus();
}

/* ---------------- view: um deck ---------------- */
const GRUPOS_DECK = [
  ["comandante",   "Comandante",    c => c.ehComandante],
  ["criatura",     "Criaturas",     c => /creature/i.test(c.t) && !/land/i.test(c.t)],
  ["planeswalker", "Planeswalkers", c => /planeswalker/i.test(c.t)],
  ["instantanea",  "Instantâneas",  c => /instant/i.test(c.t)],
  ["feitico",      "Feitiços",      c => /sorcery/i.test(c.t)],
  ["artefato",     "Artefatos",     c => /artifact/i.test(c.t)],
  ["encantamento", "Encantamentos", c => /enchantment/i.test(c.t)],
  ["batalha",      "Batalhas",      c => /battle/i.test(c.t)],
  ["terreno",      "Terrenos",      c => /land/i.test(c.t)],
];

function renderDeck(id){
  const d = deckPorId(id);
  if(!d){ go("decks"); return; }
  const fmt = formatoDe(d.formato);

  app.innerHTML = `
    <button class="icon-btn" id="voltar-decks" style="margin-bottom:16px">← todos os decks</button>
    <div class="coll-head">
      <div class="ico">${d.comandante && d.comandante.img
        ? `<img class="ico-capa" src="${escapeHTML(d.comandante.img)}" alt="">` : "🂠"}</div>
      <div style="flex:1;min-width:220px">
        <h2 contenteditable="true" id="deck-nome" spellcheck="false">${escapeHTML(d.nome)}</h2>
        <p>${fmt.nome} · ${fmt.desc}</p>
      </div>
      <div class="progress-wrap" id="deck-resumo"></div>
    </div>

    <div class="toolbar">
      <button class="btn" id="add-carta-deck">+ Adicionar cartas</button>
      ${fmt.comandante ? `<button class="btn ghost" id="def-comandante">${d.comandante ? "Trocar comandante" : "Escolher comandante"}</button>` : ""}
      <select id="deck-formato" style="width:auto">
        ${FORMATOS.map(f => `<option value="${f.id}"${d.formato===f.id?" selected":""}>${f.nome}</option>`).join("")}
      </select>
      <div class="grow"></div>
      <button class="btn ghost" id="deck-texto">Exportar lista</button>
      <button class="btn ghost" id="deck-excluir">Excluir</button>
    </div>

    <div class="deck-layout">
      <div class="deck-cartas" id="deck-cartas"></div>
      <aside class="deck-lado" id="deck-diagnostico"></aside>
    </div>`;

  document.getElementById("voltar-decks").onclick = () => go("decks");
  const nome = document.getElementById("deck-nome");
  nome.onblur = () => { const t = nome.textContent.trim(); if(t){ d.nome = t; save(); } else nome.textContent = d.nome; };
  nome.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); nome.blur(); } };

  document.getElementById("add-carta-deck").onclick = () => buscarParaDeck(d);
  const bc = document.getElementById("def-comandante");
  if(bc) bc.onclick = () => buscarParaDeck(d, { comandante:true });
  document.getElementById("deck-formato").onchange = e => { d.formato = e.target.value; save(); renderDeck(d.id); };
  document.getElementById("deck-texto").onclick = () => exportarDeck(d);
  document.getElementById("deck-excluir").onclick = () => {
    if(!confirm(`Excluir o deck "${d.nome}"? As cartas continuam na sua coleção.`)) return;
    S.decks = decks().filter(x => x.id !== d.id); save(); go("decks");
  };

  pintarDeck(d);
}

function pintarDeck(d){
  const alvo = document.getElementById("deck-cartas");
  if(!alvo) return;
  const todas = cartasDoDeck(d);

  const usadas = new Set();
  const secoes = GRUPOS_DECK.map(([chave, titulo, casa]) => {
    const itens = todas.filter(c => !usadas.has(c) && casa(c));
    itens.forEach(c => usadas.add(c));
    return { chave, titulo, itens:itens.sort((a,b) => (a.mv||0)-(b.mv||0) || a.n.localeCompare(b.n)) };
  }).filter(s => s.itens.length);
  const sobrou = todas.filter(c => !usadas.has(c));
  if(sobrou.length) secoes.push({ chave:"outros", titulo:"Outras", itens:sobrou });

  alvo.innerHTML = todas.length === 0
    ? `<div class="empty">Deck vazio. Clique em <b>+ Adicionar cartas</b> — dá para buscar em tudo
        que existe ou só no que você já tem.</div>`
    : secoes.map(s => `
      <section class="deck-secao">
        <h3 class="grupo-titulo">${s.titulo}<span>${s.itens.reduce((a,c)=>a+(c.qtd||1),0)}</span></h3>
        <div class="deck-linhas">
          ${s.itens.map(c => linhaDeCarta(c, d)).join("")}
        </div>
      </section>`).join("");

  ligarLinhasDoDeck(d);
  pintarDiagnostico(d);
  pintarResumoDoDeck(d);
}

function linhaDeCarta(c, d){
  const tenho = isOwned(c.id);
  const p = precoLocal(deckParaCarta(c));
  return `
  <div class="deck-linha ${tenho?"tenho":""}" data-id="${c.id}">
    <span class="dl-qtd">${c.ehComandante ? "★" : (c.qtd || 1) + "×"}</span>
    <img class="dl-img" loading="lazy" src="${escapeHTML(c.img || "")}" alt="">
    <span class="dl-nome">${escapeHTML(c.n)}
      <small>${escapeHTML((c.t || "").split("—")[0].trim())}${c.mv ? ` · ${c.mv} mana` : ""}</small></span>
    <span class="dl-preco">${p ? formatarPreco(p) : "—"}</span>
    <span class="dl-tenho" title="${tenho ? "você tem esta carta" : "você ainda não tem"}">${tenho ? "✓" : ""}</span>
    <span class="dl-acoes">
      ${c.ehComandante ? "" : `<button class="dl-menos" title="tirar uma">−</button>
      <button class="dl-mais" title="mais uma">+</button>`}
      <button class="dl-info" title="detalhes">i</button>
      <button class="dl-fora" title="tirar do deck">×</button>
    </span>
  </div>`;
}

function ligarLinhasDoDeck(d){
  const alvo = document.getElementById("deck-cartas");
  if(!alvo) return;
  alvo.querySelectorAll(".deck-linha").forEach(el => {
    const id = el.dataset.id;
    const achar = () => (d.cartas || []).find(x => x.id === id);
    const ehCmd = d.comandante && d.comandante.id === id;
    const mexer = f => { f(); save(); pintarDeck(d); };
    const bt = (sel, fn) => { const b = el.querySelector(sel); if(b) b.onclick = e => { e.stopPropagation(); fn(); }; };
    bt(".dl-mais", () => mexer(() => { const c = achar(); if(c) c.qtd = (c.qtd || 1) + 1; }));
    bt(".dl-menos", () => mexer(() => {
      const c = achar(); if(!c) return;
      if((c.qtd || 1) <= 1) d.cartas = d.cartas.filter(x => x.id !== id); else c.qtd--;
    }));
    bt(".dl-fora", () => mexer(() => {
      if(ehCmd) d.comandante = null; else d.cartas = d.cartas.filter(x => x.id !== id);
    }));
    bt(".dl-info", () => {
      const c = ehCmd ? d.comandante : achar();
      if(c) openCard(deckParaCarta(c));
    });
  });
}

function pintarResumoDoDeck(d){
  const alvo = document.getElementById("deck-resumo");
  if(!alvo) return;
  const dg = diagnosticoDoDeck(d);
  const pct = dg.total ? Math.round(100 * dg.tenho / dg.total) : 0;
  alvo.innerHTML = `
    <div class="progress-num"><span>você tem</span><b>${pct}%</b></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="progress-num">
      <span>${dg.total} de ${dg.fmt.cartas} cartas</span>
      <span>${formatarPreco({valor:dg.valor, simbolo:regiao().simbolo})}</span>
    </div>`;
}

function pintarDiagnostico(d){
  const alvo = document.getElementById("deck-diagnostico");
  if(!alvo) return;
  const g = diagnosticoDoDeck(d);
  const edh = g.fmt.cartas >= 100;
  const fmtP = v => formatarPreco({ valor:v, simbolo:regiao().simbolo });

  const barraCurva = () => {
    const max = Math.max(1, ...Object.values(g.curva));
    return `<div class="curva">${[0,1,2,3,4,5,6,7].map(k => `
      <div class="curva-col" title="${g.curva[k]||0} carta(s) de custo ${k}${k===7?"+":""}">
        <i style="height:${Math.round(100*(g.curva[k]||0)/max)}%"></i>
        <span>${k}${k===7?"+":""}</span>
      </div>`).join("")}</div>`;
  };

  const meta = (nome, valor, faixa, dica) => {
    const [min,max] = faixa;
    const estado = valor < min ? "abaixo" : valor > max ? "acima" : "certo";
    const rotulo = estado === "certo" ? "ok" : estado === "abaixo" ? `pouco (mire ${min}–${max})` : `muito (mire ${min}–${max})`;
    return `<div class="dg-linha ${estado}">
      <span>${nome}</span><b>${valor}</b><small title="${escapeHTML(dica)}">${rotulo}</small></div>`;
  };

  const cores = ["w","u","b","r","g"].filter(c => g.pips[c] > 0 || g.fontes[c] > 0);
  const nomeCor = { w:"branco", u:"azul", b:"preto", r:"vermelho", g:"verde" };

  alvo.innerHTML = `
    <div class="dg-bloco">
      <span class="flabel">Terrenos</span>
      <div class="dg-grande ${g.terrenos < g.alvoTerrenos - 2 ? "abaixo" : g.terrenos > g.alvoTerrenos + 2 ? "acima" : "certo"}">
        <b>${g.terrenos}</b><span>no deck</span>
      </div>
      <p class="dg-txt">Para um custo médio de <b>${g.mvMedio.toFixed(2)}</b>, a conta do Frank Karsten pede
      <b>${g.alvoTerrenos}</b> terrenos${g.terrenos === g.alvoTerrenos ? " — está no ponto." :
        g.terrenos < g.alvoTerrenos ? ` — faltam ${g.alvoTerrenos - g.terrenos}.` : ` — ${g.terrenos - g.alvoTerrenos} a mais do que o necessário.`}
      Rampa e compra barata puxam esse número para baixo.</p>
    </div>

    <div class="dg-bloco">
      <span class="flabel">Curva de mana</span>
      ${barraCurva()}
    </div>

    ${edh ? `<div class="dg-bloco">
      <span class="flabel">Peças que todo deck precisa</span>
      ${meta("Rampa", g.rampa, METAS_EDH.rampa, "cartas de até 4 manas que colocam terreno ou produzem mana")}
      ${meta("Compra", g.compra, METAS_EDH.compra, "cartas que compram carta")}
      ${meta("Remoção", g.remocao, METAS_EDH.remocao, "destruir, exilar, anular ou queimar um alvo")}
      ${meta("Varridas", g.varrida, METAS_EDH.varrida, "destrói ou exila tudo de uma vez")}
      <p class="dg-txt">As faixas são o consenso de deck de Commander. Não é lei — deck de aggro
      leva menos varrida, deck de controle leva mais.</p>
    </div>` : ""}

    ${cores.length > 1 ? `<div class="dg-bloco">
      <span class="flabel">Cores: símbolo exigido × fonte de mana</span>
      ${cores.map(c => {
        const falta = g.pips[c] > 0 && g.fontes[c] < Math.max(6, Math.round(g.pips[c] * 0.55));
        return `<div class="dg-linha ${falta?"abaixo":"certo"}">
          <span><i class="ponto-cor" style="background:${PONTOS_COR[c]}"></i>${nomeCor[c]}</span>
          <b>${g.fontes[c]}</b><small>${g.pips[c]} símbolo${g.pips[c]===1?"":"s"}${falta?" · poucas fontes":""}</small></div>`;
      }).join("")}
    </div>` : ""}

    <div class="dg-bloco">
      <span class="flabel">Legalidade e tamanho</span>
      ${g.problemas.length
        ? g.problemas.map(p => `<div class="dg-problema ${p.tipo}">${escapeHTML(p.txt)}</div>`).join("")
        : `<div class="dg-problema ok">Tudo certo para ${g.fmt.nome}.</div>`}
    </div>

    <div class="dg-bloco">
      <span class="flabel">Preço</span>
      <div class="dg-linha certo"><span>deck inteiro</span><b>${fmtP(g.valor)}</b><small></small></div>
      <div class="dg-linha ${g.falta ? "abaixo" : "certo"}"><span>o que falta comprar</span><b>${fmtP(g.falta)}</b>
        <small>${g.total - g.tenho} carta${g.total-g.tenho===1?"":"s"}</small></div>
    </div>`;
}

/* ---------------- buscar cartas para o deck ---------------- */
function buscarParaDeck(d, opcoes = {}){
  const fmt = formatoDe(d.formato);
  const soComandante = !!opcoes.comandante;
  let busca = 0, achadas = [], soMinhas = false;

  modal(`<div class="modal-pad">
    <h3>${soComandante ? "Escolher comandante" : "Adicionar cartas"}</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 14px">
      ${soComandante
        ? "Só aparecem cartas que podem ser comandante."
        : `Busca em tudo que é legal em ${fmt.nome}${d.comandante ? `, dentro da identidade de cor de ${escapeHTML(d.comandante.n)}` : ""}.`}</p>
    <label class="field"><span>Nome, tipo ou o que a carta faz</span>
      <input type="text" id="bd-termo" placeholder="ex.: Sol Ring, dragão, destroy target creature" autocomplete="off">
    </label>
    <label class="check" style="margin-bottom:12px"><input type="checkbox" id="bd-minhas">
      <span>só cartas que eu já tenho</span></label>
    <div class="status" id="bd-status">digite pelo menos três letras</div>
    <div class="cards" id="bd-grade"></div>
  </div>`);

  const campo = document.getElementById("bd-termo");
  const status = document.getElementById("bd-status");
  const grade = document.getElementById("bd-grade");
  campo.focus();
  let timer;
  campo.oninput = () => { clearTimeout(timer); timer = setTimeout(rodar, 380); };
  document.getElementById("bd-minhas").onchange = e => { soMinhas = e.target.checked; rodar(); };

  function query(termo){
    const partes = [];
    if(soComandante) partes.push("is:commander");
    partes.push(`f:${d.formato}`);
    if(!soComandante && d.comandante && fmt.comandante) partes.push(`ci<=${d.comandante.ci || "c"}`);
    if(soComandante && false) partes.push("");
    partes.push(`(name:"${termo}" or type:"${termo}" or oracle:"${termo}")`);
    return partes.join(" ");
  }

  async function rodar(){
    const termo = campo.value.trim();
    if(termo.length < 3){ status.textContent = "digite pelo menos três letras"; grade.innerHTML = ""; return; }
    status.textContent = "buscando…"; grade.innerHTML = skeletons(8);
    const meu = ++busca;
    try{
      if(soMinhas){
        const t = semAcento(termo);
        achadas = cartasQueTenho().filter(c => semAcento(c.name).includes(t) || semAcento(c.type||"").includes(t));
        if(meu !== busca || !grade.isConnected) return;
        status.textContent = `${achadas.length} na sua coleção`;
      } else {
        const json = await scryPage(query(termo), "cards", "edhrec", 1, "auto");
        if(meu !== busca || !grade.isConnected) return;
        achadas = (json.data || []).map(normalize);
        status.textContent = `${json.total_cards || achadas.length} carta${(json.total_cards||0)===1?"":"s"} — mostrando ${achadas.length}`;
      }
      if(!achadas.length){ grade.innerHTML = ""; status.textContent = "nada encontrado"; return; }
      grade.innerHTML = achadas.map(c => cardHTML(c)).join("");
      grade.querySelectorAll(".card").forEach(el => {
        const c = achadas.find(x => x.id === el.dataset.id);
        if(!c) return;
        const info = el.querySelector(".info");
        if(info) info.onclick = ev => { ev.stopPropagation(); openCard(c); };
        el.onclick = () => {
          if(soComandante){
            d.comandante = cartaDeDeck(c, 1); save(); closeModal(); renderDeck(d.id);
            toast(`${c.name} virou o comandante`);
            return;
          }
          porNoDeck(d, c);
          el.classList.add("no-deck");
          toast(`${c.name} entrou no deck`);
        };
      });
    }catch(e){
      if(meu === busca && grade.isConnected){ status.textContent = "erro na busca"; grade.innerHTML = ""; }
    }
  }
}

function porNoDeck(d, carta){
  const fmt = formatoDe(d.formato);
  d.cartas = d.cartas || [];
  const ja = d.cartas.find(x => x.id === carta.id);
  const basico = /basic/i.test(carta.type || "");
  if(ja){
    if(fmt.singleton && !basico) return toast(`${carta.name} já está no deck (${fmt.nome} é singleton)`);
    if(!fmt.singleton && !basico && (ja.qtd || 1) >= 4) return toast("máximo de 4 cópias");
    ja.qtd = (ja.qtd || 1) + 1;
  } else {
    d.cartas.push(cartaDeDeck(carta, 1));
  }
  save();
  if(view.name === "deck") pintarDeck(d);
}

function exportarDeck(d){
  const linhas = [];
  if(d.comandante) linhas.push(`1 ${d.comandante.n}`, "");
  (d.cartas || []).forEach(c => linhas.push(`${c.qtd || 1} ${c.n}`));
  const txt = linhas.join("\n");
  modal(`<div class="modal-pad">
    <h3>Lista do deck</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 12px">
      Formato de texto que Moxfield, Archidekt e a maioria dos sites entende.</p>
    <textarea id="deck-txt" rows="14" style="font-family:ui-monospace,monospace;font-size:12.5px">${escapeHTML(txt)}</textarea>
    <div class="pergunta-acoes"><button class="btn" id="copiar-deck">Copiar</button></div>
  </div>`);
  document.getElementById("copiar-deck").onclick = () => {
    const el = document.getElementById("deck-txt");
    el.select(); document.execCommand("copy");
    toast("lista copiada");
  };
}

/* ---------------- decks mais jogados ----------------
   Em Commander o deck é o comandante, e o EDHREC publica esse ranking por
   período. O navegador não lê o EDHREC direto (o site não libera CORS), então
   quem lê é o job diário: a tela aqui consulta a nossa tabela top_decks.
   "Desde sempre" não precisa de tabela: o próprio Scryfall carrega o ranking
   histórico do EDHREC dentro de cada carta (edhrec_rank), e ordenar por ele
   dá a lista de todos os tempos ao vivo. */

const PERIODOS_TOP = [
  ["semana",  "Última semana"],
  ["mes",     "Último mês"],
  ["anos2",   "Últimos 2 anos"],
  ["sempre",  "Desde sempre"],
];
/* Commander tem as quatro janelas (o EDHREC publica as três primeiras e o
   Scryfall carrega o ranking histórico). Os formatos de torneio vêm das
   listas de torneio dos últimos 7 e 30 dias — não existe "desde sempre"
   honesto ali, porque o metagame de dois anos atrás não é o de hoje. */
const PERIODOS_POR_FORMATO = {
  commander: ["semana","mes","anos2","sempre"],
  brawl:     [],
  standard:  ["semana","mes"], pioneer:["semana","mes"], modern:["semana","mes"],
  legacy:    ["semana","mes"], vintage:["semana","mes"], pauper:["semana","mes"],
};
const periodosDe = f => PERIODOS_POR_FORMATO[f] || [];
let topView = { formato:"commander", periodo:"semana", linhas:[], cartas:{}, busca:"", pagina:1, temMais:false, total:0 };

async function pintarTopDecks(){
  const alvo = document.getElementById("deck-conteudo");
  if(!alvo) return;
  const janelas = periodosDe(topView.formato);
  const temFonte = janelas.length > 0;
  if(temFonte && !janelas.includes(topView.periodo)) topView.periodo = janelas[0];

  alvo.innerHTML = `
    <div class="toggles" style="margin-bottom:10px" id="top-formatos">
      ${FORMATOS.map(f => `<button class="tog ${topView.formato===f.id?"on":""}" data-f="${f.id}">${f.nome}</button>`).join("")}
    </div>
    ${temFonte ? `
      <div class="toggles" style="margin-bottom:16px" id="top-periodos">
        ${PERIODOS_TOP.filter(([id]) => janelas.includes(id))
            .map(([id,nome]) => `<button class="tog ${topView.periodo===id?"on":""}" data-p="${id}">${nome}</button>`).join("")}
      </div>` : ""}
    <div id="top-lista"></div>`;

  document.getElementById("top-formatos").onclick = e => {
    const b = e.target.closest("[data-f]"); if(!b) return;
    topView.formato = b.dataset.f; topView.linhas = []; pintarTopDecks();
  };
  const per = document.getElementById("top-periodos");
  if(per) per.onclick = e => {
    const b = e.target.closest("[data-p]"); if(!b) return;
    topView.periodo = b.dataset.p; topView.linhas = []; topView.pagina = 1; pintarTopDecks();
  };

  const lista = document.getElementById("top-lista");
  if(!temFonte){
    const fmt = formatoDe(topView.formato);
    const link = LINKS_META[topView.formato] || LINKS_META.commander;
    lista.innerHTML = `
      <div class="nota-regiao">
        <b>Ainda não tenho ranking de ${fmt.nome}.</b><br>
        Os formatos de torneio saem das listas publicadas de MTGO, Melee e Topdeck, e o Brawl quase não
        aparece nelas. Se você quiser acompanhar, o lugar hoje é
        <a href="${link[1]}" target="_blank" rel="noopener">${escapeHTML(link[0])} ↗</a>.
      </div>`;
    return;
  }

  if(topView.formato === "commander" && topView.periodo === "sempre") return listaDeSempre();
  return listaDoPeriodo();
}

/* Vem da nossa tabela, alimentada pelo job diário. Em Commander cada linha é
   um comandante; nos formatos de torneio é um arquétipo, com a fatia que ele
   ocupou nas listas de torneio da janela. */
async function listaDoPeriodo(){
  const alvo = document.getElementById("top-lista");
  if(!alvo) return;
  const ehEdh = topView.formato === "commander";
  alvo.innerHTML = `<div class="status">carregando o ranking…</div>`;
  let linhas = [];
  try{
    linhas = await supa(`top_decks?formato=eq.${encodeURIComponent(topView.formato)}`
      + `&periodo=eq.${encodeURIComponent(topView.periodo)}`
      + `&select=posicao,nome,decks,url,dia&order=posicao.asc&limit=100`);
  }catch(e){ linhas = []; }
  if(!alvo.isConnected) return;

  if(!linhas.length){
    alvo.innerHTML = `<div class="nota-regiao">
      O ranking desta janela ainda não foi baixado. Ele vem do job diário, que roda às 6h10.
      ${ehEdh ? "Enquanto isso, o <b>Desde sempre</b> funciona sozinho, direto do Scryfall." : ""}</div>`;
    return;
  }

  const dia = linhas[0].dia;
  const totalDecks = linhas.reduce((a,l) => a + (l.decks||0), 0) || 1;
  const janela = (PERIODOS_TOP.find(p => p[0] === topView.periodo) || ["","essa janela"])[1].toLowerCase();

  alvo.innerHTML = `
    <p class="status" style="text-align:left;margin:0 0 12px">
      ${linhas.length} ${ehEdh ? "decks mais jogados de Commander" : "arquétipos de " + formatoDe(topView.formato).nome}
      ${janela} · ${ehEdh
        ? "número de decks publicados no EDHREC"
        : `${totalDecks.toLocaleString("pt-BR")} decks de torneio classificados`}${
        dia ? ` · atualizado em ${new Date(dia+"T12:00:00").toLocaleDateString("pt-BR")}` : ""}</p>
    <div class="${ehEdh ? "cmd-grade" : "meta-lista"}" id="top-grade">
      ${linhas.map(l => ehEdh ? `
        <div class="cmd-cartao" data-nome="${escapeHTML(l.nome)}">
          <div class="cmd-pos">${l.posicao}</div>
          <div class="cmd-mini" id="mini-${l.posicao}"></div>
          <div class="cmd-info">
            <b>${escapeHTML(l.nome)}</b>
            <small>${(l.decks||0).toLocaleString("pt-BR")} decks publicados</small>
            <div class="cmd-acoes">
              <button class="btn ghost cmd-usar">Criar deck</button>
              ${l.url ? `<a class="btn ghost" href="${escapeHTML(l.url)}" target="_blank" rel="noopener">Ver no EDHREC ↗</a>` : ""}
            </div>
          </div>
        </div>` : `
        <div class="meta-linha">
          <span class="meta-pos">${l.posicao}</span>
          <span class="meta-nome">${escapeHTML(l.nome)}</span>
          <span class="meta-barra"><i style="width:${Math.round(100*(l.decks||0)/totalDecks)}%"></i></span>
          <span class="meta-share">${(100*(l.decks||0)/totalDecks).toFixed(1)}%</span>
          <span class="meta-decks">${(l.decks||0)} deck${(l.decks||0)===1?"":"s"}</span>
        </div>`).join("")}
    </div>
    ${ehEdh ? "" : `<p class="impr-dica">Arquétipo classificado pelas regras abertas do MTGOFormatData,
      sobre as listas de torneio de MTGO, Melee, Topdeck e Manatraders. A fatia é sobre os decks
      classificados nesta janela, não sobre o mundo inteiro.</p>`}`;

  if(!ehEdh) return;

  // as imagens vêm do Scryfall em lote, pelo nome
  const cartas = await cartasPorNome(linhas.map(l => l.nome));
  if(!alvo.isConnected) return;
  linhas.forEach(l => {
    const c = cartas[chaveDeNome(l.nome)];
    const caixa = document.getElementById("mini-" + l.posicao);
    if(caixa && c) caixa.innerHTML = `<img loading="lazy" src="${escapeHTML(c.small||"")}" alt="${escapeHTML(c.name)}">`;
  });
  alvo.querySelectorAll(".cmd-cartao").forEach(el => {
    const c = cartas[chaveDeNome(el.dataset.nome)];
    const usar = el.querySelector(".cmd-usar");
    if(usar) usar.onclick = () => c
      ? novoDeck({ formato:"commander", nome:c.name, comandante:cartaDeDeck(c,1) })
      : novoDeck({ formato:"commander", nome:el.dataset.nome });
    const mini = el.querySelector(".cmd-mini");
    if(mini && c) mini.onclick = () => openCard(c);
  });
}

/* busca em lote pelo nome exato — /cards/collection aceita 75 por vez */
async function cartasPorNome(nomes){
  const fora = {};
  const unicos = [...new Set(nomes)];
  for(let i = 0; i < unicos.length; i += 75){
    const lote = unicos.slice(i, i+75).map(n => ({ name: n.split(" // ")[0] }));
    try{
      const r = await fetch(`${API}/cards/collection`, {
        method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
        body: JSON.stringify({ identifiers: lote })
      });
      if(!r.ok) break;
      const j = await r.json();
      (j.data || []).map(normalize).forEach(c => {
        fora[chaveDeNome(c.name)] = c;
        fora[chaveDeNome(c.name.split(" // ")[0])] = c;
      });
    }catch(e){ break; }
    await sleep(120);
  }
  return fora;
}

/* desde sempre: ao vivo do Scryfall, ordenado pelo ranking histórico */
async function listaDeSempre(){
  const alvo = document.getElementById("top-lista");
  if(!alvo) return;
  alvo.innerHTML = `
    <div class="toolbar" style="margin-bottom:14px">
      <div class="grow"><input type="search" id="top-busca" placeholder="procurar comandante pelo nome…" value="${escapeHTML(topView.busca)}"></div>
      <div class="toggles" id="top-cores">
        ${[["w","Branco"],["u","Azul"],["b","Preto"],["r","Vermelho"],["g","Verde"],["c","Incolor"]]
          .map(([c,n]) => `<button class="tog ${topView.cor===c?"on":""}" data-cor="${c}">
            <i class="ponto-cor" style="background:${PONTOS_COR[c] || "#8a92a6"}"></i>${n}</button>`).join("")}
      </div>
    </div>
    <p class="status" style="text-align:left;margin:0 0 12px" id="top-status">carregando…</p>
    <div class="cmd-grade" id="top-grade">${skeletons(8)}</div>
    <div class="loadmore" id="top-mais"></div>`;

  const b = document.getElementById("top-busca");
  let t;
  b.oninput = () => { clearTimeout(t); t = setTimeout(() => { topView.busca = b.value; carregarSempre(true); }, 380); };
  document.getElementById("top-cores").onclick = e => {
    const x = e.target.closest("[data-cor]"); if(!x) return;
    topView.cor = topView.cor === x.dataset.cor ? "" : x.dataset.cor;
    carregarSempre(true);

  carregarSempre(true);
}

async function carregarSempre(zerar){
  const grade = document.getElementById("top-grade"), status = document.getElementById("top-status");
  if(!grade) return;
  if(zerar){ topView.linhas = []; topView.pagina = 1; grade.innerHTML = skeletons(8); }
  const partes = ["is:commander game:paper"];
  if((topView.busca||"").trim()) partes.push(`name:"${topView.busca.trim()}"`);
  if(topView.cor) partes.push(topView.cor === "c" ? "ci:c" : `ci:${topView.cor}`);
  try{
    const json = await scryPage(partes.join(" "), "cards", "edhrec", topView.pagina, "auto");
    if(!grade.isConnected) return;
    topView.linhas.push(...(json.data || []).map(normalize));
    topView.total = json.total_cards || topView.linhas.length;
    topView.temMais = !!json.has_more;
    topView.pagina++;
  }catch(e){
    if(grade.isConnected){ grade.innerHTML = ""; status.textContent = "não consegui buscar agora."; }
    return;
  }
  if(!grade.isConnected) return;

  status.innerHTML = `${topView.total.toLocaleString("pt-BR")} comandantes${topView.busca||topView.cor?" nesse filtro":""} ·
    ordenados pelo ranking histórico de uso do EDHREC, que o Scryfall publica em cada carta`;
  grade.innerHTML = topView.linhas.map((c,i) => `
    <div class="cmd-cartao" data-id="${c.id}">
      <div class="cmd-pos">${i+1}</div>
      <div class="cmd-mini"><img loading="lazy" src="${escapeHTML(c.small||"")}" alt="${escapeHTML(c.name)}"></div>
      <div class="cmd-info">
        <b>${escapeHTML(c.name)}</b>

/* =====================================================================
   CHASE CARDS — a lista de desejo com preço de olho

   O usuário cria os grupos com o nome que quiser ("comprar em outubro",
   "reserva do Modern") e joga carta dentro. Para cada carta o app guarda o
   preço do dia em que ela entrou e compara com o de agora, usando o mesmo
   histórico diário que alimenta o gráfico da carta.
   ===================================================================== */

function chase(){
  if(!S.chase) S.chase = { grupos:[{ id:"geral", nome:"Quero comprar" }], cartas:[] };
  if(!S.chase.grupos.length) S.chase.grupos = [{ id:"geral", nome:"Quero comprar" }];
  return S.chase;
}
function porNoChase(carta, grupoId){
  const c = chase();
  if(c.cartas.some(x => x.id === carta.id)) return false;
  const p = precoLocal(carta);
  c.cartas.push(Object.assign(cartaDeDeck(carta, 1), {
    grupo: grupoId || c.grupos[0].id,
    entrada: p ? p.valor : 0,
    entradaEm: Date.now(),
    alvo: 0,
  }));
  save();
  return true;
}

let chaseView = { carregouHistorico:false };

function renderChase(){
  const c = chase();
  const total = c.cartas.reduce((a,x) => { const p = precoLocal(deckParaCarta(x)); return a + (p?p.valor:0); }, 0);

  app.innerHTML = `
    <div class="section-head">
      <div>
        <h2>Chase cards</h2>
        <p>As cartas que você quer comprar, em grupos com o nome que você quiser. O app guarda o preço
        do dia em que cada uma entrou e mostra o que subiu e o que caiu desde então.</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="chase-add">+ Adicionar carta</button>
        <button class="btn ghost" id="chase-grupo">+ Grupo</button>
      </div>
    </div>

    ${c.cartas.length === 0
      ? `<div class="empty">Nenhuma carta na lista ainda.<br>
          Use o <b>+ Adicionar carta</b>, ou abra qualquer carta no catálogo e clique em
          <b>“quero esta”</b>.</div>`
      : `<div class="resumo-colecao" style="margin-bottom:18px">
          <div class="rc"><b>${c.cartas.length}</b><small>cartas na mira</small></div>
          <div class="rc"><b>${formatarPreco({valor:total, simbolo:regiao().simbolo})}</b><small>custo de comprar tudo</small></div>
          <div class="rc"><b>${c.grupos.length}</b><small>grupos</small></div>
        </div>` }

    <div id="chase-lista"></div>`;

  document.getElementById("chase-add").onclick = () => buscarParaChase();
  document.getElementById("chase-grupo").onclick = () => criarGrupoChase();
  pintarChase();
  carregarPrecosDoChase();
}

function pintarChase(){
  const alvo = document.getElementById("chase-lista");
  if(!alvo) return;
  const c = chase();
  if(!c.cartas.length){ alvo.innerHTML = ""; return; }

  alvo.innerHTML = c.grupos.map(g => {
    const itens = c.cartas.filter(x => x.grupo === g.id);
    const soma = itens.reduce((a,x) => { const p = precoLocal(deckParaCarta(x)); return a + (p?p.valor:0); }, 0);
    return `
    <section class="chase-grupo" data-grupo="${g.id}">
      <h3 class="grupo-titulo">
        <span class="chase-nome" contenteditable="true" spellcheck="false" data-g="${g.id}">${escapeHTML(g.nome)}</span>
        <span>${itens.length}</span>
        <b class="chase-soma">${formatarPreco({valor:soma, simbolo:regiao().simbolo})}</b>
        ${c.grupos.length > 1 ? `<button class="chase-apagar" data-g="${g.id}" title="apagar grupo">×</button>` : ""}
      </h3>
      ${itens.length
        ? `<div class="chase-linhas">${itens.map(linhaChase).join("")}</div>`
        : `<div class="empty" style="padding:22px">Grupo vazio — mande cartas para cá pelo seletor de cada carta.</div>`}
    </section>`;
  }).join("");

  ligarChase();
}

function linhaChase(x){
  const carta = deckParaCarta(x);
  const p = precoLocal(carta);
  const agora = p ? p.valor : 0;
  const entrada = Number(x.entrada) || 0;
  const dif = entrada && agora ? (agora - entrada) / entrada : 0;
  const seta = dif > 0.02 ? "subiu" : dif < -0.02 ? "caiu" : "parado";
  const alvo = Number(x.alvo) || 0;
  const bateu = alvo && agora && agora <= alvo;
  const grupos = chase().grupos;
  return `
  <div class="chase-linha ${bateu?"na-mira":""}" data-id="${x.id}">
    <img class="dl-img" loading="lazy" src="${escapeHTML(x.img||"")}" alt="">
    <span class="dl-nome">${escapeHTML(x.n)}
      <small>${escapeHTML(x.sn || x.s || "")}</small></span>
    <span class="chase-graf" id="chase-graf-${escapeHTML(x.id)}"></span>
    <span class="chase-preco">
      <b>${p ? formatarPreco(p) : "—"}</b>
      ${entrada ? `<small class="var-${seta}">${dif>0?"+":""}${(dif*100).toFixed(0)}% desde que entrou</small>` : ""}
    </span>
    <span class="chase-alvo">
      <input type="number" step="0.01" min="0" placeholder="preço alvo" value="${alvo||""}" data-alvo="${escapeHTML(x.id)}">
      ${bateu ? `<em>chegou no alvo</em>` : ""}
    </span>
    <select class="chase-mover" data-mover="${escapeHTML(x.id)}">
      ${grupos.map(g => `<option value="${g.id}"${g.id===x.grupo?" selected":""}>${escapeHTML(g.nome)}</option>`).join("")}
    </select>
    <span class="dl-acoes">
      <button class="dl-info" title="detalhes">i</button>
      <button class="dl-fora" title="tirar da lista">×</button>
    </span>
  </div>`;
}

function ligarChase(){
  const alvo = document.getElementById("chase-lista");
  if(!alvo) return;
  const c = chase();

  alvo.querySelectorAll(".chase-nome").forEach(el => {
    el.onblur = () => {
      const g = c.grupos.find(x => x.id === el.dataset.g);
      const t = el.textContent.trim();
      if(g && t){ g.nome = t; save(); pintarChase(); } else el.textContent = g ? g.nome : "";
    };
    el.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); el.blur(); } };
  });

  alvo.querySelectorAll(".chase-apagar").forEach(b => b.onclick = () => {
    const g = c.grupos.find(x => x.id === b.dataset.g);
    if(!g) return;
    const quantas = c.cartas.filter(x => x.grupo === g.id).length;
    if(quantas && !confirm(`Apagar "${g.nome}"? As ${quantas} cartas vão para o primeiro grupo.`)) return;
    c.grupos = c.grupos.filter(x => x.id !== g.id);
    c.cartas.forEach(x => { if(x.grupo === g.id) x.grupo = c.grupos[0].id; });
    save(); renderChase();
  });

  alvo.querySelectorAll(".chase-linha").forEach(el => {
    const x = c.cartas.find(y => y.id === el.dataset.id);
    if(!x) return;
    el.querySelector(".dl-info").onclick = () => openCard(deckParaCarta(x));
    el.querySelector(".dl-fora").onclick = () => {
      registrarDesfazer(`tirar ${x.n} da lista de desejo`, { chase: JSON.parse(JSON.stringify(c)) });
      S.chase.cartas = c.cartas.filter(y => y.id !== x.id); save(); renderChase();
    };
    const alvoInput = el.querySelector("[data-alvo]");
    if(alvoInput) alvoInput.onchange = () => { x.alvo = Number(alvoInput.value) || 0; save(); pintarChase(); };
    const mover = el.querySelector("[data-mover]");
    if(mover) mover.onchange = () => { x.grupo = mover.value; save(); pintarChase(); };
  });
}

function criarGrupoChase(){
  const nome = prompt("Nome do grupo (ex.: comprar em outubro, reserva do Modern):");
  if(!nome || !nome.trim()) return;
  chase().grupos.push({ id:"g" + Date.now().toString(36), nome:nome.trim() });
  save(); renderChase();
}

function buscarParaChase(){
  let busca = 0, achadas = [];
  const grupos = chase().grupos;
  modal(`<div class="modal-pad">
    <h3>Adicionar à lista de desejo</h3>
    <label class="field"><span>Nome da carta</span>
      <input type="text" id="ch-termo" placeholder="ex.: Mana Crypt" autocomplete="off"></label>
    <label class="field"><span>Em qual grupo</span>
      <select id="ch-grupo">${grupos.map(g => `<option value="${g.id}">${escapeHTML(g.nome)}</option>`).join("")}</select>
    </label>
    <div class="status" id="ch-status">digite pelo menos três letras</div>
    <div class="cards" id="ch-grade"></div>
  </div>`);
  const campo = document.getElementById("ch-termo");
  const status = document.getElementById("ch-status"), grade = document.getElementById("ch-grade");
  campo.focus();
  let t;
  campo.oninput = () => { clearTimeout(t); t = setTimeout(rodar, 380); };

  async function rodar(){
    const termo = campo.value.trim();
    if(termo.length < 3){ status.textContent = "digite pelo menos três letras"; grade.innerHTML = ""; return; }
    status.textContent = "buscando…"; grade.innerHTML = skeletons(6);
    const meu = ++busca;
    try{
      const json = await scryPage(`name:"${termo}"`, "prints", "usd", 1, "desc");
      if(meu !== busca || !grade.isConnected) return;
      achadas = (json.data || []).map(normalize);
      status.textContent = `${achadas.length} impressões — escolha a que você quer comprar`;
      grade.innerHTML = achadas.map(c => cardHTML(c)).join("");
      grade.querySelectorAll(".card").forEach(el => {
        const c = achadas.find(x => x.id === el.dataset.id);
        if(!c) return;
        const info = el.querySelector(".info");
        if(info) info.onclick = ev => { ev.stopPropagation(); openCard(c); };
        el.onclick = () => {
          const g = document.getElementById("ch-grupo").value;
          if(porNoChase(c, g)) toast(`${c.name} entrou na lista`);
          else toast(`${c.name} já estava na lista`);
          closeModal(); renderChase();
        };
      });
    }catch(e){
      if(meu === busca && grade.isConnected){ status.textContent = "erro na busca"; grade.innerHTML = ""; }
    }
  }
}

/* o gráfico de cada carta da lista vem do mesmo histórico diário do banco */
async function carregarPrecosDoChase(){
  const c = chase();
  for(const x of c.cartas.slice(0, 40)){
    const caixa = document.getElementById("chase-graf-" + x.id);
    if(!caixa || !caixa.isConnected) continue;
    try{
      const linhas = await supa(`price_history?card_id=eq.${encodeURIComponent(x.id)}&select=day,usd,usd_foil&order=day.asc&limit=120`);
      if(!caixa.isConnected) continue;
      const pontos = (linhas || []).map(l => ({ dia:l.day, v:Number(l.usd || l.usd_foil) })).filter(p => p.v > 0);
      if(pontos.length >= 2) caixa.innerHTML = sparkline(pontos);
      else caixa.innerHTML = `<small class="sem-hist">sem histórico ainda</small>`;
    }catch(e){ break; }
  }
}

            <select id="add-to" style="flex:1">${manuals.map(m=>`<option value="${m.id}">${escapeHTML(m.name)}</option>`).join("")}</select>
            <button class="btn ghost" id="add-go">Adicionar</button>
          </div>
        </div>` : ""}
      </div>
    </div>

    <div class="impressoes" id="impressoes">
      <span class="flabel">Todas as impressões</span>
      <div class="carregando">procurando…</div>
    </div>
  </div>`);

  document.getElementById("own-toggle").onclick = ()=>{
    toggleOwn(c); closeModal();
    if(isOwned(c.id) && c.acabamentoEscolhido){ S.owned[c.id].fin = c.acabamentoEscolhido; save(); renderKPIs(); }
    if(view.name==="collection"){ paintGrid(); paintProgress(); }
    else if(view.name==="catalogo"){ pintarCatalogo(); atualizarStatus(); }
  };
  const addGo = document.getElementById("add-go");
  if(addGo) addGo.onclick = ()=>{
    const col = customById(document.getElementById("add-to").value);
    if(!col) return;
    if(col.cards.some(x=>x.id===c.id)) return toast("Essa carta já está em " + col.name);
    col.cards.push(c); save(); closeModal(); toast(`Adicionada a ${col.name}`);
    if(view.name==="collection" && cur.def.id===col.id){ cur.cards.push(c); paintGrid(); paintProgress(); }
  };
  const rm = document.getElementById("rm-card");
  if(rm) rm.onclick = ()=>{
    const col = customById(cur.def.id);
    if(col && col.type === "manual"){
      registrarDesfazer(`remover ${c.name} de ${col.name}`, { custom: JSON.parse(JSON.stringify(S.custom)) });
      col.cards = col.cards.filter(x=>x.id!==c.id);
      cur.cards = cur.cards.filter(x=>x.id!==c.id);
      save();
    } else if(incluidasDe(cur.def.id).some(x => x.id === c.id)){
      registrarDesfazer(`tirar ${c.name} de ${cur.def.name}`, { inclusoes: JSON.parse(JSON.stringify(S.inclusoes||{})) });
      removerIncluida(cur.def.id, c.id);
    } else {
      // coleção por busca (inclusive as prontas): a carta vai para a lista de removidas
      registrarDesfazer(`remover ${c.name} desta coleção`, { exclusoes: JSON.parse(JSON.stringify(S.exclusoes||{})) });
      excluirDaColecao(cur.def.id, c.id);
    }
    closeModal(); go("collection", cur.def.id);
  };

  /* carta de duas faces: dá para ver o outro lado sem sair do detalhe */
  const virar = document.getElementById("virar-carta");
  if(virar){
    let lado = 0;
    virar.onclick = () => {
      lado = (lado + 1) % c.faces.length;
      const f = c.faces[lado], outra = c.faces[(lado + 1) % c.faces.length];
      const img = document.getElementById("carta-face");
      if(img) img.src = f.normal || f.small || img.src;
      virar.textContent = `↻ virar — ver ${outra.nome || "o outro lado"}`;
    };
  }

  const quero = document.getElementById("quero-detalhe");
  if(quero) quero.onclick = () => {
    if(naChase(c.id)){
      S.chase.cartas = S.chase.cartas.filter(x => x.id !== c.id); save();
      toast(`${c.name} saiu dos chase cards`);
    } else {
      porNoChase(c); toast(`${c.name} entrou nos chase cards`);
    }
    openCard(c);
  };

  const seletor = document.getElementById("acab-seletor");
  if(seletor) seletor.onclick = e => {
    const b = e.target.closest(".acab"); if(!b) return;
    c.acabamentoEscolhido = b.dataset.acab;
    if(isOwned(c.id)){ S.owned[c.id].fin = c.acabamentoEscolhido; save(); renderKPIs(); }
    openCard(c);
  };

  carregarHistorico(c);
  carregarImpressoes(c);
}


/* ---------- produtos selados da edição, com a foto real da caixa ---------- */
let evUnitarioAtual = 0;
async function carregarProdutosDoSet(st, cartas, cfg){
  // se já existe uma lista na tela (troca rápida de edição), ela sai antes:
  // era isso que fazia a mesma caixa aparecer duas vezes
  document.querySelectorAll("#set-produtos").forEach(el => el.remove());

  const alvo = document.createElement("div");
  alvo.id = "set-produtos";
  alvo.innerHTML = `<div class="status">procurando os produtos lacrados desta edição…</div>`;
  const painel = document.getElementById("set-analise");
  if(painel && painel.parentNode) painel.parentNode.appendChild(alvo);

  const produtos = await carregarSelados(st.code);
  if(!alvo.isConnected) return;              // o usuário já foi para outra edição
  if(!produtos.length){
    alvo.innerHTML = `<div class="empty" style="margin-top:22px">
      Não achei produtos lacrados catalogados para esta edição.</div>`;
    return;
  }
  pintarProdutos(st, produtos, cartas, cfg);
  const ids = produtos.map(p => p.tcg).filter(Boolean);
  if(ids.length){
    const precos = await precosDeSelados(ids);
    if(alvo.isConnected && Object.keys(precos).length) pintarProdutos(st, produtos, cartas, cfg);
  }
}

/* ---------- preço de mercado dos lacrados ----------
   O Scryfall não tem preço de produto lacrado e o MTGJSON também não.
   O preço vem do nosso banco, alimentado uma vez por dia pelo job com os
   dados públicos do TCGplayer. Enquanto não houver dado, vale o preço que
   você digitar — que continua tendo precedência sobre o automático. */
const cachePrecoSelado = {};
async function precosDeSelados(tcgIds){
  const faltam = tcgIds.filter(id => cachePrecoSelado[id] === undefined);
  if(faltam.length){
    faltam.forEach(id => { cachePrecoSelado[id] = null; });   // não pergunta duas vezes
    try{
      const lista = await supa(
        `sealed_prices?tcg_id=in.(${faltam.join(",")})&select=tcg_id,market,day&order=day.desc`);
      (lista || []).forEach(l => {
        if(cachePrecoSelado[l.tcg_id] == null) cachePrecoSelado[l.tcg_id] = { valor:Number(l.market)||0, dia:l.day };
      });
    }catch(e){}
  }
  const fora = {};
  tcgIds.forEach(id => { if(cachePrecoSelado[id]) fora[id] = cachePrecoSelado[id]; });
  return fora;
}

/* Cada caixa tem o seu próprio tipo de booster: contar uma Collector Box
   com o EV do Play Booster dá número errado, que era o que acontecia. */
function modeloDoProduto(pr, cfg){
  const sub = String(pr.sub || "").toLowerCase();
  if(sub === "collector") return "colecionador";
  if(sub === "play") return "play";
  if(sub === "draft" || sub === "set") return "draft";
  return cfg.modelo;
}
function boostersDoProduto(pr){
  if(pr.tam > 0) return pr.tam;                       // o MTGJSON diz quantos vêm
  if(pr.cat === "booster_pack") return 1;
  if(pr.cat === "booster_box") return BOOSTERS_POR_CAIXA[pr.sub] || BOOSTERS_POR_CAIXA.default;
  return 0;
}

function pintarProdutos(st, produtos, cartas, cfg){
  const alvo = document.getElementById("set-produtos");
  if(!alvo) return;
  const precos = ((S.selados && S.selados[st.code]) || {}).produtos || {};
  const est = cartas.length ? estatisticasDoSet(cartas) : null;
  const r = regiao();

  alvo.dataset.pronto = "1";
  try{ alvo.dataset.lista = JSON.stringify(produtos); }catch(e){}

  /* o preço automático vem em dólar; a tela mostra na moeda da região */
  const emMoeda = usd => {
    if(r.moeda === "BRL" && CAMBIO && CAMBIO.usd) return usd * CAMBIO.usd;
    if(r.moeda === "EUR" && CAMBIO && CAMBIO.usd && CAMBIO.eur) return usd * (CAMBIO.usd / CAMBIO.eur);
    return usd;
  };
  /* lê sempre do estado, não de uma cópia: senão o preço recém-digitado
     não aparece na conta até repintar a página inteira */
  const precoManual = pr => {
    const atuais = ((S.selados && S.selados[st.code]) || {}).produtos || precos;
    for(const u of (pr.uuids || [pr.uuid])){ const v = Number(atuais[u]); if(v) return v; }
    return 0;
  };

  const ordem = { booster_box:0, booster_pack:1, bundle:2,
                  box_set:3, commander_deck:4, deck:5, prerelease_kit:6,
                  booster_case:15, bundle_case:16, case:17 };
  /* "Case" é a caixa de atacado que vem com seis displays dentro — quem
     coleciona não compra isso, e elas só enchiam a lista. Ficam escondidas,
     com um link para quem quiser ver. */
  const ehCase = pr => /_case$/.test(pr.cat || "") || pr.cat === "case" || /\bcases?\b/i.test(pr.nome || "");
  const cases = produtos.filter(ehCase);
  const mostrarCases = !!(S.config && S.config.mostrarCases);
  const lista = (mostrarCases ? produtos.slice() : produtos.filter(pr => !ehCase(pr)))
    .sort((a,b) => (ordem[a.cat] ?? 10) - (ordem[b.cat] ?? 10) || String(a.nome).localeCompare(String(b.nome)));

  const linhaProduto = pr => {
    const img = imagemProduto(pr.tcg);
    const auto = pr.tcg && cachePrecoSelado[pr.tcg] ? emMoeda(cachePrecoSelado[pr.tcg].valor) : 0;
    const manual = precoManual(pr);
    const preco = manual || auto;
    const boosters = boostersDoProduto(pr);
    const modelo = modeloDoProduto(pr, cfg);
    const ev = boosters && est ? evComModelo(est, cfg, modelo, "mediana") * boosters : 0;
    const rel = ev && preco ? ev / preco : null;
    const cor = rel === null ? "" : rel >= 1 ? "acima" : rel >= 0.75 ? "perto" : "abaixo";
    const rotuloModelo = boosters > 1 && MODELOS_BOOSTER[modelo] ? MODELOS_BOOSTER[modelo].rotulo : "";
    return `
    <div class="produto" data-uuid="${escapeHTML(pr.uuid)}">
      <div class="produto-foto">
        ${img ? `<img src="${escapeHTML(img)}" alt="${escapeHTML(pr.nome)}" loading="lazy"
                   onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sem-foto',textContent:'sem foto'}))">`
              : `<span class="sem-foto">sem foto</span>`}
      </div>
      <div class="produto-info">
        <b>${escapeHTML(pr.nome)}</b>
        <span class="produto-cat">${escapeHTML(CATEGORIAS_PT[pr.cat] || String(pr.cat || "").replace(/_/g," "))}${
          boosters > 1 ? ` · ${boosters} boosters${rotuloModelo ? ` · ${escapeHTML(rotuloModelo)}` : ""}` : ""}</span>
        <div class="produto-preco">
          <input type="number" step="0.01" min="0"
                 placeholder="${auto ? formatarPreco({valor:auto, simbolo:r.simbolo}) + " de mercado" : "preço em " + r.simbolo}"
                 value="${manual || ""}" data-preco="${escapeHTML(pr.uuid)}">
          <span class="produto-rel ${cor}">${rel !== null ? (rel*100).toFixed(0) + "%" : ""}</span>
        </div>
        <span class="produto-ev">${[
            auto ? `mercado hoje: ${formatarPreco({valor:auto, simbolo:r.simbolo})}` : "",
            ev ? `cartas dentro: ~${formatarPreco({valor:ev, simbolo:r.simbolo})}` : ""
          ].filter(Boolean).join(" · ")}</span>
        ${pr.tcg ? `<a class="produto-link" target="_blank" rel="noopener"
           href="https://www.tcgplayer.com/product/${encodeURIComponent(pr.tcg)}">ver no TCGplayer ↗</a>` : ""}
      </div>
    </div>`;
  };

  const temAuto = lista.some(pr => pr.tcg && cachePrecoSelado[pr.tcg]);
  alvo.innerHTML = `
    <div class="section-head" style="margin-top:34px">
      <div>
        <h2 style="font-size:17px">Produtos lacrados</h2>
        <p>${lista.length} produtos catalogados nesta edição, com a foto oficial.
        ${temAuto ? "O preço de mercado vem do TCGplayer, atualizado todo dia."
                  : "Ainda não tenho preço de mercado destes produtos — ponha o que você vê na loja."}
        O que você digitar vale mais que o automático, e a % compara o preço com o valor das cartas de dentro.
        ${cases.length ? `<br><button class="ligar-cases" id="ver-cases">${mostrarCases
            ? `esconder as ${cases.length} caixas de atacado (case)`
            : `mostrar as ${cases.length} caixas de atacado (case)`}</button>` : ""}</p>
      </div>
    </div>
    <div class="produtos">${lista.map(linhaProduto).join("")}</div>`;

  const btnCases = document.getElementById("ver-cases");
  if(btnCases) btnCases.onclick = () => {
    S.config.mostrarCases = !mostrarCases; save();
    pintarProdutos(st, produtos, cartas, cfg);
  };

  /* Repintar a lista inteira a cada tecla tirava o foco do campo no meio do
     número. Agora só a linha mexida é refeita. */
  const guardar = el => {
    const uuid = el.dataset.preco;
    S.selados = S.selados || {};
    S.selados[st.code] = S.selados[st.code] || {};
    S.selados[st.code].produtos = S.selados[st.code].produtos || {};
    S.selados[st.code].produtos[uuid] = Number(el.value) || 0;
    save();
    const pr = lista.find(p => p.uuid === uuid);
    const linha = el.closest(".produto");
    if(!pr || !linha) return;
    const novo = document.createElement("div");
    novo.innerHTML = linhaProduto(pr);
    const rel = novo.querySelector(".produto-rel"), evTxt = novo.querySelector(".produto-ev");
    const relAtual = linha.querySelector(".produto-rel"), evAtual = linha.querySelector(".produto-ev");
    if(rel && relAtual){ relAtual.className = rel.className; relAtual.textContent = rel.textContent; }
    if(evTxt && evAtual) evAtual.textContent = evTxt.textContent;
  };
  const temporizadores = new WeakMap();
  alvo.querySelectorAll("[data-preco]").forEach(el => {
    el.oninput = () => {
      clearTimeout(temporizadores.get(el));
      temporizadores.set(el, setTimeout(() => guardar(el), 500));
    };
    el.onchange = () => { clearTimeout(temporizadores.get(el)); guardar(el); };
  });
}

/* ---------- histórico de preço: vem do banco, arquivado todo dia ---------- */
async function carregarHistorico(c){
  const alvo = document.getElementById("grafico");
  if(!alvo) return;
  try{
    const linhas = await supa(`price_history?card_id=eq.${encodeURIComponent(c.id)}&select=day,usd,usd_foil&order=day.asc&limit=400`);
    if(!alvo.isConnected) return;
    const pontos = linhas.map(l => ({ dia:l.day, v:Number(l.usd || l.usd_foil) })).filter(x => x.v > 0);

    if(pontos.length === 0){
      alvo.innerHTML = `<span class="carregando">esta carta ainda não entrou no arquivo diário</span>`;
      return;
    }
    if(pontos.length === 1){
      alvo.innerHTML = `<span class="carregando">arquivando desde ${pontos[0].dia} — o gráfico ganha forma nos próximos dias</span>`;
      return;
    }
    const primeiro = pontos[0].v, ultimo = pontos[pontos.length-1].v;
    const varia = ((ultimo/primeiro) - 1) * 100;
    alvo.innerHTML = `
      <div class="grafico-topo">
        <span>${pontos.length} dias</span>
        <b class="${varia >= 0 ? "sobe" : "desce"}">${varia >= 0 ? "▲" : "▼"} ${Math.abs(varia).toFixed(1)}%</b>
      </div>
      ${sparkline(pontos)}`;
  }catch(e){
    if(alvo.isConnected) alvo.innerHTML = `<span class="carregando">histórico indisponível agora</span>`;
  }
}

function sparkline(pontos){
  const L = 260, A = 54, pad = 3;
  const vs = pontos.map(p => p.v);
  const min = Math.min(...vs), max = Math.max(...vs), amp = (max - min) || 1;
  const x = i => pad + (i / (pontos.length - 1)) * (L - pad*2);
  const y = v => A - pad - ((v - min) / amp) * (A - pad*2);
  const linha = pontos.map((p,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area = `${linha} L${x(pontos.length-1).toFixed(1)},${A} L${x(0).toFixed(1)},${A} Z`;
  const fim = pontos[pontos.length-1];
  return `<svg viewBox="0 0 ${L} ${A}" class="spark" role="img"
      aria-label="variação de preço de ${pontos[0].dia} a ${fim.dia}">
    <path d="${area}" fill="var(--gold-dim)" opacity=".18"></path>
    <path d="${linha}" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linejoin="round"></path>
    <circle cx="${x(pontos.length-1).toFixed(1)}" cy="${y(fim.v).toFixed(1)}" r="2.6" fill="var(--gold)"></circle>
  </svg>`;
}

/* ---------- todas as impressões da mesma carta ---------- */
/* Símbolo oficial da edição a partir do código. O normalize() guarda o
   código em maiúsculo e o Scryfall entrega minúsculo — daí o toLowerCase. */
function simboloDoSet(code, alt){
  const st = (SETS || []).find(x => x.code === String(code || "").toLowerCase());
  return st && st.icone
    ? `<img class="set-simbolo" src="${st.icone}" alt="${escapeHTML(alt || code || "")}" loading="lazy">`
    : `<span class="set-simbolo vazio">${escapeHTML(String(code || "").toUpperCase())}</span>`;
}

async function carregarImpressoes(c){
  const alvo = document.getElementById("impressoes");
  if(!alvo) return;
  carregarSets().then(() => {          // sem os sets não há símbolo para desenhar
    if(alvo.isConnected && alvo.dataset.semSimbolo) carregarImpressoes(c);
  }).catch(()=>{});
  try{
    const url = c.impressoesUri
      || `${API}/cards/search?q=${encodeURIComponent(`!"${c.name}"`)}&unique=prints&order=released&dir=asc`;
    const r = await fetch(url, { headers:{Accept:"application/json"} });
    if(!r.ok) throw new Error("busca falhou");
    const j = await r.json();
    if(!alvo.isConnected) return;
    const versoes = (j.data||[]).map(normalize);
    if(versoes.length <= 1){
      alvo.innerHTML = `<span class="flabel">Todas as impressões</span>
        <div class="carregando">esta carta só foi impressa uma vez</div>`;
      return;
    }
    const tenho = versoes.filter(v => isOwned(v.id)).length;

    /* Impressões que repetem a mesma ilustração ficam num bloco só: a arte
       aparece uma vez e as edições que a usam ficam listadas embaixo. */
    const mapa = new Map();
    versoes.forEach(v => {
      const chave = v.arte || (v.name + "|" + v.artist);
      if(!mapa.has(chave)) mapa.set(chave, []);
      mapa.get(chave).push(v);
    });
    const artes = [...mapa.values()];

    alvo.innerHTML = `
      <span class="flabel">Todas as impressões — ${versoes.length} em ${artes.length} ${artes.length>1?"artes":"arte"}${tenho?` · você tem ${tenho}`:""}</span>
      <div class="impr-tira">
        ${artes.map(g => {
          const capa = g.find(v => v.id === c.id) || g.find(v => isOwned(v.id)) || g[0];
          const aqui = g.some(v => v.id === c.id), meu = g.some(v => isOwned(v.id));
          return `
          <div class="impr-grupo ${aqui?"atual":""} ${meu?"tenho":""}">
            ${capa.small ? `<img class="impr-arte" loading="lazy" src="${capa.small}" alt="${escapeHTML(capa.name)}">`
                         : `<div class="impr-arte sem-arte">${escapeHTML(capa.name)}</div>`}
            <span class="impr-artista">${escapeHTML(capa.artist || "")}${g.length>1?` · ${g.length} edições`:""}</span>
            <div class="impr-eds">
              ${g.map(v => `
                <button class="impr ${isOwned(v.id)?"owned":""} ${v.id===c.id?"atual":""}" data-id="${v.id}"
                        title="${escapeHTML(v.setName||"")} (${escapeHTML((v.set||"").toUpperCase())}) · #${escapeHTML(v.num||"")}${
                          rotuloVariante(v) ? " · " + escapeHTML(rotuloVariante(v)) : ""} · ${v.released||""}">
                  <span class="impr-set">${simboloDoSet(v.set, v.setName)}</span>
                  <span class="impr-ano">${(v.released||"").slice(0,4)}</span>
                  ${rotuloVariante(v) ? `<span class="impr-var">${escapeHTML(rotuloVariante(v))}</span>` : ""}
                  ${precoLocal(v)?`<span class="impr-preco">${formatarPreco(precoLocal(v))}</span>`:""}
                </button>`).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
      <p class="impr-dica">Cada bloco é uma ilustração. Clique numa edição para ver os detalhes dela — preço e raridade mudam de uma para outra.</p>`;
    // se os símbolos ainda não tinham chegado, repinta quando chegarem
    if(alvo.querySelector(".set-simbolo.vazio")) alvo.dataset.semSimbolo = "1";
    else delete alvo.dataset.semSimbolo;
    alvo.querySelectorAll(".impr").forEach(el => {
      el.onclick = () => {
        const v = versoes.find(x => x.id === el.dataset.id);
        if(v) openCard(v);
      };
    });
  }catch(e){
    if(alvo.isConnected) alvo.innerHTML = `<span class="flabel">Todas as impressões</span>
      <div class="carregando">não consegui buscar agora</div>`;
  }
}

         "terrenos de arte completa",
         "cartas míticas acima de 50 dólares"]
        .map(e => `<button class="ex" data-ex="${escapeHTML(e)}">${escapeHTML(e)}</button>`).join("")}
    </div>

    <div id="c-leitura" class="leitura"></div>

    <label class="field" style="margin-top:14px"><span>Nome da coleção</span>
      <input type="text" id="c-name" placeholder="dê um nome" value="${escapeHTML(ed ? ed.name : "")}">
    </label>
    <div class="dupla">
      <label class="field"><span>Ícone</span><input type="text" id="c-icon" value="${escapeHTML(ed ? (ed.icon||"⭐") : "⭐")}" maxlength="4"></label>
      <label class="field"><span>Descrição (opcional)</span><input type="text" id="c-desc" value="${escapeHTML(ed ? (ed.desc||"") : "")}"></label>
    </div>
    <label class="field"><span>Versões da mesma carta</span>
      <select id="c-unique">
        ${VERSOES.map(([v,n]) => `<option value="${v}"${(ed ? uniqueDaColecao(ed) : "cards")===v?" selected":""}>${n}</option>`).join("")}
      </select>
      <small>"Uma por arte" repete a carta quando a ilustração muda — bom para quem coleciona arte.
      "Todas as impressões" traz cada versão de cada set.</small>
    </label>

    <details class="avancado">
      <summary>Ver a busca gerada</summary>
      <input type="text" id="c-q" value="${escapeHTML(preset.query || "")}" placeholder="a busca aparece aqui conforme você escreve">
      <small>Sintaxe do Scryfall. Só mexa aqui se quiser ajustar na mão — o normal é escrever em português acima.</small>
    </details>

    <div style="display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap">
      ${ed ? "<span></span>" : `<button class="btn ghost" id="c-manual">Prefiro montar carta a carta</button>`}
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="c-cancel">Cancelar</button>
        <button class="btn" id="c-save">${ed ? "Salvar" : "Criar coleção"}</button>
      </div>
    </div>
  </div>`);

  const frase = document.getElementById("c-frase");
  const nome = document.getElementById("c-name");
  let timer;
  frase.addEventListener("input", () => {
    criar.frase = frase.value;
    if(!nome.dataset.tocado) nome.value = tituloDaFrase(frase.value);
    clearTimeout(timer);
    timer = setTimeout(lerFrase, 350);
  });
  nome.addEventListener("input", () => { nome.dataset.tocado = "1"; });

  document.getElementById("c-exemplos").onclick = e => {
    const b = e.target.closest(".ex"); if(!b) return;
    frase.value = b.dataset.ex;
    frase.dispatchEvent(new Event("input"));
    frase.focus();
  };

  document.getElementById("c-cancel").onclick = closeModal;
  const btnManual = document.getElementById("c-manual");
  if(btnManual) btnManual.onclick = () => salvarColecao("manual");
  document.getElementById("c-save").onclick = () => salvarColecao(ed ? ed.type : "query");

  const qManual = document.getElementById("c-q");
  qManual.addEventListener("input", () => { criar.q = qManual.value; });

  // sem a lista de edições carregada, o interpretador não reconhece nome de set —
  // e o usuário pode nunca ter aberto o catálogo nesta sessão
  carregarSets().then(() => { if(criar.frase) lerFrase(); });
  carregarSubtipos();

  if(criar.frase) lerFrase();
  else if(preset.query) contarPreview(preset.query);
  if(!ed) frase.focus();
}

function tituloDaFrase(f){
  const t = f.trim().replace(/\s+/g, " ");
  if(!t) return "";
  return t.charAt(0).toUpperCase() + t.slice(1, 60);
}

function lerFrase(){
  const { partes, duvidas } = interpretar(criar.frase);
  // aplica as respostas que o usuário já deu
  const pendentes = [];
  duvidas.forEach(d => {
    const escolhidas = criar.respostas[d.id];
    if(escolhidas === undefined){ pendentes.push(d); return; }
    (escolhidas || []).forEach(parte => partes.push(parte));
  });
  criar.partes = partes.filter(p => !criar.removidas.includes(p.id));
  criar.duvidas = pendentes;
  criar.q = queryDasPartes(partes);
  const campo = document.getElementById("c-q");
  if(campo) campo.value = criar.q;
  pintarLeitura();
  if(partes.length && !pendentes.length) contarPreview(criar.q);
}

function pintarLeitura(){
  const alvo = document.getElementById("c-leitura");
  if(!alvo) return;
  if(!criar.frase.trim()){ alvo.innerHTML = ""; return; }

  const chips = criar.partes.length
    ? `<div class="entendi">
         <span class="flabel">Entendi — clique no × para tirar</span>
         <div class="chips-lidos">${criar.partes.map(p => `
           <span class="lido">${escapeHTML(p.rotulo)}
             <button class="tirar-lido" data-tirar="${escapeHTML(p.id)}" title="tirar da coleção">×</button>
           </span>`).join("")}
           ${criar.removidas.length ? `<button class="restaurar" id="restaurar-partes">restaurar ${criar.removidas.length}</button>` : ""}
         </div>
       </div>`
    : (criar.duvidas.length ? ""
        : `<div class="entendi"><span class="carregando">ainda não reconheci nada — tente citar cor, tipo, ano, edição ou raridade</span></div>`);

  const perguntas = criar.duvidas.map(d => {
    const marcadas = criar.rascunho && criar.rascunho[d.id] ? criar.rascunho[d.id] : [];
    return `
    <div class="pergunta" data-id="${escapeHTML(d.id)}">
      <p>${escapeHTML(d.pergunta)}</p>
      <span class="pergunta-dica">dá para marcar mais de uma</span>
      <div class="opcoes">
        ${d.opcoes.map((o,i) => `<button class="op ${marcadas.includes(i)?"on":""}" data-op="${i}">${escapeHTML(o.rotulo)}</button>`).join("")}
      </div>
      <div class="pergunta-acoes">
        <button class="btn" data-confirmar="1"${marcadas.length?"":" disabled"}>
          ${marcadas.length > 1 ? `Usar as ${marcadas.length}` : "Confirmar"}</button>
        <button class="btn ghost" data-ignorar="1">Ignorar isso</button>
      </div>
    </div>`;
  }).join("");

  alvo.innerHTML = chips + perguntas + `<div class="preview-contagem" id="c-contagem"></div>`;

  alvo.querySelectorAll(".pergunta").forEach(el => {
    el.onclick = e => {
      const d = criar.duvidas.find(x => x.id === el.dataset.id);
      if(!d) return;
      criar.rascunho = criar.rascunho || {};

      const op = e.target.closest("[data-op]");
      if(op){
        const i = Number(op.dataset.op);
        const atual = criar.rascunho[d.id] || [];
        criar.rascunho[d.id] = atual.includes(i) ? atual.filter(x => x !== i) : atual.concat(i);
        pintarLeitura();
        return;
      }
      if(e.target.closest("[data-confirmar]")){
        const marcadas = criar.rascunho[d.id] || [];
        if(!marcadas.length) return;
        const partes = marcadas.map(i => d.opcoes[i].parte).filter(Boolean);
        criar.respostas[d.id] = partes.length > 1 ? [combinarPartes(partes)] : partes;
        delete criar.rascunho[d.id];
        lerFrase();
        return;
      }
      if(e.target.closest("[data-ignorar]")){
        criar.respostas[d.id] = [];
        delete criar.rascunho[d.id];
        lerFrase();
      }
    };
  });

  alvo.querySelectorAll("[data-tirar]").forEach(el => {
    el.onclick = () => {
      const alvoId = el.dataset.tirar;
      // se veio de uma pergunta respondida, a pergunta volta a ser feita
      const daPergunta = Object.keys(criar.respostas).find(k =>
        (criar.respostas[k] || []).some(p => p.id === alvoId));
      if(daPergunta) delete criar.respostas[daPergunta];
      else criar.removidas.push(alvoId);
      lerFrase();
    };
  });
  const restaurar = document.getElementById("restaurar-partes");
  if(restaurar) restaurar.onclick = () => { criar.removidas = []; lerFrase(); };
}

async function contarPreview(q){
  const alvo = document.getElementById("c-contagem");
  if(!alvo) return;
  alvo.textContent = "contando…";
  try{
    const json = await scryPage(q, "cards", "name", 1);
    if(!alvo.isConnected) return;
    const n = json.total_cards || 0;
    if(n === 0){ alvo.innerHTML = `<b class="vazio">nenhuma carta encontrada</b> — tente afrouxar a descrição`; return; }
    alvo.innerHTML = `<b>${n.toLocaleString("pt-BR")}</b> cartas nessa coleção`
      + (n > 3000 ? ` <span class="grande">— é bastante; dá para apertar por raridade, período ou preço</span>` : "");
  }catch(e){
    if(alvo.isConnected) alvo.textContent = "não consegui contar agora";
  }
}

function salvarColecao(tipo){
  const nome = document.getElementById("c-name").value.trim();
  if(!nome) return toast("Dê um nome para a coleção");
  const q = (document.getElementById("c-q").value || "").trim();
  if(tipo === "query" && !q) return toast("Descreva o que você quer colecionar");
  if(tipo === "query" && criar.duvidas.length) return toast("Responda a pergunta acima primeiro");

  const icone = document.getElementById("c-icon").value.trim() || "⭐";
  const desc = document.getElementById("c-desc").value.trim();

  if(criar.editando){
    const col = customById(criar.editando.id);
    if(!col) return toast("coleção não encontrada");
    registrarDesfazer(`editar ${col.name}`, { custom: JSON.parse(JSON.stringify(S.custom)) });
    Object.assign(col, { name:nome, icon:icone, desc:desc || criar.frase.trim(),
                         frase:criar.frase.trim(), q: col.type === "query" ? q : null,
                         unique: document.getElementById("c-unique").value });
    definirUnique(col.id, document.getElementById("c-unique").value);
    save(); closeModal(); go("collection", col.id);
    return;
  }

  const c = {
    id:"c" + Date.now().toString(36), type:tipo, name:nome,
    desc: desc || (tipo === "query" ? criar.frase.trim() : ""),
    frase: criar.frase.trim(), icon:icone,
    q: tipo === "query" ? q : null, order:"name", cards:[], createdAt:Date.now(),
    unique: (document.getElementById("c-unique") || {}).value || "cards"
  };
  S.custom.push(c); save(); closeModal(); go("collection", c.id);
}

function shareCollection(def){
  const payload = { app:"collector", v:1, name:def.name, desc:def.desc, icon:def.icon||"⭐",
                    type:def.type||"query", q:def.q||null, cards:def.cards||[] };
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  modal(`<div class="modal-pad">
    <h3>Compartilhar coleção</h3>
    <p style="color:var(--muted);font-size:13px">Copie o código abaixo e mande para outro colecionador. Ele importa em <b>Backup → Importar</b> e passa a acompanhar o mesmo desafio.</p>
    <textarea id="share-code" rows="6" style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px">${code}</textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
      <button class="btn" id="copy">Copiar código</button>
    </div>
    <p style="color:var(--faint);font-size:12px;margin-top:14px">Na versão com comunidade, isso vira um link público com ranking de quem completou primeiro.</p>
  </div>`);
  document.getElementById("copy").onclick = async ()=>{
    try{ await navigator.clipboard.writeText(code); toast("Código copiado"); }
    catch(e){ document.getElementById("share-code").select(); toast("Selecione e copie (Cmd+C)"); }
  };
}

document.getElementById("btn-backup").onclick = ()=>{
  modal(`<div class="modal-pad">
    <h3>Backup e importação</h3>
    <p style="color:var(--muted);font-size:13px">Tudo fica salvo neste navegador. Exporte para não perder e para levar para outro dispositivo.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0">
      <button class="btn" id="exp">Exportar meus dados</button>
      <button class="btn ghost" id="imp">Importar coleção / backup</button>
    </div>
    <div class="kv"><span>Cartas marcadas</span><b>${ownedCount()}</b></div>
    <div class="kv"><span>Coleções próprias</span><b>${S.custom.length}</b></div>
    <div class="kv"><span>Valor estimado</span><b style="color:var(--gold)">${money(ownedValue())}</b></div>
  </div>`);
  document.getElementById("exp").onclick = ()=>{
    const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `collector-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); toast("Backup baixado");
  };
  document.getElementById("imp").onclick = ()=>{
    const code = prompt("Cole aqui o código da coleção ou o conteúdo do arquivo de backup:");
    if(!code) return;
    try{
      let obj;
      try{ obj = JSON.parse(code); }
      catch(e){ obj = JSON.parse(decodeURIComponent(escape(atob(code.trim())))); }
      if(obj.app==="collector"){
        obj.id = "c"+Date.now().toString(36); obj.cards = obj.cards||[]; obj.createdAt=Date.now();
        S.custom.push(obj); save(); closeModal(); go("mine"); toast("Coleção importada");
      }else if(obj.owned){
        S.owned = Object.assign(S.owned, obj.owned);
        S.custom = S.custom.concat(obj.custom||[]);
        S.totals = Object.assign(S.totals, obj.totals||{});
        save(); closeModal(); render(); toast("Backup restaurado");
      }else toast("Formato não reconhecido");
    }catch(e){ toast("Não consegui ler esse código"); }
  };
};

/* ---------------- utils ---------------- */
function escapeHTML(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
let toastT;
function toast(msg){
  clearTimeout(toastT);
  let el = document.querySelector(".toast");
  if(!el){ el = document.createElement("div"); el.className="toast"; document.body.appendChild(el); }
  el.textContent = msg;
  toastT = setTimeout(()=>el.remove(), 2600);
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* ---------------- região ---------------- */
function pintarBotaoRegiao(){
  const b = document.getElementById("btn-regiao");
  if(b) b.textContent = regiao().nome;
}

document.getElementById("btn-regiao").onclick = ()=>{
  const atual = S.config.regiao;
  modal(`<div class="modal-pad">
    <h3>Região da conta</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 18px">
      Define a moeda dos preços e qual mercado o app mostra primeiro.</p>
    <div class="opcoes-regiao">
      ${Object.entries(REGIOES).map(([k,r]) => `
        <button class="opcao ${k===atual?"on":""}" data-regiao="${k}">
          <b>${r.nome}</b>
          <span>${r.simbolo} · ${r.fonte}</span>
        </button>`).join("")}
    </div>
    <div class="nota-regiao">
      <b>Sobre o Brasil:</b> o Ligamagic não publica preços para outros aplicativos, então em reais o valor
      é <b>convertido do dólar pela cotação do dia</b> e aparece marcado como estimativa. O link para a
      página da carta no Ligamagic está em toda carta — lá você vê o preço real das lojas brasileiras.
      ${CAMBIO && CAMBIO.usd ? `<br><br>Cotação de agora: US$ 1 = R$ ${CAMBIO.usd.toFixed(2)}` : ""}
    </div>
  </div>`);
  root.querySelectorAll("[data-regiao]").forEach(el => {
    el.onclick = async ()=>{
      S.config.regiao = el.dataset.regiao;
      save();
      await carregarCambio();
      closeModal(); pintarBotaoRegiao(); render();
      toast(`Preços em ${regiao().simbolo} — ${regiao().nome}`);
    };
  });
};

/* o câmbio chega depois; quando chegar, os preços em real se acertam sozinhos */
carregarCambio().then(()=>{ if(regiao().moeda === "BRL") render(); else renderKPIs(); });
pintarBotaoRegiao();
render();
</script>
