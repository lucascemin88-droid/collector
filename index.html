/* =====================================================================
   CARTÃO PARA POSTAR

   Uma imagem quadrada com o melhor da coleção, feita aqui mesmo no
   aparelho — nada sobe para servidor nenhum. As artes vêm do Scryfall
   com CORS liberado, então o canvas não fica "sujo" e a imagem pode ser
   salva de verdade.
   ===================================================================== */
async function abrirCartaoDaColecao(){
  const todas = cartasQueTenho();
  if(!todas.length) return toast("marque algumas cartas antes");

  modal(`<div class="modal-pad">
    <h3>Cartão da sua coleção</h3>
    <p style="color:var(--muted);font-size:13px;margin:6px 0 14px">
      Uma imagem quadrada com as nove cartas mais valiosas que você tem, o total e o progresso.
      É montada aqui no seu aparelho — nada sobe para lugar nenhum.</p>
    <div id="cartao-alvo" class="cartao-previa"><span class="carregando">montando…</span></div>
    <div class="pergunta-acoes">
      <button class="btn" id="cartao-baixar" disabled>Baixar a imagem</button>
      <button class="btn ghost" id="cartao-fechar">Fechar</button>
    </div>
    <p class="dg-txt" id="cartao-dica"></p>
  </div>`);
  document.getElementById("cartao-fechar").onclick = closeModal;

  const melhores = todas.slice().sort((a, b) => (b.unit || 0) - (a.unit || 0)).slice(0, 9);
  const url = await desenharCartao(melhores, todas);
  const alvo = document.getElementById("cartao-alvo");
  if(!alvo || !alvo.isConnected) return;
  alvo.innerHTML = `<img src="${url}" alt="cartão da coleção">`;

  const baixar = document.getElementById("cartao-baixar");
  baixar.disabled = false;
  baixar.onclick = () => {
    const a = document.createElement("a");
    a.href = url; a.download = "minha-colecao.png";
    document.body.appendChild(a); a.click(); a.remove();
  };
  document.getElementById("cartao-dica").textContent = ehIPhone()
    ? "No iPhone, toque e segure a imagem acima e escolha “Adicionar às Fotos”."
    : "A imagem tem 1080 × 1080, o tamanho que o Instagram pede.";
}

function carregarImagem(src){
  return new Promise(res => {
    if(!src) return res(null);
    const img = new Image();
    img.crossOrigin = "anonymous";      // sem isto o canvas fica sujo e não dá para salvar
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
}

async function desenharCartao(melhores, todas){
  const L = 1080, cv = document.createElement("canvas");
  cv.width = L; cv.height = L;
  const g = cv.getContext("2d");

  const cor = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#000";
  const fundo = cor("--bg") || "#0a0b0e", ouro = cor("--accent") || "#e3b25a";
  const texto = cor("--text") || "#e8eaf0", fraco = cor("--text-3") || "#8a92a6";

  g.fillStyle = fundo; g.fillRect(0, 0, L, L);

  // grade 3×3 das artes, ocupando a metade de cima
  const artes = await Promise.all(melhores.map(c => carregarImagem(c.arteCrop || c.small)));
  const lado = 300, gap = 12, x0 = (L - (lado*3 + gap*2)) / 2, y0 = 118;
  artes.forEach((img, i) => {
    const x = x0 + (i % 3) * (lado + gap), y = y0 + Math.floor(i / 3) * (lado*0.72 + gap);
    const alt = lado * 0.72;
    g.save();
    g.beginPath();
    if(g.roundRect) g.roundRect(x, y, lado, alt, 10); else g.rect(x, y, lado, alt);
    g.clip();
    if(img){
      const escala = Math.max(lado / img.width, alt / img.height);
      g.drawImage(img, x + (lado - img.width*escala)/2, y + (alt - img.height*escala)/2,
                  img.width*escala, img.height*escala);
    } else {
      g.fillStyle = "#1e222c"; g.fillRect(x, y, lado, alt);
    }
    g.restore();
  });

  const fonte = (t, p, c) => { g.font = `${p} ${t}px -apple-system, "Segoe UI", system-ui, sans-serif`; g.fillStyle = c; };

  fonte(30, 700, ouro); g.textAlign = "left";
  g.fillText("COLLECTOR", 60, 74);
  fonte(20, 500, fraco);
  g.fillText("Magic: The Gathering", 60, 102);

  const base = y0 + 3*(lado*0.72) + 2*gap + 74;
  fonte(76, 700, texto); g.textAlign = "center";
  g.fillText(ownedCount().toLocaleString("pt-BR"), L/2 - 230, base);
  fonte(22, 500, fraco); g.fillText("cartas", L/2 - 230, base + 34);

  fonte(76, 700, ouro);
  g.fillText(money(ownedValue()), L/2 + 90, base);
  fonte(22, 500, fraco); g.fillText("valor estimado", L/2 + 90, base + 34);

  const edicoes = new Set(todas.map(c => c.set).filter(Boolean)).size;
  fonte(20, 500, fraco); g.textAlign = "center";
  g.fillText(`${edicoes} edições diferentes · ${(S.decks||[]).length} decks montados`, L/2, base + 86);

  g.strokeStyle = ouro; g.globalAlpha = .35;
  g.strokeRect(28, 28, L-56, L-56);
  g.globalAlpha = 1;

  return cv.toDataURL("image/png");
}

/* =====================================================================
   O QUE MUDOU DESDE A ÚLTIMA VEZ

   Um sino que não inventa: ele compara o que existe agora com a hora em
   que você fechou o app da última vez. Enquanto não houver servidor de
   envio, é isto que dá para prometer — e é honesto, porque só fala de
   coisa que já aconteceu.
   ===================================================================== */
let avisos_ = { movers:null, carregando:false };

function vistoEm(){ return Number((S.config || {}).visto) || 0; }

/* "já vi" zera de verdade: a hora avança, as variações de preço que eu
   acabei de mostrar saem da conta, e os chase cards que chegaram no alvo
   ficam marcados como avisados — senão o sino ficaria aceso para sempre
   por causa de uma carta que continua no preço. */
function marcarVisto(){
  S.config.visto = Date.now();
  S.config.avisosVistos = chaseNoAlvo().map(x => x.id);
  avisos_.movers = [];
  save();
}

async function carregarAvisos(){
  if(avisos_.carregando || avisos_.movers) return;
  const itens = itensDaColecao();
  if(!itens.length) return;
  avisos_.carregando = true;
  try{
    const dias = Math.max(1, Math.min(30, Math.ceil((Date.now() - (vistoEm() || Date.now())) / 86400000)));
    avisos_.movers = await rpc("collection_movers", { p_itens: itens, p_dias: dias, p_limite: 4 }) || [];
  }catch(e){ avisos_.movers = []; }
  avisos_.carregando = false;
  if(view.name === "home") pintarSino();
}

/* chase card que chegou no preço que você queria */
function chaseNoAlvo(){
  const jaAvisados = (S.config || {}).avisosVistos || [];
  return ((S.chase || {}).cartas || []).filter(x => {
    const alvo = Number(x.alvo) || 0;
    if(!alvo || jaAvisados.includes(x.id)) return false;
    const p = precoLocal(deckParaCarta(x));
    return p && p.valor > 0 && p.valor <= alvo;
  });
}

function contarAvisos(){
  const desde = vistoEm();
  const noticiasNovas = desde
    ? (noticias.itens || []).filter(n => new Date(n.published_at).getTime() > desde).length : 0;
  const mexeram = (avisos_.movers || []).length;
  const naMira = chaseNoAlvo().length;
  return { noticiasNovas, mexeram, naMira, total: noticiasNovas + mexeram + naMira };
}

function pintarSino(){
  const el = document.getElementById("sino");
  if(!el) return;
  const c = contarAvisos();
  el.innerHTML = `🔔${c.total ? `<i>${c.total > 9 ? "9+" : c.total}</i>` : ""}`;
  el.title = c.total ? "o que mudou desde a última vez" : "nada novo desde a última vez";
}

function abrirAvisos(){
  const c = contarAvisos();
  const desde = vistoEm();
  const novas = desde
    ? (noticias.itens || []).filter(n => new Date(n.published_at).getTime() > desde) : [];
  const mira = chaseNoAlvo();

  modal(`<div class="modal-pad">
    <h3>O que mudou</h3>
    <p style="color:var(--muted);font-size:13px;margin:6px 0 14px">
      ${desde ? `Desde ${new Date(desde).toLocaleString("pt-BR", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" })}.`
              : "Esta é a sua primeira visita — a partir de agora eu guardo o que muda entre uma e outra."}</p>

    ${!c.total ? `<div class="empty">Nada novo por enquanto.</div>` : ""}

    ${mira.length ? `
      <section class="bloco-cfg">
        <h3>Chegaram no preço que você queria</h3>
        ${mira.map(x => {
          const p = precoLocal(deckParaCarta(x));
          return `<div class="lc-linha">
            ${x.img ? `<img src="${escapeHTML(x.img)}" alt="">` : `<span class="mv-sem"></span>`}
            <span class="lc-nome">${escapeHTML(x.n)}<small>seu alvo era ${money(Number(x.alvo))}</small></span>
            <span class="lc-preco sobe">${p ? formatarPreco(p) : ""}</span>
          </div>`;
        }).join("")}
      </section>` : ""}

    ${(avisos_.movers || []).length ? `
      <section class="bloco-cfg">
        <h3>Cartas suas que mexeram de preço</h3>
        ${blocoMovers()}
      </section>` : ""}

    ${novas.length ? `
      <section class="bloco-cfg">
        <h3>${novas.length} notícia${novas.length>1?"s":""} nova${novas.length>1?"s":""}</h3>
        ${novas.slice(0,6).map(n => `<div class="lc-linha">
          <span class="lc-nome">${escapeHTML(n.title)}<small>${escapeHTML(n.source_name)}</small></span>
        </div>`).join("")}
      </section>` : ""}

    <div class="pergunta-acoes"><button class="btn" id="av-ok">Entendi</button></div>
  </div>`);

  document.querySelectorAll("[data-carta]").forEach(b => b.onclick = () => {
    const r = S.owned[b.dataset.carta];
    if(r){ closeModal(); openCard(cartaDoResumo(b.dataset.carta, r)); }
  });
  document.getElementById("av-ok").onclick = () => { marcarVisto(); closeModal(); pintarSino(); };
}

/* =====================================================================
   VALORIZAÇÃO DA COLEÇÃO

   O robô arquiva o preço de todo dia desde 01/09/2026. Aqui a gente
   pergunta ao banco quanto a SUA coleção valia em cada um desses dias.

   A lista de cartas vai no corpo do pedido, não no banco: dá para ver a
   própria valorização sem ter conta. Em compensação o banco não sabe a
   condição das suas cartas, então o gráfico usa o preço de carta
   perfeita — e a tela diz isso.

   Duas honestidades que a tela precisa carregar:
   - só entra no gráfico a carta que o robô acompanha; a tela mostra
     quantas das suas estão cobertas;
   - o arquivo é novo, então a linha começa curta. Melhor uma linha curta
     e verdadeira do que uma longa e inventada.
   ===================================================================== */
let valorizacao = { serie:null, movers:null, cobertura:null, dias:30, carregando:false, erro:null };

const itensDaColecao = () => Object.keys(S.owned).map(id => ({ id, q: qtdDe(id) }));

async function carregarValorizacao(){
  const itens = itensDaColecao();
  if(!itens.length || valorizacao.carregando) return;
  valorizacao.carregando = true; valorizacao.erro = null;
  try{
    const [serie, movers, cobertura] = await Promise.all([
      rpc("collection_series",   { p_itens: itens, p_dias: valorizacao.dias }),
      rpc("collection_movers",   { p_itens: itens, p_dias: valorizacao.dias, p_limite: 5 }),
      rpc("collection_coverage", { p_itens: itens }),
    ]);
    valorizacao.serie = serie || [];
    valorizacao.movers = movers || [];
    valorizacao.cobertura = cobertura || null;
  }catch(e){
    valorizacao.erro = e.message;
  }
  valorizacao.carregando = false;
  if(view.name === "minha") renderMinha();
}

function blocoValorizacao(){
  const v = valorizacao;
  if(!Object.keys(S.owned).length) return "";

  const periodos = [[7,"7 dias"],[30,"30 dias"],[90,"3 meses"],[365,"tudo"]];
  const barra = `<div class="toggles" id="val-periodo">
      ${periodos.map(([d,n]) => `<button class="tog ${d===v.dias?"on":""}" data-dias="${d}">${n}</button>`).join("")}
    </div>`;

  if(v.erro) return `<section class="bloco-val"><div class="val-topo"><b>Valorização</b>${barra}</div>
    <p class="dg-txt">Não consegui buscar o histórico agora — ${escapeHTML(v.erro)}</p></section>`;

  if(!v.serie) return `<section class="bloco-val"><div class="val-topo"><b>Valorização</b>${barra}</div>
    <p class="dg-txt">Buscando o histórico…</p></section>`;

  const pontos = v.serie.map(l => ({ dia:l.dia, v:Number(l.usd) })).filter(p => p.v > 0);
  const cob = v.cobertura || {};
  const nota = cob.pedidas ? `${cob.com_historico} das suas ${cob.pedidas} cartas têm histórico arquivado` : "";

  if(pontos.length < 2){
    return `<section class="bloco-val">
      <div class="val-topo"><b>Valorização</b>${barra}</div>
      <p class="dg-txt">${pontos.length === 1
        ? `O arquivo começou em ${cob.primeiro_dia || "01/09/2026"} e ainda tem um dia só das suas cartas.
           A linha ganha forma sozinha nos próximos dias — cada dia que passa é um ponto a mais.`
        : `Nenhuma das suas cartas entrou no arquivo diário ainda. Elas entram na próxima passagem do robô,
           e a partir daí o gráfico começa.`}
        ${nota ? `<br>${nota}.` : ""}</p>
    </section>`;
  }

  const primeiro = pontos[0].v, ultimo = pontos[pontos.length-1].v;
  const dif = ultimo - primeiro;
  const pct = primeiro ? (dif / primeiro) * 100 : 0;

  return `
  <section class="bloco-val">
    <div class="val-topo"><b>Valorização</b>${barra}</div>
    <div class="val-corpo">
      <div class="val-numeros">
        <div class="val-hoje">${money(ultimo)}</div>
        <div class="val-dif ${dif>=0?"sobe":"desce"}">
          ${dif>=0?"▲":"▼"} ${money(Math.abs(dif))} <span>(${Math.abs(pct).toFixed(1)}%)</span>
        </div>
        <div class="val-desde">de ${money(primeiro)} em ${dataCurta(pontos[0].dia)}</div>
      </div>
      <div class="val-grafico">${sparkline(pontos)}</div>
    </div>
    <p class="dg-txt">
      ${nota ? nota + ". " : ""}O gráfico usa o preço de carta perfeita, que é o que o arquivo guarda;
      o valor total lá em cima já desconta a condição de cada uma das suas.
    </p>
    ${blocoMovers()}
  </section>`;
}

function dataCurta(iso){
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("pt-BR", { day:"2-digit", month:"short" });
}

function blocoMovers(){
  const lista = valorizacao.movers || [];
  if(!lista.length) return "";
  const subiram = lista.filter(m => Number(m.dif) > 0);
  const cairam  = lista.filter(m => Number(m.dif) < 0).reverse();
  if(!subiram.length && !cairam.length) return "";

  const linha = m => {
    const r = S.owned[m.card_id];
    if(!r) return "";
    const dif = Number(m.dif), pct = Number(m.pct);
    return `<button class="mover" data-carta="${m.card_id}">
      ${r.img ? `<img src="${r.img}" alt="" loading="lazy">` : `<span class="mv-sem"></span>`}
      <span class="mv-nome">${escapeHTML(r.n || "?")}<small>${escapeHTML(r.sn || r.s || "")}</small></span>
      <span class="mv-dif ${dif>=0?"sobe":"desce"}">${dif>=0?"+":"−"}${money(Math.abs(dif))}
        <small>${pct!=null?`${dif>=0?"+":"−"}${Math.abs(pct).toFixed(1)}%`:""}</small></span>
    </button>`;
  };

  return `
  <div class="movers">
    ${subiram.length ? `<div class="mv-col"><span class="flabel">Subiram</span>${subiram.map(linha).join("")}</div>` : ""}
    ${cairam.length  ? `<div class="mv-col"><span class="flabel">Caíram</span>${cairam.map(linha).join("")}</div>` : ""}
  </div>`;
}

function ligarValorizacao(){
  const barra = document.getElementById("val-periodo");
  if(barra) barra.querySelectorAll("[data-dias]").forEach(b => b.onclick = () => {
    valorizacao.dias = Number(b.dataset.dias);
    valorizacao.serie = null; valorizacao.movers = null;
    renderMinha();
    carregarValorizacao();
  });
  app.querySelectorAll("[data-carta]").forEach(b => b.onclick = () => {
    const r = S.owned[b.dataset.carta];
    if(r) openCard(cartaDoResumo(b.dataset.carta, r));
  });
}

/* =====================================================================
   CONDIÇÃO, IDIOMA E PREÇO PAGO

   Até aqui o valor estimado supunha que toda carta é NM em inglês. Isso é
   uma ficção educada: uma carta jogada vale bem menos, e carta em
   português é outro mercado.

   Duas honestidades importantes nesta parte:

   - Os multiplicadores de condição são REGRA DE BOLSO do mercado, não
     preço de fonte nenhuma. Por isso ficam à vista na tela e a conta diz
     que é estimativa. O Scryfall publica preço de carta NM; o desconto
     por desgaste é convenção de loja.
   - Idioma NÃO mexe no preço. Carta em português às vezes vale mais e às
     vezes vale menos, e eu não tenho fonte para isso — então fica só
     registrado, e a tela avisa que o preço é o da impressão em inglês.

   Carta marcada antes desta versão continua valendo como NM em inglês,
   que é o que ela já era na conta. Ninguém precisa arrumar nada.
   ===================================================================== */
const CONDICOES = [
  ["NM",  "Perfeita",     "Near Mint — como saiu do pacote",            1.00],
  ["SP",  "Quase perfeita","Slightly Played — desgaste de manuseio",     0.90],
  ["MP",  "Jogada",       "Moderately Played — marcas visíveis",         0.75],
  ["HP",  "Muito jogada", "Heavily Played — desgaste forte",             0.55],
  ["DMG", "Danificada",   "Damaged — dobra, rasgo ou dano de água",      0.35],
];
const IDIOMAS = [
  ["en", "Inglês"], ["pt", "Português"], ["es", "Espanhol"], ["ja", "Japonês"],
  ["de", "Alemão"], ["fr", "Francês"], ["it", "Italiano"], ["ru", "Russo"],
  ["ko", "Coreano"], ["zhs", "Chinês"],
];

const condDe  = r => (r && r.cond) || "NM";
const langDe  = r => (r && r.lang) || "en";
const fatorCondicao = cond => (CONDICOES.find(c => c[0] === cond) || CONDICOES[0])[3];
const nomeCondicao  = cond => (CONDICOES.find(c => c[0] === cond) || CONDICOES[0])[1];
const nomeIdioma    = lang => (IDIOMAS.find(i => i[0] === lang) || IDIOMAS[0])[1];

function normalizarCondicao(t){
  const s = String(t || "").trim().toLowerCase();
  if(!s) return "";
  if(/^(nm|m|mint|near ?mint|nova|perfeita)$/.test(s)) return "NM";
  if(/^(sp|lp|light(ly)? ?played|slight(ly)? ?played|excellent|good)$/.test(s)) return "SP";
  if(/^(mp|moderate(ly)? ?played|played)$/.test(s)) return "MP";
  if(/^(hp|heav(il)?y ?played|poor)$/.test(s)) return "HP";
  if(/^(dmg|damaged|danificada)$/.test(s)) return "DMG";
  return "";
}
function normalizarIdioma(t){
  const s = String(t || "").trim().toLowerCase();
  if(!s) return "";
  const mapa = { en:"en", english:"en", ingles:"en", "inglês":"en",
                 pt:"pt", "pt-br":"pt", portuguese:"pt", "português":"pt", portugues:"pt",
                 es:"es", spanish:"es", "espanhol":"es",
                 ja:"ja", jp:"ja", japanese:"ja", "japonês":"ja",
                 de:"de", german:"de", fr:"fr", french:"fr",
                 it:"it", italian:"it", ru:"ru", russian:"ru",
                 ko:"ko", korean:"ko", zhs:"zhs", chinese:"zhs" };
  return mapa[s] || "";
}

/* preço unitário de uma carta que você tem, já com o desconto da condição */
function valorUnitario(id){
  const r = S.owned[id];
  if(!r) return 0;
  const base = (r.fin === "foil" && r.usdF) ? r.usdF : (r.usd || 0);
  return base * fatorCondicao(condDe(r));
}
/* quanto você pagou, em dólar, somando todas as cópias */
function pagoTotal(){
  return Object.entries(S.owned).reduce((a, [id, r]) => a + (Number(r.pg) || 0) * qtdDe(id), 0);
}
function temPrecoPago(){ return Object.values(S.owned).some(r => Number(r.pg) > 0); }

/* =====================================================================
   IMPORTAR DE OUTRO APLICATIVO

   Quem já tem coleção no Moxfield, no Deckbox, no Archidekt, no TCGplayer
   ou no MTGGoldfish não vai remarcar três mil cartas na mão. Todos eles
   exportam CSV, e todos põem as mesmas coisas em colunas de nome
   diferente — então a gente lê pelo NOME DA COLUNA, não pela posição, e
   aceita os apelidos de cada um.

   Depois de ler, cada linha precisa virar uma carta de verdade. A ordem
   de tentativa vai do mais exato para o mais frouxo:

     1. id do Scryfall, quando o arquivo traz (Archidekt e Moxfield trazem)
     2. edição + número de coleção — identifica a impressão exata
     3. nome + edição
     4. só o nome — aí o Scryfall escolhe uma impressão qualquer

   E nada é gravado antes de você ver o que casou e o que não casou. Uma
   importação que apaga a coleção da pessoa é pior do que importação
   nenhuma.
   ===================================================================== */

/* apelidos de coluna → o que a gente precisa */
const COLUNAS = {
  qtd:    ["count", "quantity", "qty", "quantidade", "amount"],
  nome:   ["name", "card", "card name", "simple name", "nome"],
  set:    ["edition", "set", "set name", "edition name", "set code", "edition code", "set id"],
  setCode:["set code", "edition code", "set id"],
  numero: ["collector number", "card number", "number", "collector_number"],
  id:     ["scryfall id", "scryfall_id", "scryfallid"],
  foil:   ["foil", "finish", "printing", "premium"],
  cond:   ["condition", "condicao", "condição"],
  lang:   ["language", "lang", "idioma"],
  pago:   ["purchase price", "my price", "price", "preco pago", "preço pago", "purchase_price"],
};

/* Um CSV de verdade tem vírgula dentro de aspas ("Ach! Hans, Run!") e aspas
   dobradas. Fazer isso na mão é chato mas é curto, e evita uma biblioteca. */
function lerCSV(texto){
  texto = String(texto || "").replace(/^﻿/, "");           // BOM do Excel
  const primeira = (texto.split(/\r?\n/)[0] || "");
  // alguns exports em português usam ponto e vírgula
  const sep = (primeira.match(/;/g) || []).length > (primeira.match(/,/g) || []).length ? ";" : ",";

  const linhas = [];
  let campo = "", linha = [], dentro = false;
  for(let i = 0; i < texto.length; i++){
    const ch = texto[i];
    if(dentro){
      if(ch === '"'){
        if(texto[i+1] === '"'){ campo += '"'; i++; }
        else dentro = false;
      } else campo += ch;
    } else if(ch === '"'){ dentro = true; }
    else if(ch === sep){ linha.push(campo); campo = ""; }
    else if(ch === "\n"){ linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else if(ch !== "\r"){ campo += ch; }
  }
  if(campo || linha.length){ linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(c => String(c).trim() !== ""));
}

function mapearColunas(cabecalho){
  const limpo = cabecalho.map(c => String(c).trim().toLowerCase());
  const achar = apelidos => {
    for(const a of apelidos){ const i = limpo.indexOf(a); if(i >= 0) return i; }
    return -1;
  };
  const mapa = {};
  Object.entries(COLUNAS).forEach(([k, apelidos]) => { mapa[k] = achar(apelidos); });
  return mapa;
}

const FOIL_SIM = /^(foil|yes|true|1|sim|etched|foil etched)$/i;

function linhasDoArquivo(texto){
  const linhas = lerCSV(texto);
  if(linhas.length < 2) return { erro:"esse arquivo não parece um CSV com cabeçalho" };
  const mapa = mapearColunas(linhas[0]);
  if(mapa.nome < 0 && mapa.id < 0)
    return { erro:"não achei uma coluna de nome de carta (nem de id do Scryfall) no cabeçalho" };

  const pega = (l, i) => (i >= 0 && l[i] !== undefined) ? String(l[i]).trim() : "";
  const fora = [];
  for(let i = 1; i < linhas.length; i++){
    const l = linhas[i];
    const nome = pega(l, mapa.nome);
    const id = pega(l, mapa.id);
    if(!nome && !id) continue;
    const q = parseInt(pega(l, mapa.qtd), 10);
    const foilCru = pega(l, mapa.foil);
    fora.push({
      nome, id,
      set: (pega(l, mapa.setCode) || pega(l, mapa.set)).trim(),
      numero: pega(l, mapa.numero).replace(/^0+(?=\d)/, ""),
      qtd: Number.isFinite(q) && q > 0 ? q : 1,
      foil: FOIL_SIM.test(foilCru),
      cond: normalizarCondicao(pega(l, mapa.cond)),
      lang: normalizarIdioma(pega(l, mapa.lang)),
      pago: precoDoTexto(pega(l, mapa.pago)),
      linha: i + 1,
    });
  }
  return { itens:fora, colunas:mapa };
}

function precoDoTexto(t){
  if(!t) return 0;
  const n = parseFloat(String(t).replace(/[^\d.,-]/g, "").replace(/\.(?=\d{3}\b)/g, "").replace(",", "."));
  return Number.isFinite(n) && n > 0 ? n : 0;
}

/* Identificadores no formato que o /cards/collection do Scryfall entende.
   Um pedido leva 75 por vez. */
function identificadorDe(it){
  if(it.id && /^[0-9a-f-]{30,}$/i.test(it.id)) return { id: it.id };
  const set = (it.set || "").toLowerCase();
  // sigla de edição tem 3 a 5 letras/números; "Bloomburrow" por extenso não serve aqui
  const sigla = /^[a-z0-9]{3,5}$/.test(set) ? set : "";
  if(sigla && it.numero) return { set: sigla, collector_number: it.numero };
  if(sigla && it.nome)   return { name: it.nome, set: sigla };
  return { name: it.nome };
}

async function casarComOScryfall(itens, aoAndar){
  const achadas = new Map();     // índice do item → carta normalizada
  const naoAchadas = [];
  for(let i = 0; i < itens.length; i += 75){
    const lote = itens.slice(i, i + 75);
    let j = null;
    try{
      const r = await fetch(`${API}/cards/collection`, {
        method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
        body: JSON.stringify({ identifiers: lote.map(identificadorDe) })
      });
      if(r.ok) j = await r.json();
    }catch(e){}
    if(!j){ lote.forEach(it => naoAchadas.push(it)); }
    else {
      const porNome = new Map();
      (j.data || []).map(normalize).forEach(c => {
        achadas.set(c.id, c);
        const chave = c.name.toLowerCase();
        if(!porNome.has(chave)) porNome.set(chave, []);
        porNome.get(chave).push(c);
      });
      // o Scryfall devolve as cartas fora de ordem: cada item procura a sua
      lote.forEach(it => {
        const ident = identificadorDe(it);
        let c = null;
        if(ident.id) c = achadas.get(ident.id) || null;
        if(!c){
          const cands = porNome.get((it.nome || "").toLowerCase()) || [];
          c = cands.find(x => ident.set && x.set.toLowerCase() === ident.set
                              && (!ident.collector_number || String(x.num) === ident.collector_number))
              || cands.find(x => ident.set && x.set.toLowerCase() === ident.set)
              || cands[0] || null;
        }
        if(c) it.carta = c; else naoAchadas.push(it);
      });
    }
    if(aoAndar) aoAndar(Math.min(i + 75, itens.length), itens.length);
    await sleep(PAGE_DELAY);
  }
  return { casadas: itens.filter(it => it.carta), naoAchadas };
}

function mostrarPrevia(nomeArquivo, casadas, naoAchadas, colunas){

        <div class="nao-achadas">
          ${naoAchadas.slice(0,60).map(it => `<span>linha ${it.linha}: ${escapeHTML(it.nome || it.id || "?")}${
            it.set ? ` <i>(${escapeHTML(it.set)})</i>` : ""}</span>`).join("")}
          ${naoAchadas.length > 60 ? `<span>…e mais ${naoAchadas.length - 60}</span>` : ""}
        </div>
        <p class="dg-txt">Costuma ser carta de outro jogo, token, ou nome escrito de um jeito que o
        Scryfall não reconhece. Essas linhas simplesmente não entram — nada do que você já tem é mexido.</p>
      </details>` : ""}

    ${jaTinha ? `
      <div class="fgrupo" style="margin-top:14px">
        <span class="flabel">Para as cartas que você já tem</span>
        <div class="toggles">
          <button class="tog on" data-modo="arquivo">usar a quantidade do arquivo</button>
          <button class="tog" data-modo="somar">somar às minhas</button>

    <div class="pergunta-acoes" style="margin-top:16px">
      <button class="btn" id="imp-confirmar">Trazer ${casadas.length} carta${casadas.length>1?"s":""}</button>
      <button class="btn ghost" id="imp-cancelar">Cancelar</button>
    </div>`;

  let modo = "arquivo";
  document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => {

  });
  document.getElementById("imp-cancelar").onclick = closeModal;
  document.getElementById("imp-confirmar").onclick = () => {

    closeModal(); render();

function aplicarImportacao(casadas, modo){
  let mexidas = 0;
  casadas.forEach(it => {
    const c = it.carta;
    const jaTinha = isOwned(c.id);
    if(jaTinha && modo === "pular") return;

    const antes = S.owned[c.id] || {};
    const registro = Object.assign(resumoCarta(c), {
      at: antes.at || Date.now(),
      fin: it.foil ? "foil" : (antes.fin || "normal"),
    });
    const qAntes = jaTinha ? qtdDe(c.id) : 0;
    registro.q = modo === "somar" ? qAntes + it.qtd : it.qtd;
    if(it.cond) registro.cond = it.cond;
    else if(antes.cond) registro.cond = antes.cond;
    if(it.lang) registro.lang = it.lang;
    else if(antes.lang) registro.lang = antes.lang;
    if(it.pago) { registro.pg = it.pago; registro.pgM = "USD"; }
    else if(antes.pg){ registro.pg = antes.pg; registro.pgM = antes.pgM; }

    S.owned[c.id] = registro;
    mexidas++;
  });
  save(); renderKPIs();
  return mexidas;
}

/* =====================================================================
   CONTA E SINCRONIZAÇÃO

   Três decisões que explicam todo o resto deste bloco:

   1. Entrar é OPCIONAL. Sem conta o app é o que sempre foi: tudo no
      aparelho, nada sai daqui. A conta só acrescenta — nunca é exigida
      para abrir uma tela.

   2. A porta é um CÓDIGO DE SEIS DÍGITOS por e-mail, não um link. Link
      mágico é mais bonito, mas no iPhone ele abre no Safari — e quem
      instalou o Collector na tela de início ficaria logado no navegador
      e deslogado no aplicativo, que é exatamente o problema que a conta
      veio resolver. Código a pessoa digita onde ela está. Sem senha:
      senha é mais uma coisa para vazar, esquecer e recuperar.

   3. O que sobe é o PACOTE DO BACKUP inteiro, o mesmo de sempre. E a
      fusão é sempre aditiva, dos dois lados: entrar numa conta nunca
      apaga o que já estava no aparelho, e subir nunca apaga o que já
      estava na nuvem. Na dúvida entre perder e duplicar, duplica.
   ===================================================================== */

const SESSAO_KEY = "collector.sessao";
const SYNC_KEY   = "collector.sync";

let SYNC = { rev:0, dono:null, em:0, sujo:false, estado:"parado", timer:null, indo:null };

function lerSessao(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSAO_KEY) || "null");
    return (s && s.refresh_token) ? s : null;
  }catch(e){ return null; }
}
function guardarSessao(s){
  SESSAO = s;
  try{
    if(s) localStorage.setItem(SESSAO_KEY, JSON.stringify(s));
    else localStorage.removeItem(SESSAO_KEY);
  }catch(e){}
  pintarBotaoConta();
}
function lerSync(){
  try{ return Object.assign(SYNC, JSON.parse(localStorage.getItem(SYNC_KEY) || "{}"), { timer:null, indo:null }); }
  catch(e){ return SYNC; }
}
function guardarSync(){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify({ rev:SYNC.rev, dono:SYNC.dono, em:SYNC.em, sujo:SYNC.sujo })); }
  catch(e){}
}

const logado = () => !!(SESSAO && SESSAO.refresh_token);

/* ---------------- as três chamadas de autenticação ---------------- */
async function auth(caminho, corpo){
  const r = await fetch(`${SUPA_URL}/auth/v1/${caminho}`, {
    method:"POST",
    headers:{ apikey:SUPA_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(corpo || {})
  });
  const txt = await r.text();
  let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    const m = (j && (j.msg || j.error_description || j.message || j.error)) || `erro ${r.status}`;
    throw new Error(traduzErroAuth(m, r.status));
  }
  return j;
}

function traduzErroAuth(m, status){
  const t = String(m).toLowerCase();
  if(/invalid|expired|token has expired|otp/.test(t) && status === 403) return "código errado ou vencido — peça outro";
  if(/rate|too many|seconds/.test(t))    return "muitas tentativas seguidas — espere um minuto";
  if(/invalid.*email|email.*invalid/.test(t)) return "esse e-mail não parece válido";
  if(/signups not allowed|disabled/.test(t))  return "cadastro fechado no momento";
  return m;
}

function daSessao(j){
  if(!j || !j.access_token) throw new Error("resposta do login veio incompleta");
  return {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expira_em: Date.now() + (Number(j.expires_in || 3600) * 1000),
    email: (j.user && j.user.email) || "",
    user_id: (j.user && j.user.id) || ""
  };
}

/* Para onde o link do e-mail volta. Precisa estar na lista de Redirect URLs
   do Supabase (Authentication → URL Configuration). */
function voltarPara(){
  return location.origin + location.pathname;
}

async function pedirCodigo(email){
  await auth("otp?redirect_to=" + encodeURIComponent(voltarPara()), { email, create_user:true });
}

/* O e-mail pode chegar de duas formas, e as duas funcionam:

   - CÓDIGO de seis dígitos, que é o caminho bom: a pessoa digita onde
     estiver, inclusive dentro do app instalado na tela de início.
   - LINK, que é o que o Supabase manda enquanto o projeto usa o servidor
     de e-mail dele (no plano gratuito o texto do e-mail é fixo e só traz
     o link). Clicar no link traz os tokens no fim do endereço; esta
     função os recolhe e limpa a barra de endereço.

   Assim o login funciona hoje, e passa a funcionar também pelo código no
   dia em que o projeto tiver SMTP próprio — sem mexer no app. */
function pegarSessaoDoLink(){
  const bruto = (location.hash || "").replace(/^#/, "");
  if(!bruto) return false;
  const p = new URLSearchParams(bruto);
  // tira os tokens da barra de endereço para não ficarem no histórico
  const limpar = () => {
    try{ history.replaceState(null, "", location.pathname + location.search); }
    catch(e){ location.hash = ""; }
  };

  if(p.get("error_description") || p.get("error")){
    const m = decodeURIComponent(p.get("error_description") || p.get("error")).replace(/\+/g," ");
    limpar();
    setTimeout(() => toast("O link do e-mail não valeu: " + m), 300);
    return false;
  }
  if(!p.get("access_token") || !p.get("refresh_token")) return false;

  guardarSessao({
    access_token: p.get("access_token"),
    refresh_token: p.get("refresh_token"),
    expira_em: Date.now() + (Number(p.get("expires_in") || 3600) * 1000),
    email: "", user_id: ""
  });
  limpar();
  // o token traz o e-mail e o id dentro dele; ler é só decodificar o meio
  try{
    const meio = JSON.parse(decodeURIComponent(escape(atob(
      SESSAO.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))));
    SESSAO.email = meio.email || ""; SESSAO.user_id = meio.sub || "";
    guardarSessao(SESSAO);
  }catch(e){}
  return true;
}
async function entrarComCodigo(email, codigo){
  const j = await auth("verify", { type:"email", email, token:String(codigo).replace(/\D/g,"") });
  guardarSessao(daSessao(j));
}
async function renovarSessao(){
  if(!logado()) return false;
  try{
    const j = await auth("token?grant_type=refresh_token", { refresh_token: SESSAO.refresh_token });
    guardarSessao(daSessao(j));
    return true;
  }catch(e){
    // refresh vencido de vez: a sessão acabou, mas os dados daqui continuam intactos
    guardarSessao(null);
    return false;
  }
}
async function garantirSessao(){
  if(!logado()) return false;
  if(SESSAO.access_token && SESSAO.expira_em - Date.now() > 60000) return true;
  return renovarSessao();
}
async function sair(){
  try{
    await fetch(`${SUPA_URL}/auth/v1/logout`, { method:"POST",
      headers:Object.assign(cabecalhoAuth(), { "Content-Type":"application/json" }) });
  }catch(e){}
  guardarSessao(null);
  SYNC.rev = 0; SYNC.dono = null; SYNC.em = 0; SYNC.sujo = false; SYNC.estado = "parado";
  guardarSync();
}

/* ---------------- subir e descer ---------------- */
function nomeDoAparelho(){
  const ua = navigator.userAgent;
  const qual = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad"
             : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac"
             : /Windows/.test(ua) ? "Windows" : "navegador";
  return qual + (ehAppInstalado() ? " (app)" : "");
}

function pintarEstadoSync(){
  // o estado aparece em dois lugares: na janela da conta e na tela de Ajustes
  document.querySelectorAll("#sync-estado, #sync-estado-tela").forEach(el => el.innerHTML = textoDoSync());
  pintarBotaoConta();
}
function textoDoSync(){
  if(!logado()) return "";
  if(SYNC.estado === "indo")  return "sincronizando…";
  if(SYNC.estado === "erro")  return `<span style="color:var(--neg)">não consegui sincronizar — tentarei de novo</span>`;
  if(!SYNC.em)                return "ainda não sincronizado";
  const min = Math.round((Date.now() - SYNC.em)/60000);
  return SYNC.sujo ? "alterações esperando para subir"
       : min < 1 ? "tudo salvo na conta, agora mesmo"
       : `tudo salvo na conta · há ${min} min`;
}

/* O coração: junta o que está na nuvem com o que está aqui e sobe o
   resultado. Roda inteiro em qualquer um dos casos — primeiro login,
   aparelho novo, conflito — porque a fusão aditiva é idempotente. */
async function sincronizar(motivo){
  if(!logado()) return;
  if(SYNC.indo) return SYNC.indo;

  SYNC.indo = (async () => {
    SYNC.estado = "indo"; pintarEstadoSync();
    try{
      if(!await garantirSessao()) throw new Error("sessão vencida");

      // conta diferente da última que sincronizou neste aparelho: começa do zero
      if(SYNC.dono && SESSAO.user_id && SYNC.dono !== SESSAO.user_id){ SYNC.rev = 0; }
      SYNC.dono = SESSAO.user_id || SYNC.dono;

      const nuvem = await rpc("sync_pull", {});
      let precisaSubir = SYNC.sujo || !nuvem || motivo === "entrou";

      if(nuvem && nuvem.payload && nuvem.rev !== SYNC.rev){
        // o que está lá é novidade para este aparelho: funde e sobe o resultado
        restaurarBackup(nuvem.payload);
        precisaSubir = true;
      }

      if(precisaSubir){
        let r = await rpc("sync_push", { p_payload: pacoteDeBackup(), p_device: nomeDoAparelho(),
                                         p_rev: nuvem ? nuvem.rev : null });
        if(r && r.conflito){                       // alguém subiu no meio do caminho
          restaurarBackup(r.payload);
          r = await rpc("sync_push", { p_payload: pacoteDeBackup(), p_device: nomeDoAparelho(), p_rev: null });
        }
        SYNC.rev = (r && r.rev) || SYNC.rev;
      } else if(nuvem){
        SYNC.rev = nuvem.rev;
      }

      SYNC.sujo = false; SYNC.em = Date.now(); SYNC.estado = "ok";
      guardarSync();
      aplicarTema(temaAtual());
      if(motivo === "entrou" || motivo === "manual") render();
    }catch(e){
      SYNC.estado = "erro";
      if(motivo === "manual") toast("Não consegui sincronizar: " + e.message);
    }finally{
      SYNC.indo = null;
      pintarEstadoSync();
    }
  })();
  return SYNC.indo;
}

/* save() chama isto a cada mudança; sobe uma vez só depois que a pessoa para de mexer */
function agendarSync(){
  if(!logado()) return;
  // se já tem uma subida em andamento, ela leva o que acabou de mudar
  if(SYNC.indo) return;
  SYNC.sujo = true; guardarSync(); pintarEstadoSync();
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => sincronizar("mudou"), 4000);
}

/* ---------------- a tela ---------------- */
function pintarBotaoConta(){
  const b = document.getElementById("btn-conta");
  if(!b) return;
  if(!logado()){ b.textContent = "Entrar"; b.classList.remove("logado"); return; }
  b.classList.add("logado");
  const inicial = (SESSAO.email || "?").trim()[0].toUpperCase();
  const pino = SYNC.estado === "indo" ? "…" : SYNC.estado === "erro" ? "!" : SYNC.sujo ? "•" : "";
  b.textContent = inicial + (pino ? " " + pino : "");
  b.title = SESSAO.email + " — " + textoDoSync().replace(/<[^>]+>/g,"");
}

    <div class="pergunta-acoes" style="margin-top:14px">
      <button class="btn" id="ct-ok">Entrar</button>
      <button class="btn ghost" id="ct-voltar">Trocar o e-mail</button>
      <button class="btn ghost" id="ct-reenviar">Reenviar</button>
    </div>
    <div class="status" id="ct-status" style="margin-top:10px"></div>
  </div>`);

  const campo = document.getElementById("ct-codigo");
  const st = document.getElementById("ct-status");
  const bt = document.getElementById("ct-ok");
  campo.focus();

  const entrar = async () => {
    const c = campo.value.replace(/\D/g,"");
    if(c.length < 6){ st.textContent = "faltam dígitos"; return; }
    bt.disabled = true; st.textContent = "entrando…";
    try{
      await entrarComCodigo(email, c);
      closeModal();
      toast("Bem-vindo — sincronizando a sua coleção");
      await sincronizar("entrou");
      telaDaConta();
    }catch(err){
      st.textContent = err.message; bt.disabled = false;
    }
  };
  bt.onclick = entrar;
  campo.onkeydown = ev => { if(ev.key === "Enter") entrar(); };
  campo.oninput = () => { if(campo.value.replace(/\D/g,"").length === 6) entrar(); };
  document.getElementById("ct-voltar").onclick = () => telaDeEntrada(email);
  document.getElementById("ct-reenviar").onclick = async () => {
    st.textContent = "reenviando…";
    try{ await pedirCodigo(email); st.textContent = "código novo enviado"; }
    catch(err){ st.textContent = err.message; }
  };
}

    <div class="kv"><span>E-mail</span><b>${escapeHTML(SESSAO.email || "—")}</b></div>
    <div class="kv"><span>Aparelho</span><b>${escapeHTML(nomeDoAparelho())}</b></div>
    <div class="kv"><span>Cartas marcadas</span><b>${ownedCount()}</b></div>
    <div class="kv"><span>Coleções próprias</span><b>${(S.custom||[]).length}</b></div>
    <div class="kv"><span>Decks</span><b>${(S.decks||[]).length}</b></div>
    <div class="kv"><span>Chase cards</span><b>${((S.chase||{}).cartas||[]).length}</b></div>
    <div class="kv"><span>Situação</span><b id="sync-estado">${textoDoSync()}</b></div>

/* ---------------- partida ---------------- */
SESSAO = lerSessao();

pintarBotaoConta();
if(logado()){
  // sessão pode estar vencida; renovar já resolve, e o pull vem junto
  if(veioDoLink) setTimeout(() => { toast("Você entrou — sincronizando a sua coleção"); sincronizar("entrou"); }, 200);
  else sincronizar("abriu");

function abrirBackup(){
  const p = pacoteDeBackup();
  const codigo = (() => { try{ return btoa(unescape(encodeURIComponent(JSON.stringify(p)))); }catch(e){ return ""; } })();

  modal(`<div class="modal-pad">
    <h3>Backup</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 14px">
      Leva <b>tudo</b>: cartas, coleções, decks, chase cards, capas, grupos da mesa e configurações.
      Guarde o arquivo, ou use o código para passar de um aparelho para outro.</p>

    <div class="kv"><span>Cartas marcadas</span><b>${ownedCount()}</b></div>
    <div class="kv"><span>Coleções próprias</span><b>${(S.custom||[]).length}</b></div>
    <div class="kv"><span>Decks</span><b>${(S.decks||[]).length}</b></div>
    <div class="kv"><span>Chase cards</span><b>${((S.chase||{}).cartas||[]).length}</b></div>
    <div class="kv"><span>Grupos de mesa</span><b>${((S.mesa||{}).grupos||[]).length}</b></div>
    <div class="kv"><span>Tamanho do backup</span><b>${tamanhoDoBackup()}</b></div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 12px">
      <button class="btn" id="bk-arquivo">Baixar arquivo</button>
      <label class="btn ghost" style="cursor:pointer">Restaurar de arquivo
        <input type="file" id="bk-ler" accept="application/json,.json" hidden></label>
    </div>

    <details class="avancado" ${codigo ? "" : "hidden"}>
      <summary>Passar por código (para outro aparelho)</summary>
      <p style="color:var(--faint);font-size:11.5px;margin:8px 0">
        Copie daqui e cole no outro aparelho, em Backup → Restaurar de código.</p>
      <textarea id="bk-codigo" rows="4" readonly
        style="font-family:ui-monospace,monospace;font-size:11px">${escapeHTML(codigo)}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn ghost" id="bk-copiar">Copiar código</button>
        <button class="btn ghost" id="bk-colar">Restaurar de código</button>
      </div>
    </details>
    <div class="status" id="bk-status"></div>
  </div>`);

  const st = document.getElementById("bk-status");

  document.getElementById("bk-arquivo").onclick = () => {
    const blob = new Blob([JSON.stringify(p, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `collector-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Backup baixado");
  };

  document.getElementById("bk-ler").onchange = e => {
    const arq = e.target.files && e.target.files[0];
    if(!arq) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      let obj = null;
      try{ obj = JSON.parse(leitor.result); }catch(err){ st.textContent = "esse arquivo não é um backup"; return; }
      const erro = restaurarBackup(obj);
      if(erro){ st.textContent = erro; return; }
      closeModal(); render(); toast("Backup restaurado — nada do que já estava aqui foi apagado");
    };
    leitor.readAsText(arq);
  };

  const copiar = document.getElementById("bk-copiar");
  if(copiar) copiar.onclick = () => {
    const el = document.getElementById("bk-codigo");
    el.removeAttribute("readonly"); el.select(); el.setSelectionRange(0, 999999);
    try{ document.execCommand("copy"); toast("código copiado"); }catch(e){}
    el.setAttribute("readonly", "");
  };
  const colar = document.getElementById("bk-colar");
  if(colar) colar.onclick = () => {
    const texto = prompt("Cole aqui o código do outro aparelho:");
    if(!texto) return;
    let obj = null;
    try{ obj = JSON.parse(texto); }
    catch(e){ try{ obj = JSON.parse(decodeURIComponent(escape(atob(texto.trim())))); }catch(e2){} }
    const erro = obj ? restaurarBackup(obj) : "não consegui ler esse código";
    if(erro){ st.textContent = erro; return; }
    closeModal(); render(); toast("Dados restaurados");
  };
}
document.getElementById("btn-config").onclick = () => go("config");

/* =====================================================================
   Instalação na tela de início

   O service worker faz o app abrir sem internet e guardar a arte das
   cartas já vistas. Em file:// o navegador não deixa registrar — e tudo
   bem, ali é só para testar.
   ===================================================================== */
/* https em produção; localhost também vale, é onde a gente testa */
if("serviceWorker" in navigator &&
   (location.protocol === "https:" || ["localhost","127.0.0.1"].includes(location.hostname))){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* está rodando como app instalado, e não como aba do navegador? */
function ehAppInstalado(){
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}
function ehIPhone(){ return /iPhone|iPad|iPod/.test(navigator.userAgent); }

  const instalado = ehAppInstalado();

  modal(`<div class="modal-pad">
    <h3>${instalado ? "Você já está no aplicativo" : "Pôr na tela de início"}</h3>

    ${instalado ? `
      <p style="color:var(--muted);font-size:13px;margin:6px 0 16px">
        O Collector está aberto como aplicativo: tela cheia, ícone junto dos outros e funciona sem internet
        para o que você já abriu.</p>
      <div class="pergunta-acoes"><button class="btn" id="inst-backup">Restaurar um backup</button></div>
    ` : `
      <div class="nota-regiao" style="margin-bottom:16px">
        <b>Este botão não instala nada sozinho — e nem poderia.</b> A Apple não deixa um site se instalar:
        quem faz isso é você, em dois toques dentro do Safari. Abaixo está exatamente onde tocar.
      </div>

      ${iphone && !safari ? `<div class="dg-problema erro" style="margin-bottom:14px">
        Você está em outro navegador. No iPhone, <b>só o Safari</b> põe na tela de início.
        Copie o endereço aqui embaixo e abra no Safari.</div>` : ""}

      <div class="instalar-passos">
        <div class="ip-passo">
          <span class="ip-num">1</span>
          <div>
            <b>Toque no botão de compartilhar</b>
            <small>É o quadradinho com a seta para cima, na barra de baixo do Safari.</small>
            ${svgBarraSafari()}
          </div>
        </div>
        <div class="ip-passo">
          <span class="ip-num">2</span>
          <div>
            <b>Role a lista e toque em “Adicionar à Tela de Início”</b>
            <small>Ela fica abaixo de “Copiar” e “Adicionar aos Favoritos” — quase sempre é preciso
            <b>arrastar a lista para cima</b> para ela aparecer. É esse passo que a maioria não acha.</small>
            ${svgFolhaCompartilhar()}
          </div>
        </div>
        <div class="ip-passo">
          <span class="ip-num">3</span>
          <div>
            <b>Toque em “Adicionar”, no canto de cima</b>
            <small>O ícone do Collector aparece na sua tela junto dos outros apps.
            Abra por ele, não pelo Safari.</small>
          </div>
        </div>
      </div>

      <div class="nota-regiao" style="margin-top:16px">
        <b>Faça o backup antes.</b> O aplicativo instalado guarda os dados em um lugar separado do Safari —
        sua coleção não atravessa sozinha. Baixe aqui, instale, abra pelo ícone e restaure lá dentro.
      </div>

      <div class="pergunta-acoes" style="margin-top:14px">
        <button class="btn" id="inst-backup">Fazer backup agora</button>
        <button class="btn ghost" id="inst-copiar">Copiar o endereço</button>
      </div>

      <details class="avancado" style="margin-top:14px">
        <summary>No Android é diferente</summary>
        <p style="font-size:12.5px;color:var(--muted);line-height:1.6;margin:8px 0 0">
          No Chrome, o menu dos três pontinhos tem <b>Instalar aplicativo</b> — em um toque só.
          Se não aparecer, use <b>Adicionar à tela inicial</b> no mesmo menu.</p>
      </details>
    `}
  </div>`);

  const bk = document.getElementById("inst-backup");
  if(bk) bk.onclick = () => { closeModal(); abrirBackup(); };
  const copiar = document.getElementById("inst-copiar");
  if(copiar) copiar.onclick = () => {
    const t = document.createElement("textarea");
    t.value = location.href.split("#")[0];
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, 999999);
    try{ document.execCommand("copy"); toast("endereço copiado"); }catch(e){}
    t.remove();
  };
}

/* ---------------- utils ---------------- */
function escapeHTML(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
let toastT;
function toast(msg){
  clearTimeout(toastT);
  let el = document.querySelector(".toast");
  if(!el){ el = document.createElement("div"); el.className="toast"; document.body.appendChild(el); }
  el.textContent = msg;
  toastT = setTimeout(()=>el.remove(), 2600);
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
