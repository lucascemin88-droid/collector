/* =====================================================================
   A COLEÇÃO PRECISA EXISTIR EM ALGUM LUGAR ALÉM DESTE APARELHO

   Tudo vive no `localStorage`. O navegador pode limpar os dados de um
   site — a pessoa limpando, o sistema apertado de espaço, o app
   desinstalado sem querer — e aí a coleção some. Isso não é hipótese
   remota: é a falha mais provável deste app.

   Duas defesas, e o app é honesto sobre a diferença entre elas:

   - CONTA: quem entra tem a coleção subindo sozinha a cada mudança. É a
     proteção de verdade, porque não depende de o aparelho sobreviver.
   - ARQUIVO: um download que a pessoa guarda. Funciona sem conta, mas
     só existe se alguém lembrar de baixar — por isso o app conta os dias
     e avisa quando faz tempo demais.

   O que o app NÃO faz é dizer "seus dados estão seguros" sem nenhuma das
   duas: sem conta e sem arquivo, a tela diz exatamente isso.
   ===================================================================== */
const DIAS_SEM_BACKUP = 14;

function marcarBackupFeito(){
  S.config.ultimoBackup = Date.now();
  salvarAgora();
}
/* quantos dias desde a última proteção real: conta ou arquivo */
function estadoDaProtecao(){
  const arquivo = Number(S.config.ultimoBackup) || 0;
  const naConta = logado() && SYNC.em && !SYNC.sujo ? SYNC.em : 0;
  const ultima = Math.max(arquivo, naConta);
  const dias = ultima ? Math.floor((Date.now() - ultima) / 86400000) : null;
  // só é problema quando existe coleção para perder
  const descoberto = ownedCount() > 0 && (ultima === 0 || dias >= DIAS_SEM_BACKUP);
  /* o aviso é de uma situação, não de um acontecimento: ele não some
     porque você leu. Mas repetir todo dia vira ruído, então quem clicou
     "entendi" fica 7 dias sem ouvir de novo — e o alerta continua à
     vista, sem contador, em Ajustes. */
  const avisadoEm = Number(S.config.avisoBackupVistoEm) || 0;
  return {
    naConta: !!naConta, arquivo, ultima, dias, descoberto,
    cartas: ownedCount(),
    cobrar: descoberto && Date.now() - avisadoEm > 7*86400000,
  };
}

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return structuredClone(blank);
    const lido = Object.assign(structuredClone(blank), JSON.parse(raw));
    lido.config = Object.assign({ regiao:"global", acabamento:"normal", tema:"ouro" }, lido.config || {});
    lido.uniques = lido.uniques || {};
    return lido;
  }catch(e){ return structuredClone(blank); }
}
/* =====================================================================
   GRAVAR SEM TRAVAR A TELA

   `save()` serializa a coleção inteira. Com 5.000 cartas isso é ~2 MB de
   JSON, e chamar a cada toque no + de quantidade travava o dedo na tela.

   Agora a gravação é ESPAÇADA: a memória muda na hora (é dela que a tela
   lê), e o disco recebe no máximo uma vez a cada 400 ms. Duas garantias
   para ninguém perder nada:

   - `salvarAgora()` grava na marra, e é o que roda quando a aba some,
     quando o app vai para segundo plano e antes de fechar;
   - qualquer leitura que dependa do disco (backup, exportação) chama
     `salvarAgora()` antes.

   `save()` continua sendo o nome usado em todo o app — quem chama não
   precisa saber de nada disso.
   ===================================================================== */
let gravacao = { pendente:false, timer:null, em:0 };

function salvarAgora(){
  clearTimeout(gravacao.timer);
  gravacao.timer = null;
  gravacao.pendente = false;
  try{
    localStorage.setItem(STORE, JSON.stringify(S));
    gravacao.em = Date.now();
  }
  catch(e){ toast("Não consegui salvar (armazenamento cheio ou bloqueado)"); }
}

function save(){
  gravacao.pendente = true;
  if(!gravacao.timer) gravacao.timer = setTimeout(salvarAgora, 400);
  // quem está logado tem a mudança levada para a conta alguns segundos depois
  if(typeof agendarSync === "function") agendarSync();
}

/* a aba pode sumir sem aviso: é aqui que a gravação pendente vira disco */
addEventListener("visibilitychange", () => { if(document.hidden && gravacao.pendente) salvarAgora(); });
addEventListener("pagehide", () => { if(gravacao.pendente) salvarAgora(); });

/* cartas que o usuário tirou de uma coleção na mão — vale para as temáticas
   prontas também, porque a curadoria de ninguém acerta o gosto de todo mundo */
function excluidasDe(id){ return (S.exclusoes && S.exclusoes[id]) || []; }
/* cartas que o usuário puxou para dentro de uma coleção que a busca não pegaria */
function incluidasDe(id){ return (S.inclusoes && S.inclusoes[id]) || []; }
function incluirNaColecao(colId, carta){
  S.inclusoes = S.inclusoes || {};
  const atual = S.inclusoes[colId] || [];
  if(atual.some(c => c.id === carta.id)) return false;
  atual.push(carta);
  S.inclusoes[colId] = atual;
  save();
  return true;
}
function removerIncluida(colId, cardId){
  if(!S.inclusoes || !S.inclusoes[colId]) return;
  S.inclusoes[colId] = S.inclusoes[colId].filter(c => c.id !== cardId);
  save();
}
function excluirDaColecao(colId, cardId){
  S.exclusoes = S.exclusoes || {};
  const atual = new Set(excluidasDe(colId));
  atual.add(cardId);
  S.exclusoes[colId] = [...atual];
  save();
}
function restaurarColecao(colId){
  if(!S.exclusoes) return;
  delete S.exclusoes[colId];
  save();
}

/* ---------------- Scryfall ---------------- */
const memCache = new Map();     // "q|unique|order|page" -> resposta
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function scryPage(q, unique="cards", order="name", page=1, dir="auto"){
  const key = `${q}|${unique}|${order}|${dir}|${page}`;
  if(memCache.has(key)) return memCache.get(key);
  const url = `${API}/cards/search?q=${encodeURIComponent(q)}&unique=${unique}&order=${order}&dir=${dir}&page=${page}`;
  const res = await fetch(url, { headers:{ "Accept":"application/json" } });
  if(res.status === 404){ const out = { data:[], total_cards:0, has_more:false }; memCache.set(key,out); return out; }
  if(!res.ok) throw new Error(`Scryfall respondeu ${res.status}`);
  const json = await res.json();
  memCache.set(key, json);
  await sleep(PAGE_DELAY);
  return json;
}

function normalize(c){
  const faces = (c.card_faces || []).filter(f => f && f.image_uris);
  const face = (c.image_uris ? c : faces[0]) || {};
  const img = face.image_uris || {};
  return {
    id:c.id, name:c.name, set:(c.set||"").toUpperCase(), setName:c.set_name,
    layout:c.layout || "normal",
    /* cartas de duas faces: guardo os dois lados para dar o botão de virar */
    faces: faces.length > 1 ? faces.map(f => ({
      nome:f.name, small:(f.image_uris||{}).small,
      normal:(f.image_uris||{}).normal || (f.image_uris||{}).large })) : null,
    num:c.collector_number, rarity:c.rarity, type:c.type_line, mana:c.mana_cost || (c.card_faces&&c.card_faces[0]&&c.card_faces[0].mana_cost) || "",
    oracle:c.oracle_text || (c.card_faces||[]).map(f=>f.oracle_text).filter(Boolean).join("\n//\n"),
    artist:c.artist, released:c.released_at,
    small:img.small, normal:img.normal || img.large,
    arteCrop:img.art_crop,
    usd:c.prices && c.prices.usd,
    usdFoil:c.prices && (c.prices.usd_foil || c.prices.usd_etched),
    eur:c.prices && c.prices.eur,
    eurFoil:c.prices && c.prices.eur_foil,
    url:c.scryfall_uri,
    compra:c.purchase_uris || null,
    impressoesUri:c.prints_search_uri || null,
    arte:c.illustration_id || (c.card_faces && c.card_faces[0] && c.card_faces[0].illustration_id) || null,
    acabamentos:c.finishes || [],
    promos:c.promo_types || [],
    frames:c.frame_effects || [],
    borda:c.border_color || "",
    /* usados pela área de decks: identidade de cor manda no Commander,
       o que a terra produz manda no diagnóstico de mana */
    ci:(c.color_identity || []).join("").toLowerCase(),
    produz:(c.produced_mana || []).join("").toLowerCase(),
    legal:c.legalities || null,
    gc:c.game_changer === true,          // lista oficial de Game Changers do Commander
    edhrec:c.edhrec_rank || null,
    cores:(c.colors || (c.card_faces && c.card_faces[0] && c.card_faces[0].colors) || []).join("").toLowerCase(),
    mv:(c.cmc === undefined ? null : c.cmc)
  };
}

function isOwned(id){ return !!S.owned[id]; }

/* O que fica guardado de cada carta que você tem. É o bastante para a aba
   "Minha coleção" funcionar sozinha, sem consultar o Scryfall a cada abertura. */
/* =====================================================================
   O QUE FICA GUARDADO DE CADA CARTA

   Tudo isto vive no `localStorage`, que no Safari tem teto de uns 5 MB
   por site. Então a régua é simples: campo que pode ser DERIVADO não é
   guardado. Três saíram:

   - `big` (imagem grande) — é a mesma URL da pequena com `/normal/` no
     lugar de `/small/`. O Scryfall serve os dois tamanhos no mesmo
     caminho, e a URL é longa: era o campo mais caro da lista.
   - `url` (página no Scryfall) — `scryfall.com/card/<set>/<número>`
     resolve para a carta certa; o slug do nome é enfeite.
   - `promos` vazio — a esmagadora maioria das cartas não tem promo
     nenhuma, e `"promos":[]` em cada uma custa espaço à toa. Quando a
     carta TEM promo, o campo continua guardado: é o que dá "surge foil"
     e "sem borda" no lugar de "foil".

   `enxugarColecao()` limpa esses campos de quem já tinha a coleção
   marcada antes desta versão.
   ===================================================================== */
const imagemGrande = small => String(small || "").replace("/small/", "/normal/");
const paginaNoScryfall = r =>
  r && r.s && r.num ? `https://scryfall.com/card/${r.s}/${encodeURIComponent(r.num)}` : "";

function resumoCarta(c){
  const r = { n:c.name, s:c.set, sn:c.setName, num:c.num, r:c.rarity, t:c.type,
           c:c.cores || "", mv:(c.mv === undefined ? null : c.mv),
           img:c.small, art:c.artist,
           usd:Number(c.usd) || 0, eur:Number(c.eur) || 0,
           usdF:Number(c.usdFoil) || 0, eurF:Number(c.eurFoil) || 0,
           fin:c.acabamentoEscolhido || "normal", arte:c.arte || null,
           crop:c.arteCrop || null,
           ano:(c.released || "").slice(0,4), at:Date.now() };
  if((c.promos || []).length) r.promos = c.promos;
  return r;
}
function cartaDoResumo(id, r){
  return { id, name:r.n, set:r.s, setName:r.sn, num:r.num, rarity:r.r, type:r.t,
           cores:r.c || "", mv:r.mv, small:r.img, normal:r.big || imagemGrande(r.img),
           usd:r.usd || null, eur:r.eur || null,
           usdFoil:r.usdF || null, eurFoil:r.eurF || null, artist:r.art,
           url:r.url || paginaNoScryfall(r),
           acabamentoEscolhido:r.fin || "normal", promos:r.promos || [], arte:r.arte || null,
           arteCrop:r.crop || null,
           released:r.ano ? `${r.ano}-01-01` : "", mana:"", oracle:"", compra:null, impressoesUri:null };
}

/* tira de quem já tinha coleção os campos que hoje são derivados.
   Roda uma vez por abertura e só grava se realmente mudou alguma coisa. */
function enxugarColecao(){
  let mexeu = 0;
  Object.values(S.owned || {}).forEach(r => {
    if(r.big !== undefined){ delete r.big; mexeu++; }
    if(r.url !== undefined){ delete r.url; mexeu++; }
    if(Array.isArray(r.promos) && !r.promos.length){ delete r.promos; mexeu++; }
  });
  return mexeu;
}
function toggleOwn(card){
  if(S.owned[card.id]) delete S.owned[card.id];
  else S.owned[card.id] = resumoCarta(card);
  save(); renderKPIs();
}

/* Cartas marcadas antes desta versão só têm nome e set guardados.
   Este remendo busca o resto em lotes e some sozinho depois. */
let hidratando = false;
async function hidratarColecao(){
  if(hidratando) return false;
  /* "semImg" marca a carta que o Scryfall não conhece mais: sem isso ela
     volta na lista toda vez e a aba fica repintando para sempre. */
  const faltando = Object.keys(S.owned).filter(id => !S.owned[id].img && !S.owned[id].semImg);
  if(!faltando.length) return false;
  hidratando = true;
  let mudou = false;
  try{
    for(let i = 0; i < faltando.length; i += 75){
      const lote = faltando.slice(i, i + 75).map(id => ({ id }));
      const r = await fetch(`${API}/cards/collection`, {
        method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
        body: JSON.stringify({ identifiers: lote })
      });
      if(!r.ok) break;
      const j = await r.json();
      (j.data || []).map(normalize).forEach(c => {
        const antes = S.owned[c.id] || {};
        // o que é seu não se perde: data de entrada, acabamento e quantidade
        S.owned[c.id] = Object.assign(resumoCarta(c), {
          at: antes.at || Date.now(), fin: antes.fin || "normal", q: antes.q });
        mudou = true;
      });
      (j.not_found || []).forEach(x => {
        const id = x && x.id;
        if(id && S.owned[id]){ S.owned[id].semImg = 1; mudou = true; }
      });
      await sleep(120);
    }
    if(mudou) save();
    return mudou;
  } finally { hidratando = false; }
}
/* conta cópias, não linhas: quem tem quatro Llanowar Elves iguais tem quatro cartas */
function ownedCount(){ return Object.keys(S.owned).reduce((a,id)=>a+qtdDe(id),0); }
/* o valor já desconta a condição de cada carta — ver CONDICOES */
function ownedValue(){ return Object.keys(S.owned).reduce((a,id)=>a+valorUnitario(id)*qtdDe(id),0); }
function money(v){
  const r = regiao();
  let valor = v, simbolo = "US$";
  if(r.moeda === "BRL" && CAMBIO && CAMBIO.usd){ valor = v * CAMBIO.usd; simbolo = "R$"; }
  else if(r.moeda === "EUR" && CAMBIO && CAMBIO.eur && CAMBIO.usd){ valor = v * (CAMBIO.eur ? CAMBIO.usd/CAMBIO.eur : 1); simbolo = "€"; }
  return simbolo + " " + valor.toLocaleString("pt-BR",{maximumFractionDigits:0});
}

function renderKPIs(){
  document.getElementById("kpi-cards").textContent = ownedCount().toLocaleString("pt-BR");
  document.getElementById("kpi-value").textContent = money(ownedValue());
}

/* telas de dentro → a qual mestre pertencem */
const DONO_DA_TELA = {
  collection:"colecao", set:"buscador", secretlair:"buscador", promos:"buscador",
  deck:"game", config:null,
};

function mestreDaView(nome){
  const dono = MENU.find(m => m.secoes.some(s => s.v === nome));
  if(dono) return dono.id;
  return DONO_DA_TELA[nome] !== undefined ? DONO_DA_TELA[nome] : null;
}

let view = { name:"home", id:null };
const app = document.getElementById("app");

function pintarNav(){
  const atual = mestreDaView(view.name);
  const masters = document.getElementById("masters");
  masters.innerHTML = MENU.map(m => `
    <button class="master ${m.id===atual?"on":""}" data-master="${m.id}">${m.nome}${
      m.secoes.length > 1 ? `<span class="seta">▾</span>` : ""}</button>`).join("");
  masters.querySelectorAll("[data-master]").forEach(b => b.onclick = () => {
    const m = MENU.find(x => x.id === b.dataset.master);
    go(m.secoes[0].v);
  });

  const barra = document.getElementById("subtabs");
  const dono = MENU.find(m => m.id === atual);
  // um mestre com uma seção só não precisa repetir o próprio nome embaixo
  if(!dono || dono.secoes.length < 2){ barra.innerHTML = ""; return; }
  barra.innerHTML = dono.secoes.map(s => `
    <button class="tab ${s.v===view.name?"active":""}" data-view="${s.v}">${s.nome}</button>`).join("");
  barra.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
}

function go(name,id){ view={name,id}; render(); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  pintarNav(); renderKPIs();
  if(view.name==="home") return renderHome();
  if(view.name==="comunidade") return renderComunidade();
  if(view.name==="troca") return renderTroca();
  if(view.name==="especiais") return renderEspeciais();
  if(view.name==="mercado") return renderMercado();
  if(view.name==="trocas") return renderTrocas();
  if(view.name==="config") return renderConfig();
  if(view.name==="themes") return renderThemes();
  if(view.name==="minha") return renderMinha();
  if(view.name==="conferencia") return renderConferencia();
  if(view.name==="mine") return renderMine();
  if(view.name==="decks") return renderDecks();
  if(view.name==="deck") return renderDeck(view.id);
  if(view.name==="chase") return renderChase();
  if(view.name==="mesa") return renderMesa();
  if(view.name==="catalogo") return renderCatalogo();
  if(view.name==="sets") return renderSets();
  if(view.name==="set") return renderSet(view.id);
  if(view.name==="secretlair") return renderSecretLair();
  if(view.name==="promos") return renderPromos();
  if(view.name==="collection") return renderCollection(view.id);
}

function temaAtual(){ return (S.config && S.config.tema) || "ouro"; }

/* "Como o aparelho" não é um tema: é uma escolha que aponta para outro.
   Claro vira Pergaminho, escuro vira o de sempre. */
function temaEfetivo(){
  const id = temaAtual();
  if(id !== "sistema") return id;
  return matchMedia("(prefers-color-scheme: light)").matches ? "pergaminho" : "ouro";
}

function aplicarTema(){
  const id = temaEfetivo();
  const t = TEMAS[id] || TEMAS.ouro;
  const raiz = document.documentElement;
  // limpa o tema anterior antes de pôr o novo, senão sobra variável solta
  Object.keys(TEMAS).forEach(k => Object.keys(TEMAS[k].vars).forEach(v => raiz.style.removeProperty(v)));
  Object.entries(t.vars).forEach(([k, v]) => raiz.style.setProperty(k, v));
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t.vars["--bg"] || "#0C0A11");
}

/* =====================================================================
   HOME — as notícias do dia

   O app não reproduz matéria de ninguém: mostra manchete, imagem e fonte,
   e o toque leva para o site de quem escreveu. Quem lê os feeds é o robô,
   de quatro em quatro horas, porque nenhum site de Magic libera leitura
   direta pelo navegador.

   A última leva fica guardada aqui no aparelho: no metrô, a Home abre.
   ===================================================================== */
const NEWS_KEY = "collector.noticias";
let noticias = { itens:null, em:0, erro:null, carregando:false };

function noticiasGuardadas(){
  try{
    const g = JSON.parse(localStorage.getItem(NEWS_KEY) || "null");
    return (g && Array.isArray(g.itens)) ? g : null;
  }catch(e){ return null; }
}

async function carregarNoticias(forcar){
  if(noticias.carregando) return;
  if(!forcar && noticias.itens && Date.now() - noticias.em < 15*60*1000) return;
  noticias.carregando = true;
  try{
    const linhas = await supa("news?select=id,url,source,source_name,title,summary,image,published_at"
                            + "&order=published_at.desc&limit=40");
    noticias = { itens:linhas, em:Date.now(), erro:null, carregando:false };
    try{ localStorage.setItem(NEWS_KEY, JSON.stringify({ itens:linhas, em:noticias.em })); }catch(e){}
  }catch(e){
    noticias.carregando = false;
    noticias.erro = e.message;
  }
  if(view.name === "home") renderHome();
}

const FONTE_COR = {
  wizards:"#D9A441", goldfish:"#4FBF8B", hipsters:"#E05B5B",
  edhrec:"#6fb6f0", herald:"#b48ce0",
};

function quandoRelativo(iso){
  const t = new Date(iso).getTime();
  if(!t) return "";
  const min = Math.round((Date.now() - t) / 60000);
  if(min < 2) return "agora";
  if(min < 60) return `há ${min} min`;
  const h = Math.round(min/60);
  if(h < 24) return `há ${h} h`;
  const d = Math.round(h/24);
  if(d === 1) return "ontem";
  if(d < 30) return `há ${d} dias`;
  return new Date(iso).toLocaleDateString("pt-BR", { day:"2-digit", month:"short" });
}

/* O resumo do feed costuma vir com o rodapé do WordPress grudado —
   "The post X appeared first on Y", "Continue reading". Isso não é
   notícia, é encanamento: sai antes de aparecer na tela. */
function limparResumo(txt){
  return String(txt || "")
    .replace(/\s*The post\b[\s\S]*?appeared first on[\s\S]*$/i, "")
    .replace(/\s*Continue reading[\s\S]*$/i, "")
    .replace(/\s*Read (the rest|more)[\s\S]*$/i, "")
    .replace(/\s*\[[.…]+\]\s*$/, "")
    .replace(/\s*[.…]{2,}\s*$/, "…")
    .trim();
}

function noticiaHTML(n, grande){
  const cor = FONTE_COR[n.source] || "var(--accent)";
  const img = n.image
    ? `<img src="${escapeHTML(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
    : `<div class="sem-foto">${escapeHTML((n.source_name||"?")[0])}</div>`;
  return `
  <a class="noticia ${grande?"grande":""}" href="${escapeHTML(n.url)}" target="_blank" rel="noopener noreferrer">
    <div class="n-foto">${img}</div>
    <div class="n-corpo">
      <span class="n-fonte" style="color:${cor}">${escapeHTML(n.source_name)}</span>
      <h3>${escapeHTML(n.title)}</h3>
      ${grande && limparResumo(n.summary) ? `<p>${escapeHTML(limparResumo(n.summary))}</p>` : ""}
      <span class="n-quando">${quandoRelativo(n.published_at)}</span>
    </div>
  </a>`;
}

/* =====================================================================
   CALENDÁRIO DE LANÇAMENTOS

   O Scryfall publica as edições com data — inclusive as que ainda não
   saíram. É a única coisa no app que dá motivo para abrir fora da hora
   de comprar: pré-release tem data marcada e todo mundo esquece.

   Três decisões:
   - só edição de verdade (`expansion`, `core`, `draft_innovation`,
     `commander`, `masters`) — o Scryfall lista dezenas de "sets" que são
     promo, token e memorabilia, e isso entupiria a tela;
   - a data de pré-release é a do lançamento menos 8 dias (sexta anterior),
     que é a regra da Wizards há anos — e a tela diz que é estimativa,
     porque a Wizards não publica isso num campo;
   - fica guardado por 12 horas: é lista que muda uma vez por mês.
   ===================================================================== */
let lancamentos = { itens:null, carregando:false, em:0 };
/* os mesmos tipos que a tela de Edições chama de "principais" */
const TIPOS_DE_LANCAMENTO = ["expansion", "core", "draft_innovation", "commander", "masters"];

async function carregarLancamentos(){
  if(lancamentos.carregando) return;
  try{
    const g = JSON.parse(localStorage.getItem("collector.sets") || "null");
    if(g && Date.now() - g.em < 12*3600*1000){ lancamentos.itens = g.itens; lancamentos.em = g.em; return; }
  }catch(e){}
  lancamentos.carregando = true;
  try{
    const r = await fetch(`${API}/sets`);
    if(!r.ok) throw new Error("sets " + r.status);
    const j = await r.json();
    const hoje = new Date().toISOString().slice(0, 10);
    lancamentos.itens = (j.data || [])
      .filter(x => TIPOS_DE_LANCAMENTO.includes(x.set_type) && x.released_at && !x.digital)
      .filter(x => x.released_at >= hoje)
      .sort((a, b) => a.released_at.localeCompare(b.released_at))
      .slice(0, 6)
      .map(x => ({ code:x.code, nome:x.name, dia:x.released_at, icone:x.icon_svg_uri,
                   cartas:x.card_count || 0 }));
    lancamentos.em = Date.now();
    try{ localStorage.setItem("collector.sets",
      JSON.stringify({ itens:lancamentos.itens, em:lancamentos.em })); }catch(e){}
  }catch(e){ lancamentos.itens = lancamentos.itens || []; }
  lancamentos.carregando = false;
  if(view.name === "home") pintarLancamentos();
}

const diasAte = dia => Math.ceil((Date.parse(dia + "T12:00:00Z") - Date.now()) / 86400000);
/* pré-release é a sexta anterior ao lançamento — 8 dias antes, na prática */
const preDe = dia => new Date(Date.parse(dia + "T12:00:00Z") - 8*86400000).toISOString().slice(0, 10);
const diaCurto = dia => new Date(dia + "T12:00:00Z")
  .toLocaleDateString("pt-BR", { day:"2-digit", month:"short" });

function blocoLancamentos(){
  const itens = lancamentos.itens;
  if(itens === null) return `<div id="lancamentos"></div>`;
  if(!itens.length) return `<div id="lancamentos"></div>`;
  return `<div id="lancamentos">
    <h3 class="grupo-titulo" style="margin-top:26px">O que vem por aí<span>${itens.length}</span></h3>
    <div class="lanc-grade">
      ${itens.map(x => {
        const faltam = diasAte(x.dia);
        const pre = preDe(x.dia);
        const faltamPre = diasAte(pre);
        return `<button class="lanc" data-set="${escapeHTML(x.code)}">
          ${x.icone ? `<img class="lanc-ico" src="${escapeHTML(x.icone)}" alt="" loading="lazy">` : ""}
          <span class="lanc-nome">${escapeHTML(x.nome)}</span>
          <span class="lanc-data">${diaCurto(x.dia)}${
            faltam > 0 ? ` · em ${faltam} dia${faltam > 1 ? "s" : ""}` : " · hoje"}</span>
          ${faltamPre > 0
            ? `<span class="lanc-pre">pré-release por volta de ${diaCurto(pre)}</span>`
            : faltam > 0 ? `<span class="lanc-pre">pré-release já passou</span>` : ""}
        </button>`;
      }).join("")}
    </div>
    <p class="dg-txt">Datas de lançamento do Scryfall. A do pré-release é <b>estimativa</b> — a sexta
    anterior, que é como a Wizards costuma marcar; ela não publica essa data num campo, então confira
    com a sua loja antes de contar com ela. Tocar abre a edição no Buscador.</p>
  </div>`;
}

function pintarLancamentos(){
  const alvo = document.getElementById("lancamentos");
  if(!alvo) return;
  alvo.outerHTML = blocoLancamentos();
  ligarLancamentos();
}

/* =====================================================================
   COLEÇÕES DA COMUNIDADE

   Publicar manda a DEFINIÇÃO da coleção (nome, busca ou lista de cartas).
   O que você tem não sai daqui — quem segue conta o próprio progresso com
   os próprios dados.

   Seguir copia a definição para "Minhas coleções", marcada com quem fez.
   Assim tudo o que já existe — progresso, capa, faltantes, chase — passa a
   valer para ela sem uma linha nova de código.
   ===================================================================== */
let comunidade = { lista:null, sigo:[], erro:null, carregando:false };

async function carregarComunidade(){
  if(comunidade.carregando) return;
  comunidade.carregando = true;
  try{
    comunidade.lista = await supa("public_collections?select=id,local_id,owner,name,descricao,icon,autor,"
      + "cartas,seguidores,payload,updated_at&order=seguidores.desc,updated_at.desc&limit=60");
    comunidade.erro = null;
    if(logado()){
      try{ comunidade.sigo = await rpc("my_follows", {}) || []; }catch(e){ comunidade.sigo = []; }
    }
  }catch(e){
    comunidade.erro = e.message;
  }
  comunidade.carregando = false;
  if(view.name === "comunidade") renderComunidade();
}

/* a coleção pública já está aqui dentro? (por seguir, ou por ser minha) */
function localDaPublica(p){
  return (S.custom || []).find(c => c.id === p.local_id
    || (c.origem && c.origem.id === p.id));
}

function renderComunidade(){
  if(!comunidade.lista && !comunidade.carregando) carregarComunidade();
  const lista = comunidade.lista || [];
  const minhasPublicadas = (S.custom || []).filter(c => c.publicada);

  app.innerHTML = `
    <div class="section-head">
      <div>
        <h2>Coleções da comunidade</h2>
        <p>Metas que outros colecionadores montaram e publicaram, das mais seguidas para as menos.
        Seguir traz a coleção para a sua lista — o seu progresso continua sendo só seu.</p>
      </div>
      <button class="icon-btn" id="com-atualizar">atualizar</button>
    </div>

    ${minhasPublicadas.length ? `
      <section class="grupo-temas">
        <h3 class="grupo-titulo">Publicadas por você<span>${minhasPublicadas.length}</span></h3>
        <div class="theme-grid">${minhasPublicadas.map(customCardHTML).join("")}</div>
      </section>` : ""}

    ${lista.length ? `
      <section class="grupo-temas">
        <h3 class="grupo-titulo">Mais seguidas<span>${lista.length}</span></h3>
        <div class="theme-grid">${lista.map(publicaCardHTML).join("")}</div>
      </section>`
    : comunidade.erro ? `<div class="empty">Não consegui buscar agora.<br>
        <span style="color:var(--faint);font-size:12.5px">${escapeHTML(comunidade.erro)}</span></div>`
    : comunidade.carregando ? `<div class="empty">Buscando…</div>`
    : `<div class="empty">Ninguém publicou uma coleção ainda.<br>
        Pode ser você: monte uma em <b>Minhas coleções</b> e toque em publicar.</div>`}`;

  const at = document.getElementById("com-atualizar");
  if(at) at.onclick = () => { comunidade.lista = null; carregarComunidade(); renderComunidade(); };
  app.querySelectorAll("[data-open]").forEach(el => el.onclick = () => go("collection", el.dataset.open));
  app.querySelectorAll("[data-seguir]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    seguirPublica(lista.find(p => p.id === b.dataset.seguir), b);
  });
}

function publicaCardHTML(p){
  const local = localDaPublica(p);
  const seguindo = comunidade.sigo.includes(p.id) || !!local;
  return `
  <div class="theme publica" ${local ? `data-open="${local.id}"` : ""}>
    ${capaHTML(local ? local.id : "pub-"+p.id, "linear-gradient(135deg,#26313f,#40566f)", p.icon || "⭐")}
    <div class="theme-body">
      <h3>${escapeHTML(p.name)}</h3>
      <p>${escapeHTML(p.descricao || "")}</p>
      <div class="theme-meta">
        <span class="chip">${p.autor ? "por " + escapeHTML(p.autor) : "anônimo"}</span>
        <span>${p.cartas ? p.cartas + " cartas · " : ""}${p.seguidores} seguindo</span>
      </div>
      <button class="btn ${seguindo?"ghost":""}" data-seguir="${p.id}" style="margin-top:10px;width:100%">
        ${seguindo ? (local ? "Abrir na minha lista" : "Seguindo") : "Seguir"}
      </button>
    </div>
  </div>`;
}

async function seguirPublica(p, botao){
  if(!p) return;
  const local = localDaPublica(p);
  if(local) return go("collection", local.id);

  if(!logado()){
    toast("Entre na sua conta para seguir uma coleção");
    return abrirConta();
  }
  botao.disabled = true; botao.textContent = "seguindo…";
  try{
    await rpc("follow_collection", { p_id:p.id, p_seguir:true });
  }catch(e){
    botao.disabled = false; botao.textContent = "Seguir";
    return toast("Não consegui seguir: " + e.message);
  }
  // a definição vira uma coleção aqui dentro, com a marca de quem fez
  const d = p.payload || {};
  const nova = {
    id:"s" + Date.now().toString(36), type:d.type || "query", name:p.name,
    desc:p.descricao || d.desc || "", icon:p.icon || d.icon || "⭐",
    q:d.q || null, order:"name", cards:d.cards || [], createdAt:Date.now(),
    unique:d.unique || "cards",
    origem:{ id:p.id, autor:p.autor || "", em:Date.now() },
  };
  S.custom.push(nova); save();
  comunidade.sigo.push(p.id);
  toast(`"${p.name}" entrou nas suas coleções`);
  go("collection", nova.id);
}

/* publicar / despublicar uma coleção sua */
async function publicarColecao(col){
  if(!logado()){ toast("Entre na sua conta para publicar"); return abrirConta(); }
  const total = col.type === "manual" ? (col.cards||[]).length : (S.totals[col.id] || 0);
  const payload = { app:"collector", v:1, type:col.type || "query", q:col.q || null,
                    cards:col.cards || [], unique:col.unique || "cards",
                    icon:col.icon || "⭐", desc:col.desc || "" };
  try{
    await rpc("publish_collection", {
      p_local_id: col.id, p_name: col.name, p_desc: col.desc || null,
      p_icon: col.icon || "⭐", p_autor: (S.mesa && S.mesa.eu) || "",
      p_payload: payload, p_cartas: total });
    col.publicada = true; save();
    toast("Publicada — já aparece para a comunidade");
  }catch(e){ toast("Não consegui publicar: " + e.message); }
  if(view.name === "comunidade"){ comunidade.lista = null; carregarComunidade(); }
  render();
}

async function despublicarColecao(col){
  try{
    await rpc("unpublish_collection", { p_local_id: col.id });
    col.publicada = false; save();
    toast("Saiu da comunidade — continua aqui com você");
  }catch(e){ toast("Não consegui tirar: " + e.message); }
  if(view.name === "comunidade"){ comunidade.lista = null; carregarComunidade(); }
  render();
}

function renderThemes(){
  // com 60 coleções, jogar tudo numa grade só vira parede; vão por assunto
  const grupos = [];
  THEMES.forEach(t => {
    const g = grupos.find(x => x.nome === (t.grupo || "Outras"));
    if(g) g.itens.push(t); else grupos.push({ nome:t.grupo || "Outras", itens:[t] });
  });

  const busca = (temas.busca || "").trim();
  const filtrar = lista => {
    if(!busca) return lista;
    const t = semAcento(busca);
    return lista.filter(x => semAcento(x.name).includes(t) || semAcento(x.desc).includes(t)
                          || semAcento(x.grupo || "").includes(t));
  };
  const visiveis = grupos.map(g => ({ ...g, itens:filtrar(g.itens) })).filter(g => g.itens.length);
  const quantas = visiveis.reduce((a,g) => a + g.itens.length, 0);

  app.innerHTML = `
    <div class="section-head">
      <div>
        <h2>Coleções temáticas</h2>
        <p>${THEMES.length} metas prontas para colecionar, de "todas as corujas" a "todos os Sol Ring".
        Abra uma, marque o que você já tem e acompanhe o progresso — as cartas vêm ao vivo do Scryfall.</p>
      </div>
      <input type="search" id="busca-tema" placeholder="filtrar temas…" value="${escapeHTML(busca)}"
             style="width:auto;min-width:200px">
    </div>
    ${quantas ? visiveis.map(g => `
      <section class="grupo-temas">
        <h3 class="grupo-titulo">${escapeHTML(g.nome)}<span>${g.itens.length}</span></h3>
        <div class="theme-grid">${g.itens.map(themeCardHTML).join("")}</div>
      </section>`).join("")
    : `<div class="empty">Nenhum tema com esse nome.</div>`}`;

  app.querySelectorAll("[data-open]").forEach(el=> el.onclick = ()=> go("collection", el.dataset.open));

/* ---------------- capa da coleção ----------------
   Por padrão a capa é o emoji sobre uma cor. Quem quiser põe uma carta:
   guardo só o recorte da arte e o nome, para a capa continuar existindo
   mesmo sem internet e sem depender da carta estar em alguma lista. */
function capaDe(id){ return (S.capas || {})[id] || null; }
function definirCapa(id, carta){
  S.capas = S.capas || {};
  if(!carta) delete S.capas[id];
  else S.capas[id] = { img: carta.arteCrop || carta.normal || carta.small, nome: carta.name, cid: carta.id };
  save();
}
function capaHTML(id, fundo, emoji){
  const capa = capaDe(id);
  return capa && capa.img
    ? `<div class="theme-cover com-arte" style="background-image:url('${escapeHTML(capa.img)}')"
            title="capa: ${escapeHTML(capa.nome || "")}"></div>`
    : `<div class="theme-cover" style="background:${fundo}">${emoji}</div>`;
}

function themeCardHTML(t){
  const total = S.totals[t.id];
  const pct = total ? Math.round(100*collectionOwnedCount(t.id)/total) : null;
  return `
  <button class="theme" data-open="${t.id}">
    ${capaHTML(t.id, t.cover, t.icon)}
    <div class="theme-body">
      <h3>${t.name}</h3>
      <p>${t.desc}</p>
      <div class="theme-meta">
        <span class="chip">${total ? total.toLocaleString("pt-BR")+" cartas" : "Magic"}</span>
        <span>${pct!==null ? pct+"% completa" : "abrir →"}</span>
      </div>
      ${pct!==null ? `<div class="mini-bar"><i style="width:${pct}%"></i></div>` : ""}
    </div>
  </button>`;
}

/* Regra única de interação com uma miniatura, para não haver surpresa:
   clique marca a carta que você não tem; carta que você já tem só sai pelo ×. */
function naChase(id){ return !!(S.chase && (S.chase.cartas||[]).some(x => x.id === id)); }

/* o botão de "quero esta" existe em toda miniatura do app: catálogo, edições,
   coleções, Secret Lair. Ele manda a carta para os chase cards sem sair da tela. */
function ligarQuero(el, c, aoMudar){
  const b = el.querySelector(".quero-carta");
  if(!b) return;
  b.onclick = e => {
    e.stopPropagation();
    if(naChase(c.id)){
      S.chase.cartas = S.chase.cartas.filter(x => x.id !== c.id); save();
      toast(`${c.name} saiu dos chase cards`);
    } else {
      porNoChase(c);
      toast(`${c.name} entrou nos chase cards`);
    }
    if(aoMudar) aoMudar(c, el);
    else { b.classList.toggle("na-lista", naChase(c.id)); b.textContent = naChase(c.id) ? "★" : "☆"; }
  };
}

function ligarCartas(grid, achar, aoMudar){
  if(!grid) return;
  grid.querySelectorAll(".card").forEach(el => {
    const c = achar(el.dataset.id);
    if(!c) return;
    ligarQuero(el, c, aoMudar);
    const info = el.querySelector(".info");
    if(info) info.onclick = e => { e.stopPropagation(); openCard(c); };
    const tirar = el.querySelector(".tirar-carta");
    if(tirar) tirar.onclick = e => {
      e.stopPropagation();
      registrarDesfazer(`tirar ${c.name} da sua coleção`, { owned:{ ...S.owned } });
      toggleOwn(c);
      if(aoMudar) aoMudar(c, el);
    };
    el.onclick = () => {
      if(isOwned(c.id)) return openCard(c);   // já é sua: clicar abre os detalhes
      toggleOwn(c);
      if(aoMudar) aoMudar(c, el);
    };
  });
}

      <div class="grow"><input type="search" id="filter-term" placeholder="filtrar por nome dentro da coleção…"></div>
      <div class="seg" id="seg">
        <button class="active" data-f="all">Todas</button>

function skeletons(n){ return Array.from({length:n},()=>`<div class="card-skel"></div>`).join(""); }

async function loadMore(){
  const st = document.getElementById("status");
  const lm = document.getElementById("loadmore");
  if(lm) lm.innerHTML = "";
  st.textContent = `Buscando página ${cur.page} no Scryfall…`;
  try{
    const json = await scryPage(cur.def.q, uniqueDaColecao(cur.def), cur.def.order||"name", cur.page);
    cur.total = (json.total_cards || 0) + (cur.extras || 0);
    const novas = (json.data||[]).map(normalize).filter(c => !cur.cards.some(x => x.id === c.id));
    cur.cards.push(...novas);
    cur.hasMore = !!json.has_more;
    cur.page++;
    S.totals[cur.def.id] = cur.total;
    save();
    paintGrid(); paintProgress();
    st.textContent = `${cur.cards.length} de ${cur.total.toLocaleString("pt-BR")} cartas carregadas`;
    if(cur.hasMore){
      const rest = Math.min(175, cur.total - cur.cards.length);
      lm.innerHTML = `<button class="btn ghost" id="more">Carregar mais ${rest} cartas</button>`;
      document.getElementById("more").onclick = loadMore;
    }
  }catch(err){
    st.innerHTML = `<span style="color:var(--red)">Falha ao falar com o Scryfall: ${escapeHTML(err.message)}</span>`;
    document.getElementById("grid").innerHTML = "";
  }
}

function visibleCards(){
  const fora = new Set(excluidasDe(cur.def.id));
  return cur.cards.filter(c=>{
    if(fora.has(c.id)) return false;
    if(cur.term && !c.name.toLowerCase().includes(cur.term)) return false;
    if(cur.filter==="owned") return isOwned(c.id);
    if(cur.filter==="missing") return !isOwned(c.id);
    return true;
  });
}

function paintGrid(){
  const grid = document.getElementById("grid");
  const list = visibleCards();
  if(list.length===0){
    const manualVazia = cur.def.type==="manual" && cur.cards.length===0;
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${manualVazia
      ? `Coleção vazia. Vá no <b>Catálogo</b>, abra o <b>ⓘ</b> de uma carta e escolha “Adicionar a uma coleção manual”.`
      : "Nenhuma carta com esse filtro."}</div>`;
    return;
  }
  const porId = new Map(cur.cards.map(c => [c.id, c]));
  pintarGradeAosPoucos(grid, list, c => cardHTML(c),
    caixa => ligarCartas(caixa, id => porId.get(id), () => { paintGrid(); paintProgress(); }));
}

/* =====================================================================
   PINTAR A GRADE AOS POUCOS

   Cinco mil cartas de uma vez são cinco mil nós no DOM: um segundo de
   tela travada no desktop, vários no telefone. Aqui a grade sai em lotes
   e o próximo lote só é montado quando você chega perto do fim da rolagem.

   Duas sutilezas que valem o comentário:

   - os cliques são ligados numa CAIXA à parte antes de os nós entrarem na
     grade. Ligar de novo na grade inteira a cada lote seria trabalho
     crescente — no fim, ligar 5.000 cartas quarenta vezes;
   - sem `IntersectionObserver` (navegador velho, ou um teste que mede o
     total) a função pinta tudo de uma vez, e não some com nada.
   ===================================================================== */
const LOTE_GRADE = 120;

function pintarGradeAosPoucos(grid, lista, html, ligar){
  if(!grid) return;
  grid.innerHTML = "";
  const sentinela = document.createElement("div");
  sentinela.className = "grade-mais";
  grid.appendChild(sentinela);

  let i = 0, obs = null;
  const proximo = () => {
    const parte = lista.slice(i, i + LOTE_GRADE);
    i += parte.length;
    if(parte.length){
      const caixa = document.createElement("div");
      caixa.innerHTML = parte.map(html).join("");
      if(ligar) ligar(caixa);
      while(caixa.firstChild) grid.insertBefore(caixa.firstChild, sentinela);
    }
    if(i >= lista.length){
      sentinela.remove();
      if(obs) obs.disconnect();
    } else {
      sentinela.textContent = `mais ${(lista.length - i).toLocaleString("pt-BR")} carregando…`;
    }
  };

  if(typeof IntersectionObserver === "function"){
    obs = new IntersectionObserver(entradas => {
      if(entradas.some(e => e.isIntersecting)) proximo();
    }, { rootMargin:"800px" });
    obs.observe(sentinela);
    proximo();
  } else {
    while(i < lista.length) proximo();
  }
}

function cardHTML(c, copias, selo, comQtd){
  const own = isOwned(c.id);
  const n = Number(copias);
  copias = Number.isFinite(n) && n > 1 ? n : 0;
  const qtd = own ? qtdDe(c.id) : 0;
  /* o lugar só aparece quando você está justamente procurando por lugar —
     nas outras telas seria mais uma etiqueta em cima da arte */
  const onde = own ? ((S.owned[c.id] || {}).loc || "") : "";
  const mostrarOnde = onde && view.name === "minha" &&
                      (minha.f.local || minha.f.ordem === "local");
  return `
  <div class="card ${own?"owned":""}" data-id="${c.id}" title="${escapeHTML(c.name)}${
    onde ? " — guardada em " + escapeHTML(onde) : ""} — clique para marcar">
    ${mostrarOnde ? `<span class="etiq-local">${escapeHTML(onde)}</span>` : ""}
    ${copias > 1 ? `<span class="copias">×${copias}</span>` : ""}
    ${selo ? `<span class="copias selo-edicoes">${escapeHTML(selo)}</span>` : ""}
    ${["foil","etched"].includes(c.acabamentoEscolhido) ? `<span class="marca-foil">${nomeAcabamento(c, c.acabamentoEscolhido)}</span>` : ""}
    ${own ? `<button class="tirar-carta" title="tirar da minha coleção">×</button>` : ""}
    <button class="quero-carta ${naChase(c.id)?"na-lista":""}"
            title="${naChase(c.id) ? "já está nos chase cards" : "quero esta — mandar para os chase cards"}">${naChase(c.id)?"★":"☆"}</button>
    ${c.small ? `<img loading="lazy" src="${c.small}" alt="${escapeHTML(c.name)}">`
              : `<div class="sem-arte">${escapeHTML(c.name)}</div>`}
    <div class="tick">${own?"✓":""}</div>
    <button class="info">i</button>
    <div class="cap">
      <span class="cap-nome">${escapeHTML(c.name)}</span>
      <span class="cap-preco">${precoLocal(c) ? formatarPreco(precoLocal(c)) : "—"}</span>
    </div>
    ${comQtd && own ? `
      <div class="qtd-ctl" title="quantas cópias desta carta você tem">
        <button class="qtd-menos" data-id="${c.id}">−</button>
        <input class="qtd-num" type="number" min="0" step="1" inputmode="numeric"
               value="${qtd}" data-id="${c.id}" aria-label="quantidade">
        <button class="qtd-mais" data-id="${c.id}">+</button>
      </div>` : ""}
  </div>`;
}

/* ---- quantas cópias de cada carta ---- */
function qtdDe(id){
  const r = S.owned[id];
  if(!r) return 0;
  const n = Number(r.q);
  return Number.isFinite(n) && n > 0 ? n : 1;
}
function definirQtd(id, n){
  const r = S.owned[id];
  if(!r) return;
  n = Math.max(0, Math.floor(Number(n) || 0));
  if(n === 0) delete S.owned[id];
  else r.q = n;
  save(); renderKPIs();
}
/* liga os botões de quantidade de uma grade */
function ligarQuantidades(caixa, depois){
  if(!caixa) return;
  const mexer = (id, n) => { definirQtd(id, n); if(depois) depois(); };
  caixa.querySelectorAll(".qtd-mais").forEach(b => b.onclick = e => {
    e.stopPropagation(); mexer(b.dataset.id, qtdDe(b.dataset.id) + 1);
  });
  caixa.querySelectorAll(".qtd-menos").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.id, atual = qtdDe(id);
    if(atual <= 1) registrarDesfazer(`tirar a última cópia`, { owned:{ ...S.owned } });
    mexer(id, atual - 1);
  });
  caixa.querySelectorAll(".qtd-num").forEach(el => {
    el.onclick = e => e.stopPropagation();
    el.onchange = e => { e.stopPropagation(); mexer(el.dataset.id, el.value); };
  });
}

function paintProgress(){
  const fora = new Set(excluidasDe(cur.def.id));
  const dentro = cur.cards.filter(c => !fora.has(c.id));
  const total = (cur.def.type==="manual" ? cur.cards.length : (cur.total||0)) - fora.size;
  const own = dentro.filter(c=>isOwned(c.id)).length;
  const pct = total ? Math.round(100*own/total) : 0;
  if(cur.def.id && cur.def.id!=="__search__"){ S.totals[cur.def.id]=total; S.totals[cur.def.id+"::own"]=own; save(); }
  document.getElementById("pct").textContent = pct+"%";
  document.getElementById("bar").style.width = pct+"%";
  document.getElementById("prog-label").textContent = `${own} de ${total.toLocaleString("pt-BR")} cartas`;
  const val = dentro.filter(c=>isOwned(c.id)).reduce((a,c)=>a+(Number(c.usd)||0),0);
  document.getElementById("prog-value").textContent = val ? money(val)+" nesta coleção" : "";
  renderKPIs();
}

async function carregarSets(){
  if(SETS) return SETS;
  const guardado = localStorage.getItem("collector.sets.v1");
  if(guardado){
    try{
      const { em, lista } = JSON.parse(guardado);
      if(Date.now() - em < 7*24*3600*1000){ SETS = lista; return SETS; }
    }catch(e){}
  }
  const r = await fetch(`${API}/sets`, { headers:{Accept:"application/json"} });
  const j = await r.json();
  SETS = (j.data||[])
    .filter(s => !s.digital && s.card_count > 0)
    .map(s => ({ code:s.code, name:s.set_name || s.name, ano:(s.released_at||"").slice(0,4),
                 n:s.card_count, tipo:s.set_type, icone:s.icon_svg_uri }))
    .filter(s => s.ano);
  try{ localStorage.setItem("collector.sets.v1", JSON.stringify({ em:Date.now(), lista:SETS })); }catch(e){}
  return SETS;
}

async function carregarSubtipos(){
  if(SUBTIPOS) return SUBTIPOS;
  try{
    const r = await fetch(`${API}/catalog/creature-types`, { headers:{Accept:"application/json"} });
    SUBTIPOS = (await r.json()).data || [];
  }catch(e){ SUBTIPOS = []; }
  return SUBTIPOS;
}

/* ------- monta a busca do Scryfall a partir dos filtros ------- */
function montarQuery(f){
  const p = [];
  const aspas = s => `"${String(s).replace(/"/g, '')}"`;

  if(f.texto.trim()){
    const t = aspas(f.texto.trim());
    p.push(f.noTexto ? `(name:${t} or o:${t})` : `name:${t}`);
  }
  if(f.artista.trim()) p.push(`a:${aspas(f.artista.trim())}`);

  if(f.set) p.push(`e:${f.set}`);
  else {
    if(f.anoDe && f.anoAte && f.anoDe === f.anoAte) p.push(`year:${f.anoDe}`);
    else { if(f.anoDe) p.push(`year>=${f.anoDe}`); if(f.anoAte) p.push(`year<=${f.anoAte}`); }
  }

  if(f.cores.length){
    const so = f.cores.filter(c => c !== "c").join("");
    if(f.cores.includes("c") && !so) p.push("c:c");
    else if(so){
      const op = f.modoCor === "exatamente" ? "=" : f.modoCor === "no-maximo" ? "<=" : ">=";
      p.push(`c${op}${so}`);
    }
  }
  if(f.raridades.length) p.push(`(${f.raridades.map(r => `r:${r}`).join(" or ")})`);
  if(f.tipos.length)     p.push(`(${f.tipos.map(t => `t:${t}`).join(" or ")})`);
  if(f.subtipo.trim())   p.push(`t:${aspas(f.subtipo.trim())}`);

  if(f.mvDe !== "")  p.push(`mv>=${f.mvDe}`);
  if(f.mvAte !== "") p.push(`mv<=${f.mvAte}`);
  if(f.usdDe !== "")  p.push(`usd>=${f.usdDe}`);
  if(f.usdAte !== "") p.push(`usd<=${f.usdAte}`);

  f.flags.forEach(fl => p.push(fl === "firstprint" ? "is:firstprinting" : `is:${fl}`));
  if(f.acabamento === "foil")    p.push("is:foil");
  if(f.acabamento === "nonfoil") p.push("is:nonfoil");
  if(f.avancado.trim()) p.push(f.avancado.trim());

  // sem nenhum filtro a busca seria o Magic inteiro; ancora em algo válido
  return p.length ? p.join(" ") : "game:paper";
}

function resumoFiltros(f){
  const n = ["texto","artista","set","subtipo","avancado"].filter(k => f[k]).length
          + (f.anoDe||f.anoAte ? 1 : 0)
          + f.cores.length + f.raridades.length + f.tipos.length + f.flags.length
          + ["mvDe","mvAte","usdDe","usdAte"].filter(k => f[k] !== "").length;
  return n;
}

function montarAnos(){
  const strip = document.getElementById("anos");
  const anos = [];
  for(let a = ANO_ATUAL; a >= ANO_INICIAL; a--) anos.push(a);
  strip.innerHTML = anos.map(a => {
    const ativo = cat.f.anoDe == a && cat.f.anoAte == a;
    return `<button class="ano ${ativo?"on":""}" data-ano="${a}">${a}</button>`;
  }).join("");
  strip.onclick = async e => {
    const b = e.target.closest(".ano"); if(!b) return;
    const a = b.dataset.ano;
    const jaEra = cat.f.anoDe == a && cat.f.anoAte == a;
    cat.f.anoDe = jaEra ? "" : a;
    cat.f.anoAte = jaEra ? "" : a;
    cat.f.set = "";
    await renderCatalogo();
    if(!jaEra) buscarCatalogo();
  };
}

async function preencherListas(){
  const [sets, subtipos] = await Promise.all([carregarSets(), carregarSubtipos()]);

  const dl = document.getElementById("lista-subtipos");
  if(dl) dl.innerHTML = subtipos.map(t => `<option value="${escapeHTML(t)}">`).join("");

  const anos = [];
  for(let a = ANO_ATUAL; a >= ANO_INICIAL; a--) anos.push(a);
  const de = document.getElementById("f-anode"), ate = document.getElementById("f-anoate");
  if(de && ate){
    de.innerHTML = `<option value="">de…</option>` +
      anos.map(a => `<option value="${a}"${cat.f.anoDe==a?" selected":""}>${a}</option>`).join("");
    ate.innerHTML = `<option value="">até…</option>` +
      anos.map(a => `<option value="${a}"${cat.f.anoAte==a?" selected":""}>${a}</option>`).join("");
  }

  const sel = document.getElementById("f-set");
  if(sel){
    const filtrados = sets
      .filter(s => (!cat.f.anoDe || s.ano >= cat.f.anoDe) && (!cat.f.anoAte || s.ano <= cat.f.anoAte))
      .sort((a,b) => b.ano.localeCompare(a.ano) || a.name.localeCompare(b.name));
    sel.innerHTML = `<option value="">todas as edições (${filtrados.length})</option>` +
      filtrados.map(s => `<option value="${s.code}"${cat.f.set===s.code?" selected":""}>${escapeHTML(s.name)} · ${s.ano} · ${s.n} cartas</option>`).join("");
  }

  const busca = document.getElementById("f-set-busca");
  const listaEl = document.getElementById("f-set-lista");
  const escolhaEl = document.getElementById("f-set-escolha");

  const simbolo = st => st.icone
    ? `<img class="set-simbolo" src="${st.icone}" alt="" loading="lazy">`
    : `<span class="set-simbolo vazio">◆</span>`;

  if(escolhaEl){
    const atual = cat.f.set && sets.find(st => st.code === cat.f.set);
    escolhaEl.innerHTML = atual
      ? `<div class="set-atual">${simbolo(atual)}<b>${escapeHTML(atual.name)}</b>
           <span>${atual.ano} · ${atual.n}</span><button class="tirar" id="f-set-tirar" title="tirar filtro">×</button></div>`
      : "";
    const tirar = document.getElementById("f-set-tirar");
    if(tirar) tirar.onclick = () => { cat.f.set = ""; renderCatalogo().then(()=>{ if(cat.buscou) buscarCatalogo(); }); };
  }

  if(busca && listaEl){
    const mostrar = termo => {
      const t = semAcento(termo).trim();
      const achados = sets
        .filter(st => !t || semAcento(st.name).includes(t) || st.code.includes(t))
        .filter(st => (!cat.f.anoDe || st.ano >= cat.f.anoDe) && (!cat.f.anoAte || st.ano <= cat.f.anoAte))
        .sort((a,b) => b.ano.localeCompare(a.ano) || b.n - a.n)
        .slice(0, 60);
      listaEl.hidden = !t && !achados.length;
      listaEl.innerHTML = achados.length
        ? achados.map(st => `
            <button class="set-linha" data-code="${st.code}">
              ${simbolo(st)}
              <span class="set-linha-nome">${escapeHTML(st.name)}</span>
              <span class="set-linha-meta">${st.ano} · ${st.n}</span>
            </button>`).join("")
        : `<div class="set-linha vazia">nenhuma edição com esse nome</div>`;
    };

    busca.oninput = () => { listaEl.hidden = false; mostrar(busca.value); };
    busca.onfocus = () => { listaEl.hidden = false; mostrar(busca.value); };
    listaEl.onclick = e => {
      const b = e.target.closest(".set-linha[data-code]"); if(!b) return;
      cat.f.set = b.dataset.code;
      busca.value = "";
      renderCatalogo().then(buscarCatalogo);
    };
    // um ouvinte só: sem isto, cada volta ao catálogo empilhava mais um
    if(!window.__fechaListaSet){
      window.__fechaListaSet = e => {
        const el = document.getElementById("f-set-lista"), campo = document.getElementById("f-set-busca");
        if(el && el.isConnected && !el.contains(e.target) && e.target !== campo) el.hidden = true;
      };
      document.addEventListener("click", window.__fechaListaSet);
    }
  }

  // quando o período é um ano só, mostra as edições daquele ano como atalhos
  const alvo = document.getElementById("sets-do-ano");
  if(alvo && cat.f.anoDe && cat.f.anoDe === cat.f.anoAte){
    const doAno = sets.filter(s => s.ano === cat.f.anoDe)
      .sort((a,b) => b.n - a.n);
    alvo.innerHTML = doAno.length ? `
      <div class="sets-linha">
        <span class="flabel" style="margin:0 4px 0 0">Edições de ${cat.f.anoDe}:</span>
        ${doAno.map(s => `<button class="set-chip so-simbolo ${cat.f.set===s.code?"on":""}" data-set="${s.code}"
              title="${escapeHTML(s.name)} — ${s.n} cartas">
            ${s.icone ? `<img class="set-simbolo" src="${s.icone}" alt="${escapeHTML(s.name)}" loading="lazy">`
                      : `<span class="set-simbolo vazio">◆</span>`}
            <b>${s.n}</b></button>`).join("")}
      </div>` : "";
    alvo.onclick = e => {
      const b = e.target.closest(".set-chip"); if(!b) return;
      cat.f.set = cat.f.set === b.dataset.set ? "" : b.dataset.set;
      renderCatalogo().then(buscarCatalogo);
    };
  } else if(alvo){ alvo.innerHTML = ""; }
}

function ligarFiltros(){
  const f = cat.f;
  const liga = (id, campo, prop="value") => {
    const el = document.getElementById(id);
    if(el) el.addEventListener("input", () => { f[campo] = prop === "checked" ? el.checked : el.value; atualizarPreview(); });
  };
  liga("f-texto","texto"); liga("f-notexto","noTexto","checked"); liga("f-artista","artista");
  liga("f-subtipo","subtipo"); liga("f-mvde","mvDe"); liga("f-mvate","mvAte");
  liga("f-usdde","usdDe"); liga("f-usdate","usdAte"); liga("f-avancado","avancado");

  const alterna = (containerId, attr, campo) => {
    const box = document.getElementById(containerId);
    if(!box) return;
    box.onclick = e => {
      const b = e.target.closest(".tog"); if(!b) return;
      const v = b.dataset[attr];
      const i = f[campo].indexOf(v);
      if(i >= 0) f[campo].splice(i,1); else f[campo].push(v);
      b.classList.toggle("on");
      atualizarPreview();
    };
  };
  alterna("f-cores","cor","cores");
  alterna("f-raridades","rar","raridades");
  alterna("f-tipos","tipo","tipos");
  alterna("f-flags","flag","flags");

  const acab = document.getElementById("f-acabamento");
  if(acab) acab.onchange = () => { f.acabamento = acab.value; atualizarPreview(); if(cat.buscou) buscarCatalogo(); };

  const modo = document.getElementById("f-modocor");
  if(modo) modo.onchange = () => { f.modoCor = modo.value; atualizarPreview(); };

  const de = document.getElementById("f-anode"), ate = document.getElementById("f-anoate"),
        set = document.getElementById("f-set");
  if(de)  de.onchange  = () => { f.anoDe = de.value; f.set = ""; renderCatalogo(); };
  if(ate) ate.onchange = () => { f.anoAte = ate.value; f.set = ""; renderCatalogo(); };
  if(set) set.onchange = () => { f.set = set.value; atualizarPreview(); };

  const ordem = document.getElementById("f-ordem");
  if(ordem){
    ordem.value = f.direcao === "asc" && f.ordem === "released" ? "released-asc"
                : f.ordem === "usd" && f.direcao === "desc" ? "usd-desc"
                : f.ordem === "rarity" ? "rarity-desc" : f.ordem;
    ordem.onchange = () => {
      const v = ordem.value;
      if(v === "released"){ f.ordem = "released"; f.direcao = "desc"; }
      else if(v === "released-asc"){ f.ordem = "released"; f.direcao = "asc"; }
      else if(v === "usd-desc"){ f.ordem = "usd"; f.direcao = "desc"; }
      else if(v === "usd"){ f.ordem = "usd"; f.direcao = "asc"; }
      else if(v === "rarity-desc"){ f.ordem = "rarity"; f.direcao = "desc"; }
      else { f.ordem = v; f.direcao = "auto"; }
      if(cat.buscou) buscarCatalogo();
    };
  }
  const unico = document.getElementById("f-unico");
  if(unico) unico.onchange = () => { f.unico = unico.value; if(cat.buscou) buscarCatalogo(); };

  const agr = document.getElementById("f-agrupar-arte");
  if(agr) agr.onclick = () => {
    f.agruparArte = !f.agruparArte;
    agr.classList.toggle("on", f.agruparArte);
    S.config.agruparArte = f.agruparArte; save();
    if(cat.buscou){ pintarCatalogo(); atualizarStatus(); }
  };

  document.getElementById("buscar").onclick = buscarCatalogo;
  document.getElementById("limpar").onclick = () => { cat = { ...cat, f:FILTROS_VAZIOS(), cards:[], buscou:false }; renderCatalogo(); };
  document.getElementById("salvar-colecao").onclick = () => openNewCollection({ query: montarQuery(cat.f) });
}

function atualizarPreview(){
  const el = document.getElementById("preview");
  if(!el) return;
  const q = montarQuery(cat.f);
  const n = resumoFiltros(cat.f) + (cat.f.acabamento !== "qualquer" ? 1 : 0);
  el.innerHTML = `<span>${n ? n + (n===1?" filtro":" filtros") : "sem filtro"}</span><code>${escapeHTML(q)}</code>`;
}

async function buscarCatalogo(){
  cat.q = montarQuery(cat.f);
  cat.cards = []; cat.page = 1; cat.hasMore = false; cat.total = 0; cat.buscou = true;
  const grid = document.getElementById("grid");
  if(grid) grid.innerHTML = skeletons(18);
  await paginaCatalogo();
}

async function paginaCatalogo(){
  const st = document.getElementById("status");
  st.textContent = cat.page === 1 ? "Buscando no Scryfall…" : `Carregando página ${cat.page}…`;
  try{
    // na Europa o preço mostrado é o do Cardmarket: ordenar por dólar ali
    // dava uma lista que não batia com os números na tela
    const ordem = cat.f.ordem === "usd" && regiao().moeda === "EUR" ? "eur" : cat.f.ordem;
    const json = await scryPage(cat.q, cat.f.unico, ordem, cat.page, cat.f.direcao);
    cat.cards.push(...(json.data||[]).map(normalize));
    cat.total = json.total_cards || 0;
    cat.hasMore = !!json.has_more;
    cat.page++;
    pintarCatalogo();
    atualizarStatus();
  }catch(err){
    st.innerHTML = `<span style="color:var(--red)">Erro: ${escapeHTML(err.message)}</span>`;
    const g = document.getElementById("grid"); if(g) g.innerHTML = "";
  }
}

function atualizarStatus(){
  const st = document.getElementById("status");
  const lm = document.getElementById("loadmore");
  if(!st) return;
  if(cat.total === 0){ st.textContent = "Nenhuma carta com esses filtros."; if(lm) lm.innerHTML = ""; return; }
  const meus = cat.cards.filter(c => isOwned(c.id)).length;
  st.textContent = `${cat.cards.length} de ${cat.total.toLocaleString("pt-BR")} cartas`
                 + (meus ? ` · ${meus} você já tem` : "");
  if(lm){
    if(cat.hasMore){
      const resto = Math.min(175, cat.total - cat.cards.length);
      lm.innerHTML = `<button class="btn ghost" id="mais-cat">Carregar mais ${resto}</button>`;
      document.getElementById("mais-cat").onclick = paginaCatalogo;
    } else lm.innerHTML = "";
  }
}

/* Junta numa miniatura só as cartas de ilustração idêntica. A capa é a
   versão que você já tem, quando tem — assim a arte na tela é a sua. */
function agruparPorArte(lista){
  const mapa = new Map();
  lista.forEach(c => {
    const chave = c.arte || (c.name + "|" + c.artist);
    if(!mapa.has(chave)) mapa.set(chave, []);
    mapa.get(chave).push(c);
  });
  return [...mapa.values()].map(g => {
    const capa = g.find(c => isOwned(c.id)) || g[0];
    return { carta:capa, edicoes:g.length };
  });
}

/* A ordem por preço tem que bater com o preço que está escrito na carta.
   O Scryfall ordena pelo dólar da impressão que ele escolheu; a tela mostra
   o preço da região e do acabamento. Então, quando a ordem é por preço, a
   lista carregada é reordenada pelo número que aparece — e carta sem preço
   vai para o fim, nunca no meio. */
function ordenadasParaMostrar(lista){
  if(cat.f.ordem !== "usd") return lista;
  const valor = c => { const p = precoLocal(c); return p && p.valor > 0 ? p.valor : null; };
  const desc = cat.f.direcao !== "asc";
  return lista.slice().sort((a,b) => {
    const va = valor(a), vb = valor(b);
    if(va === null && vb === null) return 0;
    if(va === null) return 1;
    if(vb === null) return -1;
    return desc ? vb - va : va - vb;
  });
}

function pintarCatalogo(){
  const grid = document.getElementById("grid");
  if(!grid) return;
  cat.cards = ordenadasParaMostrar(cat.cards);
  cur = { def:{ id:"__catalogo__" }, cards:cat.cards, filter:"all", term:"" };
  if(cat.f.agruparArte){
    const grupos = agruparPorArte(cat.cards);
    grid.innerHTML = grupos.map(g =>
      cardHTML(g.carta, 0, g.edicoes > 1 ? `${g.edicoes} edições` : "")).join("");
  } else {
    grid.innerHTML = cat.cards.map(c => cardHTML(c)).join("");
  }
  ligarCartas(grid, id => cat.cards.find(c => c.id === id), () => { pintarCatalogo(); atualizarStatus(); });
}

  [/\bserializad[ao]s?\b|\bserialized\b/, "is:serialized", "serializadas"],

const RUIDO = new Set(("todos todas toda todo os as um uma uns umas de do da dos das com que e ou " +

  "juntar montar completar serie edicao edicoes set sets").split(" "));

function interpretar(frase){
  let resto = " " + semAcento(frase).replace(/[^\w\s$.,<>-]/g, " ").replace(/\s+/g, " ") + " ";
  const partes = [], duvidas = [];
  const pegar = (re, fn) => {
    const m = resto.match(re);
    if(!m) return false;
    fn(m);
    resto = resto.replace(m[0], " ");
    return true;
  };
  const add = (chave, rotulo, q) => partes.push({ id:`${chave}:${q}`, chave, rotulo, q });

  const querArte = /\bna arte\b|\bnas artes\b|\bna ilustracao\b|\bilustrad|\bno desenho\b|\bdesenh/.test(resto);
  const querTipo = /\bdo tipo\b|\bcriaturas? \w+/.test(resto);
  // essas palavras já cumpriram o papel de indicar intenção; não podem virar dúvida depois
  resto = resto.replace(/\b(na|nas|no|nos)? ?(arte|artes|ilustracao|ilustracoes|ilustrada|ilustradas|desenho|desenhos)\b/g, " ")
               .replace(/\bdo tipo\b|\btipo\b|\btipos\b|\btema\b|\btemas\b/g, " ");

  /* edição pelo nome — precisa dos sets carregados */
  if(SETS){
    const achado = SETS
      .map(st => ({ st, alvo:semAcento(st.name) }))
      .filter(x => x.alvo.length >= 4 && resto.includes(" " + x.alvo))
      .sort((a,b) => b.alvo.length - a.alvo.length)[0];
    if(achado){
      add("set", `edição ${achado.st.name}`, `e:${achado.st.code}`);
      resto = resto.replace(achado.alvo, " ");
    }
  }

  /* artista */
  pegar(/\b(?:do artista|da artista|ilustrada por|ilustradas por|arte de)\s+([a-z]+(?:\s+[a-z]+){0,2})/, m => {
    add("artista", `artista ${m[1].trim()}`, `a:"${m[1].trim()}"`);
  });

  /* período */
  const anos = () => {
    if(pegar(/\bentre (\d{4}) e (\d{4})\b/, m => add("ano", `entre ${m[1]} e ${m[2]}`, `year>=${m[1]} year<=${m[2]}`))) return;
    if(pegar(/\bantes de (\d{4})\b/, m => add("ano", `antes de ${m[1]}`, `year<${m[1]}`))) return;
    if(pegar(/\b(?:depois de|apos) (\d{4})\b/, m => add("ano", `depois de ${m[1]}`, `year>${m[1]}`))) return;
    if(pegar(/\b(?:a partir de|desde) (\d{4})\b/, m => add("ano", `de ${m[1]} em diante`, `year>=${m[1]}`))) return;
    if(pegar(/\bate (\d{4})\b/, m => add("ano", `até ${m[1]}`, `year<=${m[1]}`))) return;
    if(pegar(/\bdos anos (\d{2,4})\b/, m => {
      let d = m[1].length === 2 ? (Number(m[1]) >= 90 ? 1900 + Number(m[1]) : 2000 + Number(m[1])) : Number(m[1]);
      add("ano", `anos ${m[1]}`, `year>=${d} year<=${d+9}`);
    })) return;
    if(pegar(/\bultimos? (\d{1,2}) anos?\b/, m => {
      const d = ANO_ATUAL - Number(m[1]);
      add("ano", `últimos ${m[1]} anos`, `year>=${d}`);
    })) return;
    pegar(/\b(?:de|em|do ano de|ano) (\d{4})\b|\b(19[89]\d|20[0-4]\d)\b/, m => {
      const a = m[1] || m[2];
      add("ano", `de ${a}`, `year:${a}`);
    });
  };
  anos();

  /* preço — o Scryfall só entende dólar, então real é convertido */
  const emReal = /\breais?\b|\br\$/.test(resto);
  const paraUsd = v => (emReal && CAMBIO && CAMBIO.usd) ? (v / CAMBIO.usd) : v;
  const moeda = emReal ? "R$" : "US$";
  const preco = () => {
    if(pegar(/\b(?:abaixo de|menos de|ate|no maximo)\s*(?:r\$|us\$|\$)?\s*([\d.,]+)/, m => {
      const v = Number(m[1].replace(",", "."));
      add("preco", `até ${moeda} ${m[1]}`, `usd<=${paraUsd(v).toFixed(2)}`);
    })) return;
    if(pegar(/\b(?:acima de|mais de|a partir de|no minimo)\s*(?:r\$|us\$|\$)?\s*([\d.,]+)/, m => {
      const v = Number(m[1].replace(",", "."));
      add("preco", `acima de ${moeda} ${m[1]}`, `usd>=${paraUsd(v).toFixed(2)}`);
    })) return;
  };
  preco();
  resto = resto.replace(/\breais?\b|\bdolares?\b|\beuros?\b/g, " ");

  /* tratamentos */
  TRATAMENTOS_PT.forEach(([re, q, rotulo]) => {
    pegar(re, () => add("tratamento", rotulo, q));
  });

  /* uma palavra pode ser o nome de uma edição — "Hobbit" é criatura e é
     também três sets diferentes. Nesses casos o app pergunta. */
  const setsQueCasam = pal => !SETS ? [] : SETS
    .filter(st => new RegExp(`(^| )${pal}( |$)`).test(semAcento(st.name)))
    .sort((a,b) => b.n - a.n)
    .slice(0, 5);

  const duvidaDeSet = (pal, extras=[]) => ({
    id: "set-" + pal,
    pergunta: `"${pal}" — o que você quer?`,
    opcoes: [
      ...setsQueCasam(pal).map(st => ({
        rotulo: `${st.name} (${st.ano}, ${st.n} cartas)`,
        parte: { id:`set:e:${st.code}`, chave:"set", rotulo:`edição ${st.name}`, q:`e:${st.code}` }
      })),
      ...extras,
    ]
  });

  /* cores, raridades, tipos e criaturas */
  const cores = [], raridades = [], tipos = [], criaturas = [];
  const palavras = resto.trim().split(/\s+/).filter(Boolean);
  const sobra = [];
  palavras.forEach(pal => {
    if(CORES_PT[pal])       { cores.push(CORES_PT[pal]); return; }
    if(RARIDADES_PT[pal])   { raridades.push(RARIDADES_PT[pal]); return; }
    if(TIPOS_PT[pal])       { tipos.push(TIPOS_PT[pal]); return; }
    const tipoCriatura = BICHOS_PT[pal] || (SUBTIPOS && SUBTIPOS.find(t => semAcento(t) === pal));
    if(tipoCriatura){
      const sets = setsQueCasam(pal);
      if(sets.length && !querArte && !querTipo){
        // é bicho e é edição ao mesmo tempo: pergunta em vez de escolher sozinho
        duvidas.push(duvidaDeSet(pal, [
          { rotulo:`Criaturas do tipo ${tipoCriatura}`, parte:{ id:`criatura:t:${tipoCriatura}`, chave:"criatura", rotulo:`criaturas do tipo ${tipoCriatura}`, q:`t:${tipoCriatura}` } },
          { rotulo:`${pal} na ilustração`, parte:{ id:`arte:art:${pal}`, chave:"arte", rotulo:`${pal} na ilustração`, q:`art:${pal}` } },
        ]));
        return;
      }
      criaturas.push({ en:tipoCriatura, pt:pal });
      return;
    }
    if(!RUIDO.has(pal) && pal.length > 2 && !/^\d+$/.test(pal)){
      if(setsQueCasam(pal).length) duvidas.push(duvidaDeSet(pal, [
        { rotulo:"Parte do nome da carta", parte:{ id:`nome:${pal}`, chave:"nome", rotulo:`nome contém "${pal}"`, q:`name:"${pal}"` } },
        { rotulo:"Algo na ilustração",     parte:{ id:`arte:art:${pal}`, chave:"arte", rotulo:`${pal} na ilustração`, q:`art:${pal}` } },
      ]));
      else sobra.push(pal);
    }
  });

  if(cores.length){
    const unicas = [...new Set(cores)];
    const semIncolor = unicas.filter(c => c !== "c");
    if(semIncolor.length){
      const nomes = { w:"branco", u:"azul", b:"preto", r:"vermelho", g:"verde" };
      add("cor", semIncolor.map(c => nomes[c]).join(" e "), `c>=${semIncolor.join("")}`);
    } else add("cor", "incolores", "c:c");
  }
  if(raridades.length){
    const u = [...new Set(raridades)];
    const nomes = { common:"comuns", uncommon:"incomuns", rare:"raras", mythic:"míticas" };
    add("raridade", u.map(r => nomes[r]).join(" ou "), u.length > 1 ? `(${u.map(r=>`r:${r}`).join(" or ")})` : `r:${u[0]}`);
  }
  if(tipos.length){
    const u = [...new Set(tipos)];
    const nomes = { creature:"criaturas", instant:"mágicas instantâneas", sorcery:"feitiços",
                    artifact:"artefatos", enchantment:"encantamentos", land:"terrenos",
                    planeswalker:"planeswalkers", battle:"batalhas" };
    add("tipo", u.map(t => nomes[t]).join(" ou "), u.length > 1 ? `(${u.map(t=>`t:${t}`).join(" or ")})` : `t:${u[0]}`);
  }

  /* o ponto ambíguo: bicho é tipo de criatura ou é o que está desenhado? */
  // "dragões vermelhos" é claramente o tipo; "gatos", sozinho, pode ser o desenho.
  const temContextoDeCarta = cores.length || tipos.length || raridades.length;
  const vistas = new Set();
  criaturas.forEach(({ en, pt }) => {
    if(vistas.has(en)) return;
    vistas.add(en);
    const arte = en.toLowerCase();
    if(querArte)      add("arte", `${pt} na ilustração`, `art:${arte}`);
    else if(querTipo || temContextoDeCarta) add("criatura", `criaturas do tipo ${en}`, `t:${en}`);
    else duvidas.push({
      id: "cri-" + en,
      pergunta: `"${pt}" — você quer as cartas do tipo ${en}, ou qualquer carta com ${pt} na ilustração?`,
      opcoes: [
        { rotulo:`Tipo ${en}`,   parte:{ id:`criatura:t:${en}`, chave:"criatura", rotulo:`criaturas do tipo ${en}`, q:`t:${en}` } },
        { rotulo:`Na ilustração`,parte:{ id:`arte:art:${arte}`, chave:"arte", rotulo:`${pt} na ilustração`, q:`art:${arte}` } },
      ]
    });
  });

  /* o que não foi entendido vira pergunta, não vira palpite */
  sobra.forEach(pal => {
    duvidas.push({
      id: "resto-" + pal,
      pergunta: `Não reconheci "${pal}". O que é?`,
      opcoes: [
        { rotulo:"Parte do nome da carta", parte:{ id:`nome:${pal}`, chave:"nome", rotulo:`nome contém "${pal}"`, q:`name:"${pal}"` } },
        { rotulo:"Nome de artista",        parte:{ id:`artista:${pal}`, chave:"artista", rotulo:`artista ${pal}`, q:`a:"${pal}"` } },
        { rotulo:"Algo na ilustração",     parte:{ id:`arte:art:${pal}`, chave:"arte", rotulo:`${pal} na ilustração`, q:`art:${pal}` } },
      ]
    });
  });

  return { partes, duvidas };
}

/* várias respostas na mesma pergunta viram uma condição só, com "ou" */
function combinarPartes(partes){
  return {
    id: partes.map(p => p.id).join("+"),
    chave: partes[0].chave,
    rotulo: partes.map(p => p.rotulo).join(" ou "),
    q: `(${partes.map(p => p.q.replace(/^\((.*)\)$/, "$1")).join(" or ")})`,
  };
}

function queryDasPartes(partes){
  const q = partes.map(p => p.q).filter(Boolean).join(" ");
  return q || "game:paper";
}

/* Cada exclusão vira uma negação separada: "sem as verdes" e "sem as comuns"
   tiram verde OU comum, e não só as que são verdes E comuns ao mesmo tempo. */
function queryComExclusoes(partes, fora){
  const dentro = queryDasPartes(partes);
  const negadas = (fora || []).map(p => p.q).filter(Boolean).map(q => `-(${q})`).join(" ");
  return negadas ? `${dentro} ${negadas}` : dentro;
}


/* =====================================================================
   view: minha coleção — tudo o que você tem, num lugar só
   ===================================================================== */

const FILTROS_MINHA = () => ({ texto:"", cores:[], raridades:[], tipos:[], set:"", precoDe:"", precoAte:"",
                               local:"", ordem:"recentes", agrupar:false });

/* =====================================================================
   ONDE A CARTA ESTÁ GUARDADA

   O app sabia que você tem a carta e não sabia onde ela está. Para quem
   passou de mil cartas, essa é a diferença entre achar a carta e virar
   a casa do avesso.

   É um texto livre de propósito: fichário, caixa, gaveta, "no deck do
   Atraxa", "emprestada" — cada um organiza do seu jeito, e o app não
   inventa uma taxonomia que ninguém pediu. O que ele faz é lembrar os
   lugares que você já usou e oferecer de volta, para "Fichário azul" e
   "fichario azul" não virarem dois lugares diferentes.
   ===================================================================== */
function locaisUsados(){
  const conta = new Map();
  Object.values(S.owned).forEach(r => {
    const l = (r.loc || "").trim();
    if(!l) return;
    conta.set(l, (conta.get(l) || 0) + 1);
  });
  return [...conta.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(x => x[0]);
}
function contagemPorLocal(){
  const conta = new Map();
  Object.entries(S.owned).forEach(([id, r]) => {
    const l = (r.loc || "").trim();
    if(!l) return;
    conta.set(l, (conta.get(l) || 0) + qtdDe(id));
  });
  return [...conta.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
let minha = { f:FILTROS_MINHA(), selecao:new Set() };

function cartasQueTenho(){
  return Object.entries(S.owned).map(([id, r]) =>
    Object.assign(cartaDoResumo(id, r), {
      addedAt:r.at || 0, qtd:qtdDe(id),
      cond:condDe(r), lang:langDe(r), pago:Number(r.pg) || 0, loc:(r.loc || ""),
      unit:valorUnitario(id),                    // preço já com o desconto da condição
    }));
}
const somaQtd = lista => lista.reduce((a,c) => a + (c.qtd || 1), 0);

/* Junta as impressões da mesma carta numa entrada só, com contador.
   Quem tem seis Sol Ring diferentes vê "Sol Ring ×6" em vez de seis quadrados. */
function agruparIguais(lista){
  const mapa = new Map();
  lista.forEach(c => {
    const chave = c.name;
    const atual = mapa.get(chave);
    if(!atual){ mapa.set(chave, Object.assign({}, c, { copias:(c.qtd||1), versoes:[c] })); return; }
    atual.copias += (c.qtd || 1);
    atual.versoes.push(c);
    // representa o grupo pela versão mais valiosa
    if((Number(c.usd)||0) > (Number(atual.usd)||0)) Object.assign(atual, c, { copias:atual.copias, versoes:atual.versoes });
  });
  return [...mapa.values()];
}

function filtrarMinha(lista){
  const f = minha.f;
  const t = semAcento(f.texto).trim();
  let out = lista.filter(c => {
    if(t && !semAcento(c.name).includes(t) && !semAcento(c.setName || "").includes(t)
         && !semAcento(c.loc || "").includes(t)) return false;
    if(f.set && c.set !== f.set) return false;
    if(f.local){
      if(f.local === "__sem__"){ if((c.loc || "").trim()) return false; }
      else if((c.loc || "") !== f.local) return false;
    }
    if(f.raridades.length && !f.raridades.includes(c.rarity)) return false;
    if(f.cores.length){
      const cor = c.cores || "";
      const querIncolor = f.cores.includes("c");
      const outras = f.cores.filter(x => x !== "c");
      const bateIncolor = querIncolor && !cor;
      const bateCor = outras.some(x => cor.includes(x));
      if(!bateIncolor && !bateCor) return false;
    }
    if(f.tipos.length){
      const tipo = semAcento(c.type || "");
      if(!f.tipos.some(x => tipo.includes(x))) return false;
    }
    const p = Number(c.usd) || 0;
    if(f.precoDe !== "" && p < Number(f.precoDe)) return false;
    if(f.precoAte !== "" && p > Number(f.precoAte)) return false;
    return true;
  });
  const ordens = {
    recentes: (a,b) => b.addedAt - a.addedAt,
    nome:     (a,b) => a.name.localeCompare(b.name),
    caras:    (a,b) => (Number(b.usd)||0) - (Number(a.usd)||0),
    baratas:  (a,b) => (Number(a.usd)||0) - (Number(b.usd)||0),
    set:      (a,b) => (a.setName||"").localeCompare(b.setName||"") || a.name.localeCompare(b.name),
    /* quem não anotou o lugar vai para o fim: a lista serve para achar
       carta, e carta sem lugar não ajuda ninguém a achar nada */
    local:    (a,b) => (a.loc ? 0 : 1) - (b.loc ? 0 : 1)
                    || (a.loc||"").localeCompare(b.loc||"") || a.name.localeCompare(b.name),
    antigas:  (a,b) => (a.released||"").localeCompare(b.released||""),
  };
  return out.sort(ordens[minha.f.ordem] || ordens.recentes);
}
