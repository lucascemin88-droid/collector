function montarAnos(){
  const strip = document.getElementById("anos");
  const anos = [];
  for(let a = ANO_ATUAL; a >= ANO_INICIAL; a--) anos.push(a);
  strip.innerHTML = anos.map(a => {
    const ativo = cat.f.anoDe == a && cat.f.anoAte == a;
    return `<button class="ano ${ativo?"on":""}" data-ano="${a}">${a}</button>`;
  }).join("");
  strip.onclick = async e => {
    const b = e.target.closest(".ano"); if(!b) return;
    const a = b.dataset.ano;
    const jaEra = cat.f.anoDe == a && cat.f.anoAte == a;
    cat.f.anoDe = jaEra ? "" : a;
    cat.f.anoAte = jaEra ? "" : a;
    cat.f.set = "";
    await renderCatalogo();
    if(!jaEra) buscarCatalogo();
  };
}

async function preencherListas(){
  const [sets, subtipos] = await Promise.all([carregarSets(), carregarSubtipos()]);

  const dl = document.getElementById("lista-subtipos");
  if(dl) dl.innerHTML = subtipos.map(t => `<option value="${escapeHTML(t)}">`).join("");

  const anos = [];
  for(let a = ANO_ATUAL; a >= ANO_INICIAL; a--) anos.push(a);
  const de = document.getElementById("f-anode"), ate = document.getElementById("f-anoate");
  if(de && ate){
    de.innerHTML = `<option value="">de…</option>` +
      anos.map(a => `<option value="${a}"${cat.f.anoDe==a?" selected":""}>${a}</option>`).join("");
    ate.innerHTML = `<option value="">até…</option>` +
      anos.map(a => `<option value="${a}"${cat.f.anoAte==a?" selected":""}>${a}</option>`).join("");
  }

  const sel = document.getElementById("f-set");
  if(sel){
    const filtrados = sets
      .filter(s => (!cat.f.anoDe || s.ano >= cat.f.anoDe) && (!cat.f.anoAte || s.ano <= cat.f.anoAte))
      .sort((a,b) => b.ano.localeCompare(a.ano) || a.name.localeCompare(b.name));
    sel.innerHTML = `<option value="">todas as edições (${filtrados.length})</option>` +
      filtrados.map(s => `<option value="${s.code}"${cat.f.set===s.code?" selected":""}>${escapeHTML(s.name)} · ${s.ano} · ${s.n} cartas</option>`).join("");
  }

  const busca = document.getElementById("f-set-busca");
  const listaEl = document.getElementById("f-set-lista");
  const escolhaEl = document.getElementById("f-set-escolha");

  const simbolo = st => st.icone
    ? `<img class="set-simbolo" src="${st.icone}" alt="" loading="lazy">`
    : `<span class="set-simbolo vazio">◆</span>`;

  if(escolhaEl){
    const atual = cat.f.set && sets.find(st => st.code === cat.f.set);
    escolhaEl.innerHTML = atual
      ? `<div class="set-atual">${simbolo(atual)}<b>${escapeHTML(atual.name)}</b>
           <span>${atual.ano} · ${atual.n}</span><button class="tirar" id="f-set-tirar" title="tirar filtro">×</button></div>`
      : "";
    const tirar = document.getElementById("f-set-tirar");
    if(tirar) tirar.onclick = () => { cat.f.set = ""; renderCatalogo().then(()=>{ if(cat.buscou) buscarCatalogo(); }); };
  }

  if(busca && listaEl){
    const mostrar = termo => {
      const t = semAcento(termo).trim();
      const achados = sets
        .filter(st => !t || semAcento(st.name).includes(t) || st.code.includes(t))
        .filter(st => (!cat.f.anoDe || st.ano >= cat.f.anoDe) && (!cat.f.anoAte || st.ano <= cat.f.anoAte))
        .sort((a,b) => b.ano.localeCompare(a.ano) || b.n - a.n)
        .slice(0, 60);
      listaEl.hidden = !t && !achados.length;
      listaEl.innerHTML = achados.length
        ? achados.map(st => `
            <button class="set-linha" data-code="${st.code}">
              ${simbolo(st)}
              <span class="set-linha-nome">${escapeHTML(st.name)}</span>
              <span class="set-linha-meta">${st.ano} · ${st.n}</span>
            </button>`).join("")
        : `<div class="set-linha vazia">nenhuma edição com esse nome</div>`;
    };

    busca.oninput = () => { listaEl.hidden = false; mostrar(busca.value); };
    busca.onfocus = () => { listaEl.hidden = false; mostrar(busca.value); };
    listaEl.onclick = e => {
      const b = e.target.closest(".set-linha[data-code]"); if(!b) return;
      cat.f.set = b.dataset.code;
      busca.value = "";
      renderCatalogo().then(buscarCatalogo);
    };
    // um ouvinte só: sem isto, cada volta ao catálogo empilhava mais um
    if(!window.__fechaListaSet){
      window.__fechaListaSet = e => {
        const el = document.getElementById("f-set-lista"), campo = document.getElementById("f-set-busca");
        if(el && el.isConnected && !el.contains(e.target) && e.target !== campo) el.hidden = true;
      };
      document.addEventListener("click", window.__fechaListaSet);
    }
  }

  // quando o período é um ano só, mostra as edições daquele ano como atalhos
  const alvo = document.getElementById("sets-do-ano");
  if(alvo && cat.f.anoDe && cat.f.anoDe === cat.f.anoAte){
    const doAno = sets.filter(s => s.ano === cat.f.anoDe)
      .sort((a,b) => b.n - a.n);
    alvo.innerHTML = doAno.length ? `
      <div class="sets-linha">
        <span class="flabel" style="margin:0 4px 0 0">Edições de ${cat.f.anoDe}:</span>
        ${doAno.map(s => `<button class="set-chip so-simbolo ${cat.f.set===s.code?"on":""}" data-set="${s.code}"
              title="${escapeHTML(s.name)} — ${s.n} cartas">
            ${s.icone ? `<img class="set-simbolo" src="${s.icone}" alt="${escapeHTML(s.name)}" loading="lazy">`
                      : `<span class="set-simbolo vazio">◆</span>`}
            <b>${s.n}</b></button>`).join("")}
      </div>` : "";
    alvo.onclick = e => {
      const b = e.target.closest(".set-chip"); if(!b) return;
      cat.f.set = cat.f.set === b.dataset.set ? "" : b.dataset.set;
      renderCatalogo().then(buscarCatalogo);
    };
  } else if(alvo){ alvo.innerHTML = ""; }
}

function ligarFiltros(){
  const f = cat.f;
  const liga = (id, campo, prop="value") => {
    const el = document.getElementById(id);
    if(el) el.addEventListener("input", () => { f[campo] = prop === "checked" ? el.checked : el.value; atualizarPreview(); });
  };
  liga("f-texto","texto"); liga("f-notexto","noTexto","checked"); liga("f-artista","artista");
  liga("f-subtipo","subtipo"); liga("f-mvde","mvDe"); liga("f-mvate","mvAte");
  liga("f-usdde","usdDe"); liga("f-usdate","usdAte"); liga("f-avancado","avancado");

  const alterna = (containerId, attr, campo) => {
    const box = document.getElementById(containerId);
    if(!box) return;
    box.onclick = e => {
      const b = e.target.closest(".tog"); if(!b) return;
      const v = b.dataset[attr];
      const i = f[campo].indexOf(v);
      if(i >= 0) f[campo].splice(i,1); else f[campo].push(v);
      b.classList.toggle("on");
      atualizarPreview();
    };
  };
  alterna("f-cores","cor","cores");
  alterna("f-raridades","rar","raridades");
  alterna("f-tipos","tipo","tipos");
  alterna("f-flags","flag","flags");

  const acab = document.getElementById("f-acabamento");
  if(acab) acab.onchange = () => { f.acabamento = acab.value; atualizarPreview(); if(cat.buscou) buscarCatalogo(); };

  const modo = document.getElementById("f-modocor");
  if(modo) modo.onchange = () => { f.modoCor = modo.value; atualizarPreview(); };

  const de = document.getElementById("f-anode"), ate = document.getElementById("f-anoate"),
        set = document.getElementById("f-set");
  if(de)  de.onchange  = () => { f.anoDe = de.value; f.set = ""; renderCatalogo(); };
  if(ate) ate.onchange = () => { f.anoAte = ate.value; f.set = ""; renderCatalogo(); };
  if(set) set.onchange = () => { f.set = set.value; atualizarPreview(); };

  const ordem = document.getElementById("f-ordem");
  if(ordem){
    ordem.value = f.direcao === "asc" && f.ordem === "released" ? "released-asc"
                : f.ordem === "usd" && f.direcao === "desc" ? "usd-desc"
                : f.ordem === "rarity" ? "rarity-desc" : f.ordem;
    ordem.onchange = () => {
      const v = ordem.value;
      if(v === "released"){ f.ordem = "released"; f.direcao = "desc"; }
      else if(v === "released-asc"){ f.ordem = "released"; f.direcao = "asc"; }
      else if(v === "usd-desc"){ f.ordem = "usd"; f.direcao = "desc"; }
      else if(v === "usd"){ f.ordem = "usd"; f.direcao = "asc"; }
      else if(v === "rarity-desc"){ f.ordem = "rarity"; f.direcao = "desc"; }
      else { f.ordem = v; f.direcao = "auto"; }
      if(cat.buscou) buscarCatalogo();
    };
  }
  const unico = document.getElementById("f-unico");
  if(unico) unico.onchange = () => { f.unico = unico.value; if(cat.buscou) buscarCatalogo(); };

  const agr = document.getElementById("f-agrupar-arte");
  if(agr) agr.onclick = () => {
    f.agruparArte = !f.agruparArte;
    agr.classList.toggle("on", f.agruparArte);
    S.config.agruparArte = f.agruparArte; save();
    if(cat.buscou){ pintarCatalogo(); atualizarStatus(); }
  };

  document.getElementById("buscar").onclick = buscarCatalogo;
  document.getElementById("limpar").onclick = () => { cat = { ...cat, f:FILTROS_VAZIOS(), cards:[], buscou:false }; renderCatalogo(); };
  document.getElementById("salvar-colecao").onclick = () => openNewCollection({ query: montarQuery(cat.f) });
}

function atualizarPreview(){
  const el = document.getElementById("preview");
  if(!el) return;
  const q = montarQuery(cat.f);
  const n = resumoFiltros(cat.f) + (cat.f.acabamento !== "qualquer" ? 1 : 0);
  el.innerHTML = `<span>${n ? n + (n===1?" filtro":" filtros") : "sem filtro"}</span><code>${escapeHTML(q)}</code>`;
}

async function buscarCatalogo(){
  cat.q = montarQuery(cat.f);
  cat.cards = []; cat.page = 1; cat.hasMore = false; cat.total = 0; cat.buscou = true;
  const grid = document.getElementById("grid");
  if(grid) grid.innerHTML = skeletons(18);
  await paginaCatalogo();
}

async function paginaCatalogo(){
  const st = document.getElementById("status");
  st.textContent = cat.page === 1 ? "Buscando no Scryfall…" : `Carregando página ${cat.page}…`;
  try{
    // na Europa o preço mostrado é o do Cardmarket: ordenar por dólar ali
    // dava uma lista que não batia com os números na tela
    const ordem = cat.f.ordem === "usd" && regiao().moeda === "EUR" ? "eur" : cat.f.ordem;
    const json = await scryPage(cat.q, cat.f.unico, ordem, cat.page, cat.f.direcao);
    cat.cards.push(...(json.data||[]).map(normalize));
    cat.total = json.total_cards || 0;
    cat.hasMore = !!json.has_more;
    cat.page++;
    pintarCatalogo();
    atualizarStatus();
  }catch(err){
    st.innerHTML = `<span style="color:var(--red)">Erro: ${escapeHTML(err.message)}</span>`;
    const g = document.getElementById("grid"); if(g) g.innerHTML = "";
  }
}

function atualizarStatus(){
  const st = document.getElementById("status");
  const lm = document.getElementById("loadmore");
  if(!st) return;
  if(cat.total === 0){ st.textContent = "Nenhuma carta com esses filtros."; if(lm) lm.innerHTML = ""; return; }
  const meus = cat.cards.filter(c => isOwned(c.id)).length;
  st.textContent = `${cat.cards.length} de ${cat.total.toLocaleString("pt-BR")} cartas`
                 + (meus ? ` · ${meus} você já tem` : "");
  if(lm){
    if(cat.hasMore){
      const resto = Math.min(175, cat.total - cat.cards.length);
      lm.innerHTML = `<button class="btn ghost" id="mais-cat">Carregar mais ${resto}</button>`;
      document.getElementById("mais-cat").onclick = paginaCatalogo;
    } else lm.innerHTML = "";
  }
}

/* Junta numa miniatura só as cartas de ilustração idêntica. A capa é a
   versão que você já tem, quando tem — assim a arte na tela é a sua. */
function agruparPorArte(lista){
  const mapa = new Map();
  lista.forEach(c => {
    const chave = c.arte || (c.name + "|" + c.artist);
    if(!mapa.has(chave)) mapa.set(chave, []);
    mapa.get(chave).push(c);
  });
  return [...mapa.values()].map(g => {
    const capa = g.find(c => isOwned(c.id)) || g[0];
    return { carta:capa, edicoes:g.length };
  });
}

/* A ordem por preço tem que bater com o preço que está escrito na carta.
   O Scryfall ordena pelo dólar da impressão que ele escolheu; a tela mostra
   o preço da região e do acabamento. Então, quando a ordem é por preço, a
   lista carregada é reordenada pelo número que aparece — e carta sem preço
   vai para o fim, nunca no meio. */
function ordenadasParaMostrar(lista){
  if(cat.f.ordem !== "usd") return lista;
  const valor = c => { const p = precoLocal(c); return p && p.valor > 0 ? p.valor : null; };
  const desc = cat.f.direcao !== "asc";
  return lista.slice().sort((a,b) => {
    const va = valor(a), vb = valor(b);
    if(va === null && vb === null) return 0;
    if(va === null) return 1;
    if(vb === null) return -1;
    return desc ? vb - va : va - vb;
  });
}

function pintarCatalogo(){
  const grid = document.getElementById("grid");
  if(!grid) return;
  cat.cards = ordenadasParaMostrar(cat.cards);
  cur = { def:{ id:"__catalogo__" }, cards:cat.cards, filter:"all", term:"" };
  if(cat.f.agruparArte){
    const grupos = agruparPorArte(cat.cards);
    grid.innerHTML = grupos.map(g =>
      cardHTML(g.carta, 0, g.edicoes > 1 ? `${g.edicoes} edições` : "")).join("");
  } else {
    grid.innerHTML = cat.cards.map(c => cardHTML(c)).join("");
  }
  ligarCartas(grid, id => cat.cards.find(c => c.id === id), () => { pintarCatalogo(); atualizarStatus(); });
}

const TRATAMENTOS_PT = [

  [/\bserializad[ao]s?\b|\bserialized\b/, "is:serialized", "serializadas"],

];
const RUIDO = new Set(("todos todas toda todo os as um uma uns umas de do da dos das com que e ou " +
  "cartas carta magic mtg colecao colecoes quero queria gostaria ter tenham tem sao ser " +

  "arte artes ilustracao desenho tema temas tipo tipos versao versoes impressao impressoes " +
  "juntar montar completar serie edicao edicoes set sets").split(" "));

function interpretar(frase){
  let resto = " " + semAcento(frase).replace(/[^\w\s$.,<>-]/g, " ").replace(/\s+/g, " ") + " ";
  const partes = [], duvidas = [];
  const pegar = (re, fn) => {
    const m = resto.match(re);
    if(!m) return false;
    fn(m);
    resto = resto.replace(m[0], " ");
    return true;
  };
  const add = (chave, rotulo, q) => partes.push({ id:`${chave}:${q}`, chave, rotulo, q });

  const querArte = /\bna arte\b|\bnas artes\b|\bna ilustracao\b|\bilustrad|\bno desenho\b|\bdesenh/.test(resto);
  const querTipo = /\bdo tipo\b|\bcriaturas? \w+/.test(resto);
  // essas palavras já cumpriram o papel de indicar intenção; não podem virar dúvida depois
  resto = resto.replace(/\b(na|nas|no|nos)? ?(arte|artes|ilustracao|ilustracoes|ilustrada|ilustradas|desenho|desenhos)\b/g, " ")
               .replace(/\bdo tipo\b|\btipo\b|\btipos\b|\btema\b|\btemas\b/g, " ");

  /* edição pelo nome — precisa dos sets carregados */
  if(SETS){
    const achado = SETS
      .map(st => ({ st, alvo:semAcento(st.name) }))
      .filter(x => x.alvo.length >= 4 && resto.includes(" " + x.alvo))
      .sort((a,b) => b.alvo.length - a.alvo.length)[0];
    if(achado){
      add("set", `edição ${achado.st.name}`, `e:${achado.st.code}`);
      resto = resto.replace(achado.alvo, " ");
    }
  }

  /* artista */
  pegar(/\b(?:do artista|da artista|ilustrada por|ilustradas por|arte de)\s+([a-z]+(?:\s+[a-z]+){0,2})/, m => {
    add("artista", `artista ${m[1].trim()}`, `a:"${m[1].trim()}"`);
  });

  /* período */
  const anos = () => {
    if(pegar(/\bentre (\d{4}) e (\d{4})\b/, m => add("ano", `entre ${m[1]} e ${m[2]}`, `year>=${m[1]} year<=${m[2]}`))) return;
    if(pegar(/\bantes de (\d{4})\b/, m => add("ano", `antes de ${m[1]}`, `year<${m[1]}`))) return;
    if(pegar(/\b(?:depois de|apos) (\d{4})\b/, m => add("ano", `depois de ${m[1]}`, `year>${m[1]}`))) return;
    if(pegar(/\b(?:a partir de|desde) (\d{4})\b/, m => add("ano", `de ${m[1]} em diante`, `year>=${m[1]}`))) return;
    if(pegar(/\bate (\d{4})\b/, m => add("ano", `até ${m[1]}`, `year<=${m[1]}`))) return;
    if(pegar(/\bdos anos (\d{2,4})\b/, m => {
      let d = m[1].length === 2 ? (Number(m[1]) >= 90 ? 1900 + Number(m[1]) : 2000 + Number(m[1])) : Number(m[1]);
      add("ano", `anos ${m[1]}`, `year>=${d} year<=${d+9}`);
    })) return;
    if(pegar(/\bultimos? (\d{1,2}) anos?\b/, m => {
      const d = ANO_ATUAL - Number(m[1]);
      add("ano", `últimos ${m[1]} anos`, `year>=${d}`);
    })) return;
    pegar(/\b(?:de|em|do ano de|ano) (\d{4})\b|\b(19[89]\d|20[0-4]\d)\b/, m => {
      const a = m[1] || m[2];
      add("ano", `de ${a}`, `year:${a}`);
    });
  };
  anos();

  /* preço — o Scryfall só entende dólar, então real é convertido */
  const emReal = /\breais?\b|\br\$/.test(resto);
  const paraUsd = v => (emReal && CAMBIO && CAMBIO.usd) ? (v / CAMBIO.usd) : v;
  const moeda = emReal ? "R$" : "US$";
  const preco = () => {
    if(pegar(/\b(?:abaixo de|menos de|ate|no maximo)\s*(?:r\$|us\$|\$)?\s*([\d.,]+)/, m => {
      const v = Number(m[1].replace(",", "."));
      add("preco", `até ${moeda} ${m[1]}`, `usd<=${paraUsd(v).toFixed(2)}`);
    })) return;
    if(pegar(/\b(?:acima de|mais de|a partir de|no minimo)\s*(?:r\$|us\$|\$)?\s*([\d.,]+)/, m => {
      const v = Number(m[1].replace(",", "."));
      add("preco", `acima de ${moeda} ${m[1]}`, `usd>=${paraUsd(v).toFixed(2)}`);
    })) return;
  };
  preco();
  resto = resto.replace(/\breais?\b|\bdolares?\b|\beuros?\b/g, " ");

  /* tratamentos */
  TRATAMENTOS_PT.forEach(([re, q, rotulo]) => {
    pegar(re, () => add("tratamento", rotulo, q));
  });

  /* uma palavra pode ser o nome de uma edição — "Hobbit" é criatura e é
     também três sets diferentes. Nesses casos o app pergunta. */
  const setsQueCasam = pal => !SETS ? [] : SETS
    .filter(st => new RegExp(`(^| )${pal}( |$)`).test(semAcento(st.name)))
    .sort((a,b) => b.n - a.n)
    .slice(0, 5);

  const duvidaDeSet = (pal, extras=[]) => ({
    id: "set-" + pal,
    pergunta: `"${pal}" — o que você quer?`,
    opcoes: [
      ...setsQueCasam(pal).map(st => ({
        rotulo: `${st.name} (${st.ano}, ${st.n} cartas)`,
        parte: { id:`set:e:${st.code}`, chave:"set", rotulo:`edição ${st.name}`, q:`e:${st.code}` }
      })),
      ...extras,
    ]
  });

  /* cores, raridades, tipos e criaturas */
  const cores = [], raridades = [], tipos = [], criaturas = [];
  const palavras = resto.trim().split(/\s+/).filter(Boolean);
  const sobra = [];
  palavras.forEach(pal => {
    if(CORES_PT[pal])       { cores.push(CORES_PT[pal]); return; }
    if(RARIDADES_PT[pal])   { raridades.push(RARIDADES_PT[pal]); return; }
    if(TIPOS_PT[pal])       { tipos.push(TIPOS_PT[pal]); return; }
    const tipoCriatura = BICHOS_PT[pal] || (SUBTIPOS && SUBTIPOS.find(t => semAcento(t) === pal));
    if(tipoCriatura){
      const sets = setsQueCasam(pal);
      if(sets.length && !querArte && !querTipo){
        // é bicho e é edição ao mesmo tempo: pergunta em vez de escolher sozinho
        duvidas.push(duvidaDeSet(pal, [
          { rotulo:`Criaturas do tipo ${tipoCriatura}`, parte:{ id:`criatura:t:${tipoCriatura}`, chave:"criatura", rotulo:`criaturas do tipo ${tipoCriatura}`, q:`t:${tipoCriatura}` } },
          { rotulo:`${pal} na ilustração`, parte:{ id:`arte:art:${pal}`, chave:"arte", rotulo:`${pal} na ilustração`, q:`art:${pal}` } },
        ]));
        return;
      }
      criaturas.push({ en:tipoCriatura, pt:pal });
      return;
    }
    if(!RUIDO.has(pal) && pal.length > 2 && !/^\d+$/.test(pal)){
      if(setsQueCasam(pal).length) duvidas.push(duvidaDeSet(pal, [
        { rotulo:"Parte do nome da carta", parte:{ id:`nome:${pal}`, chave:"nome", rotulo:`nome contém "${pal}"`, q:`name:"${pal}"` } },
        { rotulo:"Algo na ilustração",     parte:{ id:`arte:art:${pal}`, chave:"arte", rotulo:`${pal} na ilustração`, q:`art:${pal}` } },
      ]));
      else sobra.push(pal);
    }
  });

  if(cores.length){
    const unicas = [...new Set(cores)];
    const semIncolor = unicas.filter(c => c !== "c");
    if(semIncolor.length){
      const nomes = { w:"branco", u:"azul", b:"preto", r:"vermelho", g:"verde" };
      add("cor", semIncolor.map(c => nomes[c]).join(" e "), `c>=${semIncolor.join("")}`);
    } else add("cor", "incolores", "c:c");
  }
  if(raridades.length){
    const u = [...new Set(raridades)];
    const nomes = { common:"comuns", uncommon:"incomuns", rare:"raras", mythic:"míticas" };
    add("raridade", u.map(r => nomes[r]).join(" ou "), u.length > 1 ? `(${u.map(r=>`r:${r}`).join(" or ")})` : `r:${u[0]}`);
  }
  if(tipos.length){
    const u = [...new Set(tipos)];
    const nomes = { creature:"criaturas", instant:"mágicas instantâneas", sorcery:"feitiços",
                    artifact:"artefatos", enchantment:"encantamentos", land:"terrenos",
                    planeswalker:"planeswalkers", battle:"batalhas" };
    add("tipo", u.map(t => nomes[t]).join(" ou "), u.length > 1 ? `(${u.map(t=>`t:${t}`).join(" or ")})` : `t:${u[0]}`);
  }

  /* o ponto ambíguo: bicho é tipo de criatura ou é o que está desenhado? */
  // "dragões vermelhos" é claramente o tipo; "gatos", sozinho, pode ser o desenho.
  const temContextoDeCarta = cores.length || tipos.length || raridades.length;
  const vistas = new Set();
  criaturas.forEach(({ en, pt }) => {
    if(vistas.has(en)) return;
    vistas.add(en);
    const arte = en.toLowerCase();
    if(querArte)      add("arte", `${pt} na ilustração`, `art:${arte}`);
    else if(querTipo || temContextoDeCarta) add("criatura", `criaturas do tipo ${en}`, `t:${en}`);
    else duvidas.push({
      id: "cri-" + en,
      pergunta: `"${pt}" — você quer as cartas do tipo ${en}, ou qualquer carta com ${pt} na ilustração?`,
      opcoes: [
        { rotulo:`Tipo ${en}`,   parte:{ id:`criatura:t:${en}`, chave:"criatura", rotulo:`criaturas do tipo ${en}`, q:`t:${en}` } },
        { rotulo:`Na ilustração`,parte:{ id:`arte:art:${arte}`, chave:"arte", rotulo:`${pt} na ilustração`, q:`art:${arte}` } },
      ]
    });
  });

  /* o que não foi entendido vira pergunta, não vira palpite */
  sobra.forEach(pal => {
    duvidas.push({
      id: "resto-" + pal,
      pergunta: `Não reconheci "${pal}". O que é?`,
      opcoes: [
        { rotulo:"Parte do nome da carta", parte:{ id:`nome:${pal}`, chave:"nome", rotulo:`nome contém "${pal}"`, q:`name:"${pal}"` } },
        { rotulo:"Nome de artista",        parte:{ id:`artista:${pal}`, chave:"artista", rotulo:`artista ${pal}`, q:`a:"${pal}"` } },
        { rotulo:"Algo na ilustração",     parte:{ id:`arte:art:${pal}`, chave:"arte", rotulo:`${pal} na ilustração`, q:`art:${pal}` } },
      ]
    });
  });

  return { partes, duvidas };
}

/* várias respostas na mesma pergunta viram uma condição só, com "ou" */
function combinarPartes(partes){
  return {
    id: partes.map(p => p.id).join("+"),
    chave: partes[0].chave,
    rotulo: partes.map(p => p.rotulo).join(" ou "),
    q: `(${partes.map(p => p.q.replace(/^\((.*)\)$/, "$1")).join(" or ")})`,
  };
}

function queryDasPartes(partes){
  const q = partes.map(p => p.q).filter(Boolean).join(" ");
  return q || "game:paper";
}

const FILTROS_MINHA = () => ({ texto:"", cores:[], raridades:[], tipos:[], set:"", precoDe:"", precoAte:"", ordem:"recentes", agrupar:false });
let minha = { f:FILTROS_MINHA(), selecao:new Set() };

function cartasQueTenho(){
  return Object.entries(S.owned).map(([id, r]) =>
    Object.assign(cartaDoResumo(id, r), { addedAt:r.at || 0, qtd:qtdDe(id) }));
}
const somaQtd = lista => lista.reduce((a,c) => a + (c.qtd || 1), 0);

/* Junta as impressões da mesma carta numa entrada só, com contador.
   Quem tem seis Sol Ring diferentes vê "Sol Ring ×6" em vez de seis quadrados. */
function agruparIguais(lista){
  const mapa = new Map();
  lista.forEach(c => {
    const chave = c.name;
    const atual = mapa.get(chave);
    if(!atual){ mapa.set(chave, Object.assign({}, c, { copias:(c.qtd||1), versoes:[c] })); return; }
    atual.copias += (c.qtd || 1);
    atual.versoes.push(c);
    // representa o grupo pela versão mais valiosa
    if((Number(c.usd)||0) > (Number(atual.usd)||0)) Object.assign(atual, c, { copias:atual.copias, versoes:atual.versoes });
  });
  return [...mapa.values()];
}

function filtrarMinha(lista){
  const f = minha.f;
  const t = semAcento(f.texto).trim();
  let out = lista.filter(c => {
    if(t && !semAcento(c.name).includes(t) && !semAcento(c.setName || "").includes(t)) return false;
    if(f.set && c.set !== f.set) return false;
    if(f.raridades.length && !f.raridades.includes(c.rarity)) return false;
    if(f.cores.length){
      const cor = c.cores || "";
      const querIncolor = f.cores.includes("c");
      const outras = f.cores.filter(x => x !== "c");
      const bateIncolor = querIncolor && !cor;
      const bateCor = outras.some(x => cor.includes(x));
      if(!bateIncolor && !bateCor) return false;
    }
    if(f.tipos.length){
      const tipo = semAcento(c.type || "");
      if(!f.tipos.some(x => tipo.includes(x))) return false;
    }
    const p = Number(c.usd) || 0;
    if(f.precoDe !== "" && p < Number(f.precoDe)) return false;
    if(f.precoAte !== "" && p > Number(f.precoAte)) return false;
    return true;
  });
  const ordens = {
    recentes: (a,b) => b.addedAt - a.addedAt,
    nome:     (a,b) => a.name.localeCompare(b.name),
    caras:    (a,b) => (Number(b.usd)||0) - (Number(a.usd)||0),
    baratas:  (a,b) => (Number(a.usd)||0) - (Number(b.usd)||0),
    set:      (a,b) => (a.setName||"").localeCompare(b.setName||"") || a.name.localeCompare(b.name),
    antigas:  (a,b) => (a.released||"").localeCompare(b.released||""),
  };
  return out.sort(ordens[minha.f.ordem] || ordens.recentes);
}

    const el = document.getElementById(id);
    if(el) el.addEventListener(evento, () => { minha.f[campo] = el.value; renderMinha(); });
  };

  if(agr) agr.onchange = () => { minha.f.agrupar = agr.checked; renderMinha(); };
  liga("m-precode","precoDe"); liga("m-precoate","precoAte");

  const alterna = (id, attr, campo) => {
    const box = document.getElementById(id);
    if(!box) return;
    box.onclick = e => {
      const b = e.target.closest(".tog"); if(!b) return;
      const v = b.dataset[attr];
      const i = minha.f[campo].indexOf(v);
      if(i >= 0) minha.f[campo].splice(i,1); else minha.f[campo].push(v);
      renderMinha();
    };
  };
  alterna("m-cores","cor","cores");
  alterna("m-raridades","rar","raridades");
  alterna("m-tipos","tipo","tipos");

  const limpar = document.getElementById("m-limpar");
  if(limpar) limpar.onclick = () => { minha.f = FILTROS_MINHA(); renderMinha(); };

  const enviar = document.getElementById("m-enviar");
  if(enviar) enviar.onclick = () => enviarParaColecao(filtradas);

  // completa os dados de cartas marcadas em versões antigas do app
  hidratarColecao().then(mudou => { if(mudou && view.name === "minha") renderMinha(); });

function enviarParaColecao(lista){
  const manuais = S.custom.filter(c => c.type === "manual");
  if(!manuais.length) return toast("Crie antes uma coleção manual");
  modal(`<div class="modal-pad">
    <h3>Enviar para uma coleção</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 16px">
      ${lista.length} carta${lista.length>1?"s":""} — as que já estiverem lá são ignoradas.</p>
    <label class="field"><span>Coleção</span>
      <select id="env-col">${manuais.map(m => `<option value="${m.id}">${escapeHTML(m.name)}</option>`).join("")}</select>
    </label>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
      <button class="btn ghost" id="env-cancel">Cancelar</button>
      <button class="btn" id="env-ok">Enviar</button>
    </div>
  </div>`);
  document.getElementById("env-cancel").onclick = closeModal;
  document.getElementById("env-ok").onclick = () => {
    const col = customById(document.getElementById("env-col").value);
    if(!col) return;
    registrarDesfazer(`enviar cartas para ${col.name}`, { custom: JSON.parse(JSON.stringify(S.custom)) });

    save(); closeModal();
    toast(novas ? `${novas} carta${novas>1?"s":""} em ${col.name}` : "todas já estavam lá");

function abrirAdicionarCarta(){
  modal(`<div class="modal-pad">
    <h3>Adicionar carta</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 14px">
      Busque pelo nome. As versões com a <b>mesma ilustração</b> vêm agrupadas — clique numa arte
      para escolher a edição e o acabamento exatos.</p>
    <label class="field"><span>Nome da carta</span>
      <input type="text" id="ad-nome" placeholder="ex.: Sol Ring" autocomplete="off">
    </label>
    <div id="ad-artes" class="artes"></div>
    <div id="ad-versoes"></div>
    <div class="status" id="ad-status">digite pelo menos três letras</div>
  </div>`);
  const campo = document.getElementById("ad-nome");
  let timer, achadas = [], busca = 0;
  campo.oninput = () => { clearTimeout(timer); timer = setTimeout(buscar, 400); };
  campo.focus();
  carregarSets().catch(()=>{});   // para o símbolo da edição aparecer na lista

  async function buscar(){
    const termo = campo.value.trim();
    const st = document.getElementById("ad-status"),
          artes = document.getElementById("ad-artes"),
          versoes = document.getElementById("ad-versoes");
    versoes.innerHTML = "";
    if(termo.length < 3){ st.textContent = "digite pelo menos três letras"; artes.innerHTML = ""; return; }
    st.textContent = "buscando…"; artes.innerHTML = skeletons(6);
    const meu = ++busca;   // duas buscas no ar: vale a última que o usuário pediu
    try{
      const json = await scryPage(`name:"${termo}"`, "prints", "released", 1, "asc");
      if(meu !== busca || !artes.isConnected) return;
      achadas = (json.data || []).map(normalize);
      if(!achadas.length){ st.textContent = "nada encontrado"; artes.innerHTML = ""; return; }
      pintarArtes();
    }catch(e){
      if(meu === busca && artes.isConnected){ st.textContent = "erro na busca"; artes.innerHTML = ""; }
    }
  }

  function grupos(){
    const mapa = new Map();
    achadas.forEach(c => {
      const chave = c.arte || (c.name + "|" + c.artist);
      if(!mapa.has(chave)) mapa.set(chave, []);
      mapa.get(chave).push(c);
    });
    return [...mapa.values()];
  }

  function pintarArtes(){
    const artes = document.getElementById("ad-artes"), st = document.getElementById("ad-status");
    const gs = grupos();
    st.textContent = `${gs.length} ilustraç${gs.length>1?"ões":"ão"} diferentes · ${achadas.length} impressões no total`;
    artes.innerHTML = gs.map((g,i) => {
      // a capa é a versão que você já tem; senão, a primeira
      const c = g.find(x => isOwned(x.id)) || g[0];
      const tenho = g.filter(x => isOwned(x.id)).length;
      return `
      <button class="arte ${tenho?"tenho":""}" data-g="${i}">
        <img loading="lazy" src="${c.small||""}" alt="${escapeHTML(c.name)}">
        <span class="arte-meta">
          <b>${g.length} ${g.length>1?"versões":"versão"}</b>
          <small>${escapeHTML(c.artist || "")}</small>
          ${tenho?`<em>você tem ${tenho}</em>`:""}
        </span>
      </button>`;
    }).join("");
    artes.onclick = e => {
      const b = e.target.closest(".arte"); if(!b) return;
      // some com as outras artes: sobra só a escolhida e a lista de edições dela
      artes.querySelectorAll(".arte").forEach(x => x.classList.toggle("escondida", x !== b));
      artes.querySelectorAll(".arte").forEach(x => x.classList.toggle("aberta", x === b));
      artes.classList.add("focada");
      pintarVersoes(gs[Number(b.dataset.g)], () => {
        artes.classList.remove("focada");
        artes.querySelectorAll(".arte").forEach(x => x.classList.remove("escondida","aberta"));
        document.getElementById("ad-versoes").innerHTML = "";
      });
    };
  }

  function pintarVersoes(grupo, voltar){
    const alvo = document.getElementById("ad-versoes");
    // normalize() guarda o código em maiúsculo; o Scryfall entrega minúsculo
    const simbolo = code => {
      const st = (SETS||[]).find(x => x.code === String(code||"").toLowerCase());
      return st && st.icone ? `<img class="set-simbolo" src="${st.icone}" alt="">` : `<span class="set-simbolo vazio">◆</span>`;
    };
    alvo.innerHTML = `
      <div class="versoes-topo">
        <span class="flabel">Qual é a sua? — ${grupo.length} ediç${grupo.length>1?"ões":"ão"} com esta arte</span>
        ${voltar ? `<button class="btn ghost" id="ad-voltar">← todas as artes</button>` : ""}
      </div>
      <div class="versoes">
        ${grupo.map(c => {
          const acabs = (c.acabamentos||[]).filter(a => ["nonfoil","foil","etched"].includes(a));
          return `
          <div class="versao" data-id="${c.id}">
            ${c.small ? `<img class="versao-mini" loading="lazy" src="${c.small}" alt="">` : ""}
            ${simbolo(c.set)}
            <span class="versao-nome">${escapeHTML(c.setName || c.set.toUpperCase())}
              <small>#${c.num} · ${(c.released||"").slice(0,4)}${
                rotuloVariante(c) ? " · " + escapeHTML(rotuloVariante(c)) : ""}</small></span>
            <span class="versao-acabs">
              ${(acabs.length ? acabs : ["nonfoil"]).map(a => {
                const chave = a === "nonfoil" ? "normal" : a;
                const preco = precoLocal(c, chave);
                const marcado = isOwned(c.id) && (S.owned[c.id].fin || "normal") === chave;
                return `<button class="vacab ${marcado?"on":""}" data-id="${c.id}" data-acab="${chave}">
                  ${nomeAcabamento(c, chave)}${preco?` · ${formatarPreco(preco)}`:""}</button>`;
              }).join("")}
            </span>
          </div>`;
        }).join("")}
      </div>`;

    const btnVoltar = document.getElementById("ad-voltar");
    if(btnVoltar && voltar) btnVoltar.onclick = voltar;

    alvo.onclick = e => {
      const b = e.target.closest(".vacab"); if(!b) return;
      const c = grupo.find(x => x.id === b.dataset.id);
      const acab = b.dataset.acab;
      const jaEra = isOwned(c.id) && (S.owned[c.id].fin || "normal") === acab;
      if(jaEra){ toggleOwn(c); toast(`${c.name} removida`); }
      else {
        c.acabamentoEscolhido = acab;
        if(!isOwned(c.id)) toggleOwn(c);
        S.owned[c.id].fin = acab; save(); renderKPIs();
        toast(`${c.name} (${(c.set||"").toUpperCase()}, ${nomeAcabamento(c, acab)}) adicionada`);
      }
      pintarVersoes(grupo, voltar);
      if(view.name === "minha") renderMinha();
    };
  }
}

/* Escolher a carta que vira capa da coleção. As que você já tem vêm
   primeiro — em geral é uma delas que você quer mostrar. */
function escolherCapa(def){
  const daColecao = (cur && cur.def && cur.def.id === def.id ? cur.cards : []).slice();
  const lista = daColecao.sort((a,b) => (isOwned(b.id)?1:0) - (isOwned(a.id)?1:0));
  const capa = capaDe(def.id);

  modal(`<div class="modal-pad">
    <h3>Capa de ${escapeHTML(def.name)}</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 16px">
      Escolha a carta que representa esta coleção. Ela aparece na lista de coleções no lugar do ícone.</p>
    ${capa ? `<div class="capa-atual">
        <img src="${escapeHTML(capa.img)}" alt="">
        <div><b>${escapeHTML(capa.nome || "capa atual")}</b>
          <span>é a capa de agora</span></div>
        <button class="btn ghost" id="capa-tirar">Voltar ao ícone</button>
      </div>` : ""}
    ${lista.length
      ? `<span class="flabel">Cartas desta coleção${lista.some(c=>isOwned(c.id)) ? " — as suas primeiro" : ""}</span>
         <div class="cards" id="capa-grid">${lista.slice(0,60).map(c => cardHTML(c)).join("")}</div>`
      : `<div class="empty">As cartas ainda estão carregando. Feche, espere a grade aparecer e tente de novo.</div>`}
  </div>`);

  const tirar = document.getElementById("capa-tirar");
  if(tirar) tirar.onclick = () => { definirCapa(def.id, null); closeModal(); go("collection", def.id); };

  const grade = document.getElementById("capa-grid");
  if(grade) grade.querySelectorAll(".card").forEach(el => {
    const c = lista.find(x => x.id === el.dataset.id);
    if(!c) return;
    el.onclick = e => {
      e.stopPropagation();
      definirCapa(def.id, c);
      closeModal();
      toast(`${c.name} virou a capa`);
      go("collection", def.id);
    };
    const info = el.querySelector(".info"); if(info) info.remove();
    const tirarCarta = el.querySelector(".tirar-carta"); if(tirarCarta) tirarCarta.remove();
  });
}

function adicionarNaColecao(def){
  modal(`<div class="modal-pad">
    <h3>Adicionar carta em ${escapeHTML(def.name)}</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 14px">
      Busque a carta que você quer nesta coleção mesmo que a busca dela não pegasse.
      Ela passa a contar no progresso, e dá para tirar depois.</p>
    <label class="field"><span>Nome da carta</span>
      <input type="text" id="inc-nome" placeholder="ex.: Sol Ring" autocomplete="off"></label>
    <div class="cards" id="inc-grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))"></div>
    <div class="status" id="inc-status">digite pelo menos três letras</div>
  </div>`);
  const campo = document.getElementById("inc-nome");
  let timer;
  campo.oninput = () => { clearTimeout(timer); timer = setTimeout(buscar, 400); };
  campo.focus();

  async function buscar(){
    const termo = campo.value.trim();
    const st = document.getElementById("inc-status"), grid = document.getElementById("inc-grid");
    if(termo.length < 3){ st.textContent = "digite pelo menos três letras"; grid.innerHTML = ""; return; }
    st.textContent = "buscando…"; grid.innerHTML = skeletons(6);
    try{
      const json = await scryPage(`name:"${termo}"`, "prints", "released", 1, "asc");
      const achadas = (json.data || []).map(normalize);
      if(!grid.isConnected) return;
      if(!achadas.length){ st.textContent = "nada encontrado"; grid.innerHTML = ""; return; }
      grid.innerHTML = achadas.map(c => cardHTML(c)).join("");
      st.textContent = `${achadas.length} impressões — clique para pôr na coleção`;
      grid.querySelectorAll(".card").forEach(el => {
        const c = achadas.find(x => x.id === el.dataset.id);
        el.onclick = () => {
          registrarDesfazer(`adicionar ${c.name} em ${def.name}`, { inclusoes: JSON.parse(JSON.stringify(S.inclusoes||{})) });
          const nova = incluirNaColecao(def.id, c);
          toast(nova ? `${c.name} entrou em ${def.name}` : "essa carta já está na coleção");
          closeModal(); go("collection", def.id);
        };
      });
    }catch(e){ if(grid.isConnected){ st.textContent = "erro na busca"; grid.innerHTML = ""; } }
  }
}

/* ---------------- desfazer ---------------- */
let pilhaDesfazer = [];
function registrarDesfazer(descricao, instantaneo){
  pilhaDesfazer.push({ descricao, instantaneo });
  if(pilhaDesfazer.length > 20) pilhaDesfazer.shift();
  mostrarDesfazer(descricao);
}
function desfazer(){
  const ultimo = pilhaDesfazer.pop();
  if(!ultimo) return toast("nada para desfazer");
  Object.assign(S, ultimo.instantaneo);
  save(); render();
  toast(`desfeito: ${ultimo.descricao}`);
}
let toastDesfazerTimer;
function mostrarDesfazer(descricao){
  clearTimeout(toastDesfazerTimer);
  let el = document.querySelector(".toast-desfazer");
  if(!el){
    el = document.createElement("div");
    el.className = "toast toast-desfazer";
    document.body.appendChild(el);
  }
  el.innerHTML = `<span>${escapeHTML(descricao)}</span><button class="btn ghost" id="btn-desfazer">Desfazer</button>`;
  document.getElementById("btn-desfazer").onclick = () => { el.remove(); desfazer(); };
  toastDesfazerTimer = setTimeout(() => el.remove(), 7000);
}

  const alvo = document.getElementById("s-lista");
  if(!alvo || !SETS) return;
  const termo = semAcento(vistaSets.busca).trim();
  const meus = {};
  // o resumo guarda o código em maiúsculo e o Scryfall usa minúsculo:
  // sem normalizar, o "você tem N" da edição ficava sempre zerado
  Object.entries(S.owned).forEach(([id, r]) => {
    if(!r.s) return;
    const k = String(r.s).toLowerCase();
    meus[k] = (meus[k] || 0) + qtdDe(id);
  });

  let lista = SETS.filter(st => {
    const grupo = TIPOS_DE_SET[vistaSets.tipo];
    if(grupo && !grupo.includes(st.tipo)) return false;
    if(!termo) return true;
    return semAcento(st.name).includes(termo) || st.code.includes(termo);
  });

  if(!lista.length){ alvo.innerHTML = `<div class="empty">Nenhuma edição com esse nome.</div>`; return; }

  const porAno = {};
  lista.forEach(st => { (porAno[st.ano] = porAno[st.ano] || []).push(st); });
  const anos = Object.keys(porAno).sort((a,b) => b.localeCompare(a));

  alvo.innerHTML = `<div class="status" style="text-align:left;margin:0 0 14px">${lista.length} edições</div>` +
    anos.map(ano => `
      <section class="ano-bloco">
        <h3 class="ano-titulo">${ano}<span>${porAno[ano].length} edições</span></h3>
        <div class="sets-grade">
          ${porAno[ano].sort((a,b) => b.n - a.n).map(st => {
            const tenho = meus[st.code] || 0;
            const pct = st.n ? Math.round(100 * tenho / st.n) : 0;
            return `
            <button class="set-cartao" data-code="${st.code}">
              <div class="set-icone">${st.icone ? `<img src="${st.icone}" alt="" loading="lazy">` : "◆"}</div>
              <div class="set-info">
                <b>${escapeHTML(st.name)}</b>
                <span>${st.code.toUpperCase()} · ${st.n} cartas</span>
                ${tenho ? `<span class="set-tenho">você tem ${tenho} (${pct}%)</span>` : ""}
              </div>
              ${tenho ? `<div class="set-barra"><i style="width:${Math.min(100,pct)}%"></i></div>` : ""}
            </button>`;
          }).join("")}
        </div>
      </section>`).join("");

  alvo.querySelectorAll(".set-cartao").forEach(el => {
    el.onclick = () => go("set", el.dataset.code);
  });
}

/* Modelos de booster. As estruturas mudaram bastante: o Play Booster (2024
   em diante) trocou o Draft Booster e trouxe curinga e foil garantido. */
const MODELOS_BOOSTER = {
  play:         { rotulo:"Play Booster (2024+)",     comuns:6,  incomuns:3, raros:1, curinga:1, foils:1,  porBox:30 },
  draft:        { rotulo:"Draft Booster (até 2023)", comuns:10, incomuns:3, raros:1, curinga:0, foils:1,  porBox:36 },
  colecionador: { rotulo:"Collector Booster",        comuns:0,  incomuns:4, raros:5, curinga:1, foils:15, porBox:12 },
};
const BOOSTER_PADRAO = { modelo:"play", chanceMitico:1/7.4 };

async function renderSet(code){
  await carregarSets();
  const st = (SETS || []).find(x => x.code === code);
  if(!st){ go("sets"); return; }
  const cfg = Object.assign({}, BOOSTER_PADRAO,
    { modelo: Number(st.ano) >= 2024 ? "play" : "draft" },
    (S.selados && S.selados[code]) || {});

  app.innerHTML = `
    <button class="icon-btn" id="voltar-sets" style="margin-bottom:16px">← todas as edições</button>
    <div class="coll-head">
      <div class="ico">${st.icone ? `<img class="set-simbolo grande" src="${st.icone}" alt="">` : "◆"}</div>
      <div style="flex:1;min-width:220px">
        <h2>${escapeHTML(st.name)}</h2>
        <p>${st.code.toUpperCase()} · ${st.ano} · ${st.n} cartas</p>
      </div>
      <button class="btn ghost" id="ver-cartas">Ver as cartas</button>
    </div>
    <div id="set-analise"><div class="status">calculando o valor das cartas desta edição…</div></div>`;

  document.getElementById("voltar-sets").onclick = ()=> go("sets");
  document.getElementById("ver-cartas").onclick = ()=>{
    cat.f = FILTROS_VAZIOS(); cat.f.set = code; cat.f.unico = "prints";
    view = { name:"catalogo", id:null };
    renderCatalogo().then(buscarCatalogo);
    window.scrollTo({ top:0, behavior:"smooth" });
  };

  // cartas que realmente saem em booster — é o que interessa para o cálculo
  let cartas = [], usouTodas = false;
  const buscar = async (consulta) => {
    const achadas = [];
    for(let pagina = 1; pagina <= 8; pagina++){
      const json = await scryPage(consulta, "cards", "usd", pagina, "desc");
      achadas.push(...(json.data || []).map(normalize));
      if(!json.has_more) break;
    }
    return achadas;
  };
  try{ cartas = await buscar(`e:${code} is:booster`); }catch(e){ cartas = []; }
  if(!cartas.length){
    // sets recentes ainda não têm a marcação de booster no Scryfall — usa todas
    try{ cartas = await buscar(`e:${code}`); usouTodas = true; }catch(e){ cartas = []; }
  }

  pintarAnaliseSet(st, cartas, cfg, usouTodas);
  carregarProdutosDoSet(st, cartas, cfg);
}

function estatisticas(lista, acabamento){
  const vals = lista.map(c => { const p = precoLocal(c, acabamento); return p ? p.valor : 0; }).filter(v => v > 0).sort((a,b) => a-b);
  if(!vals.length) return { n:lista.length, media:0, mediana:0, max:0 };
  const meio = Math.floor(vals.length/2);
  return {
    n: lista.length,
    media: vals.reduce((a,b)=>a+b,0) / vals.length,
    mediana: vals.length % 2 ? vals[meio] : (vals[meio-1] + vals[meio]) / 2,
    max: vals[vals.length-1],
  };
}

/* As estatísticas por raridade custam caro e não mudam enquanto a lista de
   cartas for a mesma — ficam guardadas na própria lista. */
const cacheEst = new WeakMap();
function estatisticasDoSet(cartas){
  if(cacheEst.has(cartas)) return cacheEst.get(cartas);
  const porRar = r => cartas.filter(c => c.rarity === r);
  const est = { mythic:estatisticas(porRar("mythic")), rare:estatisticas(porRar("rare")),
                uncommon:estatisticas(porRar("uncommon")), common:estatisticas(porRar("common")),
                geral:estatisticas(cartas), foil:estatisticas(cartas, "foil") };
  cacheEst.set(cartas, est);
  return est;
}

/* Valor esperado de UM booster do modelo pedido. Cada produto tem o seu:
   Collector Booster não pode ser contado com a receita do Play Booster. */
function evComModelo(est, cfg, nomeModelo, usar){
  const mod = MODELOS_BOOSTER[nomeModelo] || MODELOS_BOOSTER.play;
  const m = est.mythic[usar] || 0, r = est.rare[usar] || 0;
  const raroSlot = est.mythic.n ? cfg.chanceMitico * m + (1 - cfg.chanceMitico) * r : r;
  return mod.raros * raroSlot
       + mod.incomuns * (est.uncommon[usar] || 0)
       + mod.comuns  * (est.common[usar]   || 0)
       + mod.curinga * (est.geral[usar]    || 0)
       + mod.foils   * (est.foil[usar]     || 0);
}

  const est = estatisticasDoSet(cartas);
  const mod = MODELOS_BOOSTER[cfg.modelo] || MODELOS_BOOSTER.play;

  const evMedia = ev("media"), evMediana = ev("mediana");

                <tr>

            as cartas do set, então o valor tende a ficar mais alto que o real.<br><br>` : ""}
          Só entram cartas que saem em booster — variantes de coleção e promos ficam de fora,
          senão o número engorda sozinho. Preços ${S.config.acabamento === "foil" ? "da versão foil" : "da versão normal"},

      </div>

      <div class="col-ev">
        <span class="flabel">Valor esperado de um booster</span>
        <div class="ev-numeros">
          <div class="ev-principal">
            <b>${fmt(evMediana)}</b>
            <small>pela mediana — o resultado típico</small>
          </div>
          <div class="ev-secundario">
            <b>${fmt(evMedia)}</b>
            <small>pela média — puxada pelas cartas caras</small>
          </div>
        </div>

        <label class="field" style="margin-top:14px"><span>Tipo de booster</span>

let dropsSLD = null;   // { nomes: {numero: nome do drop}, datas: {numero: data das sorteadas} }

async function carregarDrops(){
  const alvo = document.getElementById("sl-lista");
  if(!alvo) return;
  sl.cartas = [];
  try{
    for(let pagina = 1; pagina <= 6; pagina++){
      const json = await scryPage(`e:sld year:${sl.ano}`, "prints", "released", pagina, "desc");
      sl.cartas.push(...(json.data || []).map(normalize));
      if(!json.has_more) break;
    }
  }catch(e){
    alvo.innerHTML = `<div class="empty">Nenhum drop encontrado em ${sl.ano}.</div>`;
    return;
  }
  pintarDrops();

  // os nomes dos drops não existem no Scryfall; vêm do MTGJSON (10 MB, uma vez por mês)
  if(dropsSLD === null){
    const aviso = document.getElementById("sl-aviso");
    if(aviso) aviso.textContent = "buscando os nomes dos drops (só na primeira vez)…";
    try{ dropsSLD = await carregarDropsSecretLair(); }
    catch(e){ dropsSLD = { nomes:{}, datas:{} }; }
    if(aviso) aviso.textContent = "";
    if(view.name === "secretlair") pintarDrops();
  }
}

function pintarDrops(){
  const alvo = document.getElementById("sl-lista");
  if(!alvo) return;
  if(!sl.cartas.length){ alvo.innerHTML = `<div class="empty">Nenhum drop em ${sl.ano}.</div>`; return; }

  /* Agrupa pelo nome do drop. O que não tem nome fica junto pela data,
     dizendo o que é: bônus sorteado, token, ou drop daquele dia. */
  const grupos = {};
  sl.cartas.forEach(c => {
    const d = dropDaCarta(c);
    const data = d.data || (c.released || "").slice(0,10);
    const chave = d.nome ? "n:" + d.nome : `${d.tipo || "resto"}:${data}`;
    (grupos[chave] = grupos[chave] || []).push(c);
  });
  const chaves = Object.keys(grupos).sort((a,b) => {
    const dataDe = k => (grupos[k][0].released || "");
    return dataDe(b).localeCompare(dataDe(a)) || a.localeCompare(b);
  });

  alvo.innerHTML = `<div class="status" style="text-align:left;margin:0 0 16px">
      ${chaves.length} drops · ${sl.cartas.length} cartas em ${sl.ano}</div>` +
    chaves.map(chave => {
      const cartas = grupos[chave].sort((a,b) => (Number(a.num) || 0) - (Number(b.num) || 0));
      const tipo = chave.slice(0, chave.indexOf(":"));
      const d = (tipo === "n" ? (cartas[0].released || "") : chave.slice(tipo.length+1) || cartas[0].released || "").slice(0,10);
      const porExtenso = dt => dt ? new Date(dt + "T12:00:00").toLocaleDateString("pt-BR", { day:"2-digit", month:"long", year:"numeric" }) : "";
      const curta = dt => dt ? new Date(dt + "T12:00:00").toLocaleDateString("pt-BR", { day:"2-digit", month:"short", year:"numeric" }) : "";
      const titulo = tipo === "n" ? chave.slice(2)
        : tipo === "bonus" ? `Bônus sorteados nos drops de ${porExtenso(d)}`
        : tipo === "token" ? `Tokens dos drops de ${porExtenso(d)}`
        : null;
      const tenho = cartas.filter(c => isOwned(c.id)).length;
      const valor = cartas.reduce((a,c) => { const p = precoLocal(c); return a + (p ? p.valor : 0); }, 0);
      return `
      <section class="drop">
        <h3 class="drop-titulo">
          ${titulo ? escapeHTML(titulo) : porExtenso(d)}
          <span>${chave.startsWith("n:") ? curta(d) + " · " : ""}${cartas.length} cartas · ${formatarPreco({valor, simbolo:regiao().simbolo})}${tenho?` · você tem ${tenho}`:""}</span>
        </h3>
        <div class="cards">${cartas.map(c => cardHTML(c)).join("")}</div>
      </section>`;
    }).join("");

  ligarCartas(alvo, id => sl.cartas.find(x => x.id === id), () => pintarDrops());
}

/* =====================================================================
   MTGJSON — produtos selados e nomes dos drops de Secret Lair.
   O Scryfall só conhece cartas; produto lacrado e nome de drop vêm daqui.
   As imagens das caixas são as do TCGplayer, pelo id que o MTGJSON entrega.
   ===================================================================== */

const MTGJSON = "https://mtgjson.com/api/v5";
const cacheSelados = {};

function imagemProduto(tcg){
  return tcg ? `https://product-images.tcgplayer.com/fit-in/437x437/${tcg}.jpg` : null;
}

function guardarLocal(chave, valor){
  try{ localStorage.setItem(chave, JSON.stringify({ em:Date.now(), valor })); }catch(e){}
}
function lerLocal(chave, validadeDias){
  try{
    const g = JSON.parse(localStorage.getItem(chave) || "null");
    if(g && Date.now() - g.em < validadeDias*24*3600*1000) return g.valor;
  }catch(e){}
  return null;
}

/* Deixa dois nomes comparáveis sem apagar palavra nenhuma: "Play" e
   "Collector", "Japanese" e número de série continuam distinguindo. */
const chaveDeNome = s => String(s || "").toLowerCase().normalize("NFKD")
  .replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

async function carregarSelados(code){
  const c = code.toUpperCase();
  if(cacheSelados[c]) return cacheSelados[c];
  const guardado = lerLocal("collector.selados.v2." + c, 30);
  if(guardado){ cacheSelados[c] = guardado; return guardado; }
  try{
    const r = await fetch(`${MTGJSON}/${c}.json`);
    if(!r.ok) throw new Error("mtgjson " + r.status);
    const j = await r.json();
    const brutos = ((j.data && j.data.sealedProduct) || []).map(p => ({
      uuid: p.uuid, nome: p.name, cat: p.category, sub: p.subtype,
      tam: Number(p.productSize) || 0,
      tcg: (p.identifiers && p.identifiers.tcgplayerProductId) || null,
    }));

    /* O MTGJSON às vezes lista o mesmo produto físico duas vezes — uma por
       canal de venda. Mesmo id do TCGplayer é o mesmo produto, sempre;
       sem id, só junta se nome, categoria e subtipo forem iguais. */
    const juntos = new Map();
    brutos.forEach(p => {
      const chave = p.tcg ? "tcg:" + p.tcg : `n:${chaveDeNome(p.nome)}|${p.cat||""}|${p.sub||""}`;
      const antes = juntos.get(chave);
      if(!antes){ juntos.set(chave, Object.assign({}, p, { uuids:[p.uuid] })); return; }
      antes.uuids.push(p.uuid);
      if(!antes.tcg && p.tcg) antes.tcg = p.tcg;       // fica com quem tem foto e link
      if(!antes.tam && p.tam) antes.tam = p.tam;
    });

    const lista = [...juntos.values()];
    cacheSelados[c] = lista;
    guardarLocal("collector.selados.v2." + c, lista);
    return lista;
  }catch(e){ cacheSelados[c] = []; return []; }
}

/* quantos boosters vêm em cada tipo de caixa, para a conta bater */
const BOOSTERS_POR_CAIXA = { collector:12, play:30, draft:36, set:30, jumpstart:18, default:30 };
const CATEGORIAS_PT = {
  booster_box:"Caixa de boosters", booster_pack:"Booster avulso", booster_case:"Case",
  bundle:"Bundle", bundle_case:"Case de bundle", deck:"Deck", deck_box:"Caixa de decks",
  commander_deck:"Deck de Commander", multiple_decks:"Conjunto de decks",
  box_set:"Box set", kit:"Kit", land_station:"Land station", subset:"Subconjunto",
};

/* =====================================================================
   De que drop é cada carta do Secret Lair.

   O Scryfall não guarda o nome do drop; o MTGJSON guarda, mas espalhado:
   uma parte das cartas aparece em contents.card, a maioria vem dentro de
   um "deck" com o mesmo nome do drop, e as versões sorteadas aparecem em
   contents.variable. Ler só o contents.card nomeava 160 de 2.686 cartas —
   por isso tanto drop sem nome e tanto drop de uma carta só.

   Lendo as três fontes mais os tokens, 2.339 das 2.754 cartas ficam com
   o nome certo. Das que sobram, quase todas são bônus sorteados dentro
   dos drops (o Scryfall marca como "sldbonus") e tokens. Quando só um
   drop saiu naquela data, a carta entra nele — é o mesmo drop, com
   certeza. Quando foi um superdrop com vários no mesmo dia, elas ficam
   juntas e a tela diz o que são, porque chutar um nome errado é pior do
   que não dar nome: testei o chute pela faixa de número de coleção e ele
   acerta metade das vezes.
   ===================================================================== */
async function carregarDropsSecretLair(){
  const guardado = lerLocal("collector.drops.sld3", 30);
  if(guardado) return guardado;
  const r = await fetch(`${MTGJSON}/SLD.json`);
  if(!r.ok) throw new Error("mtgjson " + r.status);
  const j = await r.json();
  const dados = j.data || {};
  const produtos = dados.sealedProduct || [];

  const numeroPorUuid = {}, dataPorNumero = {};
  [...(dados.cards || []), ...(dados.tokens || [])].forEach(c => {
    numeroPorUuid[c.uuid] = c.number;
    if(c.number) dataPorNumero[c.number] = c.originalReleaseDate || "";
  });
  const deckPorNome = {};
  (dados.decks || []).forEach(d => { deckPorNome[d.name] = d; });

  const numerosDoDeck = d => {
    const fora = [];
    ["commander","displayCommander","mainBoard","sideBoard"].forEach(k =>
      (d[k] || []).forEach(e => { const n = numeroPorUuid[e.uuid]; if(n) fora.push(n); }));
    return fora;
  };
  const daqui = x => String(x.set || "").toLowerCase() === "sld" && x.number;
  const numerosDoProduto = p => {
    const c = p.contents || {}, fora = [];
    (c.card || []).forEach(x => { if(daqui(x)) fora.push(x.number); });
    (c.deck || []).forEach(x => { const d = deckPorNome[x.name]; if(d) fora.push(...numerosDoDeck(d)); });
    (c.other || []).forEach(x => { const n = numeroPorUuid[x.uuid]; if(n) fora.push(n); });
    (c.variable || []).forEach(v => (v.configs || []).forEach(cf => {
      (cf.card || []).forEach(x => { if(daqui(x)) fora.push(x.number); });
      (cf.deck || []).forEach(x => { const d = deckPorNome[x.name]; if(d) fora.push(...numerosDoDeck(d)); });
    }));
    return fora;
  };

  // bundles (que só embrulham outros drops) não dão nome a carta nenhuma;
  // e entre os demais o produto menor ganha, porque é o drop mais específico
  const lista = produtos
    .filter(p => !(p.contents && p.contents.sealed))
    .map(p => ({ nome: nomeDoDrop(p.name), nums: [...new Set(numerosDoProduto(p))] }))
    .filter(x => x.nums.length && x.nome)
    .sort((a,b) => b.nums.length - a.nums.length);

  const nomes = {};
  lista.forEach(x => x.nums.forEach(n => { nomes[n] = x.nome; }));

  // data de cada drop: a mais repetida entre as cartas que já têm nome
  const contagem = {};
  Object.keys(nomes).forEach(n => {
    const d = dataPorNumero[n]; if(!d) return;
    const m = contagem[nomes[n]] = contagem[nomes[n]] || {};
    m[d] = (m[d] || 0) + 1;
  });
  const dropsDaData = {};
  Object.keys(contagem).forEach(nome => {
    const d = Object.entries(contagem[nome]).sort((a,b) => b[1] - a[1])[0][0];
    (dropsDaData[d] = dropsDaData[d] || []).push(nome);
  });

  // as sorteadas: entram no drop da data quando aquela data teve um drop só
  const datas = {};
  Object.keys(dataPorNumero).forEach(n => {
    if(nomes[n]) return;
    const d = dataPorNumero[n];
    const candidatos = (d && dropsDaData[d]) || [];
    if(candidatos.length === 1) nomes[n] = candidatos[0];
    else datas[n] = d || "";
  });

  const mapa = { nomes, datas, dropsDaData };
  guardarLocal("collector.drops.sld3", mapa);
  return mapa;
}

/* A carta não tem nome de drop pelo MTGJSON: se na data dela saiu um drop
   só, é dele; senão, dá para dizer o que ela é sem inventar nome. */
function dropDaCarta(c){
  if(!dropsSLD) return { nome:null, tipo:null };
  const num = c.num;
  const direto = dropsSLD.nomes && dropsSLD.nomes[num];
  if(direto) return { nome:direto, tipo:"drop" };
  const data = (dropsSLD.datas && dropsSLD.datas[num]) || (c.released || "").slice(0,10);
  const porData = dropsSLD.dropsDaData || {};
  const candidatos = porData[data] || porData[(c.released || "").slice(0,10)] || [];
  if(candidatos.length === 1) return { nome:candidatos[0], tipo:"drop" };
  const tipo = (c.promos || []).includes("sldbonus") ? "bonus"
             : c.layout === "token" ? "token" : "resto";
  return { nome:null, tipo, data };
}

/* os nomes vêm longos: "Secret Lair Bundle X Superdrop Y Foil and Non Foil" */
function nomeDoDrop(bruto){
  return String(bruto)
    .replace(/^Secret Lair\s*(Drop Series|Commander Deck|Bundle|Drop)?\s*[:\-–]?\s*/i, "")
    .replace(/\s*(Foil and Non ?-?Foil|Non ?-?Foil|Foil Edition|Traditional Foil|Rainbow Foil|Galaxy Foil|Textured Foil|Foil)$/i, "")
    .replace(/\s{2,}/g, " ")
    .trim() || bruto;
}

/* ---------- preço de mercado dos lacrados ----------
   O Scryfall não tem preço de produto lacrado e o MTGJSON também não.
   O preço vem do nosso banco, alimentado uma vez por dia pelo job com os
   dados públicos do TCGplayer. Enquanto não houver dado, vale o preço que
   você digitar — que continua tendo precedência sobre o automático. */
const cachePrecoSelado = {};
async function precosDeSelados(tcgIds){
  const faltam = tcgIds.filter(id => cachePrecoSelado[id] === undefined);
  if(faltam.length){
    faltam.forEach(id => { cachePrecoSelado[id] = null; });   // não pergunta duas vezes
    try{
      const lista = await supa(
        `sealed_prices?tcg_id=in.(${faltam.join(",")})&select=tcg_id,market,day&order=day.desc`);
      (lista || []).forEach(l => {
        if(cachePrecoSelado[l.tcg_id] == null) cachePrecoSelado[l.tcg_id] = { valor:Number(l.market)||0, dia:l.day };
      });
    }catch(e){}
  }
  const fora = {};
  tcgIds.forEach(id => { if(cachePrecoSelado[id]) fora[id] = cachePrecoSelado[id]; });
  return fora;
}

/* Cada caixa tem o seu próprio tipo de booster: contar uma Collector Box
   com o EV do Play Booster dá número errado, que era o que acontecia. */
function modeloDoProduto(pr, cfg){
  const sub = String(pr.sub || "").toLowerCase();
  if(sub === "collector") return "colecionador";
  if(sub === "play") return "play";
  if(sub === "draft" || sub === "set") return "draft";
  return cfg.modelo;
}
function boostersDoProduto(pr){
  if(pr.tam > 0) return pr.tam;                       // o MTGJSON diz quantos vêm
  if(pr.cat === "booster_pack") return 1;
  if(pr.cat === "booster_box") return BOOSTERS_POR_CAIXA[pr.sub] || BOOSTERS_POR_CAIXA.default;
  return 0;
}

function pintarProdutos(st, produtos, cartas, cfg){
  const alvo = document.getElementById("set-produtos");
  if(!alvo) return;
  const precos = ((S.selados && S.selados[st.code]) || {}).produtos || {};
  const est = cartas.length ? estatisticasDoSet(cartas) : null;
  const r = regiao();

  alvo.dataset.pronto = "1";
  try{ alvo.dataset.lista = JSON.stringify(produtos); }catch(e){}

  /* o preço automático vem em dólar; a tela mostra na moeda da região */
  const emMoeda = usd => {
    if(r.moeda === "BRL" && CAMBIO && CAMBIO.usd) return usd * CAMBIO.usd;
    if(r.moeda === "EUR" && CAMBIO && CAMBIO.usd && CAMBIO.eur) return usd * (CAMBIO.usd / CAMBIO.eur);
    return usd;
  };
  /* lê sempre do estado, não de uma cópia: senão o preço recém-digitado
     não aparece na conta até repintar a página inteira */
  const precoManual = pr => {
    const atuais = ((S.selados && S.selados[st.code]) || {}).produtos || precos;
    for(const u of (pr.uuids || [pr.uuid])){ const v = Number(atuais[u]); if(v) return v; }
    return 0;
  };

  const ordem = { booster_box:0, booster_pack:1, bundle:2,
                  box_set:3, commander_deck:4, deck:5, prerelease_kit:6,
                  booster_case:15, bundle_case:16, case:17 };
  /* "Case" é a caixa de atacado que vem com seis displays dentro — quem
     coleciona não compra isso, e elas só enchiam a lista. Ficam escondidas,
     com um link para quem quiser ver. */
  const ehCase = pr => /_case$/.test(pr.cat || "") || pr.cat === "case" || /\bcases?\b/i.test(pr.nome || "");
  const cases = produtos.filter(ehCase);
  const mostrarCases = !!(S.config && S.config.mostrarCases);
  const lista = (mostrarCases ? produtos.slice() : produtos.filter(pr => !ehCase(pr)))
    .sort((a,b) => (ordem[a.cat] ?? 10) - (ordem[b.cat] ?? 10) || String(a.nome).localeCompare(String(b.nome)));

  const linhaProduto = pr => {
    const img = imagemProduto(pr.tcg);
    const auto = pr.tcg && cachePrecoSelado[pr.tcg] ? emMoeda(cachePrecoSelado[pr.tcg].valor) : 0;
    const manual = precoManual(pr);
    const preco = manual || auto;
    const boosters = boostersDoProduto(pr);
    const modelo = modeloDoProduto(pr, cfg);
    const ev = boosters && est ? evComModelo(est, cfg, modelo, "mediana") * boosters : 0;
    const rel = ev && preco ? ev / preco : null;
    const cor = rel === null ? "" : rel >= 1 ? "acima" : rel >= 0.75 ? "perto" : "abaixo";
    const rotuloModelo = boosters > 1 && MODELOS_BOOSTER[modelo] ? MODELOS_BOOSTER[modelo].rotulo : "";
    return `
    <div class="produto" data-uuid="${escapeHTML(pr.uuid)}">
      <div class="produto-foto">
        ${img ? `<img src="${escapeHTML(img)}" alt="${escapeHTML(pr.nome)}" loading="lazy"
                   onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sem-foto',textContent:'sem foto'}))">`
              : `<span class="sem-foto">sem foto</span>`}
      </div>
      <div class="produto-info">
        <b>${escapeHTML(pr.nome)}</b>
        <span class="produto-cat">${escapeHTML(CATEGORIAS_PT[pr.cat] || String(pr.cat || "").replace(/_/g," "))}${
          boosters > 1 ? ` · ${boosters} boosters${rotuloModelo ? ` · ${escapeHTML(rotuloModelo)}` : ""}` : ""}</span>
        <div class="produto-preco">
          <input type="number" step="0.01" min="0"
                 placeholder="${auto ? formatarPreco({valor:auto, simbolo:r.simbolo}) + " de mercado" : "preço em " + r.simbolo}"
                 value="${manual || ""}" data-preco="${escapeHTML(pr.uuid)}">
          <span class="produto-rel ${cor}">${rel !== null ? (rel*100).toFixed(0) + "%" : ""}</span>
        </div>
        <span class="produto-ev">${[
            auto ? `mercado hoje: ${formatarPreco({valor:auto, simbolo:r.simbolo})}` : "",
            ev ? `cartas dentro: ~${formatarPreco({valor:ev, simbolo:r.simbolo})}` : ""
          ].filter(Boolean).join(" · ")}</span>
        ${pr.tcg ? `<a class="produto-link" target="_blank" rel="noopener"
           href="https://www.tcgplayer.com/product/${encodeURIComponent(pr.tcg)}">ver no TCGplayer ↗</a>` : ""}
      </div>
    </div>`;
  };

  const temAuto = lista.some(pr => pr.tcg && cachePrecoSelado[pr.tcg]);
  alvo.innerHTML = `
    <div class="section-head" style="margin-top:34px">
      <div>
        <h2 style="font-size:17px">Produtos lacrados</h2>
        <p>${lista.length} produtos catalogados nesta edição, com a foto oficial.
        ${temAuto ? "O preço de mercado vem do TCGplayer, atualizado todo dia."
                  : "Ainda não tenho preço de mercado destes produtos — ponha o que você vê na loja."}
        O que você digitar vale mais que o automático, e a % compara o preço com o valor das cartas de dentro.
        ${cases.length ? `<br><button class="ligar-cases" id="ver-cases">${mostrarCases
            ? `esconder as ${cases.length} caixas de atacado (case)`
            : `mostrar as ${cases.length} caixas de atacado (case)`}</button>` : ""}</p>
      </div>
    </div>
    <div class="produtos">${lista.map(linhaProduto).join("")}</div>`;

  const btnCases = document.getElementById("ver-cases");
  if(btnCases) btnCases.onclick = () => {
    S.config.mostrarCases = !mostrarCases; save();
    pintarProdutos(st, produtos, cartas, cfg);
  };

  /* Repintar a lista inteira a cada tecla tirava o foco do campo no meio do
     número. Agora só a linha mexida é refeita. */
  const guardar = el => {
    const uuid = el.dataset.preco;
    S.selados = S.selados || {};
    S.selados[st.code] = S.selados[st.code] || {};
    S.selados[st.code].produtos = S.selados[st.code].produtos || {};
    S.selados[st.code].produtos[uuid] = Number(el.value) || 0;
    save();
    const pr = lista.find(p => p.uuid === uuid);
    const linha = el.closest(".produto");
    if(!pr || !linha) return;
    const novo = document.createElement("div");
    novo.innerHTML = linhaProduto(pr);
    const rel = novo.querySelector(".produto-rel"), evTxt = novo.querySelector(".produto-ev");
    const relAtual = linha.querySelector(".produto-rel"), evAtual = linha.querySelector(".produto-ev");
    if(rel && relAtual){ relAtual.className = rel.className; relAtual.textContent = rel.textContent; }
    if(evTxt && evAtual) evAtual.textContent = evTxt.textContent;
  };
  const temporizadores = new WeakMap();
  alvo.querySelectorAll("[data-preco]").forEach(el => {
    el.oninput = () => {
      clearTimeout(temporizadores.get(el));
      temporizadores.set(el, setTimeout(() => guardar(el), 500));
    };
    el.onchange = () => { clearTimeout(temporizadores.get(el)); guardar(el); };
  });
}

/* ---------- histórico de preço: vem do banco, arquivado todo dia ---------- */
async function carregarHistorico(c){
  const alvo = document.getElementById("grafico");
  if(!alvo) return;
  try{
    const linhas = await supa(`price_history?card_id=eq.${encodeURIComponent(c.id)}&select=day,usd,usd_foil&order=day.asc&limit=400`);
    if(!alvo.isConnected) return;
    const pontos = linhas.map(l => ({ dia:l.day, v:Number(l.usd || l.usd_foil) })).filter(x => x.v > 0);

    if(pontos.length === 0){
      alvo.innerHTML = `<span class="carregando">esta carta ainda não entrou no arquivo diário</span>`;
      return;
    }
    if(pontos.length === 1){
      alvo.innerHTML = `<span class="carregando">arquivando desde ${pontos[0].dia} — o gráfico ganha forma nos próximos dias</span>`;
      return;
    }
    const primeiro = pontos[0].v, ultimo = pontos[pontos.length-1].v;
    const varia = ((ultimo/primeiro) - 1) * 100;
    alvo.innerHTML = `
      <div class="grafico-topo">
        <span>${pontos.length} dias</span>
        <b class="${varia >= 0 ? "sobe" : "desce"}">${varia >= 0 ? "▲" : "▼"} ${Math.abs(varia).toFixed(1)}%</b>
      </div>
      ${sparkline(pontos)}`;
  }catch(e){
    if(alvo.isConnected) alvo.innerHTML = `<span class="carregando">histórico indisponível agora</span>`;
  }
}

function sparkline(pontos){
  const L = 260, A = 54, pad = 3;
  const vs = pontos.map(p => p.v);
  const min = Math.min(...vs), max = Math.max(...vs), amp = (max - min) || 1;
  const x = i => pad + (i / (pontos.length - 1)) * (L - pad*2);
  const y = v => A - pad - ((v - min) / amp) * (A - pad*2);
  const linha = pontos.map((p,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area = `${linha} L${x(pontos.length-1).toFixed(1)},${A} L${x(0).toFixed(1)},${A} Z`;
  const fim = pontos[pontos.length-1];
  return `<svg viewBox="0 0 ${L} ${A}" class="spark" role="img"
      aria-label="variação de preço de ${pontos[0].dia} a ${fim.dia}">
    <path d="${area}" fill="var(--gold-dim)" opacity=".18"></path>
    <path d="${linha}" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linejoin="round"></path>
    <circle cx="${x(pontos.length-1).toFixed(1)}" cy="${y(fim.v).toFixed(1)}" r="2.6" fill="var(--gold)"></circle>
  </svg>`;
}

/* ---------- todas as impressões da mesma carta ---------- */
/* Símbolo oficial da edição a partir do código. O normalize() guarda o
   código em maiúsculo e o Scryfall entrega minúsculo — daí o toLowerCase. */
function simboloDoSet(code, alt){
  const st = (SETS || []).find(x => x.code === String(code || "").toLowerCase());
  return st && st.icone
    ? `<img class="set-simbolo" src="${st.icone}" alt="${escapeHTML(alt || code || "")}" loading="lazy">`
    : `<span class="set-simbolo vazio">${escapeHTML(String(code || "").toUpperCase())}</span>`;
}

async function carregarImpressoes(c){
  const alvo = document.getElementById("impressoes");
  if(!alvo) return;
  carregarSets().then(() => {          // sem os sets não há símbolo para desenhar
    if(alvo.isConnected && alvo.dataset.semSimbolo) carregarImpressoes(c);
  }).catch(()=>{});
  try{
    const url = c.impressoesUri
      || `${API}/cards/search?q=${encodeURIComponent(`!"${c.name}"`)}&unique=prints&order=released&dir=asc`;
    const r = await fetch(url, { headers:{Accept:"application/json"} });
    if(!r.ok) throw new Error("busca falhou");
    const j = await r.json();
    if(!alvo.isConnected) return;
    const versoes = (j.data||[]).map(normalize);
    if(versoes.length <= 1){
      alvo.innerHTML = `<span class="flabel">Todas as impressões</span>
        <div class="carregando">esta carta só foi impressa uma vez</div>`;
      return;
    }
    const tenho = versoes.filter(v => isOwned(v.id)).length;

    /* Impressões que repetem a mesma ilustração ficam num bloco só: a arte
       aparece uma vez e as edições que a usam ficam listadas embaixo. */
    const mapa = new Map();
    versoes.forEach(v => {
      const chave = v.arte || (v.name + "|" + v.artist);
      if(!mapa.has(chave)) mapa.set(chave, []);
      mapa.get(chave).push(v);
    });
    const artes = [...mapa.values()];

    alvo.innerHTML = `
      <span class="flabel">Todas as impressões — ${versoes.length} em ${artes.length} ${artes.length>1?"artes":"arte"}${tenho?` · você tem ${tenho}`:""}</span>
      <div class="impr-tira">
        ${artes.map(g => {
          const capa = g.find(v => v.id === c.id) || g.find(v => isOwned(v.id)) || g[0];
          const aqui = g.some(v => v.id === c.id), meu = g.some(v => isOwned(v.id));
          return `
          <div class="impr-grupo ${aqui?"atual":""} ${meu?"tenho":""}">
            ${capa.small ? `<img class="impr-arte" loading="lazy" src="${capa.small}" alt="${escapeHTML(capa.name)}">`
                         : `<div class="impr-arte sem-arte">${escapeHTML(capa.name)}</div>`}
            <span class="impr-artista">${escapeHTML(capa.artist || "")}${g.length>1?` · ${g.length} edições`:""}</span>
            <div class="impr-eds">
              ${g.map(v => `
                <button class="impr ${isOwned(v.id)?"owned":""} ${v.id===c.id?"atual":""}" data-id="${v.id}"
                        title="${escapeHTML(v.setName||"")} (${escapeHTML((v.set||"").toUpperCase())}) · #${escapeHTML(v.num||"")}${
                          rotuloVariante(v) ? " · " + escapeHTML(rotuloVariante(v)) : ""} · ${v.released||""}">
                  <span class="impr-set">${simboloDoSet(v.set, v.setName)}</span>
                  <span class="impr-ano">${(v.released||"").slice(0,4)}</span>
                  ${rotuloVariante(v) ? `<span class="impr-var">${escapeHTML(rotuloVariante(v))}</span>` : ""}
                  ${precoLocal(v)?`<span class="impr-preco">${formatarPreco(precoLocal(v))}</span>`:""}
                </button>`).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
      <p class="impr-dica">Cada bloco é uma ilustração. Clique numa edição para ver os detalhes dela — preço e raridade mudam de uma para outra.</p>`;
    // se os símbolos ainda não tinham chegado, repinta quando chegarem
    if(alvo.querySelector(".set-simbolo.vazio")) alvo.dataset.semSimbolo = "1";
    else delete alvo.dataset.semSimbolo;
    alvo.querySelectorAll(".impr").forEach(el => {
      el.onclick = () => {
        const v = versoes.find(x => x.id === el.dataset.id);
        if(v) openCard(v);
      };
    });
  }catch(e){
    if(alvo.isConnected) alvo.innerHTML = `<span class="flabel">Todas as impressões</span>
      <div class="carregando">não consegui buscar agora</div>`;
  }
}

let criar = { frase:"", respostas:{}, removidas:[], q:"", partes:[], duvidas:[], contando:false };

  criar = { frase:(ed && ed.frase) || "", respostas:{}, removidas:[], q:(ed && ed.q) || preset.query || "",

  modal(`<div class="modal-pad">
    <h3>${ed ? "Editar coleção" : "Nova coleção"}</h3>
    <p style="color:var(--muted);font-size:13px;margin:4px 0 16px">
      Escreva com suas palavras o que você quer juntar. Se eu ficar em dúvida, eu pergunto.</p>

    ${preset.query ? `
      <div class="nota-regiao" style="margin-bottom:16px">
        Vim do catálogo com os filtros que você montou. Pode criar assim, ou descrever por escrito abaixo
        para começar de novo.
      </div>` : ""}

    <label class="field"><span>O que você quer colecionar</span>
      <textarea id="c-frase" rows="3" placeholder="ex.: todos os dragões vermelhos antes de 2010">${escapeHTML(criar.frase)}</textarea>
    </label>

    <div class="exemplos" id="c-exemplos">
      ${["todos os dragões vermelhos antes de 2010",
         "cartas com gato na ilustração",
         "criaturas lendárias do Bloomburrow",
         "terrenos de arte completa",
         "cartas míticas acima de 50 dólares"]
        .map(e => `<button class="ex" data-ex="${escapeHTML(e)}">${escapeHTML(e)}</button>`).join("")}
    </div>

    <div id="c-leitura" class="leitura"></div>

    <label class="field" style="margin-top:14px"><span>Nome da coleção</span>
      <input type="text" id="c-name" placeholder="dê um nome" value="${escapeHTML(ed ? ed.name : "")}">
    </label>
    <div class="dupla">
      <label class="field"><span>Ícone</span><input type="text" id="c-icon" value="${escapeHTML(ed ? (ed.icon||"⭐") : "⭐")}" maxlength="4"></label>
      <label class="field"><span>Descrição (opcional)</span><input type="text" id="c-desc" value="${escapeHTML(ed ? (ed.desc||"") : "")}"></label>
    </div>
    <label class="field"><span>Versões da mesma carta</span>
      <select id="c-unique">
        ${VERSOES.map(([v,n]) => `<option value="${v}"${(ed ? uniqueDaColecao(ed) : "cards")===v?" selected":""}>${n}</option>`).join("")}
      </select>
      <small>"Uma por arte" repete a carta quando a ilustração muda — bom para quem coleciona arte.
      "Todas as impressões" traz cada versão de cada set.</small>
    </label>

    <details class="avancado">
      <summary>Ver a busca gerada</summary>
      <input type="text" id="c-q" value="${escapeHTML(preset.query || "")}" placeholder="a busca aparece aqui conforme você escreve">
      <small>Sintaxe do Scryfall. Só mexa aqui se quiser ajustar na mão — o normal é escrever em português acima.</small>
    </details>

    <div style="display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap">
      ${ed ? "<span></span>" : `<button class="btn ghost" id="c-manual">Prefiro montar carta a carta</button>`}
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="c-cancel">Cancelar</button>
        <button class="btn" id="c-save">${ed ? "Salvar" : "Criar coleção"}</button>
      </div>
    </div>
  </div>`);

  const frase = document.getElementById("c-frase");
  const nome = document.getElementById("c-name");
  let timer;
  frase.addEventListener("input", () => {
    criar.frase = frase.value;
    if(!nome.dataset.tocado) nome.value = tituloDaFrase(frase.value);
    clearTimeout(timer);
    timer = setTimeout(lerFrase, 350);
  });
  nome.addEventListener("input", () => { nome.dataset.tocado = "1"; });

  document.getElementById("c-exemplos").onclick = e => {
    const b = e.target.closest(".ex"); if(!b) return;
    frase.value = b.dataset.ex;
    frase.dispatchEvent(new Event("input"));
    frase.focus();
  };

  document.getElementById("c-cancel").onclick = closeModal;
  const btnManual = document.getElementById("c-manual");
  if(btnManual) btnManual.onclick = () => salvarColecao("manual");

  const qManual = document.getElementById("c-q");
  qManual.addEventListener("input", () => { criar.q = qManual.value; });

  // sem a lista de edições carregada, o interpretador não reconhece nome de set —
